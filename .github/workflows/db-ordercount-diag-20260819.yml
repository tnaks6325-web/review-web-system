name: DB Order Count Diag 2026-08-19 (one-off)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/db-ordercount-diag-20260819.yml'
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      PGCONN: ${{ secrets.BACKUP_DATABASE_URL }}
    steps:
      - name: psql 준비
        run: psql --version || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)

      - name: ① 네 사람의 주문 원장 — 실제 구매가 몇 건인가
        run: |
          psql "$PGCONN" -P pager=off -v ON_ERROR_STOP=1 <<'SQL'
          SELECT os.recipient AS 수취인,
                 regexp_replace(COALESCE(os.order_num,''),'\D','','g') AS 주문번호,
                 COUNT(*) AS 원장건수,
                 MIN(to_char(os.submitted_at AT TIME ZONE 'Asia/Seoul','MM-DD HH24:MI')) AS 최초제출,
                 MAX(to_char(os.submitted_at AT TIME ZONE 'Asia/Seoul','MM-DD HH24:MI')) AS 마지막제출,
                 string_agg(DISTINCT os.mirror_status, ',') AS 상태,
                 string_agg(DISTINCT CASE WHEN os.deleted_at IS NULL THEN '살아있음' ELSE '취소됨' END, ',') AS 생존
            FROM order_submissions os
           WHERE os.tab_name = '8/3(쿠팡)위프_블랙 탈취제 800건'
             AND right(regexp_replace(COALESCE(os.phone,''),'\D','','g'),8)
                 IN ('84486997','89508885','91064144','76640008')
           GROUP BY 1,2 ORDER BY 1,4;
          SQL

      - name: ② 표 번호로 원장 전역 검색(좌표 무관)
        run: |
          psql "$PGCONN" -P pager=off -v ON_ERROR_STOP=1 <<'SQL'
          SELECT regexp_replace(COALESCE(os.order_num,''),'\D','','g') AS 주문번호,
                 os.recipient AS 수취인, os.tab_name AS 원장좌표, os.mirror_status AS 상태,
                 to_char(os.submitted_at AT TIME ZONE 'Asia/Seoul','MM-DD HH24:MI') AS 제출,
                 CASE WHEN os.deleted_at IS NULL THEN '살아있음' ELSE '취소됨' END AS 생존
            FROM order_submissions os
           WHERE regexp_replace(COALESCE(os.order_num,''),'\D','','g')
                 IN ('5102385176784','31102386192599','25102387743327','32102390310440')
           ORDER BY 1, 5;
          SQL

      - name: ③ 그 네 명의(연락처) 모든 주문 — 좌표 무관
        run: |
          psql "$PGCONN" -P pager=off -v ON_ERROR_STOP=1 <<'SQL'
          SELECT os.recipient AS 수취인,
                 regexp_replace(COALESCE(os.order_num,''),'\D','','g') AS 주문번호,
                 os.tab_name AS 원장좌표,
                 to_char(os.submitted_at AT TIME ZONE 'Asia/Seoul','MM-DD HH24:MI') AS 제출,
                 os.mirror_status AS 상태,
                 CASE WHEN os.deleted_at IS NULL THEN '살아있음' ELSE '취소됨' END AS 생존
            FROM order_submissions os
           WHERE right(regexp_replace(COALESCE(os.phone,''),'\D','','g'),8)
                 IN ('84486997','89508885','91064144','76640008')
           ORDER BY 1, 4;
          SQL
