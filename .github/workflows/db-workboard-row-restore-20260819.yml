# ─────────────────────────────────────────────────────────────
# 일회성 4차: 링크 오염으로 잘못 내려간 줄 **일괄 복구** + 오염된 링크 정정
#
# 앞선 실행에서 확인한 것
#   · 장수산업 다섯 줄 복구 완료(8/19 활성 37줄 — 직원 출력 시점과 동일)
#   · "구매가 통째로 사라진" 경우는 테스트 작업 4건뿐(운영 0건)
#   · 대신 **링크 오염**(표에 적힌 주문번호 ≠ 시스템이 연결한 주문)으로 내려간 줄이
#     21개 작업 174줄. 원인 = 투영(`_enrichTab`)이 주문 링크를 phone8 하나로만 정해,
#     같은 작업에 여러 번 참여한 리뷰어의 모든 줄에 그중 한 주문이 붙었다.
#
# ① 복구 — "진짜 중복"을 뺀 오삭제만
#   대상 = 내려간 줄 중  ㉮ 연결된 주문이 살아 있고(written)  ㉯ 표 주문번호(6자리+)가
#   그 주문의 번호와 **다르며**  ㉰ 같은 표 주문번호를 쓰는 **살아 있는 줄이 그 탭에 없고**
#   ㉱ 같은 표 주문번호가 여러 줄이면 **가장 이른 seq 하나만**.
#   ★ ㉰㉱ 가 "진짜 중복 제외" 다 — 라미 3줄처럼 표 번호까지 같은 줄은 정상 정리라 손대지 않는다.
#
# ② 링크 정정 — 표 주문번호와 정확히 맞는 주문으로 다시 연결
#   ★ 이걸 안 하면 복구해도 다음 중복 정리에서 **또** 같은 줄이 잡힌다(실측: 복구 직후
#     dry-run 이 다섯 줄을 그대로 다시 지목했다).
#   ★ 번호가 6자리+ 이고 **그 번호의 주문이 유일**하고 **연락처까지 같을 때만**. 모호하면 안 바꾼다.
#
# ★ 하드삭제·스키마 변경 0 · 되돌리기 = 그 줄을 다시 내리면 된다(소프트).
# ─────────────────────────────────────────────────────────────
name: DB Workboard Row Restore 2026-08-19 (one-off)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/db-workboard-row-restore-20260819.yml'
  workflow_dispatch:

concurrency:
  group: db-workboard-row-restore-20260819
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGCONN: ${{ secrets.BACKUP_DATABASE_URL }}
    steps:
      - name: psql 준비
        run: psql --version || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)

      - name: ① 복구 대상 미리보기(작업별)
        run: |
          psql "$PGCONN" -P pager=off -v ON_ERROR_STOP=1 <<'SQL'
          WITH cand AS (
            SELECT DISTINCT ON (cp.sheet_id, cp.tab_name,
                                regexp_replace(cp.row_json->>'주문번호', '\D', '', 'g'))
                   cp.id, cp.sheet_id, cp.tab_name, cp.seq, cp.reviewer_name
              FROM campaign_participants cp
              JOIN order_submissions os ON os.id = cp.order_submission_id
             WHERE cp.deleted_at IS NOT NULL
               AND cp.updated_by LIKE 'dedupe:%'
               AND os.deleted_at IS NULL AND os.mirror_status = 'written'
               AND length(regexp_replace(COALESCE(cp.row_json->>'주문번호',''), '\D', '', 'g')) >= 6
               AND length(regexp_replace(COALESCE(os.order_num,''), '\D', '', 'g')) >= 6
               AND regexp_replace(cp.row_json->>'주문번호', '\D', '', 'g')
                <> regexp_replace(os.order_num, '\D', '', 'g')
               AND NOT EXISTS (
                     SELECT 1 FROM campaign_participants live
                      WHERE live.sheet_id = cp.sheet_id AND live.tab_name = cp.tab_name
                        AND live.deleted_at IS NULL
                        AND regexp_replace(COALESCE(live.row_json->>'주문번호',''), '\D', '', 'g')
                          = regexp_replace(cp.row_json->>'주문번호', '\D', '', 'g'))
             ORDER BY cp.sheet_id, cp.tab_name,
                      regexp_replace(cp.row_json->>'주문번호', '\D', '', 'g'), cp.seq
          )
          SELECT tab_name AS 작업, COUNT(*) AS 복구대상 FROM cand GROUP BY tab_name ORDER BY 2 DESC;
          SQL

      - name: ① 복구 실행
        run: |
          psql "$PGCONN" -P pager=off -v ON_ERROR_STOP=1 <<'SQL'
          WITH cand AS (
            SELECT DISTINCT ON (cp.sheet_id, cp.tab_name,
                                regexp_replace(cp.row_json->>'주문번호', '\D', '', 'g'))
                   cp.id
              FROM campaign_participants cp
              JOIN order_submissions os ON os.id = cp.order_submission_id
             WHERE cp.deleted_at IS NOT NULL
               AND cp.updated_by LIKE 'dedupe:%'
               AND os.deleted_at IS NULL AND os.mirror_status = 'written'
               AND length(regexp_replace(COALESCE(cp.row_json->>'주문번호',''), '\D', '', 'g')) >= 6
               AND length(regexp_replace(COALESCE(os.order_num,''), '\D', '', 'g')) >= 6
               AND regexp_replace(cp.row_json->>'주문번호', '\D', '', 'g')
                <> regexp_replace(os.order_num, '\D', '', 'g')
               AND NOT EXISTS (
                     SELECT 1 FROM campaign_participants live
                      WHERE live.sheet_id = cp.sheet_id AND live.tab_name = cp.tab_name
                        AND live.deleted_at IS NULL
                        AND regexp_replace(COALESCE(live.row_json->>'주문번호',''), '\D', '', 'g')
                          = regexp_replace(cp.row_json->>'주문번호', '\D', '', 'g'))
             ORDER BY cp.sheet_id, cp.tab_name,
                      regexp_replace(cp.row_json->>'주문번호', '\D', '', 'g'), cp.seq
          )
          UPDATE campaign_participants cp
             SET deleted_at = NULL, active = TRUE,
                 updated_by = 'restore:20260819-linkfix', updated_at = NOW()
            FROM cand WHERE cp.id = cand.id
          RETURNING cp.tab_name, cp.seq, cp.reviewer_name;
          SQL

      - name: ② 링크 정정 미리보기
        run: |
          psql "$PGCONN" -P pager=off -v ON_ERROR_STOP=1 <<'SQL'
          WITH uniq AS (
            SELECT sheet_id, tab_name,
                   regexp_replace(order_num, '\D', '', 'g') AS num,
                   MIN(id::text) AS oid, COUNT(*) AS n,
                   MIN(regexp_replace(COALESCE(phone,''), '\D', '', 'g')) AS ph
              FROM order_submissions
             WHERE deleted_at IS NULL
               AND length(regexp_replace(COALESCE(order_num,''), '\D', '', 'g')) >= 6
             GROUP BY 1,2,3
          )
          SELECT cp.tab_name AS 작업, COUNT(*) AS 링크정정대상
            FROM campaign_participants cp
            JOIN uniq u ON u.sheet_id = cp.sheet_id AND u.tab_name = cp.tab_name
                       AND u.num = regexp_replace(COALESCE(cp.row_json->>'주문번호',''), '\D', '', 'g')
           WHERE cp.deleted_at IS NULL AND u.n = 1
             AND right(u.ph, 8) = cp.phone8
             AND cp.order_submission_id IS DISTINCT FROM u.oid::uuid
           GROUP BY 1 ORDER BY 2 DESC;
          SQL

      - name: ② 링크 정정 실행
        run: |
          psql "$PGCONN" -P pager=off -v ON_ERROR_STOP=1 <<'SQL'
          WITH uniq AS (
            SELECT sheet_id, tab_name,
                   regexp_replace(order_num, '\D', '', 'g') AS num,
                   MIN(id::text) AS oid, COUNT(*) AS n,
                   MIN(regexp_replace(COALESCE(phone,''), '\D', '', 'g')) AS ph
              FROM order_submissions
             WHERE deleted_at IS NULL
               AND length(regexp_replace(COALESCE(order_num,''), '\D', '', 'g')) >= 6
             GROUP BY 1,2,3
          )
          UPDATE campaign_participants cp
             SET order_submission_id = u.oid::uuid, updated_at = NOW(),
                 updated_by = 'relink:20260819'
            FROM uniq u
           WHERE u.sheet_id = cp.sheet_id AND u.tab_name = cp.tab_name
             AND u.num = regexp_replace(COALESCE(cp.row_json->>'주문번호',''), '\D', '', 'g')
             AND cp.deleted_at IS NULL AND u.n = 1
             AND right(u.ph, 8) = cp.phone8
             AND cp.order_submission_id IS DISTINCT FROM u.oid::uuid;
          SQL

      - name: ③ 결과 확인
        run: |
          psql "$PGCONN" -P pager=off -v ON_ERROR_STOP=1 <<'SQL'
          SELECT COUNT(*) AS 남은_링크오염_내려간줄
            FROM campaign_participants cp
            JOIN order_submissions os ON os.id = cp.order_submission_id
           WHERE cp.deleted_at IS NOT NULL
             AND os.deleted_at IS NULL AND os.mirror_status = 'written'
             AND length(regexp_replace(COALESCE(cp.row_json->>'주문번호',''), '\D', '', 'g')) >= 6
             AND length(regexp_replace(COALESCE(os.order_num,''), '\D', '', 'g')) >= 6
             AND regexp_replace(cp.row_json->>'주문번호', '\D', '', 'g')
              <> regexp_replace(os.order_num, '\D', '', 'g');
          SELECT COUNT(*) AS 장수산업_8월19일_활성줄
            FROM campaign_participants
           WHERE sheet_id = '1E_Kvn5pyORuv3xp0Zob5T82YefDjy1tzqcFlTb5OrTw'
             AND tab_name = '0721)장수돌침대_쿠팡_탄소매트 900건'
             AND deleted_at IS NULL AND row_json->>'구매일자' LIKE '8 / 19%';
          SQL
