name: DB Dup Rows Diag 2026-08-19 (one-off)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/db-duprows-diag-20260819.yml'
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      PGCONN: ${{ secrets.BACKUP_DATABASE_URL }}
    steps:
      - name: psql 준비
        run: psql --version || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)

      - name: ① 권정현 줄 — 언제 · 무엇이 만들었나
        run: |
          psql "$PGCONN" -P pager=off -v ON_ERROR_STOP=1 <<'SQL'
          SELECT seq, source, reviewer_name AS 참여자,
                 row_json->>'구매일자' AS 구매일자,
                 regexp_replace(COALESCE(row_json->>'주문번호',''), '\D','','g') AS 표번호,
                 to_char(first_seen_at AT TIME ZONE 'Asia/Seoul','MM-DD HH24:MI') AS 생성,
                 to_char(updated_at AT TIME ZONE 'Asia/Seoul','MM-DD HH24:MI') AS 수정,
                 COALESCE(updated_by,'(없음)') AS 수정주체,
                 CASE WHEN deleted_at IS NULL THEN '살아있음' ELSE '삭제됨' END AS 상태
            FROM campaign_participants
           WHERE tab_name = '8/3(쿠팡)위프_블랙 탈취제 800건' AND phone8 = '89508885'
           ORDER BY seq;
          SQL

      - name: ② 이 탭 전체 — 같은 표 주문번호를 여러 줄이 쓰는 묶음
        run: |
          psql "$PGCONN" -P pager=off -v ON_ERROR_STOP=1 <<'SQL'
          SELECT regexp_replace(row_json->>'주문번호','\D','','g') AS 표번호,
                 COUNT(*) AS 줄수,
                 string_agg(DISTINCT source, ',') AS 출처,
                 string_agg(DISTINCT COALESCE(updated_by,'(없음)'), ',') AS 수정주체,
                 MIN(to_char(first_seen_at AT TIME ZONE 'Asia/Seoul','MM-DD HH24:MI')) AS 최초생성,
                 MAX(to_char(first_seen_at AT TIME ZONE 'Asia/Seoul','MM-DD HH24:MI')) AS 마지막생성
            FROM campaign_participants
           WHERE tab_name = '8/3(쿠팡)위프_블랙 탈취제 800건' AND deleted_at IS NULL
             AND length(regexp_replace(COALESCE(row_json->>'주문번호',''),'\D','','g')) >= 6
           GROUP BY 1 HAVING COUNT(*) > 1
           ORDER BY 2 DESC LIMIT 20;
          SQL

      - name: ③ 내 복구가 이 탭에서 되살린 줄이 있나
        run: |
          psql "$PGCONN" -P pager=off -v ON_ERROR_STOP=1 <<'SQL'
          SELECT COALESCE(updated_by,'(없음)') AS 수정주체, COUNT(*) AS 살아있는줄
            FROM campaign_participants
           WHERE tab_name = '8/3(쿠팡)위프_블랙 탈취제 800건' AND deleted_at IS NULL
           GROUP BY 1 ORDER BY 2 DESC LIMIT 20;
          SQL

      - name: ④ 전 작업 — 같은 표 주문번호 중복 묶음이 언제 생겼나(생성일 분포)
        run: |
          psql "$PGCONN" -P pager=off -v ON_ERROR_STOP=1 <<'SQL'
          WITH dup AS (
            SELECT tab_name, regexp_replace(row_json->>'주문번호','\D','','g') AS num, COUNT(*) AS n
              FROM campaign_participants
             WHERE deleted_at IS NULL
               AND length(regexp_replace(COALESCE(row_json->>'주문번호',''),'\D','','g')) >= 6
             GROUP BY 1,2 HAVING COUNT(*) > 1
          )
          SELECT cp.tab_name AS 작업, COUNT(*) AS 중복줄,
                 to_char(MIN(cp.first_seen_at AT TIME ZONE 'Asia/Seoul'),'MM-DD') AS 최초,
                 to_char(MAX(cp.first_seen_at AT TIME ZONE 'Asia/Seoul'),'MM-DD') AS 마지막,
                 string_agg(DISTINCT cp.source, ',') AS 출처
            FROM campaign_participants cp
            JOIN dup d ON d.tab_name = cp.tab_name
                      AND d.num = regexp_replace(cp.row_json->>'주문번호','\D','','g')
           WHERE cp.deleted_at IS NULL
           GROUP BY 1 ORDER BY 2 DESC LIMIT 25;
          SQL
