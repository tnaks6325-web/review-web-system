name: Oneoff - 중복 줄 성격 조사 (읽기 전용)

on:
  workflow_dispatch:
  push:
    branches: [ 'oneoff/dupwatch-run' ]

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Inspect
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -e
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          \pset pager off

          CREATE TEMP VIEW dup AS
          WITH n AS (
            SELECT cp.*,
                   regexp_replace(COALESCE((
                     SELECT string_agg(t.value, '' ORDER BY t.key)
                       FROM jsonb_each_text(COALESCE(cp.row_json,'{}'::jsonb)) t(key,value)
                      WHERE t.key LIKE '%주문번호%'
                   ),''), '\D','','g') AS onum
              FROM campaign_participants cp
              JOIN tab_configs tc ON tc.sheet_id=cp.sheet_id AND tc.tab_name=cp.tab_name
               AND COALESCE(tc.sheetless,FALSE)=TRUE
             WHERE cp.deleted_at IS NULL
               AND length(COALESCE(cp.phone8,''))>=8
          ), g AS (
            SELECT sheet_id, tab_name, onum, phone8
              FROM n WHERE length(onum)>=6
             GROUP BY 1,2,3,4 HAVING COUNT(*)>1
          )
          SELECT n.* FROM n JOIN g USING (sheet_id, tab_name, onum, phone8);

          \echo '=== ⑥ 줄마다 매달린 것 (리뷰·입금·회차) ==='
          SELECT d.tab_name, d.onum, d.seq, d.source,
                 COALESCE(d.is_submitted,FALSE) AS 제출, COALESCE(d.is_paid,FALSE) AS 입금,
                 (SELECT COUNT(*) FROM review_index ri
                   WHERE ri.sheet_id=d.sheet_id AND ri.tab_name=d.tab_name AND ri.row_index=d.seq) AS 색인행,
                 (SELECT COUNT(*) FROM review_submissions rs
                   WHERE rs.sheet_id=d.sheet_id AND rs.tab_name=d.tab_name AND rs.row_index=d.seq) AS 리뷰이미지,
                 (SELECT COUNT(*) FROM payment_batch_items pb
                   WHERE pb.sheet_id=d.sheet_id AND pb.tab_name=d.tab_name AND pb.row_index=d.seq
                     AND pb.status IN ('pending','paid')) AS 입금회차
            FROM dup d ORDER BY 1,2,3;

          \echo ''
          \echo '=== ⑦ 묶음 요약: 실적이 붙은 줄이 몇 개인가 ==='
          WITH x AS (
            SELECT d.tab_name, d.onum, d.seq,
                   (CASE WHEN COALESCE(d.is_submitted,FALSE) OR COALESCE(d.is_paid,FALSE) THEN 1 ELSE 0 END
                  + (SELECT COUNT(*) FROM review_submissions rs
                      WHERE rs.sheet_id=d.sheet_id AND rs.tab_name=d.tab_name AND rs.row_index=d.seq)
                  + (SELECT COUNT(*) FROM payment_batch_items pb
                      WHERE pb.sheet_id=d.sheet_id AND pb.tab_name=d.tab_name AND pb.row_index=d.seq
                        AND pb.status IN ('pending','paid'))) AS 실적
              FROM dup d)
          SELECT tab_name, onum, COUNT(*) AS 줄수,
                 COUNT(*) FILTER (WHERE 실적>0) AS 실적있는줄,
                 string_agg(seq::text || CASE WHEN 실적>0 THEN '★' ELSE '' END, ',' ORDER BY seq) AS 줄들
            FROM x GROUP BY 1,2 ORDER BY 4 DESC, 1, 2;
          SQL
