name: oneoff-audit
on:
  push:
    branches: [oneoff/audit]
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - name: run
        env:
          PGURL: ${{ secrets.BACKUP_DATABASE_URL }}
          B64: 
        run: |
          echo "$B64" | base64 -d > /tmp/q.sql
          psql "$PGURL" -f /tmp/q.sql
