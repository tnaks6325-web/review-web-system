# ─────────────────────────────────────────────────────────────
# 일회성 복구: 2026-08-19 리뷰어 행 오삭제 복구
#
# 사고: E2E 테스트 정리 스크립트가 /api/trackb/reviewers?q=E2E블로거 검색 결과를
#   그대로 순회 삭제했는데, 그 검색이 q의 숫자('22')를 연락처 부분일치로도 매칭해
#   무관한 실제 리뷰어 39명이 하드삭제됨(reviewers 행만 — 참여/주문/문의 이력은 무손상).
#
# 복구: 최신 R2 백업(당일 03:00 KST — 사고는 16:25 KST라 전원 포함)에서
#   reviewers 테이블을 임시 PG에 복원 → 대상 id만 남김 →
#   --column-inserts --on-conflict-do-nothing 으로 운영 DB에 "없는 행만" INSERT.
#   ★ 기존 행은 절대 덮지 않는다(UPDATE 0건). ★ 대상 id 외에는 한 행도 건드리지 않는다.
#
# 실행: workflow_dispatch 수동 1회 → 성공 확인 후 이 파일은 삭제한다.
# ─────────────────────────────────────────────────────────────
name: DB Reviewer Restore 2026-08-19 (one-off)

on:
  workflow_dispatch:

env:
  R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_PREFIX: db
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  # 오삭제된 리뷰어 id (삭제 API 응답 로그에서 채록 — ok:true,deleted:1 이었던 39건)
  TARGET_IDS: >-
    '3f978980-a784-4d91-9c77-35c8a081b874','92442295-819a-45e6-b835-eb7a0ef1e57b',
    'fe92224d-d1ef-4e32-8104-e603db129973','a852db90-6a84-4992-829a-818bccff0617',
    '09c4cdc0-2102-4ed7-b413-74a3b4245920','fa5b32f7-652c-4f8c-b984-e6d4e9ef7a99',
    'ba79ffe0-b96f-498c-9165-36aa101db5bc','4d8e455d-8f6c-4c6a-a7c0-6d189202c3e5',
    '4c53d52e-a2a8-4f96-9191-7f0d470f2d2b','835b7f05-7356-44ac-b4a2-93318fbc4ab8',
    'f2a6fe82-fea4-415c-842b-a3e4f1ec3c24','cb296394-db13-4e25-91c4-7595dcf81e52',
    '281a2266-0e6e-49cd-a824-813880cd810d','5ac211dd-30bf-4630-8572-bb2aabb32db6',
    'eb679c70-9afa-477d-bf9b-0c3d5de0d926','e5fcf254-1c4b-4374-a189-9d888d6c16ee',
    '98ebc251-5044-43ec-a4a7-cbd246bc970a','c3ef74da-29c4-4c91-a55c-34bffa7a2394',
    'dc63eb74-fe03-4857-9cb1-b462b2c3e5c5','13bbfa02-71aa-40fc-9b51-61d7a5b70c8d',
    '1fba6cbe-bf89-452f-92c7-1d99b88a32c1','fff2e3dd-d8ea-4bbd-a232-b96b620d18fd',
    'd0545d7f-2b34-4c9f-a54a-4268eb53fa73','2633c638-3b7b-4cfd-8370-d48467e78482',
    'cdd732df-51e5-4ec8-a387-feb808378b47','7c5bab7a-6d29-46c9-a453-977f2fd68fe2',
    'd107db75-f46f-49b5-a4f6-adac2617caeb','7d489fbb-ebb3-45da-8f1e-2084a02ecdfb',
    '73e959cb-1022-4cdb-8364-3835c859a164','5b3a9db3-2255-49b0-8ba5-6f9c34d12bc2',
    '05a0a690-d252-4cc4-b707-62ea71a2a51c','40e81265-30c9-470d-b8cb-997e8f602d1c',
    'b6665b13-0a7e-48aa-956f-2965ee4bc0f7','62ec4895-3238-49b0-b5a1-b1a04936071a',
    '8be8981c-c1ab-49d3-96f7-762cef0a0068','2b69b6c2-bcf5-4356-9a59-a6e91e51a4dc',
    '40f9d14c-dc3d-4db5-bf83-152c7186f341','8eaf6cdb-c764-4b1a-8d84-895419aa0558',
    'e71ced15-6bf9-4d49-aaa5-e506614888a6'

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: restore_test
          POSTGRES_PASSWORD: restore_test
          POSTGRES_DB: restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Install PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Download latest backup from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          KEY=$(aws s3api list-objects-v2 \
            --bucket "${{ secrets.R2_BUCKET }}" \
            --prefix "${R2_PREFIX}/" \
            --endpoint-url "$R2_ENDPOINT" \
            --query 'sort_by(Contents, &LastModified)[-1].Key' \
            --output text)
          if [ -z "$KEY" ] || [ "$KEY" = "None" ]; then
            echo "::error::R2에 백업 파일이 없습니다"; exit 1
          fi
          echo "restoring from: $KEY"
          aws s3 cp "s3://${{ secrets.R2_BUCKET }}/${KEY}" latest.dump \
            --endpoint-url "$R2_ENDPOINT"

      - name: Restore reviewers table into temporary Postgres
        env:
          PGPASSWORD: restore_test
        run: |
          # reviewers 테이블만(정의+데이터). FK/트리거 의존이 있으면 데이터만이라도 확보되도록
          # 실패를 무시하지 않고 결과를 검증한다.
          pg_restore \
            --host localhost --port 5432 \
            --username restore_test --dbname restore_test \
            --no-owner --no-privileges \
            --table reviewers latest.dump
          N=$(psql -h localhost -U restore_test -d restore_test -t -A -c "SELECT count(*) FROM reviewers")
          echo "backup reviewers rows: $N"
          if [ "$N" -lt 100 ]; then echo "::error::백업 reviewers 행 수가 비정상(${N})"; exit 1; fi

      - name: Keep only target ids + dump column-inserts
        env:
          PGPASSWORD: restore_test
        run: |
          psql -h localhost -U restore_test -d restore_test -v ON_ERROR_STOP=1 -c \
            "DELETE FROM reviewers WHERE id NOT IN (${TARGET_IDS})"
          FOUND=$(psql -h localhost -U restore_test -d restore_test -t -A -c "SELECT count(*) FROM reviewers")
          echo "found in backup: ${FOUND} / 39"
          psql -h localhost -U restore_test -d restore_test -t -A -c "SELECT id || ' ' || name FROM reviewers ORDER BY name"
          if [ "$FOUND" -eq 0 ]; then echo "::error::백업에서 대상 행을 찾지 못했습니다"; exit 1; fi
          # GENERATED 컬럼(phone8)은 pg_dump 데이터 덤프에서 자동 제외된다.
          pg_dump -h localhost -U restore_test -d restore_test \
            --table=reviewers --data-only --column-inserts --on-conflict-do-nothing \
            -f restore-rows.sql
          grep -c "INSERT INTO" restore-rows.sql

      - name: Insert missing rows into production (no overwrite)
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::BACKUP_DATABASE_URL 미설정"; exit 1; fi
          BEFORE=$(psql "$DATABASE_URL" -t -A -c "SELECT count(*) FROM reviewers WHERE id IN (${TARGET_IDS})")
          echo "prod rows before: ${BEFORE}"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f restore-rows.sql
          AFTER=$(psql "$DATABASE_URL" -t -A -c "SELECT count(*) FROM reviewers WHERE id IN (${TARGET_IDS})")
          echo "prod rows after: ${AFTER}"
          psql "$DATABASE_URL" -t -A -c "SELECT id || ' ' || name FROM reviewers WHERE id IN (${TARGET_IDS}) ORDER BY name"
          if [ "$AFTER" -lt "$BEFORE" ]; then echo "::error::행 수가 줄었다 — 있을 수 없는 상태"; exit 1; fi
