name: Oneoff - 비운 링크 재부착 확인 (읽기 전용)
on:
  push:
    branches: [ 'oneoff/home98' ]
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -e
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          \pset pager off

          \echo '=== 아까 비운 14줄의 현재 링크 상태 ==='
          WITH t(tab,seq,nm) AS (VALUES
            ('8/3(쿠팡)위프_블랙 탈취제 800건',166,'김현숙'),
            ('8/3(쿠팡)위프_블랙 탈취제 800건',375,'유재휘'),
            ('0729)이노크아든_면마스크 200건(실배)',117,'박세희'),
            ('8/3(쿠팡)위프_블랙 탈취제 800건',44,'박세준1'),
            ('0721)장수돌침대_쿠팡_탄소매트 900건',101,'장대한'),
            ('0721)장수돌침대_쿠팡_탄소매트 900건',95,'신우진'),
            ('0721)장수돌침대_쿠팡_탄소매트 900건',104,'이희웅'),
            ('0721)장수돌침대_쿠팡_탄소매트 900건',98,'윤승환'),
            ('0721)장수돌침대_쿠팡_탄소매트 900건',96,'김윤식'),
            ('0721)장수돌침대_쿠팡_탄소매트 900건',102,'장지남'),
            ('8/3(쿠팡)위프_블랙 탈취제 800건',164,'박세희'),
            ('0721)장수돌침대_쿠팡_탄소매트 900건',598,'이재희'),
            ('7/24(네이버)메디슨벨_파라다이스 그레인 200건',40,'이수진'),
            ('8/3(네이버)우레온_바디미스트 100건',19,'박세희'))
          SELECT t.tab AS 작업, t.seq AS "#", t.nm AS 참여자,
                 cp.order_submission_id IS NULL AS 여전히비어있음,
                 regexp_replace(COALESCE(os.order_num,''),'\D','','g') AS 다시붙은주문,
                 os.recipient AS 그주문수취인,
                 cp.updated_at, cp.updated_by
            FROM t LEFT JOIN campaign_participants cp
              ON cp.tab_name=t.tab AND cp.seq=t.seq AND cp.deleted_at IS NULL
            LEFT JOIN order_submissions os ON os.id=cp.order_submission_id
           ORDER BY t.tab, t.seq;

          \echo ''
          \echo '=== 말따/레티놀 57줄 중 다시 붙은 것 ==='
          SELECT cp.tab_name AS 작업, COUNT(*) AS 살아있는줄,
                 COUNT(*) FILTER (WHERE cp.order_submission_id IS NOT NULL) AS 링크있음
            FROM campaign_participants cp
           WHERE cp.deleted_at IS NULL
             AND cp.tab_name IN ('6/29(메이커스)말따_부스터샷 세럼 세트 300건','6/30(쿠팡)레티놀크림 300건')
           GROUP BY 1;

          SELECT COUNT(*) AS 말따레티놀_이름불일치_재발
            FROM campaign_participants cp
            JOIN order_submissions os ON os.id = cp.order_submission_id
           WHERE cp.deleted_at IS NULL
             AND cp.tab_name IN ('6/29(메이커스)말따_부스터샷 세럼 세트 300건','6/30(쿠팡)레티놀크림 300건')
             AND COALESCE(os.recipient,'') <> ''
             AND regexp_replace(COALESCE(NULLIF(cp.row_json->>'수취인',''), cp.recipient_name),'[\s ]','','g')
                 <> regexp_replace(COALESCE(os.recipient,''),'[\s ]','','g')
             AND cp.phone8 IS DISTINCT FROM right(regexp_replace(COALESCE(os.phone,''),'\D','','g'),8);
          SQL
