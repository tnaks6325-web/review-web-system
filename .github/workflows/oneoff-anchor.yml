name: Oneoff - 링크 비움 부작용 점검 (읽기 전용)
on:
  push:
    branches: [ 'oneoff/blank-scan' ]
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -e
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          \pset pager off

          CREATE TEMP TABLE mm AS
          SELECT cp.id, cp.sheet_id, cp.tab_name, cp.seq, cp.order_submission_id AS osid,
                 COALESCE(cp.row_json->>'번호','') AS num,
                 regexp_replace(COALESCE(NULLIF(cp.row_json->>'수취인',''), cp.recipient_name),'[\s ]','','g') AS nm
            FROM campaign_participants cp
            JOIN order_submissions os ON os.id = cp.order_submission_id
           WHERE cp.deleted_at IS NULL
             AND cp.tab_name IN ('6/29(메이커스)말따_부스터샷 세럼 세트 300건','6/30(쿠팡)레티놀크림 300건')
             AND COALESCE(os.recipient,'') <> ''
             AND regexp_replace(COALESCE(NULLIF(cp.row_json->>'수취인',''), cp.recipient_name),'[\s ]','','g')
                 <> regexp_replace(COALESCE(os.recipient,''),'[\s ]','','g')
             AND cp.phone8 IS DISTINCT FROM right(regexp_replace(COALESCE(os.phone,''),'\D','','g'),8);

          \echo '=== 1. 대상 줄 수 ==='
          SELECT COUNT(*) FROM mm;

          \echo ''
          \echo '=== 2. order 앵커 편집 오버레이 ==='
          SELECT m.tab_name AS 작업, m.num AS 번호, m.seq AS "#", m.nm AS 참여자,
                 pe.field AS 편집칸, pe.value_text AS 값, pe.reverted_at IS NULL AS 살아있음
            FROM mm m JOIN participant_edits pe
              ON pe.sheet_id=m.sheet_id AND pe.tab_name=m.tab_name
             AND pe.anchor_type='order' AND pe.anchor_value = m.osid::text
           ORDER BY m.tab_name, m.seq;

          \echo ''
          \echo '=== 3. order 앵커 셀 배경색 ==='
          SELECT m.tab_name AS 작업, m.num AS 번호, m.seq AS "#", cc.field AS 칸, cc.color
            FROM mm m JOIN trackb_cell_colors cc
              ON cc.sheet_id=m.sheet_id AND cc.tab_name=m.tab_name
             AND cc.anchor_type='order' AND cc.anchor_value = m.osid::text
           ORDER BY m.tab_name, m.seq;

          \echo ''
          \echo '=== 4. order 앵커 커스텀 열 값 ==='
          SELECT m.tab_name AS 작업, m.num AS 번호, m.seq AS "#", cv.column_id, cv.value_text
            FROM mm m JOIN trackb_custom_column_values cv
              ON cv.anchor_type='order' AND cv.anchor_value = m.osid::text
           ORDER BY m.tab_name, m.seq;

          \echo ''
          \echo '=== 5. 이체 회차 담김 ==='
          SELECT m.tab_name AS 작업, m.num AS 번호, m.seq AS "#", pi.status, b.seq AS 회차
            FROM mm m JOIN payment_batch_items pi
              ON pi.sheet_id=m.sheet_id AND pi.tab_name=m.tab_name AND pi.row_index=m.seq
            JOIN payment_batches b ON b.id=pi.batch_id
           ORDER BY m.tab_name, m.seq;
          SQL
