name: DB Link Mismatch Diag 2026-08-19 (one-off)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/db-link-mismatch-diag-20260819.yml'
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      PGCONN: ${{ secrets.BACKUP_DATABASE_URL }}
    steps:
      - name: psql 준비
        run: psql --version || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)

      - name: ① 남은 링크 어긋난 활성줄 — 사유 분류
        run: |
          psql "$PGCONN" -P pager=off -v ON_ERROR_STOP=1 <<'SQL'
          WITH bad AS (
            SELECT cp.id, cp.sheet_id, cp.tab_name, cp.seq, cp.reviewer_name, cp.phone8,
                   regexp_replace(cp.row_json->>'주문번호', '\D', '', 'g') AS rownum,
                   regexp_replace(os.order_num, '\D', '', 'g') AS linknum
              FROM campaign_participants cp
              JOIN order_submissions os ON os.id = cp.order_submission_id
             WHERE cp.deleted_at IS NULL AND os.deleted_at IS NULL
               AND length(regexp_replace(COALESCE(cp.row_json->>'주문번호',''), '\D', '', 'g')) >= 6
               AND length(regexp_replace(COALESCE(os.order_num,''), '\D', '', 'g')) >= 6
               AND regexp_replace(cp.row_json->>'주문번호', '\D', '', 'g')
                <> regexp_replace(os.order_num, '\D', '', 'g')
          ), cand AS (
            SELECT b.*,
                   (SELECT COUNT(*) FROM order_submissions o2
                     WHERE o2.sheet_id=b.sheet_id AND o2.tab_name=b.tab_name AND o2.deleted_at IS NULL
                       AND regexp_replace(COALESCE(o2.order_num,''), '\D', '', 'g') = b.rownum) AS live_n,
                   (SELECT COUNT(*) FROM order_submissions o3
                     WHERE o3.sheet_id=b.sheet_id AND o3.tab_name=b.tab_name AND o3.deleted_at IS NOT NULL
                       AND regexp_replace(COALESCE(o3.order_num,''), '\D', '', 'g') = b.rownum) AS dead_n,
                   (SELECT COUNT(*) FROM order_submissions o4
                     WHERE o4.sheet_id=b.sheet_id AND o4.tab_name=b.tab_name AND o4.deleted_at IS NULL
                       AND regexp_replace(COALESCE(o4.order_num,''), '\D', '', 'g') = b.rownum
                       AND right(regexp_replace(COALESCE(o4.phone,''), '\D', '', 'g'), 8) = b.phone8) AS live_ph_n
              FROM bad b
          )
          SELECT CASE
                   WHEN live_n = 0 AND dead_n > 0 THEN 'A. 표 번호의 주문이 취소상태로만 존재'
                   WHEN live_n = 0 THEN 'B. 표 번호의 주문이 원장에 아예 없음'
                   WHEN live_n = 1 AND live_ph_n = 0 THEN 'C. 주문은 있으나 연락처 불일치(명의 다름)'
                   WHEN live_n > 1 THEN 'D. 같은 번호 주문이 여러 건(모호)'
                   ELSE 'E. 기타'
                 END AS 사유, COUNT(*) AS 건수
            FROM cand GROUP BY 1 ORDER BY 2 DESC;
          SQL

      - name: ② 작업별 분포
        run: |
          psql "$PGCONN" -P pager=off -v ON_ERROR_STOP=1 <<'SQL'
          SELECT cp.tab_name AS 작업, COUNT(*) AS 어긋난줄
            FROM campaign_participants cp
            JOIN order_submissions os ON os.id = cp.order_submission_id
           WHERE cp.deleted_at IS NULL AND os.deleted_at IS NULL
             AND length(regexp_replace(COALESCE(cp.row_json->>'주문번호',''), '\D', '', 'g')) >= 6
             AND length(regexp_replace(COALESCE(os.order_num,''), '\D', '', 'g')) >= 6
             AND regexp_replace(cp.row_json->>'주문번호', '\D', '', 'g')
              <> regexp_replace(os.order_num, '\D', '', 'g')
           GROUP BY 1 ORDER BY 2 DESC LIMIT 30;
          SQL

      - name: ③ 표본 20줄
        run: |
          psql "$PGCONN" -P pager=off -v ON_ERROR_STOP=1 <<'SQL'
          SELECT cp.tab_name AS 작업, cp.seq AS 줄, cp.reviewer_name AS 참여자,
                 regexp_replace(cp.row_json->>'주문번호', '\D', '', 'g') AS 표번호,
                 regexp_replace(os.order_num, '\D', '', 'g') AS 링크번호,
                 os.recipient AS 링크수취인, os.mirror_status AS 링크상태
            FROM campaign_participants cp
            JOIN order_submissions os ON os.id = cp.order_submission_id
           WHERE cp.deleted_at IS NULL AND os.deleted_at IS NULL
             AND length(regexp_replace(COALESCE(cp.row_json->>'주문번호',''), '\D', '', 'g')) >= 6
             AND length(regexp_replace(COALESCE(os.order_num,''), '\D', '', 'g')) >= 6
             AND regexp_replace(cp.row_json->>'주문번호', '\D', '', 'g')
              <> regexp_replace(os.order_num, '\D', '', 'g')
           ORDER BY cp.tab_name, cp.seq LIMIT 20;
          SQL
