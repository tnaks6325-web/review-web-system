# ─────────────────────────────────────────────────────────────
# 일회성: 2026-08-19 중복 정리가 **잘못 취소한 주문** 되돌리기
#
# 사고 사슬
#   ① 투영이 주문 링크를 연락처 하나로만 정해, 한 사람의 여러 줄이 **한 주문**을 가리켰다.
#   ② 중복 정리가 그 링크를 믿고 뒤 줄을 내리면서 **그 줄이 가리키던 주문까지 취소**했다.
#      링크가 오염돼 있었으니 취소된 주문도 엉뚱한 것이었다.
#   실측(장수산업): 취소 13건 중 12건이 **표에 그 번호를 쓰는 살아 있는 줄이 있는** 주문이었다.
#   취소된 주문은 리뷰비 입금 대상 추출과 리뷰어 화면에서 빠진다(표에는 줄이 남아 안 보인다).
#
# ★★ 되돌리는 대상은 세 조건을 **전부** 만족하는 것만(완화 금지)
#   ㉮ `canceled_by LIKE 'dedupe:%'` — **중복 정리가 취소한 것만**. 관리자가 [주문취소]로 의도해서
#      내린 건(리뷰어 로그의 취소 처리 등)은 절대 되살리지 않는다.
#   ㉯ 주문번호 6자리 이상 — 판정할 수 없으면 손대지 않는다.
#   ㉰ 같은 탭에 **표 주문번호가 그 주문번호와 같은 살아 있는 줄이 있다** — 그 구매가 표에 남아
#      있다는 증거. 줄이 없으면 정상 취소일 수 있으므로 그대로 둔다.
#
# ★ `mirror_status` 는 'written' 으로 되돌린다 — 그 줄이 작업표에 이미 기록돼 있다는 것이 ㉰ 의
#   의미다. 'pending' 으로 두면 큐가 시트에 다시 쓰려 해 중복 기록이 난다.
# ★ `canceled_by` 는 **지우지 않는다** — "취소된 적 있음" 이력을 남긴다.
# ★ 되돌리기 = 소프트(그 주문을 다시 `deleted_at` 으로 내리면 된다).
# ─────────────────────────────────────────────────────────────
name: DB Order Uncancel 2026-08-19 (one-off)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/db-order-uncancel-20260819.yml'
  workflow_dispatch:

concurrency:
  group: db-order-uncancel-20260819
  cancel-in-progress: false

jobs:
  uncancel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGCONN: ${{ secrets.BACKUP_DATABASE_URL }}
    steps:
      - name: psql 준비
        run: psql --version || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)

      - name: ① 전수 진단 — 중복 정리가 취소한 주문(작업별)
        run: |
          psql "$PGCONN" -P pager=off -v ON_ERROR_STOP=1 <<'SQL'
          SELECT os.tab_name AS 작업,
                 COUNT(*) AS 취소된주문,
                 COUNT(*) FILTER (WHERE EXISTS (
                   SELECT 1 FROM campaign_participants live
                    WHERE live.sheet_id = os.sheet_id AND live.tab_name = os.tab_name
                      AND live.deleted_at IS NULL
                      AND regexp_replace(COALESCE(live.row_json->>'주문번호',''), '\D', '', 'g')
                        = regexp_replace(os.order_num, '\D', '', 'g'))) AS 잘못취소_되돌릴것,
                 string_agg(DISTINCT os.canceled_by, ', ') AS 취소주체
            FROM order_submissions os
           WHERE os.deleted_at IS NOT NULL
             AND os.mirror_status = 'canceled'
             AND os.canceled_by LIKE 'dedupe:%'
             AND length(regexp_replace(COALESCE(os.order_num,''), '\D', '', 'g')) >= 6
           GROUP BY os.tab_name
           ORDER BY 3 DESC, 2 DESC;
          SQL

      - name: ① 되돌리지 않는 것 — 취소 주체가 중복 정리가 아닌 건(참고)
        run: |
          psql "$PGCONN" -P pager=off -v ON_ERROR_STOP=1 <<'SQL'
          SELECT COALESCE(NULLIF(canceled_by,''), '(미기록)') AS 취소주체, COUNT(*) AS 건수
            FROM order_submissions
           WHERE deleted_at IS NOT NULL AND mirror_status = 'canceled'
             AND (canceled_by IS NULL OR canceled_by NOT LIKE 'dedupe:%')
           GROUP BY 1 ORDER BY 2 DESC LIMIT 30;
          SQL

      - name: ② 되돌리기 실행
        run: |
          psql "$PGCONN" -P pager=off -v ON_ERROR_STOP=1 <<'SQL'
          UPDATE order_submissions os
             SET deleted_at = NULL, mirror_status = 'written', updated_at = NOW()
           WHERE os.deleted_at IS NOT NULL
             AND os.mirror_status = 'canceled'
             AND os.canceled_by LIKE 'dedupe:%'
             AND length(regexp_replace(COALESCE(os.order_num,''), '\D', '', 'g')) >= 6
             AND EXISTS (
                   SELECT 1 FROM campaign_participants live
                    WHERE live.sheet_id = os.sheet_id AND live.tab_name = os.tab_name
                      AND live.deleted_at IS NULL
                      AND regexp_replace(COALESCE(live.row_json->>'주문번호',''), '\D', '', 'g')
                        = regexp_replace(os.order_num, '\D', '', 'g'))
          RETURNING os.tab_name, os.sheet_row, os.recipient,
                    regexp_replace(os.order_num, '\D', '', 'g') AS 주문번호;
          SQL

      - name: ③ 링크 정정 재실행(되살아난 주문으로 제자리 연결)
        run: |
          psql "$PGCONN" -P pager=off -v ON_ERROR_STOP=1 <<'SQL'
          WITH uniq AS (
            SELECT sheet_id, tab_name,
                   regexp_replace(order_num, '\D', '', 'g') AS num,
                   MIN(id::text) AS oid, COUNT(*) AS n,
                   MIN(regexp_replace(COALESCE(phone,''), '\D', '', 'g')) AS ph
              FROM order_submissions
             WHERE deleted_at IS NULL
               AND length(regexp_replace(COALESCE(order_num,''), '\D', '', 'g')) >= 6
             GROUP BY 1,2,3
          )
          UPDATE campaign_participants cp
             SET order_submission_id = u.oid::uuid, updated_at = NOW(),
                 updated_by = 'relink:20260819b'
            FROM uniq u
           WHERE u.sheet_id = cp.sheet_id AND u.tab_name = cp.tab_name
             AND u.num = regexp_replace(COALESCE(cp.row_json->>'주문번호',''), '\D', '', 'g')
             AND cp.deleted_at IS NULL AND u.n = 1
             AND right(u.ph, 8) = cp.phone8
             AND cp.order_submission_id IS DISTINCT FROM u.oid::uuid;
          SQL

      - name: ④ 결과 확인
        run: |
          psql "$PGCONN" -P pager=off -v ON_ERROR_STOP=1 <<'SQL'
          SELECT COUNT(*) AS 남은_잘못취소
            FROM order_submissions os
           WHERE os.deleted_at IS NOT NULL AND os.mirror_status = 'canceled'
             AND os.canceled_by LIKE 'dedupe:%'
             AND length(regexp_replace(COALESCE(os.order_num,''), '\D', '', 'g')) >= 6
             AND EXISTS (SELECT 1 FROM campaign_participants live
                          WHERE live.sheet_id = os.sheet_id AND live.tab_name = os.tab_name
                            AND live.deleted_at IS NULL
                            AND regexp_replace(COALESCE(live.row_json->>'주문번호',''), '\D', '', 'g')
                              = regexp_replace(os.order_num, '\D', '', 'g'));
          SELECT COUNT(*) AS 남은_링크어긋난_활성줄
            FROM campaign_participants cp
            JOIN order_submissions os ON os.id = cp.order_submission_id
           WHERE cp.deleted_at IS NULL AND os.deleted_at IS NULL
             AND length(regexp_replace(COALESCE(cp.row_json->>'주문번호',''), '\D', '', 'g')) >= 6
             AND length(regexp_replace(COALESCE(os.order_num,''), '\D', '', 'g')) >= 6
             AND regexp_replace(cp.row_json->>'주문번호', '\D', '', 'g')
              <> regexp_replace(os.order_num, '\D', '', 'g');
          SQL
