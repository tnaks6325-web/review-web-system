name: Oneoff - 오삭제 19줄 되살리기

on:
  workflow_dispatch:
  push:
    branches: [ 'oneoff/link-preview' ]

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore19
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -e
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          \pset pager off

          BEGIN;

          CREATE TEMP TABLE tgt(tab text, seq int, p8 text) ON COMMIT DROP;
          INSERT INTO tgt VALUES
            ('0721)장수돌침대_쿠팡_탄소매트 900건', 76,  '33536503'),
            ('0721)장수돌침대_쿠팡_탄소매트 900건', 105, '57420174'),
            ('5/20쿠팡_선크림', 58,  '32318337'),
            ('5/20쿠팡_선크림', 64,  '44505536'),
            ('5/20쿠팡_선크림', 75,  '75680537'),
            ('5/20쿠팡_선크림', 84,  '20633418'),
            ('5/20쿠팡_선크림', 89,  '32065020'),
            ('5/20쿠팡_선크림', 94,  '85217240'),
            ('5/20쿠팡_선크림', 105, '39291625'),
            ('5/6(메이커스)메디슨벨_알약패치 200건', 74,  '26500532'),
            ('5/6(메이커스)메디슨벨_알약패치 200건', 106, '57448945'),
            ('5/6(메이커스)메디슨벨_알약패치 200건', 126, '39501432'),
            ('5/6(메이커스)메디슨벨_알약패치 200건', 131, '97575079'),
            ('5/6(메이커스)메디슨벨_알약패치 200건', 158, '72951991'),
            ('6/18아르퓨레행주_쿠팡500건', 198, '52197890'),
            ('6/25(공영쇼핑)시크릿에이지_선크림+아이크림 200건', 206, '47434797'),
            ('7/28(쿠팡)넛세린_바디관리 2종세트 50건', 54, '48302320'),
            ('7/28(쿠팡)넛세린_바디관리 2종세트 50건', 62, '34683476'),
            ('7/28(쿠팡)넛세린_바디관리 2종세트 50건', 65, '39291625');

          \echo '=== 되살릴 대상 확인 ==='
          SELECT cp.tab_name, cp.seq AS "#", COALESCE(cp.row_json->>'번호','') AS 번호칸,
                 cp.row_json->>'수취인' AS 수취인, cp.phone8,
                 to_char(cp.deleted_at,'MM-DD HH24:MI') AS 내려간시각
            FROM campaign_participants cp JOIN tgt t
              ON t.tab=cp.tab_name AND t.seq=cp.seq AND t.p8=cp.phone8
           WHERE cp.deleted_at >= '2026-08-19 07:00'::timestamp
             AND cp.deleted_at <  '2026-08-19 08:00'::timestamp
           ORDER BY cp.tab_name, cp.seq;

          -- 대상이 정확히 19줄이 아니면 전체 취소
          DO $$
          DECLARE n int;
          BEGIN
            SELECT COUNT(*) INTO n
              FROM campaign_participants cp JOIN tgt t
                ON t.tab=cp.tab_name AND t.seq=cp.seq AND t.p8=cp.phone8
             WHERE cp.deleted_at >= '2026-08-19 07:00'::timestamp
               AND cp.deleted_at <  '2026-08-19 08:00'::timestamp;
            IF n <> 19 THEN
              RAISE EXCEPTION '대상이 19줄이 아닙니다 (실제 %줄) — 전체 취소', n;
            END IF;
          END $$;

          UPDATE campaign_participants cp
             SET deleted_at = NULL, active = TRUE
            FROM tgt t
           WHERE t.tab=cp.tab_name AND t.seq=cp.seq AND t.p8=cp.phone8
             AND cp.deleted_at >= '2026-08-19 07:00'::timestamp
             AND cp.deleted_at <  '2026-08-19 08:00'::timestamp;

          \echo ''
          \echo '=== 되살린 결과 ==='
          SELECT cp.tab_name, cp.seq AS "#", cp.row_json->>'수취인' AS 수취인,
                 cp.phone8, cp.deleted_at IS NULL AS 살아있음, cp.active
            FROM campaign_participants cp JOIN tgt t
              ON t.tab=cp.tab_name AND t.seq=cp.seq AND t.p8=cp.phone8
           ORDER BY cp.tab_name, cp.seq;

          \echo ''
          \echo '=== 되살린 작업의 무시트 여부 (장부 재생성 대상 판별용) ==='
          SELECT DISTINCT tc.sheet_id, tc.tab_name, COALESCE(tc.sheetless,FALSE) AS 무시트
            FROM tab_configs tc JOIN tgt t ON t.tab = tc.tab_name
           ORDER BY tc.tab_name;

          COMMIT;
          SQL
