name: Oneoff - 링크 정정 미리보기 (읽기 전용)

on:
  workflow_dispatch:
  push:
    branches: [ 'oneoff/link-preview' ]

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preview4
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -e
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          \pset pager off

          CREATE TEMP VIEW onum AS
          SELECT cp.*,
                 regexp_replace(COALESCE((
                   SELECT string_agg(t.value,'' ORDER BY t.key)
                     FROM jsonb_each_text(COALESCE(cp.row_json,'{}'::jsonb)) t(key,value)
                    WHERE t.key LIKE '%주문번호%'),''),'\D','','g') AS onum
            FROM campaign_participants cp;

          \echo '=== ① 08-19 에 내려간 줄 — 시각대별 묶음 ==='
          SELECT to_char(deleted_at,'MM-DD HH24:MI') AS 내려간시각, COUNT(*) AS 줄수,
                 COUNT(DISTINCT tab_name) AS 작업수
            FROM campaign_participants
           WHERE deleted_at >= '2026-08-19'::date
           GROUP BY 1 ORDER BY 1;

          \echo ''
          \echo '=== ② 07:00~08:00 내려간 줄 — 지금 규칙으로 재판정 ==='
          WITH gone AS (
            SELECT * FROM onum
             WHERE deleted_at >= '2026-08-19 07:00'::timestamp
               AND deleted_at <  '2026-08-19 08:00'::timestamp
          )
          SELECT g.tab_name, g.seq AS "#", COALESCE(g.row_json->>'번호','') AS 번호칸,
                 g.row_json->>'수취인' AS 수취인, g.phone8,
                 COALESCE(NULLIF(g.onum,''),'(빈칸)') AS 표주문번호,
                 CASE
                   WHEN length(g.onum) < 6 THEN '판정불가(표 주문번호 없음)'
                   WHEN EXISTS (SELECT 1 FROM onum s
                                 WHERE s.sheet_id=g.sheet_id AND s.tab_name=g.tab_name
                                   AND s.deleted_at IS NULL AND s.onum = g.onum
                                   AND s.phone8 = g.phone8)
                        THEN '정상 정리(같은 번호+명의 줄이 살아있음)'
                   ELSE '★ 오삭제 의심(같은 번호+명의 줄 없음)'
                 END AS 판정
            FROM gone g
           ORDER BY 판정 DESC, g.tab_name, g.seq;

          \echo ''
          \echo '=== ③ 08-19 전체 내려간 줄 — 판정 요약 ==='
          WITH gone AS (SELECT * FROM onum WHERE deleted_at >= '2026-08-19'::date)
          SELECT to_char(g.deleted_at,'HH24:MI') AS 시각,
                 CASE
                   WHEN length(g.onum) < 6 THEN '판정불가'
                   WHEN EXISTS (SELECT 1 FROM onum s
                                 WHERE s.sheet_id=g.sheet_id AND s.tab_name=g.tab_name
                                   AND s.deleted_at IS NULL AND s.onum = g.onum
                                   AND s.phone8 = g.phone8)
                        THEN '정상 정리'
                   ELSE '★ 오삭제 의심'
                 END AS 판정,
                 COUNT(*)
            FROM gone g GROUP BY 1,2 ORDER BY 1,2;

          \echo ''
          \echo '=== ④ 08-19 전체 오삭제 의심 줄 목록 ==='
          WITH gone AS (SELECT * FROM onum WHERE deleted_at >= '2026-08-19'::date)
          SELECT to_char(g.deleted_at,'HH24:MI') AS 시각, g.tab_name,
                 g.seq AS "#", COALESCE(g.row_json->>'번호','') AS 번호칸,
                 g.row_json->>'수취인' AS 수취인, g.phone8, g.onum AS 표주문번호,
                 g.order_submission_id IS NOT NULL AS 링크있음
            FROM gone g
           WHERE length(g.onum) >= 6
             AND NOT EXISTS (SELECT 1 FROM onum s
                              WHERE s.sheet_id=g.sheet_id AND s.tab_name=g.tab_name
                                AND s.deleted_at IS NULL AND s.onum = g.onum
                                AND s.phone8 = g.phone8)
           ORDER BY g.tab_name, g.seq;
          SQL
