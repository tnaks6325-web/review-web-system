name: Oneoff - 링크 정정 미리보기 (읽기 전용)

on:
  workflow_dispatch:
  push:
    branches: [ 'oneoff/link-preview' ]

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preview5
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -e
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          \pset pager off

          CREATE TEMP VIEW onum AS
          SELECT cp.*,
                 regexp_replace(COALESCE((
                   SELECT string_agg(t.value,'' ORDER BY t.key)
                     FROM jsonb_each_text(COALESCE(cp.row_json,'{}'::jsonb)) t(key,value)
                    WHERE t.key LIKE '%주문번호%'),''),'\D','','g') AS onum
            FROM campaign_participants cp;

          CREATE TEMP VIEW flagged AS
          SELECT g.* FROM onum g
           WHERE g.deleted_at >= '2026-08-19'::date
             AND length(g.onum) >= 6
             AND NOT EXISTS (SELECT 1 FROM onum s
                              WHERE s.sheet_id=g.sheet_id AND s.tab_name=g.tab_name
                                AND s.deleted_at IS NULL AND s.onum=g.onum AND s.phone8=g.phone8);

          \echo '=== ⑤ 08-19 판정 요약 (전체) ==='
          WITH gone AS (SELECT * FROM onum WHERE deleted_at >= '2026-08-19'::date)
          SELECT CASE
                   WHEN length(g.onum) < 6 THEN '판정불가(표 주문번호 없음)'
                   WHEN EXISTS (SELECT 1 FROM onum s
                                 WHERE s.sheet_id=g.sheet_id AND s.tab_name=g.tab_name
                                   AND s.deleted_at IS NULL AND s.onum=g.onum AND s.phone8=g.phone8)
                        THEN '정상 정리'
                   ELSE '오삭제 의심'
                 END AS 판정, COUNT(*)
            FROM gone g GROUP BY 1 ORDER BY 2 DESC;

          \echo ''
          \echo '=== ⑥ 오삭제 의심 118줄 — 그 사람의 줄이 그 작업에 남아 있는가 ==='
          SELECT CASE WHEN (SELECT COUNT(*) FROM onum s
                             WHERE s.sheet_id=f.sheet_id AND s.tab_name=f.tab_name
                               AND s.deleted_at IS NULL AND s.phone8=f.phone8) > 0
                      THEN '㉮ 같은 사람 줄이 남아 있음(중복 정리로 볼 여지)'
                      ELSE '㉯ 그 사람 줄이 하나도 없음 — 참여가 사라짐' END AS 구분,
                 COUNT(*) AS 줄수, COUNT(DISTINCT f.tab_name||f.phone8) AS 사람수
            FROM flagged f GROUP BY 1 ORDER BY 2 DESC;

          \echo ''
          \echo '=== ⑦ ㉯ 참여가 통째로 사라진 건 (사람 단위) ==='
          SELECT f.tab_name, f.row_json->>'수취인' AS 수취인, f.phone8,
                 COUNT(*) AS 내려간줄수,
                 string_agg(DISTINCT f.onum, ' / ') AS 표주문번호들,
                 string_agg(DISTINCT to_char(f.deleted_at,'HH24:MI'), ',') AS 시각
            FROM flagged f
           WHERE NOT EXISTS (SELECT 1 FROM onum s
                              WHERE s.sheet_id=f.sheet_id AND s.tab_name=f.tab_name
                                AND s.deleted_at IS NULL AND s.phone8=f.phone8)
           GROUP BY 1,2,3 ORDER BY 1,2;

          \echo ''
          \echo '=== ⑧ ㉮ 같은 사람 줄이 남아 있는 건 (사람 단위) ==='
          SELECT f.tab_name, f.row_json->>'수취인' AS 수취인, f.phone8,
                 COUNT(*) AS 내려간줄수,
                 (SELECT COUNT(*) FROM onum s
                   WHERE s.sheet_id=f.sheet_id AND s.tab_name=f.tab_name
                     AND s.deleted_at IS NULL AND s.phone8=f.phone8) AS 남은줄수,
                 string_agg(DISTINCT f.onum, ' / ') AS 내려간표번호,
                 (SELECT string_agg(DISTINCT NULLIF(s.onum,''), ' / ') FROM onum s
                   WHERE s.sheet_id=f.sheet_id AND s.tab_name=f.tab_name
                     AND s.deleted_at IS NULL AND s.phone8=f.phone8) AS 남은표번호
            FROM flagged f
           WHERE EXISTS (SELECT 1 FROM onum s
                          WHERE s.sheet_id=f.sheet_id AND s.tab_name=f.tab_name
                            AND s.deleted_at IS NULL AND s.phone8=f.phone8)
           GROUP BY 1,2,3 ORDER BY 4 DESC, 1;
          SQL
