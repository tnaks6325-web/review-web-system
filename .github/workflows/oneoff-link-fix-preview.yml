name: Oneoff - 링크 정정 미리보기 (읽기 전용)

on:
  workflow_dispatch:
  push:
    branches: [ 'oneoff/link-preview' ]

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preview3
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -e
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          \pset pager off

          \echo '=== ⓔ 이지유 연락처(33536503)로 낸 모든 주문 ==='
          SELECT os.id, regexp_replace(COALESCE(os.order_num,''),'\D','','g') AS 주문번호,
                 os.orderer AS 주문자, os.recipient AS 수취인,
                 right(regexp_replace(COALESCE(os.phone,''),'\D','','g'),8) AS 연락처8,
                 os.tab_name, to_char(os.submitted_at,'YY-MM-DD HH24:MI') AS 제출,
                 os.mirror_status, os.sheet_row, os.deleted_at IS NOT NULL AS 삭제됨
            FROM order_submissions os
           WHERE right(regexp_replace(COALESCE(os.phone,''),'\D','','g'),8) = '33536503'
           ORDER BY os.submitted_at;

          \echo ''
          \echo '=== ⓕ 수취인이 이지유/노대송/김옥선 인 주문 (전 탭) ==='
          SELECT os.id, regexp_replace(COALESCE(os.order_num,''),'\D','','g') AS 주문번호,
                 os.orderer AS 주문자, os.recipient AS 수취인,
                 right(regexp_replace(COALESCE(os.phone,''),'\D','','g'),8) AS 연락처8,
                 os.tab_name, to_char(os.submitted_at,'YY-MM-DD HH24:MI') AS 제출,
                 os.mirror_status, os.sheet_row, os.deleted_at IS NOT NULL AS 삭제됨
            FROM order_submissions os
           WHERE btrim(COALESCE(os.recipient,'')) IN ('이지유','노대송','김옥선')
              OR btrim(COALESCE(os.orderer,''))   IN ('이지유','노대송','김옥선')
           ORDER BY os.submitted_at;

          \echo ''
          \echo '=== ⓖ 장수돌침대 표에서 그 세 사람 줄 (내려간 줄 포함) ==='
          SELECT cp.seq AS "#", COALESCE(cp.row_json->>'번호','') AS 번호칸,
                 cp.row_json->>'수취인' AS 수취인, cp.phone8,
                 cp.row_json->>'구매일자' AS 구매일자,
                 regexp_replace(COALESCE((
                   SELECT string_agg(t.value,'' ORDER BY t.key)
                     FROM jsonb_each_text(COALESCE(cp.row_json,'{}'::jsonb)) t(key,value)
                    WHERE t.key LIKE '%주문번호%'),''),'\D','','g') AS 표주문번호,
                 cp.order_submission_id AS 링크, cp.source,
                 cp.deleted_at IS NOT NULL AS 내려간줄,
                 to_char(cp.deleted_at,'MM-DD HH24:MI') AS 내려간시각
            FROM campaign_participants cp
           WHERE cp.tab_name = '0721)장수돌침대_쿠팡_탄소매트 900건'
             AND (cp.row_json->>'수취인' IN ('이지유','노대송','김옥선')
                  OR cp.phone8 IN ('33536503','53849851'))
           ORDER BY cp.seq;
          SQL
