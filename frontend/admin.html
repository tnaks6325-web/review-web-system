<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex"/>
  <title>리뷰웹시스템</title>
  <!-- OG/SNS 공유 미리보기 — 예전에 이 주소로 나간 구매양식 링크의 미리보기 문구를 유지한다 -->
  <meta property="og:title" content="리뷰웹시스템"/>
  <meta property="og:description" content="리뷰제출 여기서 해주세요"/>
  <meta property="og:type" content="website"/>
  <!--
    ★★ 옛 관리자 대시보드는 2026-10-21 폐기됐다(결정 267 · 사용자 확정). 이 파일은 옛 주소(/admin)로 들어온 사람을 옮겨 주는 정류장이다.
    - 예전 구매양식 링크(?mode=form · ?r= · ?s= · ?sheetId=)는 리뷰어 구매양식(search.html)으로 쿼리째 보낸다
      (search-app.js 가 같은 파라미터를 그대로 읽는다 — 옛 index-app.js initOrderFormMode 와 같은 규칙).
    - 그 밖에는 리뷰웹시스템[3버전](workdesk.html)으로 보낸다. 같은 탭·같은 출처라 로그인(sessionStorage admin_token)이 이어지고,
      #sso= · #go= 같은 해시도 그대로 넘긴다.
    - Cloudflare `_redirects` 가 아니라 이 파일로 하는 이유: `_redirects` 는 쿼리로 목적지를 가를 수 없고, Railway 테스트 정적 호스트는 `_redirects` 를 읽지 않는다.
    ★ 이 파일을 지우면 /admin 이 리뷰어 홈으로 떨어진다(Pages SPA 폴백) — 지우지 말 것.
  -->
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var form = q.get('mode') === 'form' || !!q.get('r') || !!q.get('s') || !!q.get('sheetId');
      location.replace(form ? 'search.html' + location.search + location.hash : 'workdesk.html' + location.hash);
    })();
  </script>
  <style>
    body { margin: 0; padding: 48px 16px; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: #F9FAFB; color: #111827; text-align: center; }
    a { color: #2563EB; font-weight: 700; }
  </style>
</head>
<body>
  <p>리뷰웹시스템으로 이동하고 있습니다…</p>
  <p><a href="workdesk.html">리뷰웹시스템 열기</a></p>
</body>
</html>
