<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>인기상품 설정 UI 리디자인</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#edf2f8;color:#17213b;font:14px/1.45 system-ui,"Segoe UI",sans-serif}.stage{min-height:100vh;display:grid;place-items:center;padding:30px;background:rgba(23,33,59,.15)}.modal{width:min(760px,100%);max-height:calc(100vh - 60px);overflow:auto;background:#fff;border-radius:18px;box-shadow:0 28px 80px rgba(22,37,65,.26)}.head{display:flex;align-items:flex-start;gap:12px;padding:24px 26px 20px;border-bottom:1px solid #e6ecf4}.icon{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:#fff0e7;font-size:20px}.head h1{margin:0;font-size:19px}.head p{margin:4px 0 0;color:#64748b;font-size:13px}.close{margin-left:auto;border:0;background:none;color:#94a3b8;font-size:24px;cursor:pointer}.product{display:flex;align-items:center;gap:11px;margin:18px 26px;padding:12px 13px;border-radius:11px;background:#fff8f3;border:1px solid #fed7aa}.product small{display:block;color:#9a3412;font-size:11px}.product b{font-size:13px}.product .tag{margin-left:auto;padding:4px 8px;border-radius:99px;background:#fee2e2;color:#b91c1c;font-size:11px;font-weight:800}.body{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 26px 22px}.panel{min-height:285px;border:1px solid #dce5f1;border-radius:12px;overflow:hidden}.panel-head{padding:13px 14px;border-bottom:1px solid #e9eef5;background:#f8fafc}.panel-head b{display:block;font-size:14px}.panel-head span{color:#64748b;font-size:11px}.queue{padding:8px}.empty{padding:28px 10px;text-align:center;color:#94a3b8;font-size:12px}.priority{display:flex;align-items:center;gap:9px;padding:10px;margin-bottom:6px;border:1px solid #bfdbfe;border-radius:9px;background:#eff6ff;cursor:grab}.priority .rank{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;background:#2563eb;color:#fff;font-size:11px;font-weight:800}.priority .name{flex:1;font-weight:750;font-size:12px}.handle{color:#64748b;font-size:17px}.candidate{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid #eef2f7;cursor:pointer}.candidate:last-child{border:0}.candidate input{width:17px;height:17px;accent-color:#2563eb}.candidate b{display:block;font-size:12px}.candidate small{color:#64748b;font-size:11px}.candidate .status{margin-left:auto;color:#2563eb;font-size:11px}.tip{margin:0 26px 18px;padding:10px 12px;border-radius:9px;background:#f0fdf4;color:#166534;font-size:12px}.foot{display:flex;align-items:center;gap:9px;padding:17px 26px;border-top:1px solid #e6ecf4;background:#fbfdff}.count{margin-right:auto;color:#64748b;font-size:12px}.btn{padding:10px 15px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:#475569;font-weight:800;cursor:pointer}.btn.primary{border-color:#2563eb;background:#2563eb;color:#fff}@media(max-width:620px){.stage{padding:12px}.modal{max-height:calc(100vh - 24px)}.head,.body,.foot{padding-left:16px;padding-right:16px}.product,.tip{margin-left:16px;margin-right:16px}.body{grid-template-columns:1fr}.panel{min-height:0}}
</style></head><body><main class="stage"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="title"><header class="head"><div class="icon">🔥</div><div><h1 id="title">인기상품 설정</h1><p>선행참여 공고를 선택하고 우선순위를 정하세요.</p></div><button class="close" aria-label="닫기">×</button></header><div class="product"><div><small>인기상품</small><b>판타스틱 대용량 짜먹는 고양이 간식</b></div><span class="tag">인기 ON</span></div><div class="body"><section class="panel"><header class="panel-head"><b>선행참여 우선순위</b><span>드래그로 순서 변경</span></header><div class="queue" id="queue"><div class="empty">오른쪽에서 공고를 선택하세요.</div></div></section><section class="panel"><header class="panel-head"><b>비인기 모집공고</b><span>모집중 공고만 표시</span></header><div id="candidates"><label class="candidate"><input type="checkbox" value="메디슨벨 파라다이스 그레인 미토 버닝"><span><b>메디슨벨 파라다이스 그레인 미토 버닝</b><small>쿠팡 · 바로참여</small></span><span class="status">모집중</span></label><label class="candidate"><input type="checkbox" value="좋은상황 상황버섯진액 10포"><span><b>좋은상황 상황버섯진액 10포</b><small>쿠팡 · 바로참여</small></span><span class="status">모집중</span></label><label class="candidate"><input type="checkbox" value="우레온 모이스처 바디 리셋 미스트"><span><b>우레온 모이스처 바디 리셋 미스트</b><small>네이버 · 바로참여</small></span><span class="status">모집중</span></label></div></section></div><div class="tip">1순위 공고가 모집완료되면 다음 공고가 자동으로 선행참여 대상으로 적용됩니다.</div><footer class="foot"><span id="count" class="count">선택된 공고 없음</span><button class="btn">취소</button><button id="save" class="btn primary">ON 저장</button></footer></section></main><script>
const selected=[];let drag='';const queue=document.querySelector('#queue'),count=document.querySelector('#count');function draw(){queue.innerHTML=selected.length?selected.map((name,i)=>`<div class="priority" draggable="true" data-name="${name}"><span class="rank">${i+1}</span><span class="name">${name}</span><span class="handle">⠿</span></div>`).join(''):'<div class="empty">오른쪽에서 공고를 선택하세요.</div>';count.textContent=selected.length?`${selected.length}개 공고 선택됨`:'선택된 공고 없음';queue.querySelectorAll('[data-name]').forEach(row=>{row.ondragstart=()=>drag=row.dataset.name;row.ondragover=e=>e.preventDefault();row.ondrop=e=>{e.preventDefault();const from=selected.indexOf(drag),to=selected.indexOf(row.dataset.name);if(from!==to){selected.splice(from,1);selected.splice(to,0,drag);draw()}}})}document.querySelectorAll('#candidates input').forEach(input=>input.onchange=()=>{const i=selected.indexOf(input.value);if(input.checked&&i<0)selected.push(input.value);if(!input.checked&&i>=0)selected.splice(i,1);draw()});document.querySelector('#save').onclick=()=>{document.querySelector('#save').textContent='저장됨';setTimeout(()=>document.querySelector('#save').textContent='ON 저장',1200)};draw();
</script></body></html>
