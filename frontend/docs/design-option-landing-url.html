<script>
(function () {
  // ── 가짜 데이터 (실제 운영 형태를 그대로 흉내) ────────────────
  var DATA = {
    product: '이노크아든 수분크림',
    productUrl: 'https://www.coupang.com/vp/products/8891112223',
    options: [
      { label: '화이트 50ml', pay: 28900, count: 40, daily: 10,
        url: 'https://www.coupang.com/vp/products/8891112223?itemId=2551',
        urlPartial: 'https://www.coupang.com/vp/products/8891112223?itemId=2551' },
      { label: '베이지 50ml', pay: 28900, count: 40, daily: 10,
        url: 'https://www.coupang.com/vp/products/8891112223?itemId=2552',
        urlPartial: '' },
      { label: '대용량 100ml', pay: 41500, count: 20, daily: 5,
        url: 'https://www.coupang.com/vp/products/8891119991',
        urlPartial: '' }
    ]
  };

  var S = { view: 'intra', inflow: 'link', mode: 'opt', fill: 'full', pick: 0 };

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function money(n) { return Number(n || 0).toLocaleString(); }
  /** 옵션별 유입 URL (상황 설정 반영) — 링크유입일 때만 쓰인다 */
  function optUrl(i) {
    if (S.inflow !== 'link') return '';           // 가이드유입 = 옵션별 유입 링크를 쓰지 않는다
    if (S.fill === 'empty') return '';
    if (S.fill === 'partial') return DATA.options[i].urlPartial;
    return DATA.options[i].url;
  }
  /** ★ 상품(메인) URL — 유입방식·옵션 유무와 무관하게 **항상 필수**(사용자 확정 2026-08-10).
   *  상품 확인용 값이라 가이드유입이어도 비워 둘 수 없다. [전부 비움]일 때만 빈 칸을 흉내낸다. */
  function mainUrl() { return S.fill === 'empty' ? '' : DATA.productUrl; }
  /** 판정 단일 출처와 같은 순서: 옵션 URL → 상품(메인) URL → 빈 값 */
  function resolveLanding(i) { return optUrl(i) || mainUrl() || ''; }
  function missingCount() {
    if (S.inflow !== 'link' || S.mode !== 'opt') return 0;
    return DATA.options.filter(function (_, i) { return !optUrl(i); }).length;
  }
  function mainMissing() { return !mainUrl(); }
  var GUIDE_OFF = '가이드유입이라 <b>옵션별 유입 링크</b>는 비활성입니다 — 상품(메인) URL은 그대로 필수입니다.';

  // ══════════ ① 인트라넷 리뷰오더 ══════════
  function viewIntra() {
    var linkMode = S.inflow === 'link';
    var showOpts = S.mode === 'opt';
    var rows = showOpts ? DATA.options.map(function (o, i) {
      var v = optUrl(i);
      var need = linkMode && !v;
      return '' +
      '<div class="ia-opt single">' +
        '<label><span class="ia-lb">옵션1</span><input class="ia-in" value="' + esc(o.label) + '" readonly></label>' +
        '<label class="urlcol ' + (linkMode ? 'hi' : '') + '"><span class="ia-lb">유입 링크' + (linkMode ? ' *' : '') + '</span>' +
          '<input class="ia-in ' + (need ? 'need' : '') + '" ' + (linkMode ? '' : 'disabled') +
          ' value="' + esc(v) + '" placeholder="' + (linkMode ? 'https://…  (이 옵션의 상품 페이지)' : '가이드유입 — 사용 안 함') + '"></label>' +
        '<label><span class="ia-lb">결제금액</span><input class="ia-in" value="' + money(o.pay) + '" readonly></label>' +
        '<label><span class="ia-lb">건수</span><input class="ia-in" value="' + o.count + '" readonly></label>' +
        '<button class="x">✕</button>' +
      '</div>';
    }).join('') : '';

    var totalRecruit = showOpts ? DATA.options.reduce(function (a, o) { return a + o.count; }, 0) : 100;
    var totalCost = showOpts ? DATA.options.reduce(function (a, o) { return a + o.pay * o.count; }, 0) : 28900 * 100;

    return '' +
    '<div class="desc"><h2>① 인트라넷 리뷰오더 — 상품/옵션/금액 블록</h2>' +
      '<p><b>바뀌는 것은 옵션 행에 [유입 링크] 칸 한 개가 붙는 것뿐</b>입니다<span class="newtag">신규</span>. ' +
      '상품 카드의 <b>상품(메인) URL 칸은 지금처럼 항상 필수</b>이고, 라벨만 역할을 밝히도록 바뀝니다.</p>' +

  // ══════════ ③ 리뷰어 화면 ══════════
  function viewReviewer() {
    var linkMode = S.inflow === 'link';
    var isOpt = S.mode === 'opt';
    var picked = DATA.options[S.pick] || DATA.options[0];

    var chips = isOpt ? '<div class="optchips">' + DATA.options.map(function (o, i) {
      return '<button class="optchip ' + (i === S.pick ? 'on' : '') + '" data-pick="' + i + '">' + esc(o.label) + '</button>';
    }).join('') + '</div>' : '';

    function guideCard(mode) {
      // mode: 'now' = 지금(공고 링크 1개) / 'next' = 바뀐 뒤(옵션별 링크)
      if (!linkMode) {
        return '<div class="cwd-box"><div class="cwd-tt">🧭 유입가이드</div>' +
          '<div class="cwd-body">쿠팡 앱에서 <b>"이노크아든 수분크림"</b> 검색 → 3번째 상품 → 옵션 선택 후 구매</div></div>' +
          '<div class="callout info" style="margin:0">가이드유입이라 <b>[상품 페이지 열기] 버튼 자체가 없습니다</b> — 지금도 바뀐 뒤에도 같습니다.</div>';
      }
      var url = (mode === 'now') ? DATA.productUrl : (isOpt ? (optUrl(S.pick) || DATA.productUrl) : (prodUrl() || DATA.productUrl));
      var fellBack = mode === 'next' && isOpt && !optUrl(S.pick);
      var label = (mode === 'now' || !isOpt) ? '🔗 상품 페이지 열기 (새 탭)' : '🔗 ' + esc(picked.label) + ' 상품 페이지 열기';
      return '<div class="cwd-box"><div class="cwd-tt">🧭 유입가이드</div>' +
        '<div class="cwd-body">아래 버튼으로 상품 페이지에 들어가 구매해 주세요.</div>' +
        ((mode === 'next' && isOpt) ? '<div class="cwd-pick">내가 고른 옵션 : ' + esc(picked.label) + '</div>' : '') +
        '<button class="cwd-btn">' + label + '</button>' +
        '<div class="cwd-url">' + esc(url) + '</div>' +
        (mode === 'now' && isOpt
          ? '<div class="badalert">⚠ 어느 옵션을 골랐든 <b>같은 주소</b>가 열립니다 — ' +
            '「' + esc(picked.label) + '」를 고른 리뷰어도 여기로 들어갑니다.</div>' : '') +
        (fellBack
          ? '<div class="badalert" style="background:#fff7ed;border-color:#fcd9a8;color:#8a4b09">' +
            '⚠ 이 옵션에 링크가 없어 <b>공고 랜딩 URL로 폴백</b>했습니다(= 지금과 같은 동작). ' +
            '기존에 발행된 공고는 전부 이 상태이며 <b>화면이 깨지지 않습니다</b>.</div>' : '') +
        '</div>';
    }

    return '' +
    '<div class="desc"><h2>③ 리뷰어 화면 — 참여 후 작업내용</h2>' +
      '<p>왼쪽이 <b>지금</b>, 오른쪽이 <b>바뀐 뒤</b>입니다. ' +
      (isOpt ? '아래 옵션 칩을 눌러 <b>고른 옵션에 따라 링크가 바뀌는지</b> 확인해 보세요.'
             : '옵션 없는 작업은 지금도 바뀐 뒤도 <b>링크 1개</b>로 같습니다.') + '</p>' +
      '<p><b>옵션 변경(다른 옵션으로 갈아타기) 시에도 자동으로 따라옵니다</b> — 옵션을 바꾸면 화면이 작업내용을 다시 불러오므로 추가 배선이 없습니다.</p>' +
    '</div>' +
    chips +
    '<div class="rv-wrap">' +
      '<div class="rv-col now"><span class="cap">지금 (링크 1개)</span><div class="phone">' +
        '<div class="cwd-box"><div class="cwd-tt">🛍 상품 · 옵션 · 결제금액</div><div class="cwd-body">' +
          esc(DATA.product) + (isOpt ? ' — ' + esc(picked.label) : '') + '<br>결제금액 ' + money(isOpt ? picked.pay : 28900) + '원</div></div>' +
        guideCard('now') + '</div></div>' +
      '<div class="rv-col next"><span class="cap">바뀐 뒤 (옵션별 링크)</span><div class="phone">' +
        '<div class="cwd-box"><div class="cwd-tt">🛍 상품 · 옵션 · 결제금액</div><div class="cwd-body">' +
          esc(DATA.product) + (isOpt ? ' — ' + esc(picked.label) : '') + '<br>결제금액 ' + money(isOpt ? picked.pay : 28900) + '원</div></div>' +
        guideCard('next') + '</div></div>' +
    '</div>' +
    '<div class="callout warn">🔒 <b>참여 전에는 링크를 보여주지 않습니다.</b> 지금도 옵션 금액은 "참여 후 공개"이고, ' +
      '링크도 같은 성질입니다 — 참여(자리 확보) 전에 공개하면 <b>자리를 잡지 않고 구매부터 하는 지각 건</b>을 시스템이 스스로 유도하게 됩니다. ' +
      '공개 목록·상세 응답에는 URL을 싣지 않습니다.</div>' +
    '<div class="callout info">👁 <b>관리자 미리보기도 같은 판정을 씁니다</b> — 미리보기와 실제 리뷰어 화면이 갈라질 수 없게 ' +
      '판정 함수 한 벌(<code>resolveLandingUrl</code>)을 양쪽이 그대로 태웁니다.</div>';
  }

  function viewGate() {
    var linkMode = S.inflow === 'link';
    var isOpt = S.mode === 'opt';
    var miss = missingCount();
    var mainBad = mainMissing();
    var optBlocked = linkMode && isOpt && miss > 0;
    var blocked = mainBad || optBlocked;

    function gline(kind, txt) {
      var ico = kind === 'ok' ? '✓' : (kind === 'warn' ? '⚠' : '✕');
      return '<div class="gline ' + kind + '"><span class="ico">' + ico + '</span><span class="tx">' + txt + '</span></div>';
    }

    var lines = '' +
      gline('ok', '연결 탭 · 일 모집인원 — <b>설정됨</b>') +
      gline('ok', '구매 시간대 — <b>자율주문</b>') +
      // ★ 상품(메인) URL — 유입방식·옵션 유무와 무관하게 항상 검사(사용자 확정 2026-08-10)
      (mainBad
        ? gline('stop', '상품 URL — <b>비어 있음</b> · 유입방식·옵션 유무와 무관하게 <b>항상 필수</b>입니다')
        : gline('ok', '상품 URL — <b>입력됨</b> <span style="color:#8a93a6">(항상 필수)</span>')) +
      (linkMode
        ? (isOpt
            ? (miss
                ? gline('stop', '옵션별 유입 링크 — <b>' + miss + '개 비어 있음</b> (' +
                    DATA.options.filter(function (_, i) { return !optUrl(i); }).map(function (o) { return esc(o.label); }).join(' · ') + ')')
                : gline('ok', '옵션별 유입 링크 — <b>' + DATA.options.length + '개 모두 입력됨</b>'))
            : gline('ok', '유입 링크 — <b>상품 URL을 그대로 사용</b>'))
        : gline('ok', '유입방식 <b>유입가이드</b> — <b>옵션별 유입 링크</b>는 검사하지 않습니다')) +
      (linkMode && isOpt && !miss ? gline('warn', '옵션 3종의 링크가 서로 다릅니다 — 의도한 것인지 확인해 주세요(경고만)') : '');

    var d2 = '' +
      '<div class="gate"><h4>D2 선택에 따라 이렇게 달라집니다</h4>' +
        '<div class="gline ' + (optBlocked ? 'stop' : 'ok') + '"><span class="ico">' + (optBlocked ? '✕' : '✓') + '</span><span class="tx">' +
          '<b>게시(active) 저장만 차단 <span style="color:#17803d">(권장)</span></b> — ' +
          (optBlocked ? '지금 상태에서는 <b>[게시 상태로 저장]만</b> 잠기고, 임시저장은 됩니다.'
                      : '통과 — 게시 가능합니다.') + '</span></div>' +
        '<div class="gline ' + (optBlocked ? 'stop' : 'ok') + '"><span class="ico">' + (optBlocked ? '✕' : '✓') + '</span><span class="tx">' +
          '<b>저장 자체를 하드블록</b> — ' +
          (optBlocked ? '<b>저장 버튼 전체가 잠깁니다</b>. 옛 공고의 리뷰비·정원 긴급 정정도 함께 막힙니다.'
                      : '통과.') + '</span></div>' +
        '<div class="gline ' + (optBlocked ? 'warn' : 'ok') + '"><span class="ico">' + (optBlocked ? '⚠' : '✓') + '</span><span class="tx">' +
          '<b>경고만 (게시 허용)</b> — ' +
          (optBlocked ? '빨간 경고만 뜨고 <b>그대로 게시됩니다</b>. 누락이 리뷰어에게 그대로 나갑니다.' : '통과.') + '</span></div>' +
        '<div class="gnote">※ D2는 <b>옵션별 유입 링크</b>의 강제 수준만 정합니다 — ' +
          '<b>상품(메인) URL은 어느 선택지에서도 항상 필수</b>입니다.</div>' +
      '</div>';

    return '' +
    '<div class="desc"><h2>④ 게시 전 자동점검</h2>' +
      '<p>발행 모달 맨 아래 자동점검 블록은 <b>상품(메인) URL을 항상 검사</b>하고, 그 아래에 ' +
      '<b>옵션별 유입 링크 항목이 한 줄 추가</b>됩니다<span class="newtag">신규</span>. ' +
      '가이드유입이면 <b>옵션별 링크 항목만</b> 검사하지 않습니다(정상 상태를 경고로 칠하지 않는다는 레포 규율) — ' +
      '<b>상품 URL 검사는 그대로 남습니다</b>.</p>' +
      '<p>상단 <b>상황 설정</b>의 [URL 입력]을 <b>일부 비움 / 전부 비움</b>으로 바꿔 보세요.</p>' +
    '</div>' +
    '<div class="stage"><div class="stagehead">실제 화면 재현 — <b>모집공고 발행 › 게시 전 자동점검</b></div>' +
      '<div class="gate"><h4>게시 전 자동점검</h4>' + lines +
        '<div class="gbtns">' +
          '<button class="gbtn">임시저장</button>' +
          '<button class="gbtn pri" ' + (blocked ? 'disabled' : '') + '>게시 상태로 저장</button>' +
        '</div>' +
        (blocked
          ? '<div class="gnote" style="color:#c02626">🚫 ' +
              (mainBad && optBlocked ? '<b>상품 URL</b>과 <b>옵션별 유입 링크</b>를'
                : mainBad ? '<b>상품 URL</b>을'
                : '<b>옵션별 유입 링크</b>를') +
              ' 채워야 게시할 수 있습니다 — 임시저장은 가능합니다.' +
              (mainBad ? '<br><span style="color:#8a93a6">상품 URL은 유입방식·옵션 유무와 무관하게 항상 필수입니다.</span>' : '') +
            '</div>'
          : '<div class="gnote">모든 항목 통과 — 게시할 수 있습니다.</div>') +
      '</div>' + d2 +
    '</div>' +
    '<div class="callout info">🛡 <b>서버도 같은 조건으로 다시 확인합니다</b> — 화면만 믿지 않습니다(참여형 활성화 게이트와 같은 자리). ' +
      '마이그레이션이 안 붙은 상태로 배포되면 <b>부팅에서 막습니다</b>(<code>REQUIRED_SCHEMA</code>).</div>' +
    '<div class="callout good">↩ <b>되돌리기</b> — 킬스위치 <code>CAMPAIGN_OPTION_LANDING=0</code> 하나로 ' +
      '판정이 항상 공고 랜딩 URL을 돌려주어 <b>코드 변경 없이 종전 동작</b>으로 복귀합니다.</div>';
  }

  // ── 렌더 ────────────────────────────────
  function render() {
    var el = document.getElementById('view');
    el.innerHTML = S.view === 'intra' ? viewIntra()
                 : S.view === 'web' ? viewWeb()
                 : S.view === 'reviewer' ? viewReviewer()
                 : viewGate();

    // 화면 안 인터랙션(옵션 칩 · 작업종류 버튼)
    el.querySelectorAll('[data-pick]').forEach(function (b) {
      b.addEventListener('click', function () { S.pick = Number(b.getAttribute('data-pick')) || 0; render(); });
    });
    el.querySelectorAll('[data-mode]').forEach(function (b) {
      b.addEventListener('click', function () {
        S.mode = b.getAttribute('data-mode'); S.pick = 0; syncSeg('segMode', S.mode); render();
      });
    });
  }
  function syncSeg(id, v) {
    document.querySelectorAll('#' + id + ' button').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-v') === v);
    });
  }
  function bindSeg(id, key) {
    document.querySelectorAll('#' + id + ' button').forEach(function (b) {
      b.addEventListener('click', function () {
        S[key] = b.getAttribute('data-v');
        if (key === 'mode') S.pick = 0;
        syncSeg(id, S[key]); render();
      });
    });
  }
  document.querySelectorAll('#tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      S.view = b.getAttribute('data-v');
      document.querySelectorAll('#tabs button').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      render();
    });
  });
  bindSeg('segInflow', 'inflow');
  bindSeg('segMode', 'mode');
  bindSeg('segFill', 'fill');

  // ?v=intra|web|reviewer|gate 로 단독 열람
  var q = (location.search.match(/[?&]v=([a-z]+)/i) || [])[1];
  if (q && ['intra', 'web', 'reviewer', 'gate'].indexOf(q) >= 0) {
    S.view = q;
    document.querySelectorAll('#tabs button').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-v') === q); });
  }
  render();
})();
</script>
