<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리뷰어 구매양식 제출완료 화면</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#17213b;font:15px/1.55 system-ui,"Segoe UI",sans-serif}.phone{width:min(440px,100%);min-height:100vh;margin:auto;background:#fff}.top{height:56px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #e5e7eb;font-weight:800}.back{font-size:23px;margin-right:13px;color:#475569}.progress{display:flex;gap:6px;padding:12px 16px;background:#31206e}.progress span{flex:1;text-align:center;padding:7px 3px;border:1px solid #69589e;border-radius:7px;color:#ddd7f3;font-size:12px;font-weight:750}.progress span.on{background:#fff;color:#3a237f;border-color:#fff}.content{padding:44px 24px;text-align:center}.check{width:70px;height:70px;display:grid;place-items:center;margin:0 auto 20px;border-radius:50%;background:#dcfce7;color:#15803d;font-size:34px;font-weight:800}.content h1{margin:0;font-size:25px;letter-spacing:-.6px}.content p{margin:13px 0 28px;color:#64748b}.notice{margin:0 0 16px;padding:13px 14px;text-align:left;border:1px solid #fed7aa;border-radius:11px;background:#fff7ed;color:#9a3412;font-size:13px}.notice b{display:block;margin-bottom:3px;color:#c2410c}.button{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:#2563eb;color:#fff;font:800 15px inherit;cursor:pointer}.button + .button{margin-top:9px}.popular{background:linear-gradient(135deg,#ef4444,#dc2626)}.chat{background:#fee500;color:#3c2f00}.hint{margin-top:16px;color:#94a3b8;font-size:12px}.preview{display:flex;gap:7px;justify-content:center;padding:15px;background:#f8fafc;border-top:1px solid #e5e7eb}.preview button{border:1px solid #cbd5e1;border-radius:7px;background:#fff;padding:7px 9px;font-weight:700;font-size:12px;cursor:pointer}.preview button.active{border-color:#2563eb;background:#eff6ff;color:#1d4ed8}@media(min-width:441px){body{padding:18px}.phone{min-height:760px;border:1px solid #d8e2f0;border-radius:20px;overflow:hidden;box-shadow:0 16px 44px #1e3a5f1f}}
</style></head><body><main class="phone"><header class="top"><span class="back">‹</span>웰스앤헬스 국내산 도라지청, 100g</header><nav class="progress"><span>① 참여 전</span><span>② 작업가이드</span><span class="on">③ 제출 완료</span></nav><section class="content"><div class="check">✓</div><h1 id="heading">참여 확정!</h1><p id="copy">구매양식이 제출되었어요.<br>진행 상황은 리뷰어 홈의 참여현황에서 확인할 수 있어요.</p><div id="popBack" class="notice"><b>🔥 인기상품 참여 조건 충족</b>참여하려던 인기상품으로 돌아갈 수 있어요.</div><button id="returnBtn" class="button popular">🔥 참여하려던 인기 상품으로 돌아가기</button><button class="button">내 참여현황 보기</button><button id="chatBtn" class="button chat">💬 이 캠페인의 카톡 팀채팅방 입장</button><div class="hint">카톡 팀채팅방 버튼은 제출확정 후 연결된 경우에만 표시됩니다.</div></section><footer class="preview"><button class="active" data-mode="normal">일반 완료</button><button data-mode="popular">인기 복귀</button><button data-mode="pending">확인 대기</button></footer></main><script>
const $=s=>document.querySelector(s);document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');const m=b.dataset.mode;$('#popBack').style.display=m==='popular'?'block':'none';$('#returnBtn').style.display=m==='popular'?'block':'none';if(m==='pending'){$('#heading').textContent='구매양식이 접수됐어요';$('#copy').innerHTML='제출이 늦게 도착해 <b>운영자 확인 후</b> 참여가 확정돼요.<br>주문 내용은 안전하게 저장돼 있으니 다시 제출하지 마세요.'}else{$('#heading').textContent='참여 확정!';$('#copy').innerHTML='구매양식이 제출되었어요.<br>진행 상황은 리뷰어 홈의 참여현황에서 확인할 수 있어요.'}});
</script></body></html>
