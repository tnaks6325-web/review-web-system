<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>인기상품 선행참여 우선순위</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e9eff8;color:#17213b;font:14px system-ui,"Segoe UI",sans-serif}.shade{width:min(960px,94vw);padding:48px;background:#63718d55;border-radius:24px}.modal{max-width:760px;margin:auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 24px 60px #182d5050}.head{display:flex;gap:12px;padding:23px 25px;border-bottom:1px solid #e4eaf2}.head b{font-size:19px}.head span{margin-left:auto;color:#94a3b8;font-size:24px}.product{padding:14px 25px;background:#f8fbff;font-weight:750}.product small{display:block;color:#64748b;font-weight:500;margin-bottom:3px}.current{margin:18px 25px;padding:12px 14px;border-radius:10px;background:#fff7ed;color:#9a3412}.current b{color:#c2410c}.section{padding:0 25px 20px}.section h2{font-size:14px;margin:0 0 10px}.table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid #dce5f1;border-radius:10px;overflow:hidden}.table th{padding:10px;text-align:left;background:#f8fafc;color:#64748b;font-size:12px}.table td{padding:13px 10px;border-top:1px solid #edf2f7}.row.current-row{background:#fffaf4}.no{font-weight:800;color:#2563eb}.title{font-weight:750}.sub{font-size:12px;color:#64748b;margin-top:3px}.badge{padding:3px 7px;border-radius:999px;background:#e8f1ff;color:#2563eb;font-size:11px;font-weight:800}.badge.done{background:#e8f8ee;color:#15803d}.arrow{width:28px;text-align:center;color:#94a3b8}.mini{padding:6px 9px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;font-size:12px;font-weight:700;cursor:pointer}.mini:disabled{opacity:.4;cursor:default}.foot{display:flex;align-items:center;gap:8px;padding:16px 25px;border-top:1px solid #e4eaf2}.result{margin-right:auto;color:#15803d;font-size:12px;font-weight:700}.btn{padding:9px 15px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font-weight:750;cursor:pointer}.on{background:#2563eb;color:#fff;border-color:#2563eb}@media(max-width:560px){.shade{padding:12px}.table th:nth-child(3),.table td:nth-child(3){display:none}.current{margin-left:16px;margin-right:16px}.head,.product,.section,.foot{padding-left:16px;padding-right:16px}}
</style></head><body><div class="shade"><section class="modal"><header class="head"><b>🔥 인기상품 설정</b><span>×</span></header><div class="product"><small>인기상품</small>웰스앤헬스 국내산 도라지청, 100g</div><div class="current">현재 선행참여: <b id="current">삼백초 캔디 100g</b></div><div class="section"><h2>선행참여 우선순위</h2><table class="table"><thead><tr><th>#</th><th>비인기 공고</th><th>상태</th><th></th><th></th></tr></thead><tbody id="queue"></tbody></table></div><footer class="foot"><span id="result" class="result"></span><button class="btn" id="reset">초기화</button><button class="btn on" id="apply">ON 적용</button></footer></section></div>
<script>
const initial=[{name:'삼백초 캔디 100g',status:'모집중'},{name:'상황버섯진액 10포',status:'대기'},{name:'우레온 바디 리셋 미스트',status:'대기'}];let items=initial.map(x=>({...x}));
function render(){const active=items.find(x=>x.status!=='완료');items.forEach(x=>{if(x.status!=='완료')x.status=x===active?'모집중':'대기'});document.querySelector('#current').textContent=active?active.name:'없음';document.querySelector('#queue').innerHTML=items.map((x,i)=>`<tr class="row ${x===active?'current-row':''}"><td class="no">${i+1}</td><td><div class="title">${x.name}</div>${x===active?'<div class="sub">완료 시 다음 공고로 자동 전환</div>':''}</td><td><span class="badge ${x.status==='완료'?'done':''}">${x.status}</span></td><td><button class="mini" onclick="move(${i},-1)" ${i===0?'disabled':''}>↑</button> <button class="mini" onclick="move(${i},1)" ${i===items.length-1?'disabled':''}>↓</button></td><td><button class="mini" onclick="complete(${i})" ${x.status==='완료'?'disabled':''}>모집완료</button></td></tr>`).join('')}
function move(i,d){[items[i],items[i+d]]=[items[i+d],items[i]];render()}function complete(i){items[i].status='완료';const next=items.slice(i+1).find(x=>x.status!=='완료');if(next)next.status='모집중';render();document.querySelector('#result').textContent=next?'다음 우선순위로 전환됨':'모든 선행공고 완료'}
document.querySelector('#apply').onclick=()=>document.querySelector('#result').textContent='우선순위가 적용되었습니다';document.querySelector('#reset').onclick=()=>{items=initial.map(x=>({...x}));document.querySelector('#result').textContent='';render()};render();
</script></body></html>
