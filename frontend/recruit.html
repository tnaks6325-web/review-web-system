<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>리뷰 캠페인 모집</title>
<!-- PWA -->
<link rel="manifest" href="/manifest.webmanifest"/>
<meta name="theme-color" content="#3182f6"/>
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="iA리뷰"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#3182f6;--p-l:#e8f1fe;
  --ok:#0ca678;--ok-l:#D1FAE5;
  --warn:#D97706;--warn-l:#FEF3C7;
  --err:#DC2626;
  --bg:#f4f8ff;
  --card:#fff;
  --t1:#111827;--t2:#374151;--t3:#6B7280;--t4:#9CA3AF;
  --border:#E5E7EB;
  --r:16px;--rs:10px;
  --sh:0 2px 12px rgba(0,0,0,.07);
  --shm:0 8px 32px rgba(49,130,246,.14);
}
body{font-family:'Pretendard',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;padding-bottom:120px}

/* ── 헤더 ── */
.rc-header{
  background:linear-gradient(135deg,#144a9e 0%,#3182f6 55%,#6fa6f5 100%);
  padding:24px 20px 20px;text-align:center;color:#fff;
  position:relative;overflow:hidden
}
.rc-header::before{
  content:'';position:absolute;right:-80px;top:-80px;
  width:280px;height:280px;border-radius:50%;
  background:rgba(255,255,255,.05)
}
.rc-header-logo{font-size:.78rem;font-weight:500;opacity:.75;margin-bottom:8px;letter-spacing:.05em}
.rc-header-title{font-size:1.45rem;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
.rc-header-count{font-size:.82rem;opacity:.7;font-weight:500}

/* ── 안내 배너 ── */
.rc-notice{
  margin:16px 16px 0;
  background:#FFFBEB;border:1px solid #FDE68A;border-radius:12px;
  padding:12px 14px;display:flex;align-items:flex-start;gap:10px;
  font-size:.8rem;color:#92400E;line-height:1.5
}
.rc-notice i{color:#D97706;font-size:.9rem;flex-shrink:0;margin-top:1px}

/* ── 본문 ── */
.rc-body{max-width:560px;margin:0 auto;padding:16px}

/* ── 캠페인 카드 ── */
.rc-card{
  background:var(--card);
  border-radius:var(--r);
  overflow:hidden;
  box-shadow:var(--sh);
  margin-bottom:16px;
}
.rc-card.closed{opacity:.7}

/* 카드 헤더 */
.rc-card-head{
  background:linear-gradient(135deg,#0f2a5e 0%,#1b64da 100%);
  padding:14px 16px;
  display:flex;align-items:flex-start;gap:10px
}
.rc-card.closed .rc-card-head{background:linear-gradient(135deg,#374151 0%,#4B5563 100%)}
.rc-channel-badge{
  flex-shrink:0;
  background:#FDE68A;color:#78350F;
  padding:3px 9px;border-radius:6px;
  font-size:.68rem;font-weight:800;
  margin-top:1px
}
.rc-card-title{
  font-size:.92rem;font-weight:700;color:#fff;line-height:1.4;flex:1
}

/* 카드 본문 */
.rc-card-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px}

/* 조건 배지 */
.rc-badges{display:flex;flex-wrap:wrap;gap:6px}
.rc-badge{
  display:inline-flex;align-items:center;
  padding:4px 11px;border-radius:20px;
  font-size:.76rem;font-weight:600;
  line-height:1.3
}
.rc-badge-0{background:#D1FAE5;color:#065F46}
.rc-badge-1{background:#DBEAFE;color:#1E40AF}
.rc-badge-2{background:#FEF3C7;color:#92400E}
.rc-badge-3{background:#e8f1fe;color:#144a9e}
.rc-badge-4{background:#FCE7F3;color:#831843}
.rc-badge-5{background:#ECFDF5;color:#064E3B}

/* 메타 정보 */
.rc-meta{display:flex;flex-wrap:wrap;gap:10px}
.rc-meta-item{
  display:inline-flex;align-items:center;gap:5px;
  font-size:.76rem;color:var(--t3);font-weight:500
}
.rc-meta-item i{font-size:.7rem;color:var(--t4)}

/* 리뷰비 강조 */
.rc-fee{
  display:inline-flex;align-items:center;gap:5px;
  font-size:.82rem;font-weight:700;color:var(--p)
}

/* 정원 표시 */
.rc-slots{
  display:inline-flex;align-items:center;gap:5px;
  font-size:.76rem;font-weight:600;color:var(--ok);
  background:var(--ok-l);padding:3px 10px;border-radius:12px
}
.rc-slots.full{color:var(--err);background:#FEE2E2}

/* 특이사항 */
.rc-notes-label{font-size:.68rem;font-weight:700;color:var(--t4);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.rc-notes-text{font-size:.8rem;color:var(--t2);white-space:pre-line;line-height:1.7}

/* 구분선 */
.rc-divider{height:1px;background:var(--border);margin:0 16px}

/* 참여 버튼 */
.rc-card-footer{padding:14px 16px}
.rc-join-btn{
  display:block;width:100%;padding:14px;
  background:linear-gradient(135deg,#3182f6 0%,#1b64da 100%);color:#fff;
  border:none;border-radius:12px;
  font-size:.95rem;font-weight:800;
  text-align:center;text-decoration:none;
  cursor:pointer;
  transition:background .15s,transform .1s,box-shadow .15s;
  box-shadow:0 4px 12px rgba(49,130,246,.3);
  letter-spacing:.02em
}
.rc-join-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(49,130,246,.45)}
.rc-join-btn:active{transform:translateY(0)}
.rc-join-btn:disabled{background:#9CA3AF;cursor:not-allowed;box-shadow:none;transform:none}
.rc-join-btn i{margin-right:6px}

.rc-closed-badge{
  display:block;width:100%;padding:14px;
  background:#F3F4F6;color:var(--t3);
  border:none;border-radius:12px;
  font-size:.9rem;font-weight:700;
  text-align:center;
}

/* ── 모달 ── */
.rc-modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .2s
}
.rc-modal-overlay.show{opacity:1;pointer-events:auto}
.rc-modal{
  background:#fff;border-radius:20px;
  width:100%;max-width:400px;
  box-shadow:var(--shm);
  overflow:hidden;transform:translateY(20px);transition:transform .2s
}
.rc-modal-overlay.show .rc-modal{transform:translateY(0)}
.rc-modal-header{
  background:linear-gradient(135deg,#144a9e 0%,#3182f6 100%);
  padding:20px;color:#fff;text-align:center
}
.rc-modal-header h3{font-size:1.1rem;font-weight:700}
.rc-modal-header p{font-size:.78rem;opacity:.8;margin-top:4px}
.rc-modal-body{padding:20px;display:flex;flex-direction:column;gap:14px}
.rc-form-group{display:flex;flex-direction:column;gap:5px}
.rc-form-group label{font-size:.78rem;font-weight:600;color:var(--t2)}
.rc-form-group input{
  padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;
  font-size:.88rem;font-family:inherit;transition:border-color .15s
}
.rc-form-group input:focus{outline:none;border-color:var(--p)}
.rc-modal-footer{padding:0 20px 20px;display:flex;gap:10px}
.rc-modal-btn{
  flex:1;padding:13px;border:none;border-radius:10px;
  font-size:.88rem;font-weight:700;cursor:pointer;
  transition:background .15s
}
.rc-modal-btn.primary{background:var(--p);color:#fff}
.rc-modal-btn.primary:hover{background:#1b64da}
.rc-modal-btn.primary:disabled{background:#9CA3AF;cursor:not-allowed}
.rc-modal-btn.secondary{background:#F3F4F6;color:var(--t2)}
.rc-modal-btn.secondary:hover{background:#E5E7EB}

/* ── Toast ── */
.rc-toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  padding:12px 24px;border-radius:12px;
  font-size:.85rem;font-weight:600;
  box-shadow:0 4px 20px rgba(0,0,0,.15);
  z-index:2000;opacity:0;transition:opacity .3s,transform .3s;
  transform:translateX(-50%) translateY(-10px)
}
.rc-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.rc-toast.success{background:#065F46;color:#fff}
.rc-toast.error{background:#DC2626;color:#fff}

/* ── 하단 고정 영역 ── */
.rc-footer-fixed{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
  padding:12px 20px 16px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  z-index:100
}
.rc-kakao-btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:10px 22px;
  background:#FFE812;color:#3A1D1D;
  border:none;border-radius:30px;
  font-size:.88rem;font-weight:800;
  cursor:pointer;
  transition:background .15s,box-shadow .15s,transform .1s;
  box-shadow:0 2px 10px rgba(0,0,0,.1)
}
.rc-kakao-btn:hover{background:#FDD835;box-shadow:0 4px 14px rgba(0,0,0,.15);transform:translateY(-1px)}
.rc-kakao-btn:active{transform:translateY(0)}
.rc-kakao-btn i{font-size:.9rem}
#rcKakaoBtnMandu{background:#D1FAE5;color:#065F46}
#rcKakaoBtnMandu:hover{background:#A7F3D0}
#rcKakaoBtnMango{background:#FFE812;color:#3A1D1D}
#rcKakaoBtnMango:hover{background:#FDD835}
.rc-payment-info{font-size:.68rem;color:var(--t3);text-align:center;line-height:1.6;white-space:pre-line}
.rc-payment-info strong{color:var(--err)}

/* ── 로딩 / 빈 상태 ── */
.rc-loading{text-align:center;padding:60px 20px;color:var(--t3)}
.rc-loading i{font-size:2rem;color:var(--p);animation:spin .8s linear infinite;display:block;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.rc-empty{text-align:center;padding:60px 20px;color:var(--t4)}
.rc-empty i{font-size:2.5rem;display:block;margin-bottom:14px;opacity:.25}

/* ── 반응형 ── */
@media(max-width:400px){
  .rc-card-title{font-size:.86rem}
  .rc-join-btn{font-size:.88rem;padding:13px}
}
</style>
<style id="sianC">
/* ===== 시안 C 톤 오버레이 ===== */
:root{ --p:#3182f6; --p-l:#e8f1fe; --bg:#F4F5F8; --t1:#191F28; --t2:#5B6472; --t3:#A8AEBA; --t4:#A8AEBA; --border:#EFEFF3; }
body{ background:#F4F5F8 !important; letter-spacing:-.01em; }
.rc-header{ background:#fff !important; color:#191F28 !important; border-bottom:1px solid #EFEFF3 !important; }
.rc-header::before{ display:none !important; }
.rc-header-logo,.rc-header-count{ color:#A8AEBA !important; opacity:1 !important; }
.rc-header-title{ color:#191F28 !important; }
.rc-card{ border:1px solid #EFEFF3 !important; box-shadow:0 1px 6px rgba(17,24,40,.05) !important; }
.rc-footer-fixed{ background:#fff !important; border-top:1px solid #EFEFF3 !important; }
</style>
<script src="api.js"></script>
<link rel="stylesheet" href="css/toss-theme.css"/>
</head>
<body>

<!-- 헤더 -->
<div class="rc-header">
  <div class="rc-header-logo">아이에이리뷰 · 캠페인 모집</div>
  <div class="rc-header-title" id="rcPageTitle">리뷰 캠페인 모집</div>
  <div class="rc-header-count" id="rcActiveCount"></div>
</div>

<!-- 안내 배너 -->
<div class="rc-notice">
  <i class="fas fa-exclamation-circle"></i>
  <span>원하는 캠페인에 참여 신청하면 자동으로 등록됩니다. 정원 초과 시 자동 마감됩니다 🎯</span>
</div>

<!-- 본문 -->
<div class="rc-body">
  <div id="rcLoading" class="rc-loading">
    <i class="fas fa-circle-notch"></i>
    <p>캠페인 목록을 불러오는 중입니다...</p>
  </div>
  <div id="rcEmpty" class="rc-empty" style="display:none">
    <i class="fas fa-inbox"></i>
    <p style="font-size:.9rem;font-weight:600;color:var(--t2);margin-bottom:6px">현재 모집 중인 캠페인이 없습니다</p>
    <p style="font-size:.78rem">잠시 후 다시 확인해주세요</p>
  </div>
  <div id="rcList"></div>
</div>

<!-- 참여 신청 모달 -->
<div class="rc-modal-overlay" id="rcApplyModal">
  <div class="rc-modal">
    <div class="rc-modal-header">
      <h3 id="rcApplyTitle">참여 신청</h3>
      <p id="rcApplyCampName"></p>
    </div>
    <div class="rc-modal-body">
      <div class="rc-form-group">
        <label><i class="fas fa-user"></i> 이름 (수취인명)</label>
        <input type="text" id="rcApplyName" placeholder="실명 입력" autocomplete="name">
      </div>
      <div class="rc-form-group">
        <label><i class="fas fa-phone"></i> 연락처 (뒷자리 4~8자리)</label>
        <input type="tel" id="rcApplyPhone" placeholder="예: 01012345678" autocomplete="tel">
      </div>
      <div class="rc-form-group">
        <label><i class="fas fa-id-badge"></i> 인애드명 (선택)</label>
        <input type="text" id="rcApplyInad" placeholder="인애드 닉네임 (없으면 비워두세요)">
      </div>
    </div>
    <div class="rc-modal-footer">
      <button class="rc-modal-btn secondary" onclick="closeApplyModal()">취소</button>
      <button class="rc-modal-btn primary" id="rcApplySubmitBtn" onclick="submitApplication()">
        <i class="fas fa-check"></i> 신청하기
      </button>
    </div>
  </div>
</div>

<!-- 하단 고정 -->
<div class="rc-footer-fixed" id="rcFooter" style="display:none">
  <div id="rcKakaoBtns" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
    <button class="rc-kakao-btn" id="rcKakaoBtnMandu" onclick="copyKakaoId('mandu')" style="display:none">
      <i class="fas fa-comment"></i> 🥟 만두 아이디 복사
    </button>
    <button class="rc-kakao-btn" id="rcKakaoBtnMango" onclick="copyKakaoId('mango')" style="display:none">
      <i class="fas fa-comment"></i> 🥭 망고 아이디 복사
    </button>
  </div>
  <div class="rc-payment-info" id="rcPaymentInfo"></div>
</div>

<!-- Toast -->
<div class="rc-toast" id="rcToast"></div>

<script>
/* ═══════════════════════════════════
   전역 상태
═══════════════════════════════════ */
let _applyCampaignId = null;
let _kakaoMandu = "";
let _kakaoMango = "";

/* ═══════════════════════════════════
   설정값 로드
═══════════════════════════════════ */
async function loadSettings() {
  try {
    const res  = await fetch("tables/app_settings?limit=30");
    const json = await res.json();
    const rows = json.data || [];
    const get  = key => (rows.find(r => r.key === key) || {}).value || "";

    const pageTitle = get("recruit_page_title") || "리뷰 캠페인 모집";
    document.getElementById("rcPageTitle").textContent = pageTitle;
    document.title = pageTitle;

    _kakaoMandu = get("kakao_id_mandu");
    _kakaoMango = get("kakao_id_mango");

    const btnMandu = document.getElementById("rcKakaoBtnMandu");
    const btnMango = document.getElementById("rcKakaoBtnMango");

    if (_kakaoMandu) {
      btnMandu.innerHTML = `<i class="fas fa-comment"></i> 🥟 만두 아이디 복사 <span style="opacity:.7;font-size:.78em">(${_esc(_kakaoMandu)})</span>`;
      btnMandu.style.display = "";
    }
    if (_kakaoMango) {
      btnMango.innerHTML = `<i class="fas fa-comment"></i> 🥭 망고 아이디 복사 <span style="opacity:.7;font-size:.78em">(${_esc(_kakaoMango)})</span>`;
      btnMango.style.display = "";
    }

    const schedule = get("payment_schedule") || "";
    const payEl = document.getElementById("rcPaymentInfo");
    if (schedule) {
      const lines = schedule.split("\n");
      payEl.innerHTML = lines.map((l, i) =>
        i === 0 ? `🔔 ${_esc(l)}` : `<strong>${_esc(l)}</strong>`
      ).join("\n");
    }

    if (_kakaoMandu || _kakaoMango || schedule) {
      document.getElementById("rcFooter").style.display = "";
    }
  } catch(e) {
    console.warn("[settings]", e);
  }
}

/* ═══════════════════════════════════
   공고 목록 로드
═══════════════════════════════════ */
async function loadCampaigns() {
  try {
    const res  = await fetch(API_BASE_URL + "/api/campaign/list");
    const json = await res.json();
    const all  = json.data || [];

    document.getElementById("rcLoading").style.display = "none";

    const activeList = all.filter(c => c.status === "active");
    const closedList = all.filter(c => c.status === "closed");

    if (all.length === 0) {
      document.getElementById("rcEmpty").style.display = "";
      return;
    }

    document.getElementById("rcActiveCount").textContent = `진행중 ${activeList.length}건`;
    const container = document.getElementById("rcList");

    activeList.forEach(c => container.appendChild(_buildCard(c)));
    if (closedList.length > 0) {
      const sep = document.createElement("div");
      sep.style.cssText = "text-align:center;padding:12px;font-size:.75rem;color:var(--t4);font-weight:600";
      sep.textContent = `── 마감된 캠페인 (${closedList.length}건) ──`;
      container.appendChild(sep);
      closedList.forEach(c => container.appendChild(_buildCard(c)));
    }
  } catch(e) {
    document.getElementById("rcLoading").innerHTML =
      `<i class="fas fa-exclamation-circle" style="color:#DC2626;font-size:2rem;display:block;margin-bottom:12px"></i>
       <p style="color:#DC2626">불러오기 실패: ${_esc(e.message)}</p>`;
  }
}

/* ═══════════════════════════════════
   카드 빌드
═══════════════════════════════════ */
function _buildCard(c) {
  const channel = c.channel === "직접입력" ? (c.channel_custom || "") : (c.channel || "");
  const badges  = _parseBadges(c.badges);
  const fee     = c.review_fee ? Number(c.review_fee).toLocaleString() + "원" : "";
  const managerEmoji = c.manager === "만두" ? "🥟" : c.manager === "망고" ? "🥭" : "";
  const isClosed = c.status === "closed";
  const slotsHtml = c.max_slots > 0
    ? `<span class="rc-slots ${c.current_slots >= c.max_slots ? 'full' : ''}"><i class="fas fa-users"></i> ${c.current_slots || 0}/${c.max_slots}명</span>`
    : "";

  let footerHtml = "";
  if (isClosed) {
    footerHtml = `<div class="rc-closed-badge"><i class="fas fa-lock"></i> 모집 마감</div>`;
  } else {
    footerHtml = `<button class="rc-join-btn" onclick="openApplyModal('${_esc(c.id)}', '${_esc(c.title)}')"><i class="fas fa-hand-point-up"></i> 참여 신청하기</button>`;
  }

  const div = document.createElement("div");
  div.className = `rc-card ${isClosed ? 'closed' : ''}`;
  div.innerHTML = `
    <div class="rc-card-head">
      ${channel ? `<span class="rc-channel-badge">${_esc(channel)}</span>` : ""}
      <span class="rc-card-title">${_esc(c.title || "(제목 없음)")}</span>
      ${c.manager ? `<span style="font-size:.72rem;color:#A7F3D0;font-weight:600;flex-shrink:0;white-space:nowrap">${managerEmoji} ${_esc(c.manager)}</span>` : ""}
    </div>
    <div class="rc-card-body">
      ${badges.length ? `<div class="rc-badges">${badges.map((b,i)=>`<span class="rc-badge rc-badge-${i%6}">${_esc(b)}</span>`).join("")}</div>` : ""}
      ${(c.time_range||c.delivery_type||fee||slotsHtml) ? `
      <div class="rc-meta">
        ${fee ? `<span class="rc-fee"><i class="fas fa-won-sign"></i> 리뷰비 ${_esc(fee)}</span>` : ""}
        ${c.delivery_type ? `<span class="rc-meta-item"><i class="fas fa-truck"></i>${_esc(c.delivery_type)}</span>` : ""}
        ${c.time_range    ? `<span class="rc-meta-item"><i class="fas fa-clock"></i>${_esc(c.time_range)}</span>` : ""}
        ${slotsHtml}
      </div>` : ""}
      ${c.notes ? `<div>
        <div class="rc-notes-label"><i class="fas fa-clipboard-list"></i> 유의사항</div>
        <div class="rc-notes-text">${_esc(c.notes)}</div>
      </div>` : ""}
    </div>
    <div class="rc-divider"></div>
    <div class="rc-card-footer">
      ${footerHtml}
    </div>
  `;
  return div;
}

/* ═══════════════════════════════════
   참여 신청 모달
═══════════════════════════════════ */
function openApplyModal(campaignId, campTitle) {
  _applyCampaignId = campaignId;
  document.getElementById("rcApplyCampName").textContent = campTitle;
  document.getElementById("rcApplyName").value = "";
  document.getElementById("rcApplyPhone").value = "";
  document.getElementById("rcApplyInad").value = "";
  document.getElementById("rcApplySubmitBtn").disabled = false;
  document.getElementById("rcApplyModal").classList.add("show");
}

function closeApplyModal() {
  document.getElementById("rcApplyModal").classList.remove("show");
  _applyCampaignId = null;
}

async function submitApplication() {
  const name  = document.getElementById("rcApplyName").value.trim();
  const phone = document.getElementById("rcApplyPhone").value.trim();
  const inad  = document.getElementById("rcApplyInad").value.trim();

  if (!name) { rcShowToast("이름을 입력해주세요.", "error"); return; }
  if (!phone || phone.length < 4) { rcShowToast("연락처를 입력해주세요. (4자리 이상)", "error"); return; }

  const btn = document.getElementById("rcApplySubmitBtn");
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> 신청 중...';

  try {
    const res = await fetch(API_BASE_URL + `/api/campaign/${_applyCampaignId}/apply`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ name, phone, inad })
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      throw new Error(data.error || "신청에 실패했습니다.");
    }
    rcShowToast("🎉 " + (data.message || "참여 신청이 완료되었습니다!"), "success");
    closeApplyModal();
    // 목록 새로고침 (정원 업데이트)
    document.getElementById("rcList").innerHTML = "";
    loadCampaigns();
  } catch(e) {
    rcShowToast(e.message, "error");
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-check"></i> 신청하기';
  }
}

/* ═══════════════════════════════════
   Toast
═══════════════════════════════════ */
function rcShowToast(msg, type) {
  const el = document.getElementById("rcToast");
  el.textContent = msg;
  el.className = `rc-toast ${type} show`;
  setTimeout(() => el.classList.remove("show"), 3000);
}

/* ═══════════════════════════════════
   담당자 카톡 아이디 복사
═══════════════════════════════════ */
function copyKakaoId(who) {
  const idVal = who === "mandu" ? _kakaoMandu : _kakaoMango;
  const btnId = who === "mandu" ? "rcKakaoBtnMandu" : "rcKakaoBtnMango";
  const label = who === "mandu" ? "🥟 만두" : "🥭 망고";
  if (!idVal) return;

  const btn  = document.getElementById(btnId);
  const orig = btn.innerHTML;

  const _doCopy = () => {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(idVal);
    }
    const ta = document.createElement("textarea");
    ta.value = idVal;
    ta.style.cssText = "position:fixed;top:-9999px;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    return Promise.resolve();
  };

  _doCopy()
    .then(() => {
      btn.innerHTML = `<i class="fas fa-check"></i> ${label} 복사 완료!`;
      btn.style.background = "#A7F3D0";
      btn.style.color = "#064E3B";
      setTimeout(() => {
        btn.innerHTML = orig;
        btn.style.background = "";
        btn.style.color = "";
      }, 2200);
    })
    .catch(() => {
      alert("복사 실패. 직접 입력해주세요 → " + idVal);
    });
}

/* ═══════════════════════════════════
   유틸
═══════════════════════════════════ */
function _esc(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function _parseBadges(raw) {
  if (!raw) return [];
  if (Array.isArray(raw)) return raw;
  try { return JSON.parse(raw); } catch(_) { return []; }
}
