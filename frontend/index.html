<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>InAd 리뷰어</title>
  <meta property="og:title" content="InAd 리뷰어"/>
  <meta property="og:description" content="리뷰 캠페인 참여 및 제출"/>
  <meta property="og:type" content="website"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="api.js"></script>
  <style>
    :root {
      --p: #7C3AED; --p-light: #EDE9FE; --p-dark: #5B21B6;
      --ok: #10B981; --ok-light: #D1FAE5;
      --warn: #F59E0B; --warn-light: #FEF3C7;
      --err: #EF4444; --err-light: #FEE2E2;
      --t1: #1E293B; --t2: #334155; --t3: #64748B; --t4: #94A3B8;
      --bg: #F8FAFC; --card: #FFFFFF;
      --border: #E2E8F0; --shadow: 0 2px 12px rgba(0,0,0,.06);
      --radius: 16px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--t1); min-height:100vh; }
    .page-wrap { max-width:520px; margin:0 auto; }

    /* ─── Header ─── */
    .home-header {
      background:linear-gradient(135deg, var(--p), var(--p-dark));
      padding:20px 20px 24px; color:#fff; border-radius:0 0 20px 20px;
    }
    .home-header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .home-logo { font-size:1.1rem; font-weight:800; display:flex; align-items:center; gap:8px; }
    .home-logo i { font-size:1.2rem; }
    .home-header-actions { display:flex; gap:8px; }
    .home-header-actions button {
      background:rgba(255,255,255,.15); border:none; color:#fff; padding:6px 10px;
      border-radius:8px; font-size:.75rem; font-weight:600; cursor:pointer;
    }
    .home-header-actions button:hover { background:rgba(255,255,255,.25); }
    .home-greeting { font-size:1.3rem; font-weight:700; }
    .home-greeting-sub { font-size:.82rem; opacity:.8; margin-top:4px; }

    /* ─── Login Card ─── */
    .login-card {
      background:var(--card); border-radius:var(--radius); margin:16px; padding:28px 24px;
      box-shadow:var(--shadow); text-align:center;
    }
    .login-card h2 { font-size:1.1rem; font-weight:700; margin-bottom:6px; }
    .login-card p { font-size:.82rem; color:var(--t3); margin-bottom:20px; }
    .login-input-group { display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
    .login-input {
      width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:10px;
      font-size:.88rem; font-family:inherit; outline:none; transition:border-color .2s;
    }
    .login-input:focus { border-color:var(--p); }
    .login-btn {
      width:100%; padding:13px; background:var(--p); color:#fff; border:none;
      border-radius:10px; font-size:.9rem; font-weight:700; cursor:pointer;
      font-family:inherit; transition:background .2s;
    }
    .login-btn:hover { background:var(--p-dark); }
    .login-btn:disabled { background:var(--t4); cursor:not-allowed; }
    .login-register { margin-top:14px; font-size:.78rem; color:var(--t3); }
    .login-register a { color:var(--p); text-decoration:none; font-weight:600; }

    /* ─── Menu Grid ─── */
    .menu-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 16px; margin-top:-12px; }
    .menu-card {
      background:var(--card); border-radius:var(--radius); padding:20px 16px;
      text-align:center; text-decoration:none; color:var(--t1);
      box-shadow:var(--shadow); transition:transform .15s, box-shadow .15s;
    }
    .menu-card:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,.1); }
    .menu-card-icon { font-size:1.6rem; margin-bottom:10px; }
    .menu-card-label { font-size:.85rem; font-weight:700; }
    .menu-card-desc { font-size:.7rem; color:var(--t3); margin-top:4px; line-height:1.4; }

    /* ─── Section ─── */
    .home-section { padding:20px 16px; }
    .home-section-title { font-size:.85rem; font-weight:700; color:var(--t2); margin-bottom:12px; display:flex; align-items:center; gap:6px; }

    /* ─── Status Cards ─── */
    .status-list { display:flex; flex-direction:column; gap:8px; }
    .status-item {
      background:var(--card); border-radius:12px; padding:14px 16px;
      display:flex; align-items:center; gap:12px; box-shadow:var(--shadow);
    }
    .status-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .status-dot.done { background:var(--ok); }
    .status-dot.pending { background:var(--warn); }
    .status-dot.rejected { background:var(--err); }
    .status-info { flex:1; min-width:0; }
    .status-name { font-size:.82rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .status-meta { font-size:.7rem; color:var(--t3); margin-top:2px; }
    .status-badge { font-size:.65rem; font-weight:700; padding:3px 8px; border-radius:6px; flex-shrink:0; }
    .status-badge.done { background:var(--ok-light); color:#065F46; }
    .status-badge.pending { background:var(--warn-light); color:#92400E; }
    .status-badge.rejected { background:var(--err-light); color:#DC2626; }

    .empty-state { text-align:center; padding:30px 20px; color:var(--t4); font-size:.82rem; }
    .empty-state i { font-size:1.5rem; display:block; margin-bottom:8px; opacity:.5; }

    /* ─── Recruit Preview (legacy) ─── */
    .recruit-preview-item {
      display:block; background:var(--card); border:1px solid var(--border); border-radius:12px;
      padding:12px 16px; margin-bottom:8px; text-decoration:none; color:var(--t1);
      transition:border-color .15s, box-shadow .15s;
    }
    .recruit-preview-item:hover { border-color:var(--p); box-shadow:0 2px 8px rgba(124,58,237,.1); }
    .recruit-preview-title { font-size:.84rem; font-weight:700; margin-bottom:4px; }
    .recruit-preview-meta { display:flex; gap:10px; font-size:.72rem; color:var(--t3); flex-wrap:wrap; }

    /* ─── Recruit Card (detailed inline) ─── */
    .rc-card {
      background:var(--card); border:1px solid var(--border); border-radius:14px;
      padding:16px 18px; margin-bottom:12px;
      box-shadow:0 2px 8px rgba(0,0,0,.04); transition:box-shadow .2s, border-color .2s;
    }
    .rc-card:hover { border-color:var(--p); box-shadow:0 4px 16px rgba(124,58,237,.1); }
    .rc-card-top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
    .rc-channel {
      background:var(--p); color:#fff; font-size:.65rem; font-weight:700;
      padding:3px 8px; border-radius:6px;
    }
    .rc-title { font-size:.9rem; font-weight:700; color:var(--t1); flex:1; }
    .rc-manager { font-size:.72rem; color:var(--t3); font-weight:500; margin-left:auto; }
    .rc-badges { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; }
    .rc-badge {
      font-size:.65rem; font-weight:600; padding:2px 7px; border-radius:5px;
      background:var(--warn-light); color:#92400E;
    }
    .rc-meta {
      display:flex; flex-wrap:wrap; gap:10px; font-size:.74rem; color:var(--t2);
      margin-bottom:8px; align-items:center;
    }
    .rc-meta i { color:var(--t4); margin-right:3px; }
    .rc-slots {
      font-size:.72rem; font-weight:700; color:var(--p); background:var(--p-light);
      padding:2px 8px; border-radius:6px;
    }
    .rc-notes {
      font-size:.75rem; color:var(--t3); background:#F8FAFC;
      border-left:3px solid var(--p-light); padding:8px 12px; border-radius:6px;
      margin-bottom:10px; line-height:1.5;
    }
    .rc-notes i { color:var(--warn); margin-right:4px; }
    .rc-apply-btn {
      display:block; width:100%; text-align:center; padding:12px; border-radius:10px;
      font-size:.85rem; font-weight:700; text-decoration:none; border:none;
      cursor:pointer; font-family:inherit; transition:background .2s, transform .1s;
    }
    .rc-apply-btn:active { transform:scale(.98); }
    .rc-apply-btn.rc-kakao {
      background:#FEE500; color:#3C1E1E;
    }
    .rc-apply-btn.rc-kakao:hover { background:#F5DC00; }
    .rc-apply-btn.rc-default {
      background:var(--p); color:#fff;
    }
    .rc-apply-btn.rc-default:hover { background:var(--p-dark); }
    .rc-apply-btn.rc-closed {
      background:#E2E8F0; color:var(--t4); cursor:not-allowed;
    }

    /* ─── Inline Apply Form ─── */
    .rc-inline-form {
      margin-top:10px; padding:12px; background:#F8FAFC;
      border:1px solid var(--border); border-radius:10px;
      animation: rcFormIn .2s ease;
    }
    @keyframes rcFormIn { from { opacity:0; transform:translateY(-6px); } }
    .rc-form-fields { display:flex; gap:8px; margin-bottom:8px; }
    .rc-input {
      flex:1; padding:10px 12px; border:1.5px solid var(--border); border-radius:8px;
      font-size:.82rem; font-family:inherit; outline:none; transition:border-color .2s;
    }
    .rc-input:focus { border-color:var(--p); }
    .rc-form-actions { display:flex; gap:8px; }
    .rc-submit-btn {
      flex:1; padding:10px; background:var(--ok); color:#fff; border:none;
      border-radius:8px; font-size:.82rem; font-weight:700; cursor:pointer;
      font-family:inherit; transition:background .2s;
    }
    .rc-submit-btn:hover { background:#059669; }
    .rc-cancel-btn {
      padding:10px 14px; background:#E2E8F0; color:var(--t2); border:none;
      border-radius:8px; font-size:.82rem; font-weight:600; cursor:pointer;
      font-family:inherit;
    }
    .rc-cancel-btn:hover { background:#CBD5E1; }

    /* ─── Tab Navigation ─── */
    .tab-nav {
      display:flex; gap:0; margin-bottom:16px;
      background:#fff; border-radius:12px; padding:4px;
      box-shadow:0 1px 4px rgba(0,0,0,.06);
      border:1px solid var(--border);
    }
    .tab-btn {
      flex:1; padding:10px 8px; border:none; background:transparent;
      border-radius:10px; font-size:.8rem; font-weight:600;
      color:var(--t3); cursor:pointer; transition:all .2s;
      font-family:inherit; display:flex; align-items:center;
      justify-content:center; gap:5px;
    }
    .tab-btn:hover { background:#F1F5F9; color:var(--t1); }
    .tab-btn.active {
      background:var(--p); color:#fff;
      box-shadow:0 2px 8px rgba(139,92,246,.3);
    }
    .tab-btn.active:hover { background:var(--p-dark); }

    /* ─── Stats Summary ─── */
    .stats-bar {
      display:grid; grid-template-columns:repeat(4,1fr); gap:6px;
      margin-bottom:12px; padding:0;
    }
    .stats-bar-item {
      text-align:center; padding:10px 6px; border-radius:10px;
      background:#F8FAFC; border:1px solid var(--border);
    }
    .stats-bar-num { font-size:1.1rem; font-weight:800; }
    .stats-bar-label { font-size:.65rem; color:var(--t3); margin-top:2px; }

    /* ─── Stage Badge ─── */
    .stage-badge { font-size:.62rem; font-weight:700; padding:2px 7px; border-radius:5px; white-space:nowrap; }
    .stage-badge.assigned { background:#DBEAFE; color:#1E40AF; }
    .stage-badge.submitted { background:var(--ok-light); color:#065F46; }
    .stage-badge.paid { background:#EDE9FE; color:#5B21B6; }
    .stage-badge.closed { background:var(--err-light); color:#DC2626; }

    /* ─── Action link in status items ─── */
    .status-action {
      font-size:.68rem; color:var(--p); font-weight:600; text-decoration:none;
      padding:3px 8px; border:1px solid var(--p); border-radius:6px;
      white-space:nowrap; transition:background .2s;
    }
    .status-action:hover { background:var(--p-light); }

    /* ─── Payment Summary ─── */
    .pay-summary {
      display:flex; align-items:center; gap:12px; padding:12px 16px;
      background:linear-gradient(135deg,#EDE9FE,#F5F3FF);
      border-radius:12px; margin-bottom:12px; border:1px solid #DDD6FE;
    }
    .pay-summary-amount { font-size:1.3rem; font-weight:800; color:var(--p-dark); }
    .pay-summary-label { font-size:.72rem; color:var(--t3); }

    /* ─── Footer ─── */
    .home-footer {
      text-align:center; padding:24px 16px; font-size:.72rem; color:var(--t4);
      border-top:1px solid var(--border); margin-top:20px;
    }
    .home-footer a { color:var(--t3); text-decoration:none; }
    .home-footer a:hover { color:var(--p); }

    /* ─── Toast ─── */
    .toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:9999;
      background:#1E293B; color:#fff; padding:10px 20px; border-radius:10px;
      font-size:.82rem; font-weight:600; box-shadow:0 4px 16px rgba(0,0,0,.15);
      animation: toastIn .3s ease; }
    @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(-10px); } }
  </style>
</head>
<body>

<!-- ═══ 비로그인 상태 ═══ -->
<div id="viewLogin" class="page-wrap">
  <div class="home-header">
    <div class="home-header-top">
      <div class="home-logo"><i class="fas fa-star-half-alt"></i> InAd 리뷰어</div>
      <a href="/admin" style="font-size:.72rem;color:rgba(255,255,255,.7);text-decoration:none;padding:5px 10px;border:1px solid rgba(255,255,255,.3);border-radius:6px"><i class="fas fa-lock"></i> 관리자</a>
    </div>
    <div class="home-greeting">리뷰어 전용 페이지</div>
    <div class="home-greeting-sub">로그인하여 캠페인 참여 현황을 확인하세요</div>
  </div>

  <div class="login-card">
    <h2><i class="fas fa-sign-in-alt" style="color:var(--p);margin-right:6px"></i>로그인</h2>
    <p>등록된 전화번호 뒤 8자리로 로그인합니다</p>
    <div class="login-input-group">
      <input id="loginName" class="login-input" type="text" placeholder="이름 (선택)" autocomplete="name">
      <input id="loginPhone" class="login-input" type="tel" placeholder="전화번호 뒤 8자리 (예: 85926325)" maxlength="8" inputmode="numeric">
    </div>
    <button class="login-btn" onclick="doLogin()">
      <i class="fas fa-arrow-right"></i> 로그인
    </button>
    <div class="login-register">
      처음이신가요? <a href="/search#register">인애드 등록하기 →</a>
    </div>
  </div>

  <!-- 모집공고 섹션 (비로그인 - 항상 표시) -->
  <div class="home-section">
    <div class="home-section-title">
      <i class="fas fa-bullhorn" style="color:var(--p)"></i> 모집공고
    </div>
    <div id="recruitPreviewList">
      <div class="empty-state"><i class="fas fa-circle-notch fa-spin"></i> 불러오는 중...</div>
    </div>
  </div>
</div>

<!-- ═══ 로그인 상태 ═══ -->
<div id="viewHome" style="display:none" class="page-wrap">
  <div class="home-header">
    <div class="home-header-top">
      <div class="home-logo"><i class="fas fa-star-half-alt"></i> InAd 리뷰어</div>
      <div class="home-header-actions">
        <a href="/admin" style="font-size:.72rem;color:rgba(255,255,255,.7);text-decoration:none;padding:5px 10px;border:1px solid rgba(255,255,255,.3);border-radius:6px"><i class="fas fa-lock"></i> 관리자</a>
        <button onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> 로그아웃</button>
      </div>
    </div>
    <div class="home-greeting" id="greetingText">안녕하세요!</div>
    <div class="home-greeting-sub" id="greetingSub">오늘도 좋은 하루 보내세요 ✨</div>
  </div>

  <!-- 탭 네비게이션 -->
  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('all')">
      <i class="fas fa-th-large"></i> 전체
    </button>
    <button class="tab-btn" onclick="switchTab('status')">
      <i class="fas fa-clipboard-list"></i> 내 참여현황
    </button>
    <button class="tab-btn" onclick="switchTab('recruit')">
      <i class="fas fa-bullhorn"></i> 모집공고
    </button>
  </div>

  <!-- 모집공고 섹션 -->
  <div class="home-section" id="sectionRecruit">
    <div class="home-section-title">
      <i class="fas fa-bullhorn" style="color:var(--p)"></i> 모집공고
    </div>
    <div id="recruitPreviewList2">
      <div class="empty-state"><i class="fas fa-circle-notch fa-spin"></i> 불러오는 중...</div>
    </div>
  </div>

  <!-- 내 참여현황 (진행단계 포함) -->
  <div class="home-section" id="sectionStatus">
    <div class="home-section-title"><i class="fas fa-clipboard-list" style="color:var(--p)"></i> 내 참여현황</div>
    <!-- 요약 통계 -->
    <div id="statusStats" style="display:none"></div>
    <div id="statusList" class="status-list">
      <div class="empty-state"><i class="fas fa-circle-notch fa-spin"></i> 불러오는 중...</div>
    </div>
  </div>

  <!-- 내 신청이력 -->
  <div class="home-section" id="sectionApplications">
    <div class="home-section-title"><i class="fas fa-paper-plane" style="color:#F59E0B"></i> 캠페인 신청이력</div>
    <div id="applicationList" class="status-list">
      <div class="empty-state"><i class="fas fa-circle-notch fa-spin"></i> 불러오는 중...</div>
    </div>
  </div>

  <!-- 내 입금현황 -->
  <div class="home-section" id="sectionPayments">
    <div class="home-section-title"><i class="fas fa-wallet" style="color:var(--ok)"></i> 리뷰비 입금현황</div>
    <div id="paymentSummary" style="display:none"></div>
    <div id="paymentList" class="status-list">
      <div class="empty-state"><i class="fas fa-circle-notch fa-spin"></i> 불러오는 중...</div>
    </div>
  </div>

  <!-- Footer -->
  <div class="home-footer">
    <a href="/admin">관리자이신가요? 관리자 페이지 →</a>
  </div>
</div>

<script>
/* ═══════════════════════════════════════
   리뷰어 홈 JS
═══════════════════════════════════════ */
const USER_KEY = "iad_reviewer_user";

function getSavedUser() {
  try { return JSON.parse(localStorage.getItem(USER_KEY)); } catch(e) { return null; }
}

function initPage() {
  const user = getSavedUser();
  if (user && user.name) {
    showHome(user);
  } else {
    document.getElementById("viewLogin").style.display = "";
    document.getElementById("viewHome").style.display = "none";
  }
}

function showHome(user) {
  document.getElementById("viewLogin").style.display = "none";
  document.getElementById("viewHome").style.display = "";
  document.getElementById("greetingText").textContent = `안녕하세요, ${user.name}님!`;
  loadMyStatus(user);
}

async function doLogin() {
  const name  = document.getElementById("loginName").value.trim();
  const phone = document.getElementById("loginPhone").value.replace(/[^0-9]/g, "");
  if (!phone || phone.length !== 8) { showToast("전화번호 뒤 8자리를 입력해주세요"); return; }

  const btn = document.querySelector(".login-btn");
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> 확인 중...';

  try {
    // 1차: 리뷰어 등록 DB에서 확인 (/api/reviewer/verify)
    const verifyUrl = API_BASE_URL + "/api/reviewer/verify?phone8=" + encodeURIComponent(phone)
      + (name ? "&name=" + encodeURIComponent(name) : "");
    const res = await fetch(verifyUrl);
    const json = await res.json();

    if (json.ok) {
      const user = { name: json.name, phone: json.phone, phone8: phone, loginAt: Date.now() };
      localStorage.setItem(USER_KEY, JSON.stringify(user));
      showHome(user);
    } else {
      // 2차 fallback: review_index에서 이름 검색 (이름 입력한 경우)
      if (name) {
        const res2 = await fetch(API_BASE_URL + "/api/search?query=" + encodeURIComponent(name));
        const json2 = await res2.json();
        const results = json2.data || json2.results || [];
        const matched = results.some(r => {
          const p = (r.phone || r.연락처 || r.전화번호 || "").replace(/[^0-9]/g, "");
          return p.endsWith(phone) || p.includes(phone);
        });
        if (matched || results.length > 0) {
          const user = { name, phone8: phone, loginAt: Date.now() };
          localStorage.setItem(USER_KEY, JSON.stringify(user));
          showHome(user);
          return;
        }
      }
      showToast(json.error || "등록된 정보를 찾을 수 없습니다");
    }
  } catch(e) {
    showToast("로그인 실패: " + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-arrow-right"></i> 로그인';
  }
}

function doLogout() {
  localStorage.removeItem(USER_KEY);
  location.reload();
}

async function loadMyStatus(user) {
  const phone8 = user.phone8;
  if (!phone8) return;

  // 병렬 호출: 참여현황 + 신청이력 + 입금현황
  const [statusRes, appRes, payRes] = await Promise.allSettled([
    fetch(API_BASE_URL + "/api/reviewer/my-status?phone8=" + phone8).then(r => r.json()),
    fetch(API_BASE_URL + "/api/reviewer/my-applications?phone8=" + phone8).then(r => r.json()),
    fetch(API_BASE_URL + "/api/reviewer/my-payments?phone8=" + phone8).then(r => r.json()),
  ]);

  // ─── 1. 내 참여현황 (진행단계) ───
  renderMyStatus(statusRes.status === "fulfilled" ? statusRes.value : null);

  // ─── 2. 캠페인 신청이력 ───
  renderMyApplications(appRes.status === "fulfilled" ? appRes.value : null);

  // ─── 3. 입금현황 ───
  renderMyPayments(payRes.status === "fulfilled" ? payRes.value : null);
}

function renderMyStatus(data) {
  const wrap = document.getElementById("statusList");
  const statsEl = document.getElementById("statusStats");
  if (!wrap) return;

  if (!data || !data.ok || !data.items || data.items.length === 0) {
    wrap.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i>참여한 캠페인이 없습니다</div>`;
    return;
  }

  // 통계 바
  const s = data.stats;
  if (statsEl) {
    statsEl.style.display = "";
    statsEl.innerHTML = `
      <div class="stats-bar">
        <div class="stats-bar-item"><div class="stats-bar-num" style="color:#1E40AF">${s.assigned}</div><div class="stats-bar-label">배정됨</div></div>
        <div class="stats-bar-item"><div class="stats-bar-num" style="color:var(--ok)">${s.submitted}</div><div class="stats-bar-label">제출완료</div></div>
        <div class="stats-bar-item"><div class="stats-bar-num" style="color:var(--p)">${s.paid}</div><div class="stats-bar-label">입금완료</div></div>
        <div class="stats-bar-item"><div class="stats-bar-num" style="color:var(--t4)">${s.closed}</div><div class="stats-bar-label">마감</div></div>
      </div>
    `;
  }

  // 최근 20건만 표시
  const items = data.items.slice(0, 20);
  wrap.innerHTML = items.map(r => {
    const stageMap = {
      assigned: { cls:"assigned", text:"배정됨" },
      submitted: { cls:"submitted", text:"제출완료" },
      paid: { cls:"paid", text:"입금완료" },
      closed: { cls:"closed", text:"마감" },
    };
    const st = stageMap[r.stage] || stageMap.assigned;
    const campaign = r.displayName || r.campaignName || r.tabName || "";
    const product = r.productName || "";

    // 제출 바로가기: 배정됨 상태에서만 표시
    const actionLink = r.stage === "assigned"
      ? `<a href="/search" class="status-action"><i class="fas fa-upload"></i> 제출</a>`
      : "";

    return `
      <div class="status-item">
        <span class="stage-badge ${st.cls}">${st.text}</span>
        <div class="status-info">
          <div class="status-name">${escHtml(campaign)}${r.round ? ' (' + escHtml(r.round) + ')' : ''}</div>
          <div class="status-meta">${product ? escHtml(product) : (r.manager ? '담당: ' + escHtml(r.manager) : '')}</div>
        </div>
        ${actionLink}
      </div>
    `;
  }).join("");
}

function renderMyApplications(data) {
  const wrap = document.getElementById("applicationList");
  if (!wrap) return;

  if (!data || !data.ok || !data.applications || data.applications.length === 0) {
    wrap.innerHTML = `<div class="empty-state"><i class="fas fa-paper-plane"></i>신청한 캠페인이 없습니다</div>`;
    return;
  }

  wrap.innerHTML = data.applications.slice(0, 10).map(a => {
    const statusCls = a.status === "confirmed" ? "done" : "rejected";
    const statusText = a.status === "confirmed" ? "확정" : "취소";
    const channel = a.channel === "직접입력" ? (a.channelCustom || "") : (a.channel || "");
    const dateStr = a.appliedAt ? new Date(a.appliedAt).toLocaleDateString("ko-KR", { month:"short", day:"numeric" }) : "";

    return `
      <div class="status-item">
        <div class="status-dot ${statusCls}"></div>
        <div class="status-info">
          <div class="status-name">${escHtml(a.campaignTitle || '캠페인')}</div>
          <div class="status-meta">${channel ? escHtml(channel) + ' · ' : ''}${dateStr}${a.reviewFee ? ' · ' + Number(a.reviewFee).toLocaleString() + '원' : ''}</div>
        </div>
        <span class="status-badge ${statusCls}">${statusText}</span>
      </div>
    `;
  }).join("");
}

function renderMyPayments(data) {
  const wrap = document.getElementById("paymentList");
  const summaryEl = document.getElementById("paymentSummary");
  if (!wrap) return;

  if (!data || !data.ok || !data.payments || data.payments.length === 0) {
    wrap.innerHTML = `<div class="empty-state"><i class="fas fa-wallet"></i>입금 내역이 없습니다</div>`;
    return;
  }

  // 총액 요약
  if (summaryEl && data.summary) {
    summaryEl.style.display = "";
    summaryEl.innerHTML = `
      <div class="pay-summary">
        <i class="fas fa-coins" style="font-size:1.4rem;color:var(--p)"></i>
        <div>
          <div class="pay-summary-amount">₩${data.summary.totalAmount.toLocaleString()}</div>
          <div class="pay-summary-label">총 ${data.summary.total}건 입금완료</div>
        </div>
      </div>
    `;
  }

  wrap.innerHTML = data.payments.slice(0, 15).map(p => {
    const amt = p.amount ? Number(p.amount.replace(/[^0-9]/g, '')).toLocaleString() + "원" : "—";
    const dateStr = p.paidAt ? new Date(p.paidAt).toLocaleDateString("ko-KR", { month:"short", day:"numeric" }) : "";
    const campaign = p.displayName || p.campaignName || p.tabName || "";

    return `
      <div class="status-item">
        <div class="status-dot done"></div>
        <div class="status-info">
          <div class="status-name">${escHtml(campaign)}</div>
          <div class="status-meta">${dateStr}</div>
        </div>
        <span class="status-badge done">${amt}</span>
      </div>
    `;
  }).join("");
}

function escHtml(s) {
  const d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

function showToast(msg) {
  const existing = document.querySelector(".toast");
  if (existing) existing.remove();
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// Enter key support
document.addEventListener("DOMContentLoaded", () => {
  initPage();
  loadRecruitPreview();  // 모집공고 로드 (비로그인에서도 보임)
  document.getElementById("loginPhone").addEventListener("keydown", e => {
    if (e.key === "Enter") doLogin();
  });
  document.getElementById("loginName").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("loginPhone").focus();
  });
});

/* ═══ 탭 네비게이션 ═══ */
let _currentTab = 'all';

function switchTab(tab) {
  _currentTab = tab;
  // 버튼 활성 상태
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  event.currentTarget.classList.add('active');

  // 섹션 제어
  const recruit = document.getElementById('sectionRecruit');
  const status = document.getElementById('sectionStatus');
  const apps = document.getElementById('sectionApplications');
  const payments = document.getElementById('sectionPayments');

  if (tab === 'all') {
    if (recruit) recruit.style.display = '';
    if (status) status.style.display = '';
    if (apps) apps.style.display = '';
    if (payments) payments.style.display = '';
  } else if (tab === 'status') {
    if (recruit) recruit.style.display = 'none';
    if (status) status.style.display = '';
    if (apps) apps.style.display = '';
    if (payments) payments.style.display = '';
  } else if (tab === 'recruit') {
    if (recruit) recruit.style.display = '';
    if (status) status.style.display = 'none';
    if (apps) apps.style.display = 'none';
    if (payments) payments.style.display = 'none';
  }
}

/* ═══ 모집공고 미리보기 (홈 인라인) ═══ */

async function loadRecruitPreview() {
  try {
    const res = await fetch(API_BASE_URL + "/api/campaign/list");
    const json = await res.json();
    const list = (json.data || []).filter(c => c.status === "active");

    const html = list.length === 0
      ? `<div class="empty-state" style="padding:16px"><i class="fas fa-inbox"></i>현재 진행 중인 모집공고가 없습니다</div>`
      : list.map(c => {
          const channel = c.channel === "직접입력" ? (c.channel_custom || "") : (c.channel || "");
          const fee = c.review_fee ? Number(c.review_fee).toLocaleString() + "원" : "";
          const slots = c.max_slots > 0 ? `<span class="rc-slots">${c.current_slots||0}/${c.max_slots}명</span>` : "";
          const badges = Array.isArray(c.badges) ? c.badges : (c.badges ? JSON.parse(c.badges) : []);
          const managerEmoji = c.manager === "만두" ? "🥟" : c.manager === "망고" ? "🥭" : "";
          const isFull = c.max_slots > 0 && (c.current_slots || 0) >= c.max_slots;

          // 참여 버튼: chat_url이 있으면 카카오톡으로, 없으면 인라인 신청
          let actionBtn = "";
          if (isFull) {
            actionBtn = `<button class="rc-apply-btn rc-closed" disabled><i class="fas fa-ban"></i> 모집 마감</button>`;
          } else if (c.chat_url) {
            actionBtn = `<button class="rc-apply-btn rc-kakao" onclick="handleApplyClick('${escHtml(c.chat_url).replace(/'/g,"&apos;")}')"><i class="fas fa-comment"></i> 참여 신청하기</button>`;
          } else {
            actionBtn = `<button class="rc-apply-btn rc-default" onclick="handleApplyClick(null,'${c.id}')"><i class="fas fa-hand-pointer"></i> 참여 신청하기</button>`;
          }

          return `
            <div class="rc-card">
              <div class="rc-card-top">
                ${channel ? `<span class="rc-channel">${escHtml(channel)}</span>` : ""}
                <span class="rc-title">${escHtml(c.title)}</span>
                ${c.manager ? `<span class="rc-manager">${managerEmoji} ${escHtml(c.manager)}</span>` : ""}
              </div>
              ${badges.length ? `<div class="rc-badges">${badges.map(b=>`<span class="rc-badge">${escHtml(b)}</span>`).join("")}</div>` : ""}
              <div class="rc-meta">
                ${fee ? `<span><i class="fas fa-won-sign"></i> 리뷰비 ${fee}</span>` : ""}
                ${c.delivery_type ? `<span><i class="fas fa-truck"></i> ${escHtml(c.delivery_type)}</span>` : ""}
                ${c.time_range ? `<span><i class="fas fa-clock"></i> ${escHtml(c.time_range)}</span>` : ""}
                ${slots}
              </div>
              ${c.notes ? `<div class="rc-notes"><i class="fas fa-sticky-note"></i> ${escHtml(c.notes)}</div>` : ""}
              ${actionBtn}
              <div class="rc-inline-form" id="rcForm_${c.id}" style="display:none">
                <div class="rc-form-fields">
                  <input type="text" class="rc-input" id="rcName_${c.id}" placeholder="이름">
                  <input type="tel" class="rc-input" id="rcPhone_${c.id}" placeholder="연락처 (010-XXXX-XXXX)">
                </div>
                <div class="rc-form-actions">
                  <button class="rc-submit-btn" onclick="submitInlineApply('${c.id}')"><i class="fas fa-check"></i> 신청 완료</button>
                  <button class="rc-cancel-btn" onclick="closeInlineApply('${c.id}')">취소</button>
                </div>
              </div>
            </div>`;
        }).join("");

    const el1 = document.getElementById("recruitPreviewList");
    const el2 = document.getElementById("recruitPreviewList2");
    if (el1) el1.innerHTML = html;
    if (el2) el2.innerHTML = html;
  } catch(e) {
    const errHtml = `<div class="empty-state"><i class="fas fa-exclamation-circle"></i>모집공고 로드 실패</div>`;
    const el1 = document.getElementById("recruitPreviewList");
    const el2 = document.getElementById("recruitPreviewList2");
    if (el1) el1.innerHTML = errHtml;
    if (el2) el2.innerHTML = errHtml;
  }
}

/* ═══ 참여 신청 핸들러 ═══ */
function handleApplyClick(chatUrl, campId) {
  const user = getSavedUser();

  // 비로그인 상태: 로그인 안내
  if (!user) {
    showToast('로그인 후 참여하실 수 있습니다');
    // 로그인 입력란으로 스크롤
    const loginInput = document.getElementById('loginPhone');
    if (loginInput) { loginInput.scrollIntoView({ behavior:'smooth', block:'center' }); loginInput.focus(); }
    return;
  }

  // chat_url이 있으면 카카오톡으로 이동
  if (chatUrl) {
    window.open(chatUrl, '_blank');
    return;
  }

  // chat_url 없으면 인라인 신청 폼 열기
  if (campId) openInlineApply(campId);
}

function openInlineApply(campId) {
  // 이미 열린 다른 폼 닫기
  document.querySelectorAll('.rc-inline-form').forEach(el => el.style.display = 'none');
  const form = document.getElementById('rcForm_' + campId);
  if (!form) return;
  form.style.display = '';

  // 로그인 상태면 자동 채우기
  const user = getSavedUser();
  if (user) {
    const nameInput = document.getElementById('rcName_' + campId);
    const phoneInput = document.getElementById('rcPhone_' + campId);
    if (nameInput && user.name) nameInput.value = user.name;
    if (phoneInput && user.phone) phoneInput.value = user.phone;
    else if (phoneInput && user.phone8) phoneInput.value = user.phone8;
  }
}

function closeInlineApply(campId) {
  const form = document.getElementById('rcForm_' + campId);
  if (form) form.style.display = 'none';
}

async function submitInlineApply(campId) {
  const nameInput = document.getElementById('rcName_' + campId);
  const phoneInput = document.getElementById('rcPhone_' + campId);
  const name = (nameInput ? nameInput.value : '').trim();
  const phone = (phoneInput ? phoneInput.value : '').trim();

  if (!name) { showToast('이름을 입력해주세요'); return; }
  if (!phone) { showToast('연락처를 입력해주세요'); return; }

  try {
    const res = await fetch(API_BASE_URL + '/api/campaign/' + campId + '/apply', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, phone })
    });
    const json = await res.json();
    if (json.ok) {
      showToast('✅ 참여 신청이 완료되었습니다!');
      closeInlineApply(campId);
      loadRecruitPreview(); // 슬롯 업데이트
    } else {
      showToast(json.error || '신청 실패');
    }
  } catch(e) {
    showToast('신청 오류: ' + e.message);
  }
}
