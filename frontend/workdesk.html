<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>통합 작업대 (Track B · 그림자)</title>
<!-- 관리자 대시보드에서 가져온 공유 모듈(cs-inquiry.js 등)이 <i class="fas fa-*"> 아이콘을 쓴다.
     admin.html 과 **같은 CDN·같은 버전**을 쓰므로 두 화면의 아이콘이 어긋나지 않는다.
     못 불러와도 글자만 빠질 뿐 동작은 그대로(모듈은 아이콘에 기능을 걸지 않는다). -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css"/>
<style>
  /* ═══ Clarity Console 공용 UI 키트 토큰 — 단일 블루 액센트 + 쿨그레이 뉴트럴, tabular-nums ═══ */
  :root{
    --paper:#f4f6f9;--card:#ffffff;--card2:#f1f4f8;--ink:#101828;--muted:#667085;--faint:#98a2b3;
    --line:#e6eaf0;--line2:#d0d9e4;--accent:#2563eb;--accent-soft:#eff4ff;--accent-deep:#1d4ed8;--accent-line:#d7e3fd;
    --safe:#16a34a;--safe-soft:#e9f7ee;--warn:#b45309;--warn-soft:#fdf6ec;--bad:#e5484d;--bad-soft:#fdf0f0;
    --adv:#6d5ac9;--adv-soft:#efecfa;
    --ease:cubic-bezier(.22,1,.36,1);
    --shadow-card:0 1px 2px rgba(16,24,40,.04),0 10px 26px rgba(16,24,40,.05);
    --mono:'SF Mono','JetBrains Mono',ui-monospace,monospace;
    --sans:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  .top{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  .top .logo{font-weight:800;letter-spacing:-.02em;font-size:15px}
  .top .logo .tag{font-size:10px;font-weight:800;color:var(--accent-deep);background:var(--accent-soft);border:1px solid var(--accent-line);padding:2px 9px;border-radius:999px;margin-left:8px;letter-spacing:.05em}
  .nav{display:flex;gap:0;margin-left:6px;background:var(--card2);border-radius:10px;padding:3px}
  .navb{font:inherit;font-size:12.5px;font-weight:700;height:30px;padding:0 14px;border-radius:8px;border:none;background:none;color:var(--muted);cursor:pointer;transition:color .2s,background .2s}
  .navb.on{background:var(--card);color:var(--accent-deep);box-shadow:0 1px 3px rgba(16,24,40,.12)}
  .top .sp{flex:1}
  .rolebadge{font-size:11px;font-weight:750;padding:4px 12px;border-radius:999px;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent-deep)}
  .btn{font:inherit;font-size:12px;font-weight:700;padding:0 13px;height:32px;display:inline-flex;align-items:center;gap:6px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,transform .1s,box-shadow .15s}
  .btn:hover{border-color:var(--accent-line);background:var(--card2)} .btn:active{transform:scale(.97)}
  .btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 1px 2px rgba(37,99,235,.32)} .btn.pri:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
  .btn:disabled{background:var(--card2);color:var(--faint);border-color:var(--card2);cursor:not-allowed;box-shadow:none;transform:none}
  /* ── 작업목록 = 상단 가로바(사이드바 대체). 본문은 1열(+선택적 우측 레일) → 표가 화면 전체폭을 씀 ──
     --tbh = 상단 작업바 실제 높이(tb1 ~49 + tb2 42 + 경계 1). 높이 의존 계산(.wrap/.gridscroll)을 이 한 값에 묶어
     전체화면(작업바 숨김)일 때 body.widemode가 0으로 덮어쓰면 아래 계산들이 함께 따라온다(매직넘버 드리프트 방지).
     --toph = 상단 헤더(.top) 실제 높이. .top은 flex-wrap이라 역할별 버튼 수·화면폭에 따라 한 줄(≈57px)에서
     두 줄(≈93px+)로 늘어난다 → 상수로 박으면 좁은 화면에서 작업바가 헤더 뒤로 숨는다. 둘 다 _measureChrome()이
     실측해 덮어쓰고(아래 값은 첫 프레임용 근사치), 전체화면이면 작업바가 display:none이라 측정값이 자연히 0이 된다. */
  :root{--tbh:92px;--toph:57px;--app-max:1920px}
  .wrap{display:grid;grid-template-columns:1fr 300px;min-height:calc(100vh - var(--toph) - var(--tbh))}
  .wrap.railhidden{grid-template-columns:1fr}                 /* 우측 레일 숨김 → 1열(메인 전체폭) */
  .wrap.railhidden .rail{display:none}
  .wrap.widemode{grid-template-columns:1fr}                   /* 전체화면(전체폭) 모드 = 우 레일 + 상단 작업바까지 숨김 */
  .wrap.widemode .rail{display:none}
  body.widemode .taskbar{display:none}                        /* 전체화면에선 상단 작업바도 숨겨 표에 최대 높이 할애 */
  @media(max-width:900px){.wrap,.wrap.railhidden{grid-template-columns:1fr}.rail{display:none}}
  .railtgl,.widetgl{font-size:12px}   /* 우측 상단 토글 */

  /* 1단: 통합검색 + 업체 세그먼트(맨 앞 ★즐겨찾기) */
  .taskbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:var(--toph);z-index:4}
  .tb1{display:flex;align-items:center;gap:10px;background:var(--card2);border-bottom:1px solid var(--line);padding:8px 14px;position:relative}
  .wsearch{position:relative;flex:none;width:236px}
  .wsearch input{width:100%;font:inherit;font-size:12.5px;padding:7px 11px 7px 30px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);outline:none;transition:border-color .12s,box-shadow .12s}
  .wsearch input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .wsearch .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:12px;pointer-events:none}
  .sres{display:none;position:absolute;top:calc(100% + 4px);left:0;width:340px;z-index:40;background:var(--card);border:1px solid var(--line2);border-radius:11px;box-shadow:0 16px 38px rgba(16,24,40,.18);padding:5px;max-height:320px;overflow:auto}
  .sres.show{display:block}
  .sres .shd{font-size:10px;font-weight:750;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;padding:6px 9px 3px}
  .sitem{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer}
  .sitem:hover,.sitem.kb{background:var(--accent-soft)}
  .sitem .txt{min-width:0;flex:1}
  .sitem .sn{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sitem .sn mark{background:#fde68a;color:inherit;border-radius:3px;padding:0 1px}
  .sitem .ss{font-size:10.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sempty{padding:14px 12px;color:var(--faint);font-size:12px;text-align:center}
  .segdiv{width:1px;align-self:stretch;background:var(--line2);margin:2px 0}
  .segwrap{display:flex;align-items:center;gap:7px;overflow-x:auto;flex:1;padding-bottom:1px;scrollbar-width:thin}
  .segwrap::-webkit-scrollbar{height:5px} .segwrap::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
  .seg{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 13px;cursor:pointer;white-space:nowrap;flex:none;transition:background .12s,border-color .12s,color .12s}
  .seg:hover{border-color:var(--line2)}
  .seg .cnt{font-size:10px;font-weight:700;color:var(--faint);background:var(--card2);border-radius:8px;padding:1px 6px}
  .seg .unbmini{font-size:9px;font-weight:800;color:#fff;background:var(--bad);border-radius:20px;padding:0 5px;line-height:1.6}
  .seg.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .seg.on .cnt{background:rgba(255,255,255,.18);color:#fff}
  .seg.favseg .fs{color:#f5b301;font-size:13px}
  .seg.favseg.on{background:#b8860b;border-color:#b8860b} .seg.favseg.on .fs{color:#fff}
  /* 업체 즐겨찾기 별표 — 평소엔 숨고 호버/활성 시 노출(칩이 조밀해 상시 노출하면 이름이 밀림) */
  .seg .segstar{flex:none;font-size:12px;line-height:1;color:var(--faint);cursor:pointer;user-select:none;
    width:0;overflow:hidden;opacity:0;transition:opacity .12s,width .12s,color .12s}
  .seg:hover .segstar{width:13px;opacity:.55} .seg .segstar:hover{opacity:1;color:var(--warn)}
  .seg .segstar.on{width:13px;opacity:1;color:#f5b301}
  .seg.on .segstar{color:rgba(255,255,255,.6)} .seg.on .segstar.on{color:#ffd257}
  .seg.advfav{border-color:#f0d9a0;background:#fffdf5}
  .seg.advfav.on{background:var(--ink);border-color:var(--ink)}
  @media(hover:none){.seg .segstar{width:13px;opacity:.35}}   /* 터치는 hover가 없어 상시 노출 */

  /* 2단: 선택 그룹의 탭(밑줄 탭) */
  .tb2{display:flex;align-items:stretch;gap:2px;background:var(--card);padding:0 12px;overflow-x:auto;min-height:42px}
  .tb2::-webkit-scrollbar{height:5px} .tb2::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
  .wtab{position:relative;display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);padding:11px 12px 10px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;flex:none;transition:color .12s,background .12s}
  .wtab:hover{color:var(--ink);background:var(--card2)}
  .wtab.on{color:var(--accent-deep);font-weight:700;border-bottom-color:var(--accent)}
  /* 탭 라벨은 길다(예 "7/3(쿠팡)디아쉬끄_퀵픽싱 헤어틴트 50건" + 시트제목) → 상한 + …축약, 전체값은 title 툴팁.
     상한이 없으면 탭 4개만으로 화면이 차 나머지가 전부 가로스크롤 뒤로 밀린다. */
  .wtab .tn{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wtab .ts{font-size:10px;color:var(--faint);font-weight:400;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wtab.on .ts{color:var(--accent)}
  /* 즐겨찾기 별표 — 호버 시 노출, 활성 시 앰버로 항상 표시. 클릭은 selTab 로 전파 안 함 */
  .wtab .tstar{flex:none;font-size:13px;line-height:1;color:var(--faint);opacity:0;cursor:pointer;padding:0 1px;user-select:none;transition:opacity .12s,color .12s,transform .1s}
  .wtab:hover .tstar{opacity:.6} .wtab .tstar:hover{opacity:1;color:var(--warn);transform:scale(1.15)}
  .wtab .tstar.on{opacity:1;color:#f5b301}
  /* 터치 기기는 hover가 없어 별이 '보이지 않는 탭 영역'이 된다 → 항상 옅게 노출해 오탭을 막는다 */
  @media(hover:none){.wtab .tstar{opacity:.35}}
  .tb2 .b2empty{color:var(--faint);font-size:12px;display:flex;align-items:center;padding:0 8px}
  .advsug{display:none;position:absolute;top:100%;left:0;right:0;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-top:3px;max-height:220px;overflow-y:auto;box-shadow:0 6px 18px rgba(0,0,0,.12)}
  .advsug.show{display:block}
  .sugitem{padding:8px 11px;font-size:12.5px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .sugitem:hover{background:var(--accent-soft)}
  .sugl{display:flex;flex-direction:column;gap:2px;min-width:0}
  .sugn{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sugmeta{color:var(--faint);font-size:10.5px}
  .sugm{color:var(--faint);font-size:11px;white-space:nowrap;flex:none}
  /* 연결탭 목록 — 컬럼형 그리드(헤더·행 동일 템플릿, 정보를 행 전체 폭에 펼침). 좁은 화면은 otwrap 가로 스크롤 */
  .otwrap{overflow-x:auto;padding-bottom:2px}
  .othead,.owntab{display:grid;grid-template-columns:44px minmax(170px,1.5fr) 90px minmax(100px,1fr) 80px 88px 60px 108px 64px 64px 64px 148px 64px minmax(120px,1fr) 44px;gap:10px;align-items:center;min-width:1420px}
  .othead{font-size:9.5px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:0 14px 5px}
  .owntab{padding:9px 14px;border:1px solid var(--line);border-radius:13px;margin-bottom:7px;cursor:pointer;background:var(--card);transition:transform .25s var(--ease),box-shadow .2s,border-color .2s}
  .owntab:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(16,24,40,.08);border-color:var(--accent-line)}
  .owntab .oname{min-width:0}
  .owntab .oname b{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .owntab .osub{display:block;font-size:10.5px;color:var(--faint);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .owntab .ocol{font-size:12px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .owntab .ocol.dim{color:var(--faint)}
  .owntab .obr{font-weight:700}
  .owntab .ocnt{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
  .owntab .ocnt b{font-weight:700;color:var(--ink)} .owntab .ocnt .c-sub{color:var(--accent)} .owntab .ocnt .c-paid{color:var(--safe)}
  .owntab .openb{font-size:11px;color:var(--accent);font-weight:700;white-space:nowrap;text-align:right}
  .odot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--faint);opacity:.35;margin-right:6px;vertical-align:1px}
  .odot.a{background:var(--safe);opacity:1}
  /* 정산 컬럼(관제실 대응): 날짜셀·금액셀·비고(클릭 편집) */
  .owntab .odate{font-size:11.5px;font-variant-numeric:tabular-nums}
  .owntab .omoney{font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .owntab .omoney .pd-ok{color:var(--safe);font-weight:700} .owntab .omoney .pd-part{color:var(--warn);font-weight:700} .owntab .omoney .pd-zero{color:var(--faint)}
  .owntab .omemo{font-size:11.5px;color:var(--muted);cursor:text;border-radius:6px;padding:3px 6px;margin:-3px -6px}
  .owntab .omemo:hover{background:var(--card2);outline:1px dashed var(--accent-line)}
  .owntab .omemo i{color:var(--faint);font-style:normal;opacity:.6}
  .omemoin{width:100%;font:inherit;font-size:11.5px;padding:3px 6px;border:1px solid var(--accent-line);border-radius:6px;background:var(--card);color:var(--ink);outline:none}
  /* 브랜드 필터 칩(한 광고주가 다수 브랜드 보유 — 관제실 '브랜드' 컬럼 대응) */
  .obchips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px}
  .obchip{font-size:11px;font-weight:650;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--muted)}
  .obchip:hover{border-color:var(--accent-line)}
  .obchip.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent);color:var(--accent-deep)}
  /* 키트 배지(ok/warn/bad/neutral) — 연결탭 속성 배지 공용 */
  .bb{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--muted)}
  .bb.ok{background:var(--accent-soft);color:var(--accent-deep)}
  .bb.safe{background:var(--safe-soft);color:var(--safe)}
  .bb.warn{background:var(--warn-soft);color:var(--warn)}
  .bb.bad{background:var(--bad-soft);color:var(--bad)}
  .main{padding:18px 22px;overflow:auto}
  .mh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  /* 선택한 작업의 소속 시트 — 2단 탭에서 뺀 정보를 여기서 한 번만 표기 */
  .mhsheet{font-size:11.5px;color:var(--muted);background:var(--card2);border:1px solid var(--line);
    border-radius:7px;padding:3px 9px;white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
  .mh h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.02em}
  .bd{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--card2);color:var(--muted);border:1px solid var(--line)} .bd.g{background:var(--safe-soft);color:var(--safe);border-color:transparent} .bd.sot{background:var(--accent-soft);color:var(--accent);border-color:transparent}
  .metagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin-bottom:16px}
  .mf{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
  .mf .k{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.03em} .mf .v{font-size:13px;font-weight:600;margin-top:2px}
  .wobar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card2)}
  .wobar .wt{font-size:12.5px;font-weight:700} .wobar .wsub{font-size:11px;color:var(--faint)}
  .wodetail{border:1px solid var(--line);border-radius:11px;background:var(--card);margin-bottom:16px;overflow:hidden}
  .wodetail summary{cursor:pointer;list-style:none;padding:11px 14px;font-size:12.5px;font-weight:700;background:var(--card2);display:flex;align-items:center;gap:8px}
  .wodetail summary::-webkit-details-marker{display:none}
  .worow{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:8px 14px;border-top:1px solid var(--line);font-size:12.5px}
  .worow .wk{color:var(--faint);font-weight:650} .worow .wv{white-space:pre-wrap;word-break:break-word}
  .wochip{display:inline-block;font-size:11px;font-weight:650;padding:2px 8px;border-radius:999px;background:var(--adv-soft);color:var(--adv);margin:2px 4px 2px 0}
  .worow2{padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer} .worow2:hover{background:var(--card2)} .worow2.on{border-color:var(--adv);background:var(--adv-soft)}
  .worow2 .t{font-size:12.5px;font-weight:650} .worow2 .s{font-size:11px;color:var(--faint);margin-top:2px}
  .counts{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .cc{flex:1;min-width:170px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;transition:transform .25s var(--ease),box-shadow .2s,border-color .2s}
  .cc:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(16,24,40,.08);border-color:var(--accent-line)}
  .cc .big{font-size:20px;font-weight:800;letter-spacing:-.02em} .cc .big small{font-size:11.5px;font-weight:600;color:var(--faint);margin-left:2px}
  .cc .lb{font-size:11px;font-weight:600;color:var(--muted);margin-top:0} .cc.s .big{color:var(--safe)} .cc.p .big{color:var(--accent-deep)}
  /* KPI 게이지(도넛) — 키트 cc-gauge */
  .gauge{width:44px;height:44px;position:relative;flex:none}
  .gauge svg{transform:rotate(-90deg);display:block}
  .gauge circle{fill:none;stroke-width:4}
  .gauge .trk{stroke:var(--card2)}
  .gauge .bar{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:113;transition:stroke-dashoffset .9s var(--ease)}
  .gauge.g-safe .bar{stroke:var(--safe)} .gauge.g-warn .bar{stroke:var(--warn)}
  .gauge .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  thead th{background:var(--card2);text-align:left;padding:10px 12px;font-size:11px;letter-spacing:.02em;color:var(--muted);font-weight:750;border-bottom:2px solid var(--accent-line)}
  tbody td{padding:9px 12px;border-top:1px solid var(--line)} tbody tr{transition:background .12s} tbody tr:hover{background:var(--card2)}
  .chk{font-weight:800}.chk.y{color:var(--safe)}.chk.n{color:var(--faint)}
  .ph{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .src{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--card2);color:var(--faint)} .src.manual{background:var(--warn-soft);color:var(--warn)} .src.order{background:var(--accent-soft);color:var(--accent)}
  /* ── 편집 UI ── */
  .ecell{cursor:text;border-bottom:1px dashed transparent;border-radius:3px;padding:1px 3px} .ecell:hover{border-bottom-color:var(--line2);background:var(--card2)}
  .ecell.edited{background:var(--accent-soft);border-bottom-color:var(--accent)}
  @keyframes cellsaved{from{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--safe) 60%,transparent)}to{box-shadow:inset 0 0 0 2px transparent}}
  table.sheetgrid td.cellsaved{animation:cellsaved .55s ease-out}   /* 백그라운드 저장 완료 = 초록 링 페이드(엑셀식 즉시감) */
  .chk.clk{cursor:pointer;border-radius:4px;padding:0 4px} .chk.clk:hover{background:var(--card2)} .chk.clk.edited{outline:1px solid var(--accent);outline-offset:1px}
  .einp{font:inherit;font-size:12.5px;width:100%;min-width:60px;padding:2px 5px;border:1px solid var(--accent);border-radius:5px;background:var(--card);color:var(--ink)}
  .revb{cursor:pointer;color:var(--accent);font-size:12px;user-select:none} .revb:hover{color:var(--bad)}
  .lock{font-size:10px;opacity:.5}
  tr.amb{background:color-mix(in srgb,var(--warn-soft) 40%,transparent)}
  .rmrow{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--faint);cursor:pointer;font-size:13px;line-height:1} .rmrow:hover{color:var(--bad);border-color:var(--bad)}
  .wchip{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn);cursor:pointer} .wchip.bad{background:var(--bad-soft);color:var(--bad)}
  .addgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0} .addgrid input{padding:7px 10px;border:1px solid var(--line2);border-radius:7px;font:inherit;font-size:13px}
  .editnote{font-size:11px;color:var(--faint);margin-top:12px;line-height:1.5;padding:8px 10px;background:var(--card2);border-radius:8px}
  .hrow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12.5px;border-top:1px solid var(--line)}
  .exp{display:inline-block;cursor:pointer;color:var(--faint);font-size:11px;transition:transform .15s;user-select:none;width:12px} .exp:hover{color:var(--accent)} .exp.open{transform:rotate(90deg);color:var(--accent)}
  tr.detrow td{background:var(--card2);padding:0} tr.detrow:hover{background:var(--card2)}
  .detwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 14px} @media(max-width:820px){.detwrap{grid-template-columns:1fr}}
  .dcard{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
  .dch{font-size:11px;font-weight:750;color:var(--muted);margin-bottom:8px}
  .dgrid{display:grid;grid-template-columns:1fr;gap:4px}
  .dpair{display:flex;gap:8px;font-size:12px;line-height:1.5;border-bottom:1px dotted var(--line);padding:2px 0} .dpair:last-child{border-bottom:none}
  .dpair .dk{flex:none;width:96px;color:var(--faint);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .dpair .dv{flex:1;color:var(--ink);word-break:break-word}
  .dnone{font-size:12px;color:var(--faint);padding:4px 0}
  /* ── 시트형 그리드(열람) ── */
  .gridscroll{border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 300px - var(--tbh));background:var(--card)}   /* 상단 작업바 높이만큼 차감(전체화면 시 --tbh=0 → 원래 높이 복귀) */
  /* table-layout:fixed = 열 너비 고정 → 브라우저가 모든 셀 내용을 측정 안 함(렌더 비용 급감). overflow:visible = 상단 table{overflow:hidden} 무효화 → thead sticky 동작.
     ★ min-width:0 = 컨테이너 100% 스트레치 해제. 표폭은 _fitGrid 가 '보이는 열 고정폭의 합'으로 못박는다 →
       창을 아무리 넓혀도 열 너비가 변하지 않고(같은 자리에 같은 데이터), 남는 공간은 우측 여백으로 남는다.
       열이 더 많은 작업(탭)일수록 합이 커져 표만 그만큼 넓어진다. */
  table.sheetgrid{border-collapse:separate;border-spacing:0;font-size:12px;white-space:nowrap;min-width:0;overflow:visible;table-layout:fixed}
  table.sheetgrid th,table.sheetgrid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 9px;text-align:left;height:30px}
  table.sheetgrid td{overflow:hidden;text-overflow:ellipsis}   /* 고정폭 초과 값은 …로 축약(전체값 = 호버 툴팁 or 클릭 편집) */
  table.sheetgrid th{overflow:hidden}
  table.sheetgrid thead th{position:sticky;top:0;z-index:3;background:var(--card2);font-weight:700;color:var(--muted);font-size:10.5px;border-bottom:2px solid var(--line2);user-select:none;cursor:pointer}
  table.sheetgrid thead th.gseq{cursor:default}
  table.sheetgrid thead th:not(.gseq):hover{background:color-mix(in srgb,var(--accent-soft) 55%,var(--card2))}
  table.sheetgrid .gfz{position:sticky;background:var(--card);z-index:2}
  table.sheetgrid thead th.gfz{z-index:4;background:var(--card2)}
  .gnum{text-align:center;color:var(--faint);font-weight:700} .gnm{font-weight:600}
  table.sheetgrid td.gctr{text-align:center} table.sheetgrid th.gctr .th-in{justify-content:center}   /* 날짜/연락처 열 = 가운데 정렬(값 길이 달라도 앞여백=뒷여백) */
  table.sheetgrid.advsnug{min-width:0}   /* (역할 무관 기본이 된 규칙 — 광고주 그리드 식별용으로 클래스는 유지) */
  table.sheetgrid .gph{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  table.sheetgrid tbody tr:hover td{background:#f7faff} table.sheetgrid tbody tr:hover td.gfz{background:#eef4ff}
  /* 리뷰어 로그 딥링크로 찾아온 행 — 앰버로 잠깐 강조(고정열 포함). 호버보다 우선이라 마우스가 위에 있어도 보인다 */
  table.sheetgrid tbody tr.rowhit td, table.sheetgrid tbody tr.rowhit:hover td,
  table.sheetgrid tbody tr.rowhit td.gfz, table.sheetgrid tbody tr.rowhit:hover td.gfz{
    background:#fef3c7;box-shadow:inset 0 -1px 0 #f5b301,inset 0 1px 0 #f5b301;animation:rowhitpulse 1.1s ease-in-out 2}
  @keyframes rowhitpulse{0%,100%{background:#fef3c7}50%{background:#fde68a}}
  @media(prefers-reduced-motion:reduce){table.sheetgrid tbody tr.rowhit td{animation:none}}
  /* 안내 토스트(하단 중앙) — 흐름을 막지 않는 비모달 고지 */
  .wdtoast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);z-index:60;
    background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:10px 16px;border-radius:10px;
    box-shadow:0 10px 30px rgba(16,24,40,.28);max-width:min(560px,92vw);opacity:0;pointer-events:none;
    transition:opacity .18s var(--ease),transform .18s var(--ease)}
  .wdtoast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* 편집 가능 셀 = td 자체(셀당 .ecell 스팬 제거 → DOM 노드 ~40%↓ = 렌더 비용 감소). 클릭=편집, edited=배경 강조. */
  table.sheetgrid td.gedit{cursor:cell}
  table.sheetgrid td.gedit:hover{background:var(--card2)}
  table.sheetgrid td.gedit.edited{background:var(--accent-soft)} table.sheetgrid td.gedit.edited:hover{background:color-mix(in srgb,var(--accent-soft) 82%,var(--card2))}
  .gcell.gempty{color:var(--line2)} .gcell.gok{color:var(--safe);font-weight:600}
  td.gidlock{cursor:default}   /* 참여자·연락처 = 실제 제출 신원(수정 불가) */
  .gridbar{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .gridbar label{font-size:12px;color:var(--muted);font-weight:650}
  .gridbar select{font:inherit;font-size:12.5px;padding:5px 9px;border:1px solid var(--line2);border-radius:7px;background:var(--card);color:var(--ink)}
  .gnote{font-size:11px;color:var(--faint)} .gnote b{color:var(--muted)}
  /* ── 관측 대시보드 ── */
  .ovwrap{padding:18px 22px;overflow:auto;height:calc(100vh - 50px)}

  /* ── 화면 폭 상한 (우측 상단 FHD/QHD 토글) ────────────────────────────────────────
     창을 넓힐수록 헤더·업체 칩·탭·본문이 끝없이 따라 늘어나던 것을 --app-max 에서 멈춘다.
     ★ 래퍼를 새로 넣지 않고 padding-inline 한 줄로 처리한다 — .top/.taskbar 는 sticky 배경이라
       요소 자체에 max-width 를 걸면 넓은 화면에서 배경 띠가 화면 중앙만 덮어 스크롤 시 끊긴다.
       바깥은 화면 전폭(배경 유지) · 안쪽 내용만 상한 안에서 가운데 정렬.
     ★ 이 블록은 각 바의 자체 padding 선언보다 뒤에 와야 한다(동일 특이성 → 나중 선언이 이김).
     전체화면 모드는 표에 최대 폭을 주는 모드라 상한을 푼다(none 은 calc 에서 못 쓰므로 100vw). */
  .top    {padding-inline:max(18px, calc((100% - var(--app-max)) / 2))}
  .tb1    {padding-inline:max(14px, calc((100% - var(--app-max)) / 2))}
  .tb2    {padding-inline:max(12px, calc((100% - var(--app-max)) / 2))}
  .wrap   {padding-inline:max( 0px, calc((100% - var(--app-max)) / 2))}
  .ovwrap {padding-inline:max(22px, calc((100% - var(--app-max)) / 2))}
  body[data-vw="fhd"]{--app-max:1920px}   /* :root 기본값과 같은 값을 body 에도 명시 — 상한이 :root 한 줄에만 매달리지 않게 */
  body[data-vw="qhd"]{--app-max:2560px}
  body.widemode{--app-max:100vw}

  /* 좌우 슬라이딩 2단 스위치(FHD ↔ QHD). 라벨 폭을 44px 로 고정해야 노브 이동거리가 정확히 한 칸 */
  .vwsw{position:relative;display:inline-flex;align-items:center;background:var(--card2);border:1px solid var(--line);
    border-radius:9px;padding:3px;cursor:pointer;user-select:none;flex:none}
  .vwsw b{position:relative;z-index:1;width:44px;text-align:center;line-height:26px;
    font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--faint);transition:color .16s}
  .vwsw .vwknob{position:absolute;top:3px;left:3px;width:44px;height:26px;border-radius:7px;background:var(--accent);
    box-shadow:0 1px 3px rgba(37,99,235,.34);transition:transform .18s cubic-bezier(.4,0,.2,1)}
  .vwsw[data-on="qhd"] .vwknob{transform:translateX(44px)}
  .vwsw[data-on="fhd"] b:nth-of-type(1),
  .vwsw[data-on="qhd"] b:nth-of-type(2){color:#fff}
  .vwsw:hover{border-color:var(--accent-line)}
  .vwsw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media(prefers-reduced-motion:reduce){.vwsw .vwknob{transition:none}}

  /* 모집공고 카드를 담는 컨테이너 너비 상한 — 카드 자체(min 258px, admin.html 과 공유하는
     js/campaign-cards.js 의 .pcards-grid.pc-admin)는 그대로 두고, 그 카드를 품는 공간만 여기서
     제한한다. auto-fill 은 "컨테이너 폭 안에 258px+gap 이 몇 번 들어가는지"로 열 수를 정하므로,
     컨테이너를 5열이 딱 들어가는 폭으로 고정하면 화면이 아무리 넓어져도 항상 5장/줄이고
     남는 폭은 자동으로 오른쪽 여백이 된다(별도 스페이서 불필요, C/S 대화창과 같은 원리).
     ★ 이 컨테이너 하나만 캡을 걸 뿐 .pcards-grid.pc-admin 규칙 자체는 안 건드린다 — 관리자
       대시보드(admin.html)의 모집공고 탭은 같은 셀렉터를 그대로 쓰므로 사본 없이 무영향 유지.
     계산: 5×258px(카드 최소폭) + 4×12px(열 간격) = 1338px(5열이 들어가는 최소폭).
     1380px 로 살짝 여유를 둬 카드가 딱 5장 들어가면서도 약간(≈8px/장) 늘어나
     "현재 실제 적용된 사이즈"에서 크게 벗어나지 않게 했다. 1608px(6×258+5×12) 이상이면
     6열로 넘어가므로 그 문턱은 절대 넘지 않는다. */
  #recruitListWrap{max-width:1380px}

  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}

  table.ovtable thead th{background:var(--card2);text-align:left;padding:9px 11px;font-size:10.5px;color:var(--muted);font-weight:750;white-space:nowrap;position:sticky;top:0}
  table.ovtable td{padding:8px 11px;border-top:1px solid var(--line);white-space:nowrap} table.ovtable tbody tr:hover{background:var(--card2)}

  table.lgtable tbody tr:hover td{background:#f7faff}
  /* 폭: 짧은 항목은 고정·안 줄바꿈, 긴 설명(오류내용·조치안내)만 줄바꿈해 늘어남 */
  .lgtable .c-sev{width:64px;white-space:nowrap} .lgtable .c-ts{width:118px;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
const API_BASE = (function(){ if (window.REVIEW_API_URL) return window.REVIEW_API_URL; if (location.hostname==='localhost') return 'http://localhost:3000'; return 'https://sublime-magic-production-790b.up.railway.app'; })();
// 토큰 핸드오프 2경로: ① 인트라넷 SSO(#sso=<token> 프래그먼트, 크로스오리진이라 URL 경유 — 도착 즉시 저장 후
//   주소창에서 제거, 새 신원 도착이므로 기존 세션 덮어씀) ② admin.html raw_sso(localStorage, 기존 세션 존중).
// ── 리뷰어 로그 → 작업대 딥링크(#go=) 수신 ──
//   ★ initToken 보다 반드시 먼저 읽는다: #sso= 가 함께 오면 initToken이 해시 전체를 지우기 때문.
//   여기서는 읽기만 하고 지우지 않는다(뒤따르는 #sso=/#adv= 핸들러가 같은 해시를 봐야 함) —
//   실제 제거는 소비 시점(_consumeGo)에서 한다.
let _GO=null, _VIEW='';
(function initGoLink(){
  try{
    const m=(location.hash||'').match(/[#&]go=([^&]+)/);
    if(m){ const o=JSON.parse(decodeURIComponent(m[1]));
      if(o && typeof o==='object' && o.s && o.t) _GO=o; }   // {s:sheetId, t:tabName, g:tabGid, p:phone8, n:이름}
  }catch(_){ _GO=null; }
  // #view=logs — 대시보드 중요알림 요약 카드에서 '리뷰어 로그' 뷰로 바로 진입(초기 뷰 지정만)
  try{ const vm=(location.hash||'').match(/[#&]view=(\w+)/); if(vm) _VIEW=vm[1]; }catch(_){ }
})();
(function initToken(){
  try{   // ① #sso — 디코드 실패해도 raw_sso 폴백이 죽지 않게 분리 try
    const m=(location.hash||'').match(/[#&]sso=([^&]+)/);
    if(m){ let t=null; try{ t=decodeURIComponent(m[1]); }catch(_){ }
      try{ history.replaceState(null,'',location.pathname+location.search); }catch(_){ }
      if(t){ sessionStorage.setItem('admin_token', t); return; } }
  }catch(_){ }
  try{   // ② raw_sso(관리자 핸드오프) — 기존 세션 존중. 만료 토큰은 재주입하지 않고 폐기(유령 세션 방지).
    const raw=localStorage.getItem('raw_sso'); if(raw){ const sso=JSON.parse(raw);
      if(sso&&sso.token&&!sessionStorage.getItem('admin_token')){
        const p=parseJwt(sso.token);
        if(p&&p.exp&&p.exp*1000<Date.now()) localStorage.removeItem('raw_sso');
        else sessionStorage.setItem('admin_token', sso.token);
      } }
  }catch(_){ }
})();
function token(){ return sessionStorage.getItem('admin_token') || ''; }
// 만료/거부 토큰 정리 — "만료 배지 + 빈 목록" 유령 화면 대신 로그인으로. raw_sso 재주입 루프도 차단.
function _dropSession(msg){ sessionStorage.removeItem('admin_token'); try{ localStorage.removeItem('raw_sso'); }catch(_){ }
  STATE.role=''; STATE.name=''; renderLogin(); if(msg){ const el=$('#lerr'); if(el) el.textContent=msg; } }
async function api(path, opts){ const o=Object.assign({headers:{}},opts||{}); o.headers['Authorization']='Bearer '+token(); if(o.body)o.headers['Content-Type']='application/json';
  const r=await fetch(API_BASE+path,o);
  if(r.status===401 && token() && path.indexOf('login')===-1){   // 서버가 토큰 거부(만료 등) — 재로그인 유도
    _dropSession('세션이 만료되었습니다. 다시 로그인하세요. (인트라넷에서 "통합 작업대" 버튼으로 오면 자동 로그인)');
    return new Promise(()=>{});   // 종결 상태: 화면이 로그인으로 교체됐으므로 대기 중이던 렌더 콜백을 영구 보류(사라진 요소 접근 차단)
  }
  return r.json(); }
const $=(s,el)=>(el||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function parseJwt(t){ try{ const b=atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')); return JSON.parse(new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)))); }catch(_){ return {}; } }   // base64url + UTF-8(한글 이름) 정상 디코드
// ── Clarity 키트 헬퍼 ──
// KPI 도넛 게이지(r=18, 둘레≈113). cls: ''(블루)/'g-safe'/'g-warn'
function gaugeSvg(pct, label, cls){ const p=Math.max(0,Math.min(100,Math.round(pct||0)));
  return `<span class="gauge ${cls||''}"><svg width="44" height="44"><circle class="trk" cx="22" cy="22" r="18"/><circle class="bar" cx="22" cy="22" r="18" style="stroke-dashoffset:${(113*(1-p/100)).toFixed(1)}"/></svg><span class="pct">${esc(label!=null?label:p+'%')}</span></span>`; }
// 탭명 파싱 v2: "7/3(쿠팡)디아쉬끄_퀵픽싱 헤어틴트 50건" → 채널·목표건수·차수 + 브랜드·상품·바이럴.
// 관제실(어니스트캄x인애드 업무포털) 컬럼(브랜드|상품|채널|차수|건수)을 탭명에서 근사 추출 — 비정형은 미표시(fail-soft).
// 브랜드 = 첫 '_' 세그먼트(날짜·채널 제거 후): "0604엘시스테인_화이트닝코렉터크림100건" → 엘시스테인/화이트닝코렉터크림.
const _TAB_CHANNELS=['쿠팡','네이버','스마트스토어','메이커스','톡스토어','카카오','컬리','마켓컬리','공영쇼핑','올리브영','W컨셉','무신사','지그재그','에이블리','오늘의집','11번가','지마켓','옥션','티몬','위메프','SSG','롯데온'];
function parseTabMeta(name){ const s=String(name||''); const m={};
  const ch=s.match(/\(([^)]{1,10})\)/); if(ch&&!/^\d/.test(ch[1])) m.channel=ch[1].trim();
  const cnt=s.match(/(\d{1,4})\s*건/); if(cnt) m.count=parseInt(cnt[1],10);
  const rnd=s.match(/(\d{1,2})\s*차(?![수선])/); if(rnd) m.round=rnd[1]+'차';
  if(/바이럴|체험단|카페\s*\/\s*(블로그|커뮤)/.test(s)) m.viral=true;
  // 브랜드/상품: (채널)·선행날짜(7/3, 0612)) 제거 → '_' 분해 → 세그 꼬리(건수·차수·바이럴 채널어) 정리
  const core=s.replace(/\([^)]{0,10}\)/g,' ')
    .replace(/^\s*\d{1,2}\s*\/\s*\d{1,2}\s*[).\-]?/,'')
    .replace(/^\s*\d{4}\s*[).\-]?/,'').trim();
  let segs=core.split(/_+/).map(x=>x.trim()).filter(Boolean);
  if(segs.length&&_TAB_CHANNELS.includes(segs[0])){ if(!m.channel)m.channel=segs[0]; segs=segs.slice(1); }
  segs=segs.map(x=>x
    .replace(/\d{1,4}\s*건.*$/,'')
    .replace(/(\s*\/?\s*(카페|블로그|커뮤니티|커뮤|바이럴|체험단))+\s*$/,'')
    .replace(/\s*\d{1,2}\s*차(?![수선])\s*$/,'')
    .trim()).filter(Boolean);
  if(segs.length>=2){ if(segs[0].length<=14){ m.brand=segs[0]; m.product=segs.slice(1).join(' '); } else m.product=segs.join(' '); }
  else if(segs.length===1&&(m.channel||m.count||m.viral)) m.product=segs[0];   // 차수만으론 상품 추정 안 함(탭명 중복 노출 방지)
  return m; }

let STATE = { role:'', name:'', view:'workdesk', tabs:[], cur:null, wd:null, freezeUpto:null,
              favs:null, _favLoaded:false,   // 작업목록 즐겨찾기(localStorage 영속)
              railTab:'thread',              // 우측 레일 탭(기본=협업/댓글)
              ov:[], ovq:'', pendingTab:null, lastBatch:null,
              advs:[], advCur:null, tabIndex:{}, sheetMap:{}, addMode:'all', addSheet:null, addTabs:{},
              ownTabs:[], ownBrand:null, ownBrandList:[],     // 연결탭 목록 + 브랜드 필터(null=전체, ''=미분류)
              ownSettle:{}, ownSettleFor:null,                // 연결탭 정산 요약(비동기 필, 업체 전환 경합 가드)
              // ── 작업대 그리드 뷰 상태(클라이언트 전용, 탭 전환 시 초기화) ──
              gFilters:{}, gHidden:new Set(), gGroupBy:null, gCollapsed:new Set(), gSort:null, gSelCols:[],
              settleOpen:false, _gMenuCol:null, _gMenuInit:false, _gDragInit:false };

async function boot(){
  _applyVwMode();   // 로그인 화면부터 상한 적용(셸 렌더 전에도 body[data-vw] 세팅 — 스위치는 셸에서 다시 동기화)
  // 광고주 전용 접속 링크(#adv=<token>) — 로그인 없이 유효 토큰을 advertiser JWT 로 교환(프래그먼트라 서버로그·Referer 미유출).
  const advm=(location.hash||'').match(/[#&]adv=([^&]+)/);
  if(advm){ let t=null; try{ t=decodeURIComponent(advm[1]); }catch(_){ }
    try{ history.replaceState(null,'',location.pathname+location.search); }catch(_){ }
    if(t){ const r=await fetch(API_BASE+'/api/trackb/advertiser-link-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t})}).then(x=>x.json()).catch(()=>null);
      if(r&&r.success&&r.token){ sessionStorage.setItem('admin_token', r.token); }
      else if(r&&r.requiresLogin){ return renderLogin('🔒 '+(r.advertiserName||'이 업체')+' 전용 접속 — 발급받은 계정으로 로그인하세요.'); }   // 계정 있는 업체 = 링크가 로그인 게이트
      else return renderLogin('접속 링크가 유효하지 않거나 폐기되었습니다. 담당자에게 문의하세요.'); } }
  if (!token()) return renderLogin();
  const me = parseJwt(token()); STATE.role=me.role||''; STATE.name=me.name||'';
  if(me.exp && me.exp*1000 < Date.now())   // 만료 토큰 → 만료 신원 배지+빈 목록 유령 화면 대신 즉시 재로그인
    return _dropSession('세션이 만료되었습니다. 다시 로그인하세요. (인트라넷에서 "통합 작업대" 버튼으로 오면 자동 로그인)');
  if(!STATE.role){ sessionStorage.removeItem('admin_token'); return renderLogin(); }   // 깨진/위조 토큰 → 빈 셸 대신 로그인
  _consumeGo();   // 리뷰어 로그 딥링크 → 작업대 탭 + 해당 리뷰어 행 지정(셸 렌더 전에 세팅해야 loadTabs가 집어감)
  // #view=logs(대시보드 요약 카드에서 진입) — admin/staff만 로그 뷰 노출. 그 외/미지정은 기존 기본 뷰.
  if(_VIEW==='logs' && (STATE.role==='master'||STATE.role==='admin'||STATE.role==='staff')){ STATE.view='logs';
    try{ history.replaceState(null,'',location.pathname+location.search); }catch(_){ } }
  renderShell();
}
// 딥링크 소비: 열 탭과 강조할 리뷰어를 예약하고 주소창에서 해시를 제거(새로고침 시 재발동·URL 공유로 PII 유출 방지).
//   ★ 권한은 여기서 판단하지 않는다 — 새 탭도 평소와 똑같이 /api/trackb/tabs·/workdesk 를 호출하고
//     서버의 canAccessTab 스코프 검증을 그대로 통과해야 하므로, 링크를 손으로 만들어도 권한이 넓어지지 않는다.
function _consumeGo(){
  if(!_GO) return;
  const g=_GO; _GO=null;
  STATE.view='workdesk';
  STATE.pendingTab={ sheetId:g.s, tabName:g.t, tabGid:g.g||'', spreadsheetTitle:g.st||'' };
  STATE.pendingFocus={ phone8:String(g.p||''), name:String(g.n||'') };
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(_){ }
}
function renderLogin(msg){
  $('#app').innerHTML = `<div class="loginbox"><h2>통합 작업대 로그인</h2>

// ── 화면 폭 상한 모드 (FHD 1920 / QHD 2560) ──────────────────────────────────────
//   순수 표시 설정이라 서버·계정과 무관하게 localStorage 로만 저장한다(브라우저=모니터 1:1 대응).
//   저장값이 없거나 읽기 실패면 FHD — 좁은 쪽이 안전한 기본값(QHD 기본이면 FHD 모니터에서 상한이 무의미해진다).
const VW_KEY='wd_viewport_mode';
function _vwMode(){ try{ return localStorage.getItem(VW_KEY)==='qhd' ? 'qhd' : 'fhd'; }catch(_){ return 'fhd'; } }
function _applyVwMode(){
  const m=_vwMode();
  document.body.dataset.vw=m;
  const sw=document.getElementById('vwToggle');
  if(sw){ sw.dataset.on=m; sw.setAttribute('aria-checked', m==='qhd'?'true':'false'); }
}
function setVwMode(m){
  try{ localStorage.setItem(VW_KEY, m==='qhd'?'qhd':'fhd'); }catch(_){ }
  _applyVwMode();
  _measureChrome();   // 상한 변경 → .top 줄바꿈이 달라질 수 있음(--toph 재실측). 표폭은 고정이라 _fitGrid 불필요
}
function toggleVwMode(){ setVwMode(_vwMode()==='qhd' ? 'fhd' : 'qhd'); }
function switchView(v){ STATE.view=v; document.querySelectorAll('.navb').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  const rt=$('#railToggle'); if(rt) rt.style.display=(v==='workdesk')?'':'none';   // 레일은 작업대 뷰에만 존재
  const wt=$('#wideToggle'); if(wt) wt.style.display=(v==='workdesk')?'':'none';   // 전체화면 토글도 작업대 뷰에만
  if(v==='ownership') renderOwnershipView(); else if(v==='overview') renderOverviewView(); else if(v==='logs') renderLogsView(); else if(v==='reviewers') renderReviewersView(); else if(v==='cs') renderCsView(); else if(v==='orders') renderOrdersView(); else if(v==='campaigns') renderCampaignsView(); else renderWorkdeskView();
  if(v!=='workdesk') _measureChrome();   // 작업대를 떠나면 작업바가 사라짐 → --tbh 0으로 회수(다른 뷰 높이 계산 오염 방지)
}

// ── 상단 작업바 1·2단: 마우스 휠로 좌우 이동 ──
//   가로 스크롤 영역이라 세로 휠은 원래 아무 일도 안 한다(트랙패드만 가로 제스처 가능) → 휠 아래=오른쪽, 위=왼쪽으로 변환.
//   ★ 양 끝에 닿았거나 넘칠 게 없으면 preventDefault 하지 않는다 — 그래야 페이지 세로 스크롤이 이 줄에 갇히지 않는다.
function _bindWheelScroll(){
  ['segwrap','tb2'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el || el._wheelBound) return;   // 컨테이너는 재렌더로 새로 생기므로 엘리먼트 자체에 표시
    el._wheelBound=true;
    el.addEventListener('wheel', e=>{
      if(e.ctrlKey) return;                                   // 확대/축소 제스처는 브라우저에 양보
      if(Math.abs(e.deltaX)>Math.abs(e.deltaY)) return;       // 트랙패드 가로 스크롤은 네이티브가 처리
      const max=el.scrollWidth-el.clientWidth;
      if(max<=1) return;                                      // 넘칠 게 없음 → 페이지 스크롤 양보
      const unit=(e.deltaMode===1)?16:((e.deltaMode===2)?el.clientWidth:1);   // 줄/페이지 단위 휠 보정
      const before=el.scrollLeft;
      const next=Math.max(0, Math.min(max, before + e.deltaY*unit));
      if(next===before) return;                               // 이미 끝 → 페이지 스크롤 양보(가둠 방지)
      el.scrollLeft=next; e.preventDefault();
    }, {passive:false});
  });
}

// ── 헤더/작업바 높이 실측 → CSS 변수(--toph/--tbh) ──
//   .top은 flex-wrap이라 역할·화면폭에 따라 줄바꿈되고, 작업바 높이도 세그먼트 스크롤바 유무로 달라진다.
//   상수로 두면 ① 작업바가 헤더 뒤로 숨거나 ② .gridscroll 높이가 어긋난다 → 실제 offsetHeight로 덮어쓴다.
//   전체화면(작업바 display:none)이면 offsetHeight가 0이라 별도 분기 없이 그대로 0이 된다.
function _measureChrome(){
  try{
    const root=document.documentElement;
    const top=document.querySelector('.top'), tb=document.getElementById('taskbar');
    if(top) root.style.setProperty('--toph', (top.offsetHeight||57)+'px');
    root.style.setProperty('--tbh', ((tb&&tb.offsetHeight)||0)+'px');
  }catch(_){ }
}
let _chromeRO=null;
function _watchChrome(){
  _measureChrome();
  try{
    if(typeof ResizeObserver!=='function') return;
    if(_chromeRO) _chromeRO.disconnect();
    _chromeRO=new ResizeObserver(()=>_measureChrome());
    const top=document.querySelector('.top'), tb=document.getElementById('taskbar');
    if(top) _chromeRO.observe(top);
    if(tb) _chromeRO.observe(tb);
  }catch(_){ }
}
window.addEventListener('resize', _measureChrome);

// ── 우측 사이드바(레일) 숨기기/표시 — 브라우저 로컬 영속(레이아웃 취향, 재접속·탭전환 유지) ──
function _railHidden(){ try{ return localStorage.getItem('wd_rail_hidden_v1')==='1'; }catch(_){ return false; } }
function _syncRailToggle(){ const b=$('#railToggle'); if(!b) return; const hidden=_railHidden();
  b.textContent = hidden ? '◧ 사이드바 표시' : '◨ 사이드바 숨기기';
  b.setAttribute('aria-pressed', hidden?'true':'false'); }
function toggleRail(){ const hidden=!_railHidden();
  try{ localStorage.setItem('wd_rail_hidden_v1', hidden?'1':'0'); }catch(_){}
  const w=$('#wrap'); if(w) w.classList.toggle('railhidden', hidden);
  _syncRailToggle(); _fitGrid();   // 레일 토글=그리드 컨테이너 폭 변경 → 표폭 재계산
}

// ── 전체화면(전체폭) 모드 — 상단 작업바·우 레일을 숨겨 표에 화면을 모두 할애. 브라우저 전체화면(Fullscreen API)도 함께 요청, Esc로 나가면 레이아웃도 동기 해제. 레이아웃 상태는 로컬 영속(재접속·뷰전환 유지). ──
let _fsByWide=false;   // 이 전체화면이 '전체모드 버튼'으로 켠 것인지 표시(무관한 브라우저 전체화면 종료가 레이아웃을 끄지 않게)
function _wideMode(){ try{ return localStorage.getItem('wd_wide_v1')==='1'; }catch(_){ return false; } }
function _syncWideToggle(){ const on=_wideMode();
  document.body.classList.toggle('widemode', on);   // 상단 작업바는 wrap 밖이라 body 클래스로 숨김(버튼 유무와 무관하게 항상 적용)
  const b=$('#wideToggle'); if(!b) return;
  b.textContent = on ? '⛶ 전체화면 해제' : '⛶ 전체화면';
  b.setAttribute('aria-pressed', on?'true':'false');
}
function _applyWide(on){
  try{ localStorage.setItem('wd_wide_v1', on?'1':'0'); }catch(_){}
  const w=$('#wrap'); if(w) w.classList.toggle('widemode', on);
  _syncWideToggle(); _measureChrome(); _fitGrid();   // 패널 숨김=컨테이너 폭·높이 변경 → 실측 후 표폭 재계산
}
function toggleWide(){ const on=!_wideMode();
  _applyWide(on);
  try{
    if(on){
      if(!document.fullscreenElement && document.documentElement.requestFullscreen){
        _fsByWide=true; document.documentElement.requestFullscreen().catch(()=>{ _fsByWide=false; });
      }
    }else{
      if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
      _fsByWide=false;
    }
  }catch(_){}
}
document.addEventListener('fullscreenchange', ()=>{   // 브라우저 전체화면을 Esc로 나가면(=버튼으로 켠 경우만) 레이아웃도 해제
  if(!document.fullscreenElement){ if(_fsByWide && _wideMode()) _applyWide(false); _fsByWide=false; }
});

async function loadTabs(){
  const r = await api('/api/trackb/tabs?limit=300');
  if(!r||!r.ok){ const b=$('#tb2'); if(b) b.innerHTML=`<span class="b2empty">작업 목록은 관리자 로그인에서 제공됩니다.</span>`; return; }
  STATE.tabs=r.tabs||[];
  _renderTabList();          // 계정별 캐시로 즉시 렌더
  refreshUnseen();           // 미확인(스레드) 배지 최초 조회 — 도착 시 재렌더
  _favSyncFromServer();      // 서버 원본으로 정렬(개인화·기기 무관) — 도착 시 재렌더
  // 관측 대시보드에서 "열기"로 넘어온 탭 자동 선택
  if(STATE.pendingTab){ const pt=STATE.pendingTab; STATE.pendingTab=null;
    const idx=STATE.tabs.findIndex(t=>t.sheetId===pt.sheetId&&t.tabName===pt.tabName);
    if(idx>=0) selTab(idx); else { STATE.tabs.push(pt); selTab(STATE.tabs.length-1); } }
}
// ── 작업목록 즐겨찾기(로그인 계정별 개인화·영속) ──
//   서버 원본(/api/trackb/workdesk/favorites, 계정 귀속) + 계정별 localStorage 캐시(즉시 렌더·오프라인 폴백).
function _favUser(){ return (STATE.name||'').trim()||'_'; }
function _favLSKey(){ return 'wd_favs_v2_'+_favUser(); }
function _favLoad(){ try{ return new Set(JSON.parse(localStorage.getItem(_favLSKey())||'[]')); }catch(_){ return new Set(); } }
function _favSaveLocal(){ try{ localStorage.setItem(_favLSKey(), JSON.stringify([...(STATE.favs||[])])); }catch(_){ } }
function _favKey(t){ return (t.sheetId||'')+'␟'+(t.tabName||'')+'␟'+(t.tabGid||''); }
function isFav(t){ return !!(STATE.favs && STATE.favs.has(_favKey(t))); }
async function _favSyncFromServer(){   // 부팅 시 서버 원본으로 정렬 — 개인화·기기 무관 유지
  try{ const r=await api('/api/trackb/workdesk/favorites');
    if(r&&r.ok&&Array.isArray(r.favorites)){ STATE.favs=new Set(r.favorites); STATE._favLoaded=true; _favSaveLocal(); _renderTabList(); }
  }catch(_){ }
}
async function _favPushServer(){ try{ await api('/api/trackb/workdesk/favorites',{method:'POST',body:JSON.stringify({favorites:[...(STATE.favs||[])]})}); }catch(_){ } }
function toggleFav(ev,i){ if(ev) ev.stopPropagation(); const t=STATE.tabs[i]; if(!t) return; const k=_favKey(t);
  if(STATE.favs.has(k)) STATE.favs.delete(k); else STATE.favs.add(k);
  _favSaveLocal(); _renderTabList(); _favPushServer();   // 즉시 로컬 캐시+렌더 → 서버에 계정 귀속 영속
}
// ── 업체(1단 세그먼트) 즐겨찾기 — 즐겨찾기한 업체가 왼쪽 우선 정렬 ──
//   저장은 탭 즐겨찾기와 같은 원장(서버가 문자열 배열을 그대로 보관)에 '@adv␟' 접두로 넣는다 →
//   서버 변경 0으로 계정 귀속·기기 무관 영속을 그대로 얻고, 탭 키(sheetId␟탭명␟gid)와는 절대 겹치지 않는다
//   (시트ID는 '@'로 시작할 수 없음).
function _advFavKey(name){ return '@adv␟'+String(name==null?'':name); }
function isAdvFav(name){ return !!(STATE.favs && STATE.favs.has(_advFavKey(name))); }
function toggleAdvFav(ev, el){
  if(ev) ev.stopPropagation();   // 별 클릭이 세그먼트 선택으로 번지지 않게
  const seg=el&&el.closest?el.closest('.seg'):null; if(!seg) return;
  const name=seg.dataset.k; if(name==null || name==='' || name===W_FAV) return;   // 미지정·즐겨찾기 그룹은 대상 아님
  const k=_advFavKey(name);
  if(STATE.favs.has(k)) STATE.favs.delete(k); else STATE.favs.add(k);

    ${isMaster?`<span class="sp" style="flex:1"></span>${flipBtn}<button class="btn" onclick="showWritebackSim()" title="이 탭 편집이 시트에 반영된다면 무엇이 바뀔지 미리보기 (시뮬레이션 · 실제 시트 무접촉)">write-back 시뮬</button><button class="btn" id="projBtn" onclick="projectCur()">그림자 투영(새로고침)</button>`:''}</div>
    ${summaryStrip(wd,d,m,c)}
    <div class="setldetail" id="setldetail"${STATE.settleOpen?'':' hidden'}><div id="settlementsec"></div></div>
    ${renderWorkOrderSection(wd)}
    <div id="gridhost">${tableSection}</div>`;
  _scheduleBodyFlush();   // 청크 렌더: 나머지 행을 프레임마다 append(대형 표 첫 화면 즉시)
  // 딥링크 강조: 첫 청크 안에 대상이 있으면 즉시, 없으면 flush 진행/완료 시점에 다시 시도.
  //   남은 청크가 없을 때(작은 표)는 여기서 바로 '못 찾음'까지 확정한다.
  _applyPendingFocus(!STATE._pendingBody);
  if(gridMode) _fitGrid();   // 표폭 = 고정폭 합
  if(!STATE._fitResizeBound){ STATE._fitResizeBound=true; let t=null;
    window.addEventListener('resize',()=>{ clearTimeout(t); t=setTimeout(()=>{ if(STATE.wd&&(STATE.canEdit||STATE.role==='advertiser')) _fitGrid(); },120); }); }
  loadSettlement(STATE.cur);
  loadThread(STATE.cur);   // 협업/댓글 → 우측 레일 [협업/댓글] 탭에 렌더
}

// ── 시안 A: 상단 요약 미니 셀 스트립(상품/모집/구매시간/배송 + 참여·제출·입금 + 정산 통합) ──
function summaryStrip(wd,d,m,c){
  const target=(d.recruitCount&&+d.recruitCount)||parseTabMeta(STATE.cur.tabName).count||c.total||0;
  const pT=target?Math.round((c.total||0)/target*100):0, pS=c.total?Math.round((c.submitted||0)/c.total*100):0, pP=c.total?Math.round((c.paid||0)/c.total*100):0;
  const meta=[['상품',d.productOption||m.campaignName||'—'],['모집',(d.recruitCount||'—')+(m.manager?(' · '+m.manager):'')],['구매시간',d.purchaseTime||'자율'],['배송',d.deliveryType||m.deliveryType||'—']]
    .map(([k,v])=>`<div class="mcell"><div class="k">${esc(k)}</div><div class="v" title="${esc(v)}">${esc(v)}</div></div>`).join('');
  const kpi=`<div class="mcell kpi"><div class="k">참여자${target&&target!==c.total?` / 목표 ${target}`:''}</div><div class="v">${c.total||0}${target&&target!==c.total?`<small>/ ${target}</small>`:''}<span class="spct acc">${pT}%</span></div></div>`
    +`<div class="mcell kpi s"><div class="k">제출완료</div><div class="v">${c.submitted||0}<small>/ ${c.total||0}</small><span class="spct safe">${pS}%</span></div></div>`
    +`<div class="mcell kpi p"><div class="k">입금완료</div><div class="v">${c.paid||0}<small>/ ${c.total||0}</small><span class="spct acc">${pP}%</span></div></div>`;
  const setl=`<div class="mcell setl${STATE.settleOpen?' open':''}" id="setlCell" onclick="toggleSettleDetail()"><div class="k">정산</div><div class="v"><span class="setlsummary" style="color:var(--faint)">불러오는 중…</span><span class="caret">▼</span></div></div>`;
  return `<div class="stripA">${meta}${kpi}${setl}</div>`;
}
// 정산 미니 셀 클릭 → 하단 상세(스텝퍼) 펼침/접기
function toggleSettleDetail(){ STATE.settleOpen=!STATE.settleOpen; const dt=$('#setldetail'); if(dt) dt.hidden=!STATE.settleOpen; const c=$('#setlCell'); if(c) c.classList.toggle('open',STATE.settleOpen); }
// 스트립 정산 셀 요약(로드 상태별) — 상세는 #settlementsec(펼침 시)
function setlSummaryHtml(d){
  if(!d) return `<span class="setlsummary" style="color:var(--faint)">불러오는 중…</span>`;
  if(d.hidden) return `<span class="setlsummary"><span class="schip">비공개</span></span>`;
  if(!d.linked) return `<span class="setlsummary"><span class="schip warn">미연결</span><span style="color:var(--faint);font-weight:500">계약 연결 필요</span></span>`;
  const st=_setlStage(d);
  return `<span class="setlsummary">${d.contractNumber?`<span class="schip ok">${esc(d.contractNumber)}</span>`:''}${d.amount!=null?`<span>${_wonFmt(d.amount)}</span>`:''}<span class="schip ${st.tone}">${esc(st.label)}</span></span>`;
}
function _setlStage(d){
  const q=d.quote,inv=d.invoice,pay=d.payment,co=d.closeout;
  if(pay&&pay.status==='paid') return {label:'입금완료',tone:'safe'};
  if(inv&&inv.status==='issued') return {label:'계산서 발행',tone:'ok'};
  if(q&&q.status==='accepted') return {label:'견적 수락',tone:'ok'};
  if(q&&q.quoteNumber) return {label:'견적 진행',tone:'warn'};
  if(co&&co.date) return {label:'견적 대기',tone:'warn'};
  return {label:'준비중',tone:''};
}
// ══ P2 정산 파이프라인 스텝퍼 ══
const _SETTLE_PAY={unpaid:['미입금','bad'],partial:['부분입금','warn'],paid:['입금완료','safe']};
const _SETTLE_INV={not_issued:['미발행','warn'],issued:['발행완료','safe'],requested:['발행요청','warn']};
const _SETTLE_Q={draft:['작성중','warn'],sent:['발송','ok'],accepted:['수락','safe'],rejected:['반려','bad'],expired:['만료','bad']};
function _wonFmt(n){ return (Number(n)||0).toLocaleString('ko-KR')+'원'; }
async function loadSettlement(t){
  if(!t) return; const box=$('#settlementsec'); if(!box) return;
  const r=await api(`/api/trackb/workdesk/settlement?sheetId=${encodeURIComponent(t.sheetId)}&tabName=${encodeURIComponent(t.tabName)}`).catch(()=>null);
  if(!r||!r.ok){ box.innerHTML=''; const cs=$('#setlCell .setlsummary'); if(cs) cs.outerHTML='<span class="setlsummary" style="color:var(--faint)">정산 정보 없음</span>'; return; }
  STATE.settle={ data:r, tab:t }; renderSettlement();
}
function _step(n,label,state,sub){ // state: 'done'|'wait'|'off'
  const ic=state==='done'?'✓':(state==='wait'?'…':'—');
  return `<div class="stpstep ${state}"><div class="stpic">${ic}</div><div class="stpmeta"><div class="stpk">${esc(label)}</div><div class="stpv">${sub||'<span class="stpoff">—</span>'}</div></div></div>`;
}
function renderSettlement(){
  const st=STATE.settle; if(!st) return; const box=$('#settlementsec'); if(!box) return; const d=st.data;
  const cellS=$('#setlCell .setlsummary'); if(cellS) cellS.outerHTML=setlSummaryHtml(d);   // 스트립 정산 셀 동기화
  const canLink=STATE.role!=='advertiser';
  if(d.hidden){ box.innerHTML=`<div class="sect" style="margin-top:16px"><div class="st">정산</div><div class="stpcard"><div class="empty" style="padding:16px">정산 정보는 비공개로 설정되어 있습니다.</div></div></div>`; return; }
  if(!d.linked){
    box.innerHTML=`<div class="sect" style="margin-top:16px"><div class="st">정산</div>
      <div class="stpcard nolink"><div class="stpnl"><b>연결된 계약이 없습니다.</b><span>인트라넷 계약(C-번호)을 연결하면 견적·계산서·입금 상태가 여기 표시됩니다.</span></div>
      ${canLink?`<button class="btn pri" onclick="openLinkModal()">계약 연결</button>`:''}</div></div>`;
    return;
  }
  const co=d.closeout, q=d.quote, inv=d.invoice, pay=d.payment;
  const coAvail=d.closeoutAvailable!==false;   // 데이터 원천(P3) 있으면 생성/CSV 어포던스
  const coState=!coAvail?'off':(co&&co.date?'done':'wait');
  const coSub=!coAvail?'<span class="stpoff">준비중</span>'
    :(co&&co.date
      ?`${esc(String(co.date).slice(0,10))} · ${co.rowCount||0}건 · <a href="#" onclick="dlCloseoutCsv(event)">CSV</a>${canLink?` · <a href="#" onclick="genCloseout(event)">재생성</a>`:''}`
      :(canLink?'<a href="#" onclick="genCloseout(event)">마감자료 생성</a>':'<span class="stpoff">미생성</span>'));
  const qSub=q&&q.quoteNumber?`${esc(q.quoteNumber)}${q.status?` · <span class="bb ${(_SETTLE_Q[q.status]||['',''])[1]}">${(_SETTLE_Q[q.status]||[q.status])[0]}</span>`:''}`:'<span class="stpoff">견적 없음</span>';
  const invSub=inv?`<span class="bb ${(_SETTLE_INV[inv.status]||['','neutral'])[1]||'neutral'}">${(_SETTLE_INV[inv.status]||[inv.status])[0]}</span>${inv.date?` · ${esc(String(inv.date).slice(0,10))}`:''}`:'<span class="stpoff">—</span>';
  const paySub=pay?`<span class="bb ${(_SETTLE_PAY[pay.status]||['','neutral'])[1]||'neutral'}">${(_SETTLE_PAY[pay.status]||[pay.status])[0]}</span>${pay.date?` · ${esc(String(pay.date).slice(0,10))}`:''}`:'<span class="stpoff">—</span>';
  box.innerHTML=`<div class="sect" style="margin-top:16px"><div class="st">정산 ${d.contractNumber?`<span class="bb ok">${esc(d.contractNumber)}</span>`:''}${d.amount!=null?`<span class="bb">${_wonFmt(d.amount)}</span>`:''}${d.proxyDown?'<span class="bb warn" title="인트라넷 조회 실패 — 라벨만 표시">연동 지연</span>':''}</div>
    <div class="stpcard">
      <div class="stprow">
        ${_step(1,'마감자료',coState,coSub)}
        <div class="stparrow">→</div>
        ${_step(2,'견적서',q&&q.status==='accepted'?'done':(q&&q.quoteNumber?'wait':'off'),qSub)}
        <div class="stparrow">→</div>
        ${_step(3,'계산서',inv&&inv.status==='issued'?'done':(inv?'wait':'off'),invSub)}
        <div class="stparrow">→</div>
        ${_step(4,'입금',pay&&pay.status==='paid'?'done':(pay?'wait':'off'),paySub)}
      </div>
      ${canLink?`<div class="stpfoot"><span class="stpby">연결: ${esc(d.linkedBy||'')}</span><button class="btn xs" onclick="openLinkModal()">계약 변경</button><button class="btn xs" onclick="unlinkSettle()">연결 해제</button></div>`:''}
    </div></div>`;
}
function openLinkModal(){
  const st=STATE.settle; if(!st) return;
  const wrap=document.createElement('div'); wrap.className='modalov'; wrap.id='linkmodal';
  wrap.innerHTML=`<div class="modalbox" style="width:620px"><div class="modalhd"><b>계약 연결</b><button class="btn xs" onclick="closeLinkModal()">닫기</button></div>
    <div class="modalbd"><input id="lksearch" class="ovsearch" style="width:100%" placeholder="C-번호 / 업체명 / 작업명 검색…" oninput="searchSales(this.value)">
    <div id="lkresults" style="margin-top:10px"><div class="empty" style="padding:20px">검색어를 입력하세요.</div></div></div></div>`;
  document.body.appendChild(wrap); wrap.addEventListener('click',e=>{ if(e.target===wrap) closeLinkModal(); });
  setTimeout(()=>{ const el=$('#lksearch'); if(el) el.focus(); },40);
}
function closeLinkModal(){ const m=$('#linkmodal'); if(m) m.remove(); }
let _lkTimer=null;
function searchSales(q){
  clearTimeout(_lkTimer); const box=$('#lkresults'); if(!box) return;
  if(!(q||'').trim()){ box.innerHTML='<div class="empty" style="padding:20px">검색어를 입력하세요.</div>'; return; }
  _lkTimer=setTimeout(async()=>{
    const r=await api('/api/trackb/settlement/sales-search?q='+encodeURIComponent(q.trim())).catch(()=>null);
    if(!r||!r.ok){ box.innerHTML='<div class="empty" style="padding:20px">인트라넷 조회 실패</div>'; return; }
    const items=r.items||[];
    box.innerHTML=items.length?items.map(s=>`<div class="lkrow" onclick="pickSales('${esc(s.salesId)}')">
      <div class="lkinfo"><b>${esc(s.contractNumber||'(번호없음)')}</b><span>${esc(s.advertiserName||'')}${s.productName?' · '+esc(s.productName):''}${s.manager?' · '+esc(s.manager):''}</span></div>
      <div class="lkamt">${s.amount?_wonFmt(s.amount):''}</div></div>`).join(''):'<div class="empty" style="padding:20px">결과 없음</div>';
  },280);
}
async function pickSales(salesId){
  const st=STATE.settle; if(!st) return; const t=st.tab;
  const r=await api('/api/trackb/settlement/link',{method:'POST',body:JSON.stringify({sheetId:t.sheetId,tabName:t.tabName,salesId})});
  if(r&&r.ok){ toast('계약 연결됨'); closeLinkModal(); loadSettlement(t); } else toast((r&&r.error)||'연결 실패');
}
async function unlinkSettle(){
  const st=STATE.settle; if(!st) return; const t=st.tab;
  const r=await api('/api/trackb/settlement/unlink',{method:'POST',body:JSON.stringify({sheetId:t.sheetId,tabName:t.tabName})});
  if(r&&r.ok){ toast('연결 해제'); loadSettlement(t); } else toast((r&&r.error)||'실패');
}
async function toggleSettleVis(advertiserId,visible){
  const r=await api('/api/trackb/settlement/visibility',{method:'POST',body:JSON.stringify({advertiserId,visible})});
  if(r&&r.ok){ toast(visible?'정산 노출 ON':'정산 노출 OFF'); const a=(STATE.advs||[]).find(x=>x.id===advertiserId); if(a) a.settlementVisible=visible; }
  else toast((r&&r.error)||'실패');
}
// P3 마감자료 생성/CSV
let _genBusy=false;
async function genCloseout(e){ if(e)e.preventDefault();
  if(_genBusy) return; _genBusy=true;   // N-3: 더블클릭 중복생성 방지
  const st=STATE.settle; if(!st){ _genBusy=false; return; } const t=st.tab;
  try{
    const r=await api('/api/trackb/settlement/closeout',{method:'POST',body:JSON.stringify({sheetId:t.sheetId,tabName:t.tabName})});
    if(r&&r.ok){ toast(`마감자료 생성 (${r.closeout.rowCount}건)`); loadSettlement(t); } else toast((r&&r.error)||'생성 실패');
  } finally { _genBusy=false; }
}
async function dlCloseoutCsv(e){ if(e)e.preventDefault();
  const st=STATE.settle; if(!st) return; const t=st.tab;
  const url=`/api/trackb/settlement/closeout.csv?sheetId=${encodeURIComponent(t.sheetId)}&tabName=${encodeURIComponent(t.tabName)}`;
  const resp=await fetch(API_BASE+url,{headers:{Authorization:'Bearer '+token()}});
  if(!resp.ok){ let msg='CSV 다운로드 실패'; try{ const j=await resp.json(); if(j&&j.error) msg=j.error; }catch(_){}  toast(msg); return; }   // N-5: 서버 사유 표시
  const blob=await resp.blob(); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`closeout_${t.tabName}.csv`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
}

// ══ 우측 레일 탭 — [협업/댓글](기본) · [Parity]. 레일은 셸에 상주(탭 전환 시 재렌더 안 됨)라 1회 구성 ══
function _ensureRailTabs(){
  const rail=$('#rail'); if(!rail) return;
  if(rail.querySelector('.railtabs')) return;   // 이미 구성됨(패널만 각 loader가 채움)
  rail.innerHTML=`<div class="railtabs">
      <button class="railtab" data-rt="thread" onclick="railTab('thread')">협업/댓글</button>
      <button class="railtab" data-rt="parity" onclick="railTab('parity')">Parity</button>
    </div>
    <div class="railpane" id="railThread"><div class="empty" style="padding:14px">불러오는 중…</div></div>
    <div class="railpane" id="railParity"><div class="empty" style="padding:14px">불러오는 중…</div></div>`;
  railTab(STATE.railTab||'thread');   // 기본 선택 = 협업/댓글
}
function railTab(which){
  STATE.railTab=which;
  const rail=$('#rail'); if(!rail) return;
  rail.querySelectorAll('.railtab').forEach(b=>b.classList.toggle('on', b.dataset.rt===which));
  const th=$('#railThread'), pa=$('#railParity');
  if(th) th.hidden=(which!=='thread'); if(pa) pa.hidden=(which!=='parity');
}
// ══ P1 탭 스레드(협업 코멘트 + 확인요청 + 내부 메모) — 우측 레일 [협업/댓글] 탭 ══
async function loadThread(t){
  if(!t) return; _ensureRailTabs();
  const lb=$('#railThread'); if(lb) lb.innerHTML='<div class="empty" style="padding:14px">불러오는 중…</div>';   // 탭 전환 시 이전 탭 스레드 잔상 제거
  const tb0=document.querySelector('.railtab[data-rt="thread"]'); if(tb0) tb0.textContent='협업/댓글';   // 배지 초기화(로드 후 renderThread가 재설정)
  const r=await api(`/api/trackb/workdesk/thread?sheetId=${encodeURIComponent(t.sheetId)}&tabName=${encodeURIComponent(t.tabName)}`).catch(()=>null);
  const box=$('#railThread'); if(!box) return;
  if(!r||!r.ok){ box.innerHTML='<div class="empty" style="padding:14px">협업/댓글은 준비 중입니다.</div>'; return; }
  STATE.thread={ items:r.items||[], canInternal:!!r.canInternal, tab:t };
  renderThread();
  // 이 탭을 열었으니 목록/헤더 미확인 배지 갱신
  if(typeof refreshUnseen==='function') refreshUnseen();
}
function renderThread(){
  const st=STATE.thread; if(!st) return; const box=$('#railThread'); if(!box) return;
  const items=st.items, ci=st.canInternal;
  const openReq=items.filter(x=>x.kind==='request'&&x.status!=='done').length;
  const rows=items.map(x=>{
    const mine=(x.authorRole===STATE.role)&&(String(x.authorName||'')===String(STATE.name||''));
    const canDel=mine||STATE.role==='master'||STATE.role==='admin';
    const roleLbl={master:'관리자',admin:'관리자',staff:'AE',advertiser:'광고주'}[x.authorRole]||x.authorRole;
    const when=x.createdAt?String(x.createdAt).replace('T',' ').slice(0,16):'';
    let statusChip='';
    if(x.kind==='request'){ const s=x.status||'open';
      const smap={open:['요청','bad'],confirming:['확인중','warn'],done:['완료','safe']};
      statusChip=`<span class="bb ${smap[s][1]}">${smap[s][0]}</span>`;
      if(s!=='done') statusChip+=` <button class="btn xs" onclick="setThreadStatus('${x.id}','${s==='open'?'confirming':'done'}')">${s==='open'?'확인중':'완료'}로</button>`;
      else statusChip+=x.resolvedBy?` <span style="font-size:10.5px;color:var(--faint)">by ${esc(x.resolvedBy)}</span>`:'';
    }
    return `<div class="thitem${x.kind==='request'?' req':''}">
      <div class="thhd"><span class="bb ${x.authorRole==='advertiser'?'':'ok'}">${esc(roleLbl)}</span><b>${esc(x.authorName||'')}</b>
        ${x.kind==='request'?'<span class="bb warn">확인요청</span>':''}${x.internalOnly?'<span class="bb" title="내부 전용 — 광고주 미노출">🔒 내부</span>':''}
        <span class="thwhen">${esc(when)}</span>${canDel?`<span class="thdel" title="삭제" onclick="delThread('${x.id}')">×</span>`:''}</div>
      <div class="thbody">${esc(x.body||'')}</div>
      ${statusChip?`<div class="thstatus">${statusChip}</div>`:''}</div>`;
  }).join('')||`<div class="empty" style="padding:18px">아직 글이 없습니다. 첫 코멘트/확인요청을 남겨보세요.</div>`;
  box.innerHTML=`${openReq?`<div class="railnote">⚠ 미완료 확인요청 ${openReq}건</div>`:''}
    <div class="thlist">${rows}</div>
    <div class="thform">
      <textarea id="thbody" rows="2" placeholder="코멘트 또는 확인요청 내용… (Ctrl+Enter로 등록)"></textarea>

function _colW(h){
  if(STATE.role==='advertiser'){
    if(/아이디|쿠팡\s*id|네이버\s*id|스토어\s*id|^\s*id\s*$/i.test(String(h==null?'':h))) return 92;   // ID열(시트명 다양)
    return _ADV_COLW[h]!=null?_ADV_COLW[h]:(_COLW[h]||76);

// 가운데 정렬 대상 = 날짜형(구매일자 등)·연락처(전화) → 값 길이가 달라도 앞여백=뒷여백(좌우 대칭). (_isPhoneHeader는 아래 정의, 함수선언 호이스팅)

function _gridEditVal(h, raw){ const v=(raw==null?'':String(raw)).trim(); if(!v)return ''; if((/일자|날짜|date/i.test(h)||_isDepositCol(h))&&/^\d{4,6}(\.\d+)?$/.test(v)){ const dt=_serialToDate(parseFloat(v)); if(dt)return dt; } return v; }

function _gridVal(h, raw){ const v=_gridEditVal(h, raw); if(!v)return '';

  if(_isPhoneHeader(h)) return _fmtPhone(v);

// 연락처 표기 통일: 숫자만 추출 → 010-0000-0000(뒤8자리=phone8) 등 표준 대시 양식. 형식 불명은 원본 유지(오염 방지).
function _isPhoneHeader(h){ const s=String(h||''); return /(연락처|휴대폰|핸드폰|전화|폰번호)/.test(s) || /^(hp|tel|mobile|phone)$/i.test(s.trim()); }
function _fmtPhone(v){
  if(v==null) return ''; const s=String(v).trim(); if(!s) return '';
  const d=s.replace(/[^0-9]/g,''); if(!d) return s;
  if(d.length===8) return '010-'+d.slice(0,4)+'-'+d.slice(4);                 // phone8(뒤8자리) → 010-XXXX-XXXX
  if(d.length===11) return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);       // 01012345678 → 010-1234-5678

function _fmtKDate(v){

  const md=v.match(/^(\d{1,2})\s*[\/.]\s*(\d{1,2})\s*(?:\(\s*([일월화수목금토])\s*\.?\s*\))?$/);
  if(md) return `${+md[1]}/${+md[2]}`+(md[3]?` (${md[3]})`:'');
  return v;   // 비정형(텍스트 메모 등)은 원본 유지
}
// 입금 컬럼: 값을 항상 "월/일"(예 7/22)로 통일 — 입금일자·타임스탬프·일련번호·시트식 표기를 M/D로 정규화(요일 미표기, 폭 48px 핏). '입금액/입금금액'(금액)은 제외.
function _isDepositCol(h){ const s=String(h==null?'':h); return /입금/.test(s) && !/액|금액/.test(s); }
function _fmtMD(v){
  const s=String(v==null?'':v).replace(/\s+\d{1,2}:\d{2}(:\d{2})?\s*$/,'').trim();   // 뒤쪽 시각(HH:MM[:SS]) 제거
  if(!s) return '';

  const md=s.match(/^(\d{1,2})\s*[\/.]\s*(\d{1,2})/);

}

// 셀 표시값(그리드 렌더·필터·그룹·정렬 공용) — 신원 3열은 그대로, 시트 컬럼은 편집오버레이 반영 + 날짜 표기.
function gCellDisp(r,h){
  if(h==='#') return String(r.seq==null?'':r.seq);
  if(STATE.role!=='advertiser'){   // 광고주 그리드는 신원열(참여자·phone8)이 없음 → 동명 시트열은 rowJson에서 읽음(col 분기로 폴백)
    if(h==='참여자') return r.name||'';
    if(h==='연락처') return _fmtPhone(r.phone8||'');
  }
  const rj=(r.rowJson&&typeof r.rowJson==='object')?r.rowJson:{};
  const ceMap=(r.cellEdits&&typeof r.cellEdits==='object')?r.cellEdits:{};
  const ed=(h in ceMap); const raw= ed?ceMap[h]:rj[h];

// ── 청크 렌더: 첫 화면만 즉시 그리고 나머지 행은 프레임마다 append(대형 표 렌더 프리즈 방지) ──
const _GRID_CHUNK=60;
const _raf=(typeof requestAnimationFrame==='function')?(fn=>requestAnimationFrame(fn)):(fn=>setTimeout(fn,16));
function _scheduleBodyFlush(){
  const p=STATE._pendingBody; if(!p||!p.rows||!p.rows.length){ STATE._pendingBody=null; return; }
  const gen=p.gen;
  const step=()=>{
    const pp=STATE._pendingBody; if(!pp||pp.gen!==gen||!pp.rows.length){ if(pp&&pp.gen===gen) STATE._pendingBody=null; return; }   // 재렌더로 세대 바뀌면 자동 중단
    const tb=document.getElementById('gbody'); if(!tb){ STATE._pendingBody=null; return; }
    tb.insertAdjacentHTML('beforeend', pp.rows.splice(0,_GRID_CHUNK).join(''));
    if(pp.rows.length){ _raf(step); _applyPendingFocus(false); }   // 중간에도 시도(대상이 이미 들어왔으면 즉시 강조)
    else { STATE._pendingBody=null; _applyPendingFocus(true); }    // 마지막 청크까지 끝 → 없으면 '못 찾음' 확정
  };
  _raf(step);

// ── 리뷰어 로그 딥링크: 해당 리뷰어 행으로 스크롤 + 강조 ──
//   청크 렌더라 대상 행이 나중에 들어올 수 있어 flush 중간·완료 시점 양쪽에서 시도한다.
//   final=true(더 그릴 행이 없음)일 때만 "못 찾음"으로 확정 — 아직 안 그려진 행을 없다고 오판하지 않게.
function _applyPendingFocus(final){
  const f=STATE.pendingFocus; if(!f) return;
  const body=document.getElementById('gbody'); if(!body) return;
  // 속성 선택자 값은 JSON.stringify 로 따옴표+이스케이프(따옴표·역슬래시가 든 값이 와도 선택자가 안 깨짐)
  const sel=(attr,v)=>'tr['+attr+'='+JSON.stringify(String(v))+']';
  let tr=null;
  if(f.phone8) tr=body.querySelector(sel('data-p8',f.phone8));
  if(!tr && f.name) tr=body.querySelector(sel('data-nm',f.name));   // 연락처가 비었거나 바뀐 행 폴백
  if(!tr){
    if(final){ STATE.pendingFocus=null;
      _toast(`${f.name||'해당 리뷰어'} 행을 이 명단에서 찾지 못했습니다 — 필터가 걸려 있거나 명단에서 제거된 행일 수 있습니다.`); }

// 가벼운 안내 토스트(모달 아님 — 작업 흐름을 막지 않음)
function _toast(msg){

// 시트형 그리드: 왼쪽 고정 = #·참여자·연락처(DB 리뷰어 신원) + (선택 시)시트 컬럼 수취인까지 · 오른쪽 = 시트 컬럼 전체.

  // 행 필터(스테일 컬럼은 무시 = 탭 전환 초기화 누락 시에도 그리드 블랭크 방지) → 정렬
  let rows=(wd.roster||[]).filter(r=>Object.entries(STATE.gFilters).every(([col,set])=>{
    if(!set||!set.size) return true; if(!allCols.includes(col)) return true; return set.has(gCellDisp(r,col)); }));
  if(STATE.gSort&&STATE.gSort.col&&allCols.includes(STATE.gSort.col)){
    const col=STATE.gSort.col, sdir=STATE.gSort.dir==='desc'?-1:1;
    rows=rows.slice().sort((a,b)=>{ const x=gCellDisp(a,col),y=gCellDisp(b,col);
      const nx=Number(String(x).replace(/[,\s]/g,'')),ny=Number(String(y).replace(/[,\s]/g,''));
      const both=x!==''&&y!==''&&!isNaN(nx)&&!isNaN(ny);
      return (both?nx-ny:String(x).localeCompare(String(y),'ko'))*sdir; });
  }
  // 단일 행 렌더(편집 셀 보존 · vcols 순서 · 인덱스로 고정/폭 계산)
  const rowHtml=(r)=>{
    const rj=(r.rowJson&&typeof r.rowJson==='object')?r.rowJson:{};
    const ceMap=(r.cellEdits&&typeof r.cellEdits==='object')?r.cellEdits:{};
    const canE = STATE.canEdit && r.editable!==false;
    const badge = r.source==='manual'?' <span class="src manual">수동</span>':(r.hasOrder?' <span class="src order">주문</span>':'')
                + (r.editable===false?' <span class="lock" title="주문/신원 앵커 없음 또는 중복 — 편집 잠금">🔒</span>':'');
    const eCell=(field, disp, edited, extraCls, styleI, editv)=> canE
      ? `<td ${cls(styleI,'gcell gedit'+(edited?' edited':'')+(disp?'':' gempty')+(extraCls||''))} style="${cstyle(styleI)}" title="${esc(disp||'')}" data-id="${esc(r.id)}" data-field="${esc(field)}" data-val="${esc(editv!=null?editv:disp)}" onclick="beginEditCell(this)">${esc(disp||'—')}${edited?` <span class="revb" title="되돌리기" data-id="${esc(r.id)}" data-field="${esc(field)}" onclick="revertCell(event,this)">↩</span>`:''}</td>`
      : `<td ${cls(styleI,'gcell'+(disp?'':' gempty')+(extraCls||''))} style="${cstyle(styleI)}" title="${esc(disp||'')}">${esc(disp||'')}</td>`;
    let tds='';
    vcols.forEach((c,i)=>{ const h=c.key;
      if(c.kind==='seq'){ tds+=`<td ${cls(i,'gnum')} style="${cstyle(i)}">${esc(r.seq)}</td>`; }
      else if(c.kind==='name'){
        // 참여자 = 실제 제출 리뷰어 신원 → 값 편집 잠금(표시 전용). 배지는 유지, 제거(×, 명단 큐레이션=행 숨김)는 편집자만.
        tds+=`<td ${cls(i,'gnm gidlock')} style="${cstyle(i)}" title="실제 제출 리뷰어 정보 — 수정 불가">${esc(r.name||'—')}${badge}${canE?`<span class="rmx" title="명단에서 제거(숨김)" onclick="hideRow('${esc(r.id)}')">×</span>`:''}</td>`; }
      else if(c.kind==='phone'){ const _ph=_fmtPhone(r.phone8);
        // 연락처 = 실제 제출 리뷰어 신원 → 값 편집 잠금(표시 전용). 가운데 정렬(앞여백=뒷여백).
        tds+=`<td ${cls(i,'gcell gidlock'+(_ph?'':' gempty')+' gph gctr')} style="${cstyle(i)}" title="실제 제출 리뷰어 정보 — 수정 불가">${esc(_ph||'')}</td>`; }
      else { const jIdx=H.indexOf(h); const ed=(h in ceMap); const raw= ed?ceMap[h]:rj[h];
        const disp= ed?(raw==null?'':String(raw)):_gridVal(h, raw);
        const editv= ed?disp:_gridEditVal(h, raw);
        const ok=((jIdx===revI||jIdx===payI)&&disp)?' gok':'';
        const ctr=_isCtrCol(h)?' gctr':'';   // 시트 날짜/연락처 열 가운데 정렬
        tds+=eCell('col:'+h, disp, ed, ok+ctr, i, editv); }
    });
    // data-p8/data-nm = 리뷰어 로그 딥링크가 이 행을 찾아 강조하는 키(표시에는 영향 없음)
    return `<tr data-p8="${esc(r.phone8||'')}" data-nm="${esc(r.name||'')}">${tds}</tr>`;
  };
  // 본문 행 배열(청크 렌더용) — 그룹 여부에 따라
  let bodyArr=[], emptyBody='';
  const groupOn = STATE.gGroupBy && allCols.includes(STATE.gGroupBy);
  if(!rows.length){
    emptyBody=`<tr><td colspan="${vcols.length}" class="empty" style="height:56px">${Object.keys(STATE.gFilters).length?'조건에 맞는 행이 없습니다 — 필터를 조정하세요.':'명단 없음 — 그림자 투영을 실행하세요.'}</td></tr>`;
  } else if(groupOn){
    const gb=STATE.gGroupBy, groups=new Map();
    rows.forEach(r=>{ const k=gCellDisp(r,gb); if(!groups.has(k))groups.set(k,[]); groups.get(k).push(r); });
    for(const [k,rs] of groups){
      const open=!STATE.gCollapsed.has(k);
      const sub=rs.reduce((n,r)=>n+(r.submitted?1:0),0), paid=rs.reduce((n,r)=>n+(r.paid?1:0),0);
      bodyArr.push(`<tr class="grouphd"><td colspan="${vcols.length}"><div class="ghinner" onclick="toggleGGroup('${encodeURIComponent(k).replace(/'/g,'%27')}')"><span class="ghtri${open?' open':''}">▶</span><span class="ghcol">${esc(gb)}</span><span class="ghlbl">${esc(k||'(빈값)')}</span><span class="ghagg"><span class="a">${rs.length}명</span><span class="a s">제출 <b>${sub}</b></span><span class="a p">입금 <b>${paid}</b></span></span></div></td></tr>`);
      if(open) for(const r of rs) bodyArr.push(rowHtml(r));
    }
  } else {
    for(const r of rows) bodyArr.push(rowHtml(r));
  }
  // 청크 렌더: 첫 _GRID_CHUNK행만 즉시 그리고 나머지는 rAF로 append(대형 표 렌더 프리즈 방지 · 값 잘림 없음).
  //   세대(gen) 태그로 재렌더 시 이전 플러시 자동 중단. 소형 표(≤CHUNK)는 한 번에 = 지터/오버헤드 없음.
  const firstBody = emptyBody || bodyArr.slice(0,_GRID_CHUNK).join('');
  STATE._gridGen=(STATE._gridGen||0)+1;
  STATE._pendingBody = (bodyArr.length>_GRID_CHUNK) ? { gen:STATE._gridGen, rows:bodyArr.slice(_GRID_CHUNK) } : null;
  // 툴바(고정 열 · 행 그룹 · 접기/펼치기 · 숨긴 열 · 필터 초기화 · 편집 이력)
  const fzOpts=['<option value="">기본(연락처까지)</option>']
    .concat(H.filter(h=>['번호','담당자','구매일자','인애드명단','주문자제출','수취인','주소'].includes(h))
      .map(h=>`<option value="${esc(h)}"${STATE.freezeUpto===h?' selected':''}>${esc(h)}까지 고정</option>`)).join('');
  const grpOpts=['<option value="">그룹 없음</option>']
    .concat(H.map(h=>`<option value="${esc(h)}"${STATE.gGroupBy===h?' selected':''}>${esc(h)} 기준</option>`)).join('');
  const nHid=STATE.gHidden.size, hasFilt=Object.values(STATE.gFilters).some(s=>s&&s.size);
  const selCols=(STATE.gSelCols||[]).filter(c=>!STATE.gHidden.has(c)&&allCols.includes(c)), nSel=selCols.length;
  return `<div class="gridbar">
      ${nSel?`<span class="gselact"><b>${nSel}개 열 선택</b><button class="btn xs pri" onclick="hideSelectedCols()">숨기기</button><button class="btn xs" onclick="clearColSel()">취소</button></span>`:''}
      <label>고정 열</label><select id="fzsel" onchange="setFreeze(this.value)">${fzOpts}</select>
      <label>행 그룹</label><select id="grpsel" onchange="setGGroup(this.value)">${grpOpts}</select>
      ${groupOn?`<button class="btn xs" onclick="toggleAllGGroups()">${STATE.gCollapsed.size?'모두 펼치기':'모두 접기'}</button>`:''}
      <button class="btn xs" onclick="openGHidMenu(event)">숨긴 열${nHid?` <b style="color:var(--accent-deep)">${nHid}</b>`:' 0'}</button>
      ${hasFilt?`<button class="btn xs" style="color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,var(--line))" onclick="clearGFilters()">필터 초기화 ✕</button>`:''}
      ${STATE.canEdit?`<button class="btn xs" onclick="showEditHistory()">편집 이력</button>`:''}
      <span class="gnote">시트 동일 컬럼 · <b>컬럼명 클릭</b>=필터·정렬·숨기기 · 헤더 <b>가로 드래그</b>=여러 열 선택 → 숨기기 · <b>행 그룹</b> 접기/펼치기${STATE.canEdit?` · <b>셀 클릭=즉시 편집</b>(Enter=아래·Tab=오른쪽·Esc=취소)`:` · <b>열람 전용</b>`}</span></div>
    <div class="gridscroll"><table class="sheetgrid${STATE.role==='advertiser'?' advsnug':''}"><thead>${thead}</thead><tbody id="gbody">${firstBody}</tbody></table></div>
    <div id="addbox"></div>
    ${STATE.canEdit?`<button class="btn" style="margin-top:10px" onclick="showAddForm()">＋ 참여자 추가</button>`:''}`;
}
// 그리드만 가볍게 재렌더(필터/그룹/숨김/정렬 등 뷰 상태 변경 시 — 정산·스레드 재요청 없이)
function rerenderGrid(){ const wd=STATE.wd; if(!wd) return; const host=$('#gridhost'); if(!host) return;
  const gridMode=(STATE.canEdit||STATE.role==='advertiser')&&Array.isArray(wd.headers)&&wd.headers.length; if(gridMode){ host.innerHTML=buildGrid(wd); _scheduleBodyFlush(); _fitGrid(); } }   // 광고주도 필터/정렬/숨김 재렌더 동작
// ★★ 표폭 = '보이는 열 고정폭의 합' 못박기 (역할 무관·창 크기 무관)
//   과거엔 언더플로 시 주소 열이 잔여폭을 흡수해 표를 꽉 채웠다 → 같은 열이 창 크기·숨긴 열 수에 따라
//   매번 다른 너비가 되어, 여러 작업을 오가며 데이터를 훑는 실사용자가 열 위치를 다시 찾아야 했다.
//   이제 창을 아무리 넓혀도 열 너비는 고정이고 남는 공간은 우측 여백. 열이 많은 작업일수록 합이 커져 표만 넓어진다.
//   합 > 컨테이너면 종전대로 .gridscroll 가로 스크롤. 레이아웃 측정 없이 _colW 합만 쓰므로 스트레치 플래시도 없다.
function _fitGrid(){ try{
  const wd=STATE.wd; if(!wd) return;
  const scroll=$('.gridscroll'); if(!scroll) return;
  const tbl=scroll.querySelector('table.sheetgrid'); if(!tbl) return;
  const H=wd.headers||[];
  const idKeys = STATE.role==='advertiser' ? ['#'] : ['#','참여자','연락처'];   // buildGrid idCols와 동일
  const keys=[...idKeys, ...H].filter(k=>!STATE.gHidden.has(k));                 // vcols와 동일 규칙(숨긴 열 제외)
  let sum=0; for(const k of keys) sum+=_colW(k);
  tbl.style.width=sum+'px';                                                      // min-width:0 과 함께 100% 스트레치 차단
}catch(_){ } }
function setFreeze(v){ STATE.freezeUpto=v||null; rerenderGrid(); }
// ── 컬럼 ▾ 필터/정렬/숨기기 · 행 그룹 접기/펼치기 (클라이언트 뷰 상태) ──
function _ensureGMenus(){
  if(!$('#gcolmenu')){ const m=document.createElement('div'); m.className='gcolmenu'; m.id='gcolmenu'; document.body.appendChild(m); }
  if(!$('#ghidmenu')){ const m=document.createElement('div'); m.className='ghidmenu'; m.id='ghidmenu'; document.body.appendChild(m); }
  if(!STATE._gMenuInit){ STATE._gMenuInit=true;
    document.addEventListener('click',e=>{ if(!e.target.closest('#gcolmenu')&&!e.target.closest('.sheetgrid thead th')) closeGColMenu();
      if(!e.target.closest('#ghidmenu')&&!e.target.closest('.ghid-btn')) closeGHidMenu(); });
    document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeGColMenu(); closeGHidMenu(); } });
  }
}
function _placeMenu(m,btn,w,h){ const x=Math.max(8,Math.min(btn.left, window.innerWidth-w-10)); const y=Math.min(btn.bottom+5, window.innerHeight-h-10); m.style.left=x+'px'; m.style.top=Math.max(8,y)+'px'; }
// 헤더 가로 드래그 = 여러 열 선택(하이라이트 유지) → 툴바 [숨기기]/[취소] 로 결정 (위임 · 1회 바인딩 · 재렌더에도 유지)
function _ensureHeaderDrag(){
  if(STATE._gDragInit) return; STATE._gDragInit=true;
  if(!$('#gdragbadge')){ const b=document.createElement('div'); b.className='gdragbadge'; b.id='gdragbadge'; document.body.appendChild(b); }
  let drag=null;   // { ths:[th…], i0, i1, moved, painted }
  const badge=()=>$('#gdragbadge');
  const clearVis=()=>document.querySelectorAll('.sheetgrid thead th.gsel').forEach(t=>t.classList.remove('gsel'));
  const paint=(clientX,clientY)=>{ if(!drag) return; drag.painted=true; const lo=Math.min(drag.i0,drag.i1), hi=Math.max(drag.i0,drag.i1);
    clearVis(); let n=0; for(let i=lo;i<=hi;i++){ const t=drag.ths[i]; if(!t) continue; t.classList.add('gsel'); const c=t.getAttribute('data-col'); if(c&&c!=='#'&&!STATE.gHidden.has(c)) n++; }
    const b=badge(); if(b){ if(hi>lo&&n>0){ b.textContent=`${n}개 열 선택`; b.style.display='block'; b.style.left=Math.min(clientX+14, window.innerWidth-140)+'px'; b.style.top=(clientY+16)+'px'; } else b.style.display='none'; } };
  document.addEventListener('mousedown',e=>{
    if(e.button!==0) return;
    const th=e.target.closest('.sheetgrid thead th'); if(!th) return;
    const head=th.closest('thead'); if(!head) return;
    const ths=[...head.querySelectorAll('th')]; const i=ths.indexOf(th); if(i<0) return;
    drag={ ths, i0:i, i1:i, moved:false, painted:false }; const tr=th.closest('tr'); if(tr) tr.classList.add('dragging');
    e.preventDefault();   // 텍스트 선택 방지
  });
  document.addEventListener('mousemove',e=>{
    if(!drag) return; const th=e.target.closest('.sheetgrid thead th');
    if(th && drag.ths.includes(th)){ const i=drag.ths.indexOf(th); if(i!==drag.i1){ drag.i1=i; drag.moved=true; } }
    paint(e.clientX, e.clientY);
  });
  document.addEventListener('mouseup',e=>{
    if(!drag) return; const d=drag; drag=null;
    const b=badge(); if(b) b.style.display='none';
    document.querySelectorAll('.sheetgrid tr.dragging').forEach(t=>t.classList.remove('dragging'));
    if(!d.moved){   // 이동 없음 = 클릭 → 컬럼명 클릭 필터(‘#’ 제외). 흔들림 하이라이트는 복원.
      const th=d.ths[d.i0]; const col=th&&th.getAttribute('data-col'); const rect=th&&th.getBoundingClientRect();
      if(d.painted) rerenderGrid();
      if(col && col!=='#' && rect) openGColMenu(col, rect);
      return;
    }
    const lo=Math.min(d.i0,d.i1), hi=Math.max(d.i0,d.i1);
    const cols=[]; for(let i=lo;i<=hi;i++){ const c=d.ths[i]&&d.ths[i].getAttribute('data-col'); if(c&&c!=='#'&&!STATE.gHidden.has(c)) cols.push(c); }
    STATE.gSelCols=cols;   // 선택만(즉시 숨김 아님) — 툴바 [숨기기]/[취소] 로 확정. 하이라이트는 rerenderGrid 가 gSelCols 로 재적용.
    rerenderGrid();
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape' && STATE.gSelCols && STATE.gSelCols.length) clearColSel(); });
}
// 선택된 열 일괄 숨김 / 선택 해제
function hideSelectedCols(){
  const cols=(STATE.gSelCols||[]).filter(c=>!STATE.gHidden.has(c));
  if(!cols.length){ STATE.gSelCols=[]; rerenderGrid(); return; }
  cols.forEach(c=>{ STATE.gHidden.add(c); if(STATE.gGroupBy===c){ STATE.gGroupBy=null; STATE.gCollapsed=new Set(); } if(STATE.freezeUpto===c) STATE.freezeUpto=null; delete STATE.gFilters[c]; if(STATE.gSort&&STATE.gSort.col===c) STATE.gSort=null; });
  STATE.gSelCols=[]; closeGColMenu(); rerenderGrid();
  if(typeof toast==='function') toast(`${cols.length}개 열 숨김 · 툴바 '숨긴 열'에서 복원`);
}
function clearColSel(){ STATE.gSelCols=[]; rerenderGrid(); }
function openGColMenu(col, rect){   // 컬럼명(헤더) 클릭으로 호출 — rect=헤더 위치(팝오버 앵커)
  _ensureGMenus(); closeGHidMenu();
