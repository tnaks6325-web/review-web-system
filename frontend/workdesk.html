<script>
const API_BASE = (function(){ if (window.REVIEW_API_URL) return window.REVIEW_API_URL; if (location.hostname==='localhost') return 'http://localhost:3000'; return 'https://sublime-magic-production-790b.up.railway.app'; })();
// 토큰 핸드오프: admin.html에서 넘긴 raw_sso → sessionStorage(자동 로그인). raw-mirror.html과 동일 계약.
(function initToken(){ try{ const raw=localStorage.getItem('raw_sso'); if(raw){ const sso=JSON.parse(raw); if(sso&&sso.token&&!sessionStorage.getItem('admin_token')) sessionStorage.setItem('admin_token', sso.token); } }catch(_){} })();
function token(){ return sessionStorage.getItem('admin_token') || ''; }
async function api(path, opts){ const o=Object.assign({headers:{}},opts||{}); o.headers['Authorization']='Bearer '+token(); if(o.body)o.headers['Content-Type']='application/json'; const r=await fetch(API_BASE+path,o); return r.json(); }
const $=(s,el)=>(el||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function parseJwt(t){ try{ return JSON.parse(atob(t.split('.')[1])); }catch(_){ return {}; } }

let STATE = { role:'', name:'', view:'workdesk', tabs:[], cur:null, wd:null, freezeUpto:null,
              ov:[], ovq:'', pendingTab:null, lastBatch:null,
              advs:[], advCur:null, tabIndex:{}, sheetMap:{}, addMode:'all', addSheet:null, addTabs:{} };

async function boot(){
  if (!token()) return renderLogin();
  const me = parseJwt(token()); STATE.role=me.role||''; STATE.name=me.name||'';
  renderShell();
}
function renderLogin(){
  $('#app').innerHTML = `<div class="loginbox"><h2>통합 작업대 로그인</h2>
    <input id="lname" placeholder="아이디 (관리자 / AE / 광고주)" autocomplete="username">
    <input id="lpw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button class="btn pri" style="width:100%;padding:9px" onclick="doLogin()">로그인</button>
    <div class="err" id="lerr"></div>
    <div class="note">Track B 통합 작업대입니다. 관리자(master/admin)는 전체·관측·소유 지정, AE(영업담당)는 담당 업체 탭 열람/편집, 광고주(거래처)는 소유 탭을 열람합니다(개인정보 마스킹).</div></div>`;
  $('#lpw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
}
async function doLogin(){ const name=$('#lname').value.trim(), pw=$('#lpw').value;
  let r=await api('/api/admin/login',{method:'POST',body:JSON.stringify({name,pw})});
  if(!(r&&r.success&&r.token)){ r=await api('/api/admin/staff-login',{method:'POST',body:JSON.stringify({name,pw})}); }  // AE(영업담당) 폴백
  if(!(r&&r.success&&r.token)){ r=await api('/api/admin/advertiser-login',{method:'POST',body:JSON.stringify({name,pw})}); }  // 광고주(거래처) 폴백 — 소유 탭만·PII 마스킹
  if(r&&r.success&&r.token){ sessionStorage.setItem('admin_token',r.token); boot(); } else $('#lerr').textContent=(r&&(r.error||r.message))||'로그인 실패'; }
function logout(){ sessionStorage.removeItem('admin_token'); boot(); }

function renderShell(){
  const isAdmin = STATE.role==='master' || STATE.role==='admin';
  $('#app').innerHTML = `
    <div class="top">
      <span class="logo">통합 작업대 <span class="tag">TRACK B · 그림자</span></span>
      ${isAdmin?`<nav class="nav">
        <button class="navb" data-v="workdesk" onclick="switchView('workdesk')">작업대</button>
        <button class="navb" data-v="overview" onclick="switchView('overview')">관측</button>
        <button class="navb" data-v="ownership" onclick="switchView('ownership')">소유 지정</button></nav>`:''}
      <span class="sp"></span>
      <span class="rolebadge">${esc(STATE.role||'?')}${STATE.name?(' · '+esc(STATE.name)):''}</span>
      <button class="btn" onclick="logout()">로그아웃</button>
    </div>
    <div id="viewroot"></div>`;
  switchView(STATE.view||'workdesk');
}
function switchView(v){ STATE.view=v; document.querySelectorAll('.navb').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(v==='ownership') renderOwnershipView(); else if(v==='overview') renderOverviewView(); else renderWorkdeskView(); }

// ══ 작업대 뷰 ══
function renderWorkdeskView(){
  const isMaster = STATE.role==='master';
  $('#viewroot').innerHTML = `<div class="wrap showlist" id="wrap">
    <div class="side"><div class="sh"><span>작업 목록</span><span id="tcount"></span></div>
      <div id="tabs"><div class="empty">불러오는 중…</div></div></div>
    <div class="main" id="main"><div class="empty">왼쪽에서 작업을 선택하세요.</div></div>
    <div class="rail" id="rail"></div></div>`;
  loadTabs();
}
async function loadTabs(){
  const r = await api('/api/trackb/tabs?limit=300');
  if(!r||!r.ok){ $('#tabs').innerHTML=`<div class="empty">작업 목록은 관리자 로그인에서 제공됩니다.</div>`; return; }
  STATE.tabs=r.tabs||[]; $('#tcount').textContent=STATE.tabs.length;
  $('#tabs').innerHTML = STATE.tabs.map((t,i)=>`<div class="titem" data-i="${i}" onclick="selTab(${i})">${esc(t.tabName)}<div class="sub">${esc(t.spreadsheetTitle||'')}</div></div>`).join('')||`<div class="empty">활성 작업 없음</div>`;
  // 관측 대시보드에서 "열기"로 넘어온 탭 자동 선택
  if(STATE.pendingTab){ const pt=STATE.pendingTab; STATE.pendingTab=null;
    const idx=STATE.tabs.findIndex(t=>t.sheetId===pt.sheetId&&t.tabName===pt.tabName);
    if(idx>=0) selTab(idx); else { STATE.tabs.push(pt); selTab(STATE.tabs.length-1); } }
}
async function selTab(i){ const t=STATE.tabs[i]; STATE.cur=t;
  document.querySelectorAll('.titem').forEach(el=>el.classList.toggle('on',+el.dataset.i===i));
  $('#wrap').classList.remove('showlist'); $('#main').innerHTML=`<div class="empty">불러오는 중…</div>`;
  const q=`sheetId=${encodeURIComponent(t.sheetId)}&tabName=${encodeURIComponent(t.tabName)}&tabGid=${encodeURIComponent(t.tabGid||'')}`;
  renderWorkdesk(await api('/api/trackb/workdesk?'+q)); loadParity(t); }
function _tcell(r, field, val){   // 편집 가능 텍스트 셀
  const v = val==null?'':val;
  if(!STATE.canEdit) return `<td>${esc(v||'')}</td>`;
  if(r.editable===false) return `<td>${esc(v||'')} <span class="lock" title="주문/신원 앵커 없음 또는 중복 — 편집 잠금">🔒</span></td>`;
  const edited=(r.editedFields||[]).includes(field);
  return `<td><span class="ecell${edited?' edited':''}" data-val="${esc(v)}" onclick="beginEdit(this,'${r.id}','${field}')">${esc(v||'—')}</span>${edited?` <span class="revb" title="되돌리기" onclick="event.stopPropagation();revertEdit('${r.id}','${field}')">↩</span>`:''}</td>`;
}
function _bcell(r, field, val){   // 제출/입금 토글 셀
  if(!STATE.canEdit || r.editable===false) return `<td><span class="chk ${val?'y':'n'}">${val?'✓':'–'}</span></td>`;
  const edited=(r.editedFields||[]).includes(field);
  return `<td><span class="chk ${val?'y':'n'} clk${edited?' edited':''}" onclick="toggleBool('${r.id}','${field}',${val?'true':'false'})">${val?'✓':'–'}</span>${edited?` <span class="revb" title="되돌리기" onclick="event.stopPropagation();revertEdit('${r.id}','${field}')">↩</span>`:''}</td>`;
}
function renderWorkdesk(wd){
  if(!wd||!wd.ok){ $('#main').innerHTML=`<div class="empty">${esc((wd&&wd.error)||'조회 실패')}</div>`; return; }
  STATE.wd=wd; STATE.canEdit=(STATE.role!=='advertiser');   // master/admin/staff(AE) 편집 · 광고주는 열람
  const d=wd.detail||{},m=wd.meta||{},c=wd.counts||{}, isMaster=STATE.role==='master', canEdit=STATE.canEdit;
  const metaCards=[['상품',d.productOption||m.campaignName||'—'],['모집',(d.recruitCount||'—')+(m.manager?(' · '+m.manager):'')],['구매시간',d.purchaseTime||'자율'],['배송',d.deliveryType||m.deliveryType||'—']].map(([k,v])=>`<div class="mf"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('');
  // 시트형 그리드 모드(master/admin, 시트 헤더 순서 수신 시): 시트와 동일한 가로 그리드로 렌더(열람 전용).
  const gridMode = canEdit && Array.isArray(wd.headers) && wd.headers.length;
  const warn=[];
  if(canEdit && c.hidden>0) warn.push(`<span class="wchip" title="제거(숨김)된 행 — 클릭해 복원" onclick="showHidden()">숨김 ${c.hidden}</span>`);
  if(!gridMode && canEdit && wd.orphanEdits && wd.orphanEdits.count>0) warn.push(`<span class="wchip bad" title="앵커가 현재 명단에 없는 편집">미부착 편집 ${wd.orphanEdits.count}</span>`);
  if(canEdit && c.ambiguous>0) warn.push(`<span class="wchip" title="중복 신원 행">중복 신원 ${c.ambiguous}</span>`);
  let tableSection;
  if(gridMode){
    tableSection = buildGrid(wd);
  } else {
    const rows=(wd.roster||[]).map(r=>`<tr id="row-${esc(r.id)}"${r.ambiguous?' class="amb"':''}><td>${canEdit?`<span class="exp" title="제출 내용·시트 행 펼치기" onclick="toggleDetail('${esc(r.id)}')">▸</span> `:''}${esc(r.seq)}</td>`+
      `<td>${canEdit&&r.editable!==false?`<span class="ecell${(r.editedFields||[]).includes('reviewer_name')?' edited':''}" data-val="${esc(r.name||'')}" onclick="beginEdit(this,'${r.id}','reviewer_name')">${esc(r.name||'—')}</span>`:esc(r.name||'—')}`+
      `${r.source==='manual'?' <span class="src manual">수동</span>':(r.hasOrder?' <span class="src order">주문</span>':'')}${r.ambiguous?' <span class="src" style="background:var(--warn-soft);color:var(--warn)" title="중복 신원">⚠중복</span>':''}${(r.editedFields||[]).includes('reviewer_name')?` <span class="revb" onclick="event.stopPropagation();revertEdit('${r.id}','reviewer_name')">↩</span>`:''}</td>`+
      `<td class="ph">${esc(r.phone8||'')}</td>`+
      _tcell(r,'round',r.round)+_tcell(r,'option_text',r.option)+
      _bcell(r,'is_submitted',r.submitted)+_bcell(r,'is_paid',r.paid)+
      (canEdit?`<td>${r.source==='manual'||r.editable!==false?`<button class="rmrow" title="명단에서 제거(숨김)" onclick="hideRow('${r.id}')">×</button>`:''}</td>`:'')
      +`</tr>`).join('')||`<tr><td colspan="${canEdit?8:7}" class="empty">명단 없음 — 그림자 투영을 실행하세요.</td></tr>`;
    tableSection = `<table><thead><tr><th>#</th><th>참여자</th><th>연락처</th><th>차수</th><th>옵션</th><th>제출</th><th>입금</th>${canEdit?'<th></th>':''}</tr></thead><tbody>${rows}</tbody></table>
      ${canEdit?`<div id="addbox"></div><button class="btn" style="margin-top:10px" onclick="showAddForm()">＋ 참여자 추가</button>`:''}
      ${canEdit?'<div class="editnote">편집은 이 화면(Track B)에만 저장됩니다 — 구글시트·주문은 바뀌지 않습니다(리허설). 셀 클릭으로 수정, ↩로 되돌리기.</div>':''}`;
  }
  const sot=wd.sourceOfTruth||'sheet';
  const sotBadge=`<span class="bd ${sot==='db'?'sot':''}" title="이 탭의 진실원천(원본). 시트=레거시(현행 Track A) · Track B=DB 원본(cutover). 전환해도 쓰기반영 엔진(P2) 전까지 라이브 동작은 불변.">원본: ${sot==='db'?'Track B':'시트'}</span>`;
  const flipBtn=isMaster?`<button class="btn" id="sotBtn" title="진실원천 전환(옵션 A · 되돌리기 가능). 'db' 전환은 진짜불일치 0 게이트를 통과해야 함(force로 우회). 현재는 상태·게이트만 — 시트 쓰기반영은 P2 엔진 예정." onclick="flipSoT('${sot==='db'?'sheet':'db'}')">${sot==='db'?'시트로 되돌리기':'Track B로 전환'}</button>`:'';
  $('#main').innerHTML=`<div class="mh"><h1>${esc(STATE.cur.tabName)}</h1>
    ${wd.maskPII?'<span class="bd">개인정보 마스킹(광고주)</span>':''}<span class="bd g">참여자 ${c.total||0}</span>${sotBadge}${gridMode?'<span class="bd" title="구글시트와 동일 컬럼·가로 펼침 (열람 전용)">시트 그리드 · 열람</span>':''}${warn.join('')}
    ${isMaster?`<span class="sp" style="flex:1"></span>${flipBtn}<button class="btn" id="projBtn" onclick="projectCur()">그림자 투영(새로고침)</button>`:''}</div>
    <div class="metagrid">${metaCards}</div>
    <div class="counts"><div class="cc"><div class="big">${c.total||0}</div><div class="lb">참여자</div></div><div class="cc s"><div class="big">${c.submitted||0}</div><div class="lb">제출완료</div></div><div class="cc p"><div class="big">${c.paid||0}</div><div class="lb">입금완료</div></div></div>
    ${tableSection}`;
}
// 컬럼 폭(px) — 고정열 오프셋 계산과 최소폭에 사용. 없으면 기본값.
const _COLW={'#':44,'참여자':112,'연락처':110,'번호':48,'담당자':66,'구매일자':98,'인애드명단':90,'주문자제출':90,'수취인':78,'id':118,'주소':190,'은행':66,'계좌번호':116,'예금주':72,'결제금액':82,'리뷰제출':96,'입금':64,'주문번호':134,'비고(닉네임)':110};
function _colW(h){ return _COLW[h]||92; }
// 시트 일련번호(1899-12-30 기준) → YYYY-MM-DD. 날짜형 헤더 + 순수 숫자일 때만 변환(금액 등 오변환 방지).
function _serialToDate(n){ const ms=Math.round((n-25569)*86400000); const d=new Date(ms); if(isNaN(d.getTime()))return null; const y=d.getUTCFullYear(); if(y<2000||y>2100)return null; const p=x=>String(x).padStart(2,'0'); return `${y}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())}`; }
function _gridVal(h, raw){ const v=(raw==null?'':String(raw)).trim(); if(!v)return ''; if(/일자|날짜|date/i.test(h)&&/^\d{4,6}(\.\d+)?$/.test(v)){ const dt=_serialToDate(parseFloat(v)); if(dt)return dt; } return v; }

// 시트형 그리드: 왼쪽 고정 = #·참여자·연락처(DB 리뷰어 신원) + (선택 시)시트 컬럼 수취인까지 · 오른쪽 = 시트 컬럼 전체.
function buildGrid(wd){
  const H=wd.headers||[];
  const revI=H.indexOf('리뷰제출'), payI=H.indexOf('입금');
  // 전체 컬럼: [#, 참여자, 연락처, ...시트헤더]. 고정 개수 = 3 + (freezeUpto 시트컬럼 인덱스+1)
  const fzIdx = STATE.freezeUpto ? H.indexOf(STATE.freezeUpto) : -1;
  const frozenN = 3 + (fzIdx>=0 ? fzIdx+1 : 0);
  const cols = ['#','참여자','연락처', ...H];
  const lefts=[]; let acc=0; for(let i=0;i<cols.length;i++){ lefts[i]=acc; acc+=_colW(cols[i]); }
  const cstyle=(i)=>{ const w=_colW(cols[i]); let s=`min-width:${w}px;width:${w}px;`; if(i<frozenN){ s+=`left:${lefts[i]}px;`; if(i===frozenN-1)s+='box-shadow:2px 0 0 var(--line2);'; } return s; };
  const cls=(i,extra)=>`class="${i<frozenN?'gfz ':''}${extra||''}"`;
  const thead=`<tr>${cols.map((h,i)=>`<th ${cls(i)} style="${cstyle(i)}">${esc(h==='#'?'#':h)}</th>`).join('')}</tr>`;
  const body=(wd.roster||[]).map(r=>{
    const rj=(r.rowJson&&typeof r.rowJson==='object')?r.rowJson:{};
    const ceMap=(r.cellEdits&&typeof r.cellEdits==='object')?r.cellEdits:{};
    const canE = STATE.canEdit && r.editable!==false;
    const badge = r.source==='manual'?' <span class="src manual">수동</span>':(r.hasOrder?' <span class="src order">주문</span>':'')
                + (r.editable===false?' <span class="lock" title="주문/신원 앵커 없음 또는 중복 — 편집 잠금">🔒</span>':'');
    // 편집 셀 렌더(주입 안전: 헤더는 data-field 속성으로만 전달, onclick 인라인 없음)
    const eCell=(field, disp, edited, extraCls, styleI)=> canE
      ? `<td ${cls(styleI,'gcell'+(disp?'':' gempty')+(extraCls||''))} style="${cstyle(styleI)}"><span class="ecell${edited?' edited':''}" data-val="${esc(disp)}" data-id="${esc(r.id)}" data-field="${esc(field)}" onclick="beginEditCell(this)">${esc(disp||'—')}</span>${edited?` <span class="revb" title="되돌리기" data-id="${esc(r.id)}" data-field="${esc(field)}" onclick="revertCell(event,this)">↩</span>`:''}</td>`
      : `<td ${cls(styleI,'gcell'+(disp?'':' gempty')+(extraCls||''))} style="${cstyle(styleI)}">${esc(disp||'')}</td>`;
    let tds=`<td ${cls(0,'gnum')} style="${cstyle(0)}">${esc(r.seq)}</td>`+
            (canE
              ? `<td ${cls(1,'gnm')} style="${cstyle(1)}"><span class="ecell${(r.editedFields||[]).includes('reviewer_name')?' edited':''}" data-val="${esc(r.name||'')}" data-id="${esc(r.id)}" data-field="reviewer_name" onclick="beginEditCell(this)">${esc(r.name||'—')}</span>${badge}<span class="rmx" title="명단에서 제거(숨김)" onclick="hideRow('${esc(r.id)}')">×</span></td>`
              : `<td ${cls(1,'gnm')} style="${cstyle(1)}">${esc(r.name||'—')}${badge}</td>`)+
            eCell('phone8', r.phone8||'', (r.editedFields||[]).includes('phone8'), 'gph', 2);
    H.forEach((h,j)=>{ const i=j+3; const ed=(h in ceMap); const raw= ed?ceMap[h]:rj[h]; const disp= ed?(raw==null?'':String(raw)):_gridVal(h, raw); const ok=((j===revI||j===payI)&&disp)?' gok':'';
      tds+=eCell('col:'+h, disp, ed, ok, i); });
    return `<tr>${tds}</tr>`;
  }).join('')||`<tr><td colspan="${cols.length}" class="empty">명단 없음 — 그림자 투영을 실행하세요.</td></tr>`;
  // 고정 열 선택(수취인까지 등) — 시트 컬럼 중 신원계열만 옵션으로.
  const fzOpts=['<option value="">기본(연락처까지)</option>']
    .concat(H.filter(h=>['번호','담당자','구매일자','인애드명단','주문자제출','수취인','주소'].includes(h))
      .map(h=>`<option value="${esc(h)}"${STATE.freezeUpto===h?' selected':''}>${esc(h)}까지 고정</option>`)).join('');
  return `<div class="gridbar"><label>고정 열</label><select id="fzsel" onchange="setFreeze(this.value)">${fzOpts}</select>
      <button class="btn xs" onclick="showEditHistory()">편집 이력</button>
      <span class="gnote">구글시트와 동일 컬럼·가로 배열 · <b>셀 클릭 편집</b>(Track B 전용, 시트·주문 무접촉) · ↩ 되돌리기 · 날짜 자동표시 · 리뷰제출/입금 편집 시 카운트 연동</span></div>
    <div class="gridscroll"><table class="sheetgrid"><thead>${thead}</thead><tbody>${body}</tbody></table></div>
    <div id="addbox"></div>
    <button class="btn" style="margin-top:10px" onclick="showAddForm()">＋ 참여자 추가</button>`;
}
function setFreeze(v){ STATE.freezeUpto=v||null; if(STATE.wd) renderWorkdesk(STATE.wd); }
// 그리드 셀 편집: 헤더/필드는 data 속성으로만 전달(주입 안전). beginEdit/revertEdit(기존 오버레이 경로) 재사용.
function beginEditCell(el){ beginEdit(el, el.getAttribute('data-id'), el.getAttribute('data-field')); }
function revertCell(ev, el){ if(ev)ev.stopPropagation(); revertEdit(el.getAttribute('data-id'), el.getAttribute('data-field')); }
// 편집 이력(감사) 모달
async function showEditHistory(){
  const t=STATE.cur; if(!t)return;
  let ov=document.getElementById('histov');
  if(!ov){ ov=document.createElement('div'); ov.id='histov'; ov.className='modalov'; ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();}); document.body.appendChild(ov); }

function _spark(vals){ if(!vals.length)return ''; const w=520,h=46,pad=4,max=Math.max(1,...vals),n=vals.length;
  const X=i=>pad+(n<=1?(w-2*pad)/2:i*(w-2*pad)/(n-1)), Y=v=>h-pad-(v/max)*(h-2*pad);
  const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' '); const last=vals[vals.length-1];
  const dots=vals.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.2" fill="${v===0?'var(--safe)':'var(--bad)'}"/>`).join('');
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="margin-bottom:10px;background:var(--card2);border-radius:8px">${n>1?`<polyline fill="none" stroke="${last===0?'var(--safe)':'var(--bad)'}" stroke-width="2" points="${pts}"/>`:''}${dots}</svg>`;
}

async function flipSoT(value, force){
  if(!STATE.cur)return;
  if(value==='db' && !force && !confirm(`이 탭의 원본을 Track B(DB)로 전환합니다.\n\n옵션 A(미러 유지·되돌리기 가능)이며, 시트 쓰기반영 엔진(P2)이 붙기 전까지 라이브 동작은 바뀌지 않습니다.\n계속할까요?`)) return;
  const btn=$('#sotBtn'); if(btn){btn.disabled=true;btn.textContent='전환 중…';}
  const r=await api('/api/trackb/source-of-truth',{method:'POST',body:JSON.stringify({sheetId:STATE.cur.sheetId,tabName:STATE.cur.tabName,value,force:!!force})});
  if(r&&r.ok){ toast(`원본 → ${value==='db'?'Track B':'시트'}`); selTab(STATE.tabs.indexOf(STATE.cur)); return; }
  if(r&&r.error==='parity_not_clean'){
    if(confirm(`진짜 불일치 ${r.real}건이 남아 있습니다(권장: 0).\n그래도 강제로 Track B로 전환할까요?`)) return flipSoT('db', true);
  } else { toast('전환 실패: '+((r&&r.error)||'오류')); }
  if(btn){btn.disabled=false;btn.textContent=value==='db'?'Track B로 전환':'시트로 되돌리기';}
}

// ══ 소유 지정 뷰 ══
async function renderOwnershipView(){
  $('#viewroot').innerHTML = `<div class="own-wrap">
    <div class="advlist"><div class="sh row" style="font-size:10px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:4px 6px 9px">업체(광고주)<button class="addadv" onclick="showAddAdvertiser()">＋ 업체 추가</button></div><div id="advs"><div class="empty">불러오는 중…</div></div></div>
    <div class="own-panel" id="ownPanel"><div class="empty">왼쪽에서 업체를 선택하세요.</div></div></div>`;
  // 탭 인덱스(시트명/탭명 조회용) 1회 로드
  if(!STATE.tabs.length){ const r=await api('/api/trackb/tabs?limit=500'); STATE.tabs=(r&&r.tabs)||[]; }
  buildTabIndex();
  const r=await api('/api/trackb/advertisers');
  if(!r||!r.ok){ $('#advs').innerHTML=`<div class="empty">업체 목록은 admin/master에서 제공</div>`; return; }
  STATE.advs=r.items||[];
  $('#advs').innerHTML = STATE.advs.map((a,i)=>`<div class="advitem" data-i="${i}" onclick="selAdv(${i})"><span class="ava">${esc((a.name||'?').slice(0,1))}</span><span class="nm">${esc(a.name)}</span><span class="ct">${a.owned}</span></div>`).join('')||`<div class="empty">등록된 업체 없음</div>`;
}
// 업체(거래처) 추가 — 기존 포털 거래처 원장(POST /api/portal/advertisers, adminOrMaster) 재사용.
//   담당 AE(inad_pm)까지 입력하면 소유 지정 + AE 스코프에 즉시 사용 가능.
function showAddAdvertiser(){
  STATE.advCur=null; document.querySelectorAll('.advitem').forEach(el=>el.classList.remove('on'));
  $('#ownPanel').innerHTML = `
    <div class="ph2"><span class="big">＋</span><div><h2>업체(거래처) 추가</h2><div class="acc">새 광고주를 등록하면 이 목록에 뜨고, 아래에서 시트/탭 소유를 지정할 수 있습니다.</div></div></div>
    <div class="sect"><div class="st">새 업체</div>
      <div class="add">
        <label>거래처명 *</label>
        <input id="advName" placeholder="예: (주)콩고물" autocomplete="off" onkeydown="if(event.key==='Enter')createAdvertiser()">
        <label style="margin-top:11px">담당 AE (선택 · 로그인 아이디와 정확히 일치해야 스코프 연결)</label>
        <input id="advPm" placeholder="예: 김수만" autocomplete="off" onkeydown="if(event.key==='Enter')createAdvertiser()">
        <div id="advErr" style="color:var(--bad);font-size:12px;margin-top:9px;min-height:15px"></div>
        <button class="btn pri assignbtn" onclick="createAdvertiser()">＋ 업체 등록</button>
      </div>
    </div>`;
  setTimeout(()=>{ const el=$('#advName'); if(el) el.focus(); },40);
}
async function createAdvertiser(){
  const name=($('#advName').value||'').trim(), inad_pm=($('#advPm').value||'').trim();
  const err=$('#advErr'); if(err) err.textContent='';
  if(!name){ if(err) err.textContent='거래처명을 입력하세요.'; return; }
  const r=await api('/api/portal/advertisers',{method:'POST',body:JSON.stringify({ name, inad_pm })});
  if(r&&r.ok){ toast('업체 등록: '+name); const newId=r.data&&r.data.id;
    await renderOwnershipView();
    const idx=(STATE.advs||[]).findIndex(a=>a.id===newId); if(idx>=0) selAdv(idx);
  } else if(err){ err.textContent=(r&&r.error)||'등록 실패'; }
}
function buildTabIndex(){ STATE.sheetMap={}; STATE.tabIndex={};
  for(const t of STATE.tabs){ if(!STATE.sheetMap[t.sheetId]) STATE.sheetMap[t.sheetId]={title:t.spreadsheetTitle||t.sheetId,tabs:[]};
    STATE.sheetMap[t.sheetId].tabs.push(t); STATE.tabIndex[t.sheetId+'::'+(t.tabGid||'')]=t.tabName; } }

async function selAdv(i){ const a=STATE.advs[i]; STATE.advCur=a; STATE.addSheet=null; STATE.addMode='all'; STATE.addTabs={};
  document.querySelectorAll('.advitem').forEach(el=>el.classList.toggle('on',+el.dataset.i===i));
  $('#ownPanel').innerHTML=`<div class="empty">불러오는 중…</div>`;
  const r=await api('/api/trackb/ownership?advertiserId='+encodeURIComponent(a.id));
  renderOwnPanel(a, (r&&r.items)||[]);
}
function sheetTitle(sid){ return (STATE.sheetMap[sid]&&STATE.sheetMap[sid].title)||sid; }
function renderOwnPanel(a, items){
  const owns = items.map(o=>{
    const whole = !o.tabGid;
    const label = whole ? sheetTitle(o.sheetId) : (STATE.tabIndex[o.sheetId+'::'+o.tabGid] || ('탭 '+o.tabGid));
    const sub = whole ? '시트 전체 · 모든 탭 자동 포함' : ('시트: '+sheetTitle(o.sheetId));
    return `<div class="own"><span class="ic">${whole?'▦':'▤'}</span><div class="info"><b>${esc(label)}</b><span>${esc(sub)}</span></div>
      <span class="scope ${whole?'all':'tab'}">${whole?'시트 전체':'특정 탭'}</span>
      <button class="rm" title="소유 해제" onclick="rmOwn('${esc(o.sheetId)}','${esc(o.tabGid||'')}')">×</button></div>`;
  }).join('') || `<div class="empty" style="padding:20px">소유 캠페인 없음 — 아래에서 추가하세요.</div>`;
  const sheetOpts = Object.keys(STATE.sheetMap).map(sid=>`<option value="${esc(sid)}">${esc(sheetTitle(sid))}</option>`).join('');
  $('#ownPanel').innerHTML = `
    <div class="ph2"><span class="big">${esc((a.name||'?').slice(0,1))}</span><div><h2>${esc(a.name)}</h2><div class="acc">거래처 ID: ${esc(a.id)} · 소유 ${items.length}</div></div></div>
    <div class="sect"><div class="st">소유 캠페인</div>${owns}</div>
    <div class="sect"><div class="st">소유 추가</div>
      <div class="add">
        <label>캠페인 시트</label>
        <select id="addSheet" onchange="onAddSheet()"><option value="">— 시트 선택 —</option>${sheetOpts}</select>
        <div class="radios">
          <div class="radio on" data-m="all" onclick="setAddMode('all')"><span class="d"></span>시트 전체(모든 탭)</div>
          <div class="radio" data-m="tab" onclick="setAddMode('tab')"><span class="d"></span>특정 탭만</div>
        </div>
        <div class="taboptions" id="taboptions"></div>
        <button class="btn pri assignbtn" onclick="assignOwn()">＋ 소유 지정</button>
      </div>
    </div>`;
}
function setAddMode(m){ STATE.addMode=m; document.querySelectorAll('.radio').forEach(r=>r.classList.toggle('on',r.dataset.m===m));
  const to=$('#taboptions'); to.classList.toggle('show', m==='tab' && STATE.addSheet); if(m==='tab') renderTabOptions(); else to.innerHTML=''; }
function onAddSheet(){ STATE.addSheet=$('#addSheet').value||null; STATE.addTabs={}; if(STATE.addMode==='tab') renderTabOptions(); }
function renderTabOptions(){ const to=$('#taboptions'); if(!STATE.addSheet){ to.classList.remove('show'); to.innerHTML=''; return; }
  const tabs=(STATE.sheetMap[STATE.addSheet]||{}).tabs||[];
  to.classList.add('show');
  to.innerHTML = tabs.map(t=>`<div class="tchip ${STATE.addTabs[t.tabGid||'']?'on':''}" onclick="tglTab('${esc(t.tabGid||'')}')"><span class="cb">${STATE.addTabs[t.tabGid||'']?'✓':''}</span>${esc(t.tabName)}</div>`).join('')||'<span style="font-size:12px;color:var(--faint)">이 시트에 활성 탭 없음</span>'; }
function tglTab(gid){ STATE.addTabs[gid]=!STATE.addTabs[gid]; renderTabOptions(); }
async function assignOwn(){ const a=STATE.advCur; if(!a) return; if(!STATE.addSheet){ toast('시트를 선택하세요'); return; }
  let posts=[];
  if(STATE.addMode==='all') posts=[{sheetId:STATE.addSheet, tabGid:null}];
  else { const gids=Object.keys(STATE.addTabs).filter(g=>STATE.addTabs[g]); if(!gids.length){ toast('탭을 선택하세요'); return; } posts=gids.map(g=>({sheetId:STATE.addSheet, tabGid:g})); }
  for(const p of posts) await api('/api/trackb/ownership',{method:'POST',body:JSON.stringify({advertiserId:a.id, sheetId:p.sheetId, tabGid:p.tabGid})});
  toast('소유 지정 완료'); refreshAdvCounts(); selAdv(STATE.advs.indexOf(a));
}
async function rmOwn(sheetId, tabGid){ const a=STATE.advCur; if(!a) return;
  await api('/api/trackb/ownership',{method:'DELETE',body:JSON.stringify({advertiserId:a.id, sheetId, tabGid:tabGid||null})});
  toast('소유 해제'); refreshAdvCounts(); selAdv(STATE.advs.indexOf(a));
}
async function refreshAdvCounts(){ const r=await api('/api/trackb/advertisers'); if(r&&r.ok){ STATE.advs=r.items||[];
  document.querySelectorAll('.advitem').forEach((el)=>{ const i=+el.dataset.i; if(STATE.advs[i]) el.querySelector('.ct').textContent=STATE.advs[i].owned; }); } }

boot();
</script>
</body>
</html>
