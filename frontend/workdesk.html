<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>통합 작업대 (Track B · 그림자)</title>
<style>
  /* ═══ Clarity Console 공용 UI 키트 토큰 — 단일 블루 액센트 + 쿨그레이 뉴트럴, tabular-nums ═══ */
  :root{
    --paper:#f4f6f9;--card:#ffffff;--card2:#f1f4f8;--ink:#101828;--muted:#667085;--faint:#98a2b3;
    --line:#e6eaf0;--line2:#d0d9e4;--accent:#2563eb;--accent-soft:#eff4ff;--accent-deep:#1d4ed8;--accent-line:#d7e3fd;
    --safe:#16a34a;--safe-soft:#e9f7ee;--warn:#b45309;--warn-soft:#fdf6ec;--bad:#e5484d;--bad-soft:#fdf0f0;
    --adv:#6d5ac9;--adv-soft:#efecfa;
    --ease:cubic-bezier(.22,1,.36,1);
    --shadow-card:0 1px 2px rgba(16,24,40,.04),0 10px 26px rgba(16,24,40,.05);
    --mono:'SF Mono','JetBrains Mono',ui-monospace,monospace;
    --sans:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  .top{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  .top .logo{font-weight:800;letter-spacing:-.02em;font-size:15px}
  .top .logo .tag{font-size:10px;font-weight:800;color:var(--accent-deep);background:var(--accent-soft);border:1px solid var(--accent-line);padding:2px 9px;border-radius:999px;margin-left:8px;letter-spacing:.05em}
  .nav{display:flex;gap:0;margin-left:6px;background:var(--card2);border-radius:10px;padding:3px}
  .navb{font:inherit;font-size:12.5px;font-weight:700;height:30px;padding:0 14px;border-radius:8px;border:none;background:none;color:var(--muted);cursor:pointer;transition:color .2s,background .2s}
  .navb.on{background:var(--card);color:var(--accent-deep);box-shadow:0 1px 3px rgba(16,24,40,.12)}
  .top .sp{flex:1}
  .rolebadge{font-size:11px;font-weight:750;padding:4px 12px;border-radius:999px;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent-deep)}
  .btn{font:inherit;font-size:12px;font-weight:700;padding:0 13px;height:32px;display:inline-flex;align-items:center;gap:6px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,transform .1s,box-shadow .15s}
  .btn:hover{border-color:var(--accent-line);background:var(--card2)} .btn:active{transform:scale(.97)}
  .btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 1px 2px rgba(37,99,235,.32)} .btn.pri:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
  .btn:disabled{background:var(--card2);color:var(--faint);border-color:var(--card2);cursor:not-allowed;box-shadow:none;transform:none}
  .wrap{display:grid;grid-template-columns:230px 1fr 240px;min-height:calc(100vh - 50px)}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}.side,.rail{display:none}.wrap.showlist .main{display:none}.wrap.showlist .side{display:block}}
  .side{border-right:1px solid var(--line);background:var(--card);padding:12px 10px;overflow:auto}
  .side .sh{font-size:10px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:6px 6px 8px;display:flex;justify-content:space-between}
  .titem{font-size:12.5px;padding:8px 10px;border-radius:8px;margin-bottom:3px;color:var(--muted);cursor:pointer;border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .titem:hover{background:var(--card2)} .titem.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--ink);font-weight:650}
  .titem .sub{font-size:10.5px;color:var(--faint);font-weight:400}
  .tgh{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:750;color:var(--ink);padding:10px 6px 4px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .tgh:first-child{padding-top:2px}
  .tgc{font-size:10px;font-weight:600;color:var(--faint);background:var(--card2);border-radius:8px;padding:1px 6px}
  .advsug{display:none;position:absolute;top:100%;left:0;right:0;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-top:3px;max-height:220px;overflow-y:auto;box-shadow:0 6px 18px rgba(0,0,0,.12)}
  .advsug.show{display:block}
  .sugitem{padding:8px 11px;font-size:12.5px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
  .sugitem:hover{background:var(--accent-soft)}
  .sugm{color:var(--faint);font-size:11px}
  /* 연결탭 목록 — 컬럼형 그리드(헤더·행 동일 템플릿, 정보를 행 전체 폭에 펼침). 좁은 화면은 otwrap 가로 스크롤 */
  .otwrap{overflow-x:auto;padding-bottom:2px}
  .othead,.owntab{display:grid;grid-template-columns:44px minmax(170px,1.5fr) 90px minmax(100px,1fr) 80px 88px 60px 108px 64px 64px 64px 148px 64px minmax(120px,1fr) 44px;gap:10px;align-items:center;min-width:1420px}
  .othead{font-size:9.5px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:0 14px 5px}
  .owntab{padding:9px 14px;border:1px solid var(--line);border-radius:13px;margin-bottom:7px;cursor:pointer;background:var(--card);transition:transform .25s var(--ease),box-shadow .2s,border-color .2s}
  .owntab:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(16,24,40,.08);border-color:var(--accent-line)}
  .owntab .oname{min-width:0}
  .owntab .oname b{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .owntab .osub{display:block;font-size:10.5px;color:var(--faint);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .owntab .ocol{font-size:12px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .owntab .ocol.dim{color:var(--faint)}
  .owntab .obr{font-weight:700}
  .owntab .ocnt{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
  .owntab .ocnt b{font-weight:700;color:var(--ink)} .owntab .ocnt .c-sub{color:var(--accent)} .owntab .ocnt .c-paid{color:var(--safe)}
  .owntab .openb{font-size:11px;color:var(--accent);font-weight:700;white-space:nowrap;text-align:right}
  .odot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--faint);opacity:.35;margin-right:6px;vertical-align:1px}
  .odot.a{background:var(--safe);opacity:1}
  /* 정산 컬럼(관제실 대응): 날짜셀·금액셀·비고(클릭 편집) */
  .owntab .odate{font-size:11.5px;font-variant-numeric:tabular-nums}
  .owntab .omoney{font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .owntab .omoney .pd-ok{color:var(--safe);font-weight:700} .owntab .omoney .pd-part{color:var(--warn);font-weight:700} .owntab .omoney .pd-zero{color:var(--faint)}
  .owntab .omemo{font-size:11.5px;color:var(--muted);cursor:text;border-radius:6px;padding:3px 6px;margin:-3px -6px}
  .owntab .omemo:hover{background:var(--card2);outline:1px dashed var(--accent-line)}
  .owntab .omemo i{color:var(--faint);font-style:normal;opacity:.6}
  .omemoin{width:100%;font:inherit;font-size:11.5px;padding:3px 6px;border:1px solid var(--accent-line);border-radius:6px;background:var(--card);color:var(--ink);outline:none}
  /* 브랜드 필터 칩(한 광고주가 다수 브랜드 보유 — 관제실 '브랜드' 컬럼 대응) */
  .obchips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px}
  .obchip{font-size:11px;font-weight:650;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--muted)}
  .obchip:hover{border-color:var(--accent-line)}
  .obchip.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent);color:var(--accent-deep)}
  /* 키트 배지(ok/warn/bad/neutral) — 연결탭 속성 배지 공용 */
  .bb{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--muted)}
  .bb.ok{background:var(--accent-soft);color:var(--accent-deep)}
  .bb.safe{background:var(--safe-soft);color:var(--safe)}
  .bb.warn{background:var(--warn-soft);color:var(--warn)}
  .bb.bad{background:var(--bad-soft);color:var(--bad)}
  .main{padding:18px 22px;overflow:auto}
  .mh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .mh h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.02em}
  .bd{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--card2);color:var(--muted);border:1px solid var(--line)} .bd.g{background:var(--safe-soft);color:var(--safe);border-color:transparent} .bd.sot{background:var(--accent-soft);color:var(--accent);border-color:transparent}
  .metagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin-bottom:16px}
  .mf{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
  .mf .k{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.03em} .mf .v{font-size:13px;font-weight:600;margin-top:2px}
  .wobar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card2)}
  .wobar .wt{font-size:12.5px;font-weight:700} .wobar .wsub{font-size:11px;color:var(--faint)}
  .wodetail{border:1px solid var(--line);border-radius:11px;background:var(--card);margin-bottom:16px;overflow:hidden}
  .wodetail summary{cursor:pointer;list-style:none;padding:11px 14px;font-size:12.5px;font-weight:700;background:var(--card2);display:flex;align-items:center;gap:8px}
  .wodetail summary::-webkit-details-marker{display:none}
  .worow{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:8px 14px;border-top:1px solid var(--line);font-size:12.5px}
  .worow .wk{color:var(--faint);font-weight:650} .worow .wv{white-space:pre-wrap;word-break:break-word}
  .wochip{display:inline-block;font-size:11px;font-weight:650;padding:2px 8px;border-radius:999px;background:var(--adv-soft);color:var(--adv);margin:2px 4px 2px 0}
  .worow2{padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer} .worow2:hover{background:var(--card2)} .worow2.on{border-color:var(--adv);background:var(--adv-soft)}
  .worow2 .t{font-size:12.5px;font-weight:650} .worow2 .s{font-size:11px;color:var(--faint);margin-top:2px}
  .counts{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .cc{flex:1;min-width:170px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;transition:transform .25s var(--ease),box-shadow .2s,border-color .2s}
  .cc:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(16,24,40,.08);border-color:var(--accent-line)}
  .cc .big{font-size:20px;font-weight:800;letter-spacing:-.02em} .cc .big small{font-size:11.5px;font-weight:600;color:var(--faint);margin-left:2px}
  .cc .lb{font-size:11px;font-weight:600;color:var(--muted);margin-top:0} .cc.s .big{color:var(--safe)} .cc.p .big{color:var(--accent-deep)}
  /* KPI 게이지(도넛) — 키트 cc-gauge */
  .gauge{width:44px;height:44px;position:relative;flex:none}
  .gauge svg{transform:rotate(-90deg);display:block}
  .gauge circle{fill:none;stroke-width:4}
  .gauge .trk{stroke:var(--card2)}
  .gauge .bar{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:113;transition:stroke-dashoffset .9s var(--ease)}
  .gauge.g-safe .bar{stroke:var(--safe)} .gauge.g-warn .bar{stroke:var(--warn)}
  .gauge .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  thead th{background:var(--card2);text-align:left;padding:10px 12px;font-size:11px;letter-spacing:.02em;color:var(--muted);font-weight:750;border-bottom:2px solid var(--accent-line)}
  tbody td{padding:9px 12px;border-top:1px solid var(--line)} tbody tr{transition:background .12s} tbody tr:hover{background:var(--card2)}
  .chk{font-weight:800}.chk.y{color:var(--safe)}.chk.n{color:var(--faint)}
  .ph{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .src{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--card2);color:var(--faint)} .src.manual{background:var(--warn-soft);color:var(--warn)} .src.order{background:var(--accent-soft);color:var(--accent)}
  /* ── 편집 UI ── */
  .ecell{cursor:text;border-bottom:1px dashed transparent;border-radius:3px;padding:1px 3px} .ecell:hover{border-bottom-color:var(--line2);background:var(--card2)}
  .ecell.edited{background:var(--accent-soft);border-bottom-color:var(--accent)}
  .chk.clk{cursor:pointer;border-radius:4px;padding:0 4px} .chk.clk:hover{background:var(--card2)} .chk.clk.edited{outline:1px solid var(--accent);outline-offset:1px}
  .einp{font:inherit;font-size:12.5px;width:100%;min-width:60px;padding:2px 5px;border:1px solid var(--accent);border-radius:5px;background:var(--card);color:var(--ink)}
  .revb{cursor:pointer;color:var(--accent);font-size:12px;user-select:none} .revb:hover{color:var(--bad)}
  .lock{font-size:10px;opacity:.5}
  tr.amb{background:color-mix(in srgb,var(--warn-soft) 40%,transparent)}
  .rmrow{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--faint);cursor:pointer;font-size:13px;line-height:1} .rmrow:hover{color:var(--bad);border-color:var(--bad)}
  .wchip{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn);cursor:pointer} .wchip.bad{background:var(--bad-soft);color:var(--bad)}
  .addgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0} .addgrid input{padding:7px 10px;border:1px solid var(--line2);border-radius:7px;font:inherit;font-size:13px}
  .editnote{font-size:11px;color:var(--faint);margin-top:12px;line-height:1.5;padding:8px 10px;background:var(--card2);border-radius:8px}
  .hrow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12.5px;border-top:1px solid var(--line)}
  .exp{display:inline-block;cursor:pointer;color:var(--faint);font-size:11px;transition:transform .15s;user-select:none;width:12px} .exp:hover{color:var(--accent)} .exp.open{transform:rotate(90deg);color:var(--accent)}
  tr.detrow td{background:var(--card2);padding:0} tr.detrow:hover{background:var(--card2)}
  .detwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 14px} @media(max-width:820px){.detwrap{grid-template-columns:1fr}}
  .dcard{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
  .dch{font-size:11px;font-weight:750;color:var(--muted);margin-bottom:8px}
  .dgrid{display:grid;grid-template-columns:1fr;gap:4px}
  .dpair{display:flex;gap:8px;font-size:12px;line-height:1.5;border-bottom:1px dotted var(--line);padding:2px 0} .dpair:last-child{border-bottom:none}
  .dpair .dk{flex:none;width:96px;color:var(--faint);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .dpair .dv{flex:1;color:var(--ink);word-break:break-word}
  .dnone{font-size:12px;color:var(--faint);padding:4px 0}
  /* ── 시트형 그리드(열람) ── */
  .gridscroll{border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 300px);background:var(--card)}
  table.sheetgrid{border-collapse:separate;border-spacing:0;font-size:12px;white-space:nowrap;min-width:100%}
  table.sheetgrid th,table.sheetgrid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 9px;text-align:left;height:30px}
  table.sheetgrid thead th{position:sticky;top:0;z-index:3;background:var(--card2);font-weight:700;color:var(--muted);font-size:10.5px;border-bottom:2px solid var(--line2)}
  table.sheetgrid .gfz{position:sticky;background:var(--card);z-index:2}
  table.sheetgrid thead th.gfz{z-index:4;background:var(--card2)}
  .gnum{text-align:center;color:var(--faint);font-weight:700} .gnm{font-weight:600}
  table.sheetgrid .gph{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  table.sheetgrid tbody tr:hover td{background:#f7faff} table.sheetgrid tbody tr:hover td.gfz{background:#eef4ff}
  .gcell.gempty{color:var(--line2)} .gcell.gok{color:var(--safe);font-weight:600}
  .gridbar{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .gridbar label{font-size:12px;color:var(--muted);font-weight:650}
  .gridbar select{font:inherit;font-size:12.5px;padding:5px 9px;border:1px solid var(--line2);border-radius:7px;background:var(--card);color:var(--ink)}
  .gnote{font-size:11px;color:var(--faint)} .gnote b{color:var(--muted)}
  /* ── 관측 대시보드 ── */
  .ovwrap{padding:18px 22px;overflow:auto;height:calc(100vh - 50px)}
  .ovnote{font-size:11.5px;color:var(--faint);margin:-4px 0 14px;line-height:1.5} .ovnote b{color:var(--muted)}
  .ovsearch{font:inherit;font-size:12.5px;padding:6px 11px;border:1px solid var(--line2);border-radius:8px;background:var(--card);color:var(--ink);width:180px}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
  table.ovtable{width:100%;border-collapse:collapse;font-size:12.5px;min-width:820px}
  table.ovtable thead th{background:var(--card2);text-align:left;padding:9px 11px;font-size:10.5px;color:var(--muted);font-weight:750;white-space:nowrap;position:sticky;top:0}
  table.ovtable td{padding:8px 11px;border-top:1px solid var(--line);white-space:nowrap} table.ovtable tbody tr:hover{background:var(--card2)}
  table.ovtable td.num,table.ovtable td.ctr{text-align:center} table.ovtable td.ctr{font-weight:800}
  .ovnm{cursor:pointer} .ovnm:hover b{color:var(--accent);text-decoration:underline} .ovsub{font-size:10.5px;color:var(--faint);font-weight:400}
  .ovtable .ok{color:var(--safe)} .ovtable .no{color:var(--bad)} .ovtable .vs{color:var(--line2);margin:0 1px} .ovtable .diff{color:var(--bad);font-weight:700}
  .btn.xs{font-size:11px;padding:3px 9px}
  /* ── 그리드 제거 × · 편집 이력 모달 ── */
  .rmx{cursor:pointer;color:var(--faint);font-weight:700;font-size:13px;margin-left:6px;opacity:0;transition:opacity .12s} tr:hover .rmx{opacity:.7} .rmx:hover{color:var(--bad);opacity:1}
  .modalov{position:fixed;inset:0;background:rgba(15,35,42,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px}
  .modalbox{background:var(--card);border-radius:14px;width:900px;max-width:96vw;max-height:86vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 14px 44px rgba(0,0,0,.28)}
  .modalhd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)} .modalhd b{font-size:14px;flex:1}

<script>
const API_BASE = (function(){ if (window.REVIEW_API_URL) return window.REVIEW_API_URL; if (location.hostname==='localhost') return 'http://localhost:3000'; return 'https://sublime-magic-production-790b.up.railway.app'; })();
// 토큰 핸드오프 2경로: ① 인트라넷 SSO(#sso=<token> 프래그먼트, 크로스오리진이라 URL 경유 — 도착 즉시 저장 후
//   주소창에서 제거, 새 신원 도착이므로 기존 세션 덮어씀) ② admin.html raw_sso(localStorage, 기존 세션 존중).
(function initToken(){
  try{   // ① #sso — 디코드 실패해도 raw_sso 폴백이 죽지 않게 분리 try
    const m=(location.hash||'').match(/[#&]sso=([^&]+)/);
    if(m){ let t=null; try{ t=decodeURIComponent(m[1]); }catch(_){ }
      try{ history.replaceState(null,'',location.pathname+location.search); }catch(_){ }
      if(t){ sessionStorage.setItem('admin_token', t); return; } }
  }catch(_){ }
  try{   // ② raw_sso(관리자 핸드오프) — 기존 세션 존중
    const raw=localStorage.getItem('raw_sso'); if(raw){ const sso=JSON.parse(raw); if(sso&&sso.token&&!sessionStorage.getItem('admin_token')) sessionStorage.setItem('admin_token', sso.token); }
  }catch(_){ }
})();
function token(){ return sessionStorage.getItem('admin_token') || ''; }
async function api(path, opts){ const o=Object.assign({headers:{}},opts||{}); o.headers['Authorization']='Bearer '+token(); if(o.body)o.headers['Content-Type']='application/json'; const r=await fetch(API_BASE+path,o); return r.json(); }
const $=(s,el)=>(el||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function parseJwt(t){ try{ const b=atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')); return JSON.parse(new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)))); }catch(_){ return {}; } }   // base64url + UTF-8(한글 이름) 정상 디코드
// ── Clarity 키트 헬퍼 ──
// KPI 도넛 게이지(r=18, 둘레≈113). cls: ''(블루)/'g-safe'/'g-warn'
function gaugeSvg(pct, label, cls){ const p=Math.max(0,Math.min(100,Math.round(pct||0)));
  return `<span class="gauge ${cls||''}"><svg width="44" height="44"><circle class="trk" cx="22" cy="22" r="18"/><circle class="bar" cx="22" cy="22" r="18" style="stroke-dashoffset:${(113*(1-p/100)).toFixed(1)}"/></svg><span class="pct">${esc(label!=null?label:p+'%')}</span></span>`; }
// 탭명 파싱 v2: "7/3(쿠팡)디아쉬끄_퀵픽싱 헤어틴트 50건" → 채널·목표건수·차수 + 브랜드·상품·바이럴.
// 관제실(어니스트캄x인애드 업무포털) 컬럼(브랜드|상품|채널|차수|건수)을 탭명에서 근사 추출 — 비정형은 미표시(fail-soft).
// 브랜드 = 첫 '_' 세그먼트(날짜·채널 제거 후): "0604엘시스테인_화이트닝코렉터크림100건" → 엘시스테인/화이트닝코렉터크림.
const _TAB_CHANNELS=['쿠팡','네이버','스마트스토어','메이커스','톡스토어','카카오','컬리','마켓컬리','공영쇼핑','올리브영','W컨셉','무신사','지그재그','에이블리','오늘의집','11번가','지마켓','옥션','티몬','위메프','SSG','롯데온'];
function parseTabMeta(name){ const s=String(name||''); const m={};
  const ch=s.match(/\(([^)]{1,10})\)/); if(ch&&!/^\d/.test(ch[1])) m.channel=ch[1].trim();
  const cnt=s.match(/(\d{1,4})\s*건/); if(cnt) m.count=parseInt(cnt[1],10);
  const rnd=s.match(/(\d{1,2})\s*차(?![수선])/); if(rnd) m.round=rnd[1]+'차';
  if(/바이럴|체험단|카페\s*\/\s*(블로그|커뮤)/.test(s)) m.viral=true;
  // 브랜드/상품: (채널)·선행날짜(7/3, 0612)) 제거 → '_' 분해 → 세그 꼬리(건수·차수·바이럴 채널어) 정리
  const core=s.replace(/\([^)]{0,10}\)/g,' ')
    .replace(/^\s*\d{1,2}\s*\/\s*\d{1,2}\s*[).\-]?/,'')
    .replace(/^\s*\d{4}\s*[).\-]?/,'').trim();
  let segs=core.split(/_+/).map(x=>x.trim()).filter(Boolean);
  if(segs.length&&_TAB_CHANNELS.includes(segs[0])){ if(!m.channel)m.channel=segs[0]; segs=segs.slice(1); }
  segs=segs.map(x=>x
    .replace(/\d{1,4}\s*건.*$/,'')
    .replace(/(\s*\/?\s*(카페|블로그|커뮤니티|커뮤|바이럴|체험단))+\s*$/,'')
    .replace(/\s*\d{1,2}\s*차(?![수선])\s*$/,'')
    .trim()).filter(Boolean);
  if(segs.length>=2){ if(segs[0].length<=14){ m.brand=segs[0]; m.product=segs.slice(1).join(' '); } else m.product=segs.join(' '); }
  else if(segs.length===1&&(m.channel||m.count||m.viral)) m.product=segs[0];   // 차수만으론 상품 추정 안 함(탭명 중복 노출 방지)
  return m; }

function renderLogin(){

async function doLogin(){ const name=$('#lname').value.trim(), pw=$('#lpw').value;
  let r=await api('/api/admin/login',{method:'POST',body:JSON.stringify({name,pw})});

async function loadTabs(){

  const gkeys=[...groups.keys()].sort((a,b)=>{ if(!a) return 1; if(!b) return -1; return a.localeCompare(b,'ko'); });
  const item=i=>{ const t=STATE.tabs[i]; return `<div class="titem" data-i="${i}" onclick="selTab(${i})">${esc(t.tabName)}<div class="sub">${esc(t.spreadsheetTitle||'')}</div></div>`; };

function _tcell(r, field, val){   // 편집 가능 텍스트 셀

}

// ══ P2 정산 파이프라인 스텝퍼 ══
const _SETTLE_PAY={unpaid:['미입금','bad'],partial:['부분입금','warn'],paid:['입금완료','safe']};
const _SETTLE_INV={not_issued:['미발행','warn'],issued:['발행완료','safe'],requested:['발행요청','warn']};
const _SETTLE_Q={draft:['작성중','warn'],sent:['발송','ok'],accepted:['수락','safe'],rejected:['반려','bad'],expired:['만료','bad']};
function _wonFmt(n){ return (Number(n)||0).toLocaleString('ko-KR')+'원'; }
async function loadSettlement(t){
  if(!t) return; const box=$('#settlementsec'); if(!box) return;
  const r=await api(`/api/trackb/workdesk/settlement?sheetId=${encodeURIComponent(t.sheetId)}&tabName=${encodeURIComponent(t.tabName)}`).catch(()=>null);

  STATE.settle={ data:r, tab:t }; renderSettlement();
}
function _step(n,label,state,sub){ // state: 'done'|'wait'|'off'
  const ic=state==='done'?'✓':(state==='wait'?'…':'—');
  return `<div class="stpstep ${state}"><div class="stpic">${ic}</div><div class="stpmeta"><div class="stpk">${esc(label)}</div><div class="stpv">${sub||'<span class="stpoff">—</span>'}</div></div></div>`;
}
function renderSettlement(){
  const st=STATE.settle; if(!st) return; const box=$('#settlementsec'); if(!box) return; const d=st.data;
  const canLink=STATE.role!=='advertiser';
  if(d.hidden){ box.innerHTML=`<div class="sect" style="margin-top:16px"><div class="st">정산</div><div class="stpcard"><div class="empty" style="padding:16px">정산 정보는 비공개로 설정되어 있습니다.</div></div></div>`; return; }
  if(!d.linked){
    box.innerHTML=`<div class="sect" style="margin-top:16px"><div class="st">정산</div>
      <div class="stpcard nolink"><div class="stpnl"><b>연결된 계약이 없습니다.</b><span>인트라넷 계약(C-번호)을 연결하면 견적·계산서·입금 상태가 여기 표시됩니다.</span></div>
      ${canLink?`<button class="btn pri" onclick="openLinkModal()">계약 연결</button>`:''}</div></div>`;
    return;
  }
  const co=d.closeout, q=d.quote, inv=d.invoice, pay=d.payment;
  const coAvail=d.closeoutAvailable!==false;   // 데이터 원천(P3) 있으면 생성/CSV 어포던스
  const coState=!coAvail?'off':(co&&co.date?'done':'wait');
  const coSub=!coAvail?'<span class="stpoff">준비중</span>'
    :(co&&co.date
      ?`${esc(String(co.date).slice(0,10))} · ${co.rowCount||0}건 · <a href="#" onclick="dlCloseoutCsv(event)">CSV</a>${canLink?` · <a href="#" onclick="genCloseout(event)">재생성</a>`:''}`
      :(canLink?'<a href="#" onclick="genCloseout(event)">마감자료 생성</a>':'<span class="stpoff">미생성</span>'));
  const qSub=q&&q.quoteNumber?`${esc(q.quoteNumber)}${q.status?` · <span class="bb ${(_SETTLE_Q[q.status]||['',''])[1]}">${(_SETTLE_Q[q.status]||[q.status])[0]}</span>`:''}`:'<span class="stpoff">견적 없음</span>';
  const invSub=inv?`<span class="bb ${(_SETTLE_INV[inv.status]||['','neutral'])[1]||'neutral'}">${(_SETTLE_INV[inv.status]||[inv.status])[0]}</span>${inv.date?` · ${esc(String(inv.date).slice(0,10))}`:''}`:'<span class="stpoff">—</span>';
  const paySub=pay?`<span class="bb ${(_SETTLE_PAY[pay.status]||['','neutral'])[1]||'neutral'}">${(_SETTLE_PAY[pay.status]||[pay.status])[0]}</span>${pay.date?` · ${esc(String(pay.date).slice(0,10))}`:''}`:'<span class="stpoff">—</span>';
  box.innerHTML=`<div class="sect" style="margin-top:16px"><div class="st">정산 ${d.contractNumber?`<span class="bb ok">${esc(d.contractNumber)}</span>`:''}${d.amount!=null?`<span class="bb">${_wonFmt(d.amount)}</span>`:''}${d.proxyDown?'<span class="bb warn" title="인트라넷 조회 실패 — 라벨만 표시">연동 지연</span>':''}</div>
    <div class="stpcard">
      <div class="stprow">
        ${_step(1,'마감자료',coState,coSub)}
        <div class="stparrow">→</div>
        ${_step(2,'견적서',q&&q.status==='accepted'?'done':(q&&q.quoteNumber?'wait':'off'),qSub)}
        <div class="stparrow">→</div>
        ${_step(3,'계산서',inv&&inv.status==='issued'?'done':(inv?'wait':'off'),invSub)}
        <div class="stparrow">→</div>
        ${_step(4,'입금',pay&&pay.status==='paid'?'done':(pay?'wait':'off'),paySub)}
      </div>
      ${canLink?`<div class="stpfoot"><span class="stpby">연결: ${esc(d.linkedBy||'')}</span><button class="btn xs" onclick="openLinkModal()">계약 변경</button><button class="btn xs" onclick="unlinkSettle()">연결 해제</button></div>`:''}
    </div></div>`;
}

function closeLinkModal(){ const m=$('#linkmodal'); if(m) m.remove(); }
let _lkTimer=null;
function searchSales(q){
  clearTimeout(_lkTimer); const box=$('#lkresults'); if(!box) return;
  if(!(q||'').trim()){ box.innerHTML='<div class="empty" style="padding:20px">검색어를 입력하세요.</div>'; return; }

async function loadThread(t){

  renderThread();

function renderThread(){
  const st=STATE.thread; if(!st) return; const box=$('#threadsec'); if(!box) return;
  const items=st.items, ci=st.canInternal;
  const openReq=items.filter(x=>x.kind==='request'&&x.status!=='done').length;
  const rows=items.map(x=>{
    const mine=(x.authorRole===STATE.role)&&(String(x.authorName||'')===String(STATE.name||''));
    const canDel=mine||STATE.role==='master'||STATE.role==='admin';
    const roleLbl={master:'관리자',admin:'관리자',staff:'AE',advertiser:'광고주'}[x.authorRole]||x.authorRole;
    const when=x.createdAt?String(x.createdAt).replace('T',' ').slice(0,16):'';
    let statusChip='';
    if(x.kind==='request'){ const s=x.status||'open';

      statusChip=`<span class="bb ${smap[s][1]}">${smap[s][0]}</span>`;
      if(s!=='done') statusChip+=` <button class="btn xs" onclick="setThreadStatus('${x.id}','${s==='open'?'confirming':'done'}')">${s==='open'?'확인중':'완료'}로</button>`;
      else statusChip+=x.resolvedBy?` <span style="font-size:10.5px;color:var(--faint)">by ${esc(x.resolvedBy)}</span>`:'';
    }
    return `<div class="thitem${x.kind==='request'?' req':''}">
      <div class="thhd"><span class="bb ${x.authorRole==='advertiser'?'':'ok'}">${esc(roleLbl)}</span><b>${esc(x.authorName||'')}</b>
        ${x.kind==='request'?'<span class="bb warn">확인요청</span>':''}${x.internalOnly?'<span class="bb" title="내부 전용 — 광고주 미노출">🔒 내부</span>':''}
        <span class="thwhen">${esc(when)}</span>${canDel?`<span class="thdel" title="삭제" onclick="delThread('${x.id}')">×</span>`:''}</div>
      <div class="thbody">${esc(x.body||'')}</div>

  }).join('')||`<div class="empty" style="padding:18px">아직 글이 없습니다. 첫 코멘트/확인요청을 남겨보세요.</div>`;

        <button class="btn pri" onclick="postThread()">등록</button>
      </div></div></div>`;
  const ta=$('#thbody'); if(ta) ta.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='Enter') postThread(); });

// 컬럼 폭(px) — 고정열 오프셋 계산과 최소폭에 사용. 없으면 기본값.
const _COLW={'#':44,'참여자':112,'연락처':110,'번호':48,'담당자':66,'구매일자':98,'인애드명단':90,'주문자제출':90,'수취인':78,'id':118,'주소':190,'은행':66,'계좌번호':116,'예금주':72,'결제금액':82,'리뷰제출':96,'입금':64,'주문번호':134,'비고(닉네임)':110};
function _colW(h){ return _COLW[h]||92; }
// 시트 일련번호(1899-12-30 기준) → YYYY-MM-DD. 날짜형 헤더 + 순수 숫자일 때만 변환(금액 등 오변환 방지).
function _serialToDate(n){ const ms=Math.round((n-25569)*86400000); const d=new Date(ms); if(isNaN(d.getTime()))return null; const y=d.getUTCFullYear(); if(y<2000||y>2100)return null; const p=x=>String(x).padStart(2,'0'); return `${y}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())}`; }
function _gridVal(h, raw){ const v=(raw==null?'':String(raw)).trim(); if(!v)return ''; if(/일자|날짜|date/i.test(h)&&/^\d{4,6}(\.\d+)?$/.test(v)){ const dt=_serialToDate(parseFloat(v)); if(dt)return dt; } return v; }

// 시트형 그리드: 왼쪽 고정 = #·참여자·연락처(DB 리뷰어 신원) + (선택 시)시트 컬럼 수취인까지 · 오른쪽 = 시트 컬럼 전체.
function buildGrid(wd){
  const H=wd.headers||[];
  const revI=H.indexOf('리뷰제출'), payI=H.indexOf('입금');
  // 전체 컬럼: [#, 참여자, 연락처, ...시트헤더]. 고정 개수 = 3 + (freezeUpto 시트컬럼 인덱스+1)
  const fzIdx = STATE.freezeUpto ? H.indexOf(STATE.freezeUpto) : -1;
  const frozenN = 3 + (fzIdx>=0 ? fzIdx+1 : 0);
  const cols = ['#','참여자','연락처', ...H];
  const lefts=[]; let acc=0; for(let i=0;i<cols.length;i++){ lefts[i]=acc; acc+=_colW(cols[i]); }
  const cstyle=(i)=>{ const w=_colW(cols[i]); let s=`min-width:${w}px;width:${w}px;`; if(i<frozenN){ s+=`left:${lefts[i]}px;`; if(i===frozenN-1)s+='box-shadow:2px 0 0 var(--line2);'; } return s; };
  const cls=(i,extra)=>`class="${i<frozenN?'gfz ':''}${extra||''}"`;
  const thead=`<tr>${cols.map((h,i)=>`<th ${cls(i)} style="${cstyle(i)}">${esc(h==='#'?'#':h)}</th>`).join('')}</tr>`;
  const body=(wd.roster||[]).map(r=>{
    const rj=(r.rowJson&&typeof r.rowJson==='object')?r.rowJson:{};
    const ceMap=(r.cellEdits&&typeof r.cellEdits==='object')?r.cellEdits:{};
    const canE = STATE.canEdit && r.editable!==false;
    const badge = r.source==='manual'?' <span class="src manual">수동</span>':(r.hasOrder?' <span class="src order">주문</span>':'')
                + (r.editable===false?' <span class="lock" title="주문/신원 앵커 없음 또는 중복 — 편집 잠금">🔒</span>':'');
    // 편집 셀 렌더(주입 안전: 헤더는 data-field 속성으로만 전달, onclick 인라인 없음)
    const eCell=(field, disp, edited, extraCls, styleI)=> canE
      ? `<td ${cls(styleI,'gcell'+(disp?'':' gempty')+(extraCls||''))} style="${cstyle(styleI)}"><span class="ecell${edited?' edited':''}" data-val="${esc(disp)}" data-id="${esc(r.id)}" data-field="${esc(field)}" onclick="beginEditCell(this)">${esc(disp||'—')}</span>${edited?` <span class="revb" title="되돌리기" data-id="${esc(r.id)}" data-field="${esc(field)}" onclick="revertCell(event,this)">↩</span>`:''}</td>`
      : `<td ${cls(styleI,'gcell'+(disp?'':' gempty')+(extraCls||''))} style="${cstyle(styleI)}">${esc(disp||'')}</td>`;
    let tds=`<td ${cls(0,'gnum')} style="${cstyle(0)}">${esc(r.seq)}</td>`+
            (canE
              ? `<td ${cls(1,'gnm')} style="${cstyle(1)}"><span class="ecell${(r.editedFields||[]).includes('reviewer_name')?' edited':''}" data-val="${esc(r.name||'')}" data-id="${esc(r.id)}" data-field="reviewer_name" onclick="beginEditCell(this)">${esc(r.name||'—')}</span>${badge}<span class="rmx" title="명단에서 제거(숨김)" onclick="hideRow('${esc(r.id)}')">×</span></td>`
              : `<td ${cls(1,'gnm')} style="${cstyle(1)}">${esc(r.name||'—')}${badge}</td>`)+
            eCell('phone8', r.phone8||'', (r.editedFields||[]).includes('phone8'), 'gph', 2);
    H.forEach((h,j)=>{ const i=j+3; const ed=(h in ceMap); const raw= ed?ceMap[h]:rj[h]; const disp= ed?(raw==null?'':String(raw)):_gridVal(h, raw); const ok=((j===revI||j===payI)&&disp)?' gok':'';
      tds+=eCell('col:'+h, disp, ed, ok, i); });
    return `<tr>${tds}</tr>`;
  }).join('')||`<tr><td colspan="${cols.length}" class="empty">명단 없음 — 그림자 투영을 실행하세요.</td></tr>`;
  // 고정 열 선택(수취인까지 등) — 시트 컬럼 중 신원계열만 옵션으로.
  const fzOpts=['<option value="">기본(연락처까지)</option>']
    .concat(H.filter(h=>['번호','담당자','구매일자','인애드명단','주문자제출','수취인','주소'].includes(h))
      .map(h=>`<option value="${esc(h)}"${STATE.freezeUpto===h?' selected':''}>${esc(h)}까지 고정</option>`)).join('');
  return `<div class="gridbar"><label>고정 열</label><select id="fzsel" onchange="setFreeze(this.value)">${fzOpts}</select>
      <button class="btn xs" onclick="showEditHistory()">편집 이력</button>
      <span class="gnote">구글시트와 동일 컬럼·가로 배열 · <b>셀 클릭 편집</b>(Track B 전용, 시트·주문 무접촉) · ↩ 되돌리기 · 날짜 자동표시 · 리뷰제출/입금 편집 시 카운트 연동</span></div>
    <div class="gridscroll"><table class="sheetgrid"><thead>${thead}</thead><tbody>${body}</tbody></table></div>
    <div id="addbox"></div>
    <button class="btn" style="margin-top:10px" onclick="showAddForm()">＋ 참여자 추가</button>`;
}

// cutover 종합 판정 — fail-closed: real은 "신선한" 값만 인정(세션 [정밀] 30분 TTL > 서버 스냅샷 fresh > 없음=미검증).
const REAL_TTL_MS = 30*60*1000;
function _freshReal(o){
  if(typeof o.real==='number' && o.realAt && (Date.now()-o.realAt)<REAL_TTL_MS) return {v:o.real,src:'방금 정밀',at:o.realAt};
  const lp=o.lastParity;
  if(lp && lp.fresh && typeof lp.real==='number') return {v:lp.real,src:'스냅샷',at:lp.takenAt?new Date(lp.takenAt).getTime():null};
  return null;
}
function _cutoverVerdict(o){
  if(o.sourceOfTruth==='db') return {cls:'ok',txt:'전환됨',title:'이미 Track B 원본(cutover 완료)'};
  if(o.ghost) return {cls:'no',txt:'유령',title:'A·B 모두 활성 0행(아카이브/리네임 잔재) — cutover 대상 아님'};
  const base=o.countMatch&&o.owned&&o.woLinked;
  if(!base){ const m=[]; if(!o.countMatch)m.push('카운트'); if(!o.owned)m.push('소유'); if(!o.woLinked)m.push('발주'); return {cls:'no',txt:'미충족',title:'미충족: '+m.join('·')}; }
  const fr=_freshReal(o);
  if(fr) return fr.v===0
    ?{cls:'ok',txt:'✅ 준비',title:`카운트·소유·발주·진짜불일치0 충족 (${fr.src}${fr.at?' '+_fmtTs(fr.at):''}) → cutover 가능`}
    :{cls:'no',txt:'불일치 '+fr.v,title:`진짜 불일치 ${fr.v}건 (${fr.src})`};
  if(typeof o.real==='number') return {cls:'warn',txt:'정밀 만료',title:'정밀 결과가 30분 경과 — [정밀] 재실행 필요'};
  return {cls:'warn',txt:'정밀 필요',title:'카운트·소유·발주 충족 — [정밀]로 진짜불일치 확인 필요'};
}
function _wbCell(o){
  const wb=o.writeback;
  if(o.sourceOfTruth==='db'){
    if(!wb||wb.engineOn===undefined) return '<span class="ovsub" title="구 백엔드 응답(배포 스큐) — write-back 상태 미상. 백엔드 배포 완료 후 새로고침">?</span>';
    if(!wb.engineOn) return `<span class="no" title="TRACK_B_WRITEBACK=1 미설정 — 토글 편집이 시트에 반영되지 않는 중${wb.pending?` (대기 ${wb.pending})`:''}">엔진 OFF</span>`;
    const parts=[]; if(wb.pending)parts.push('대기 '+wb.pending); if(wb.held)parts.push('held '+wb.held); if(wb.blocked)parts.push('blk '+wb.blocked);

function _spark(vals){ if(!vals.length)return ''; const w=520,h=46,pad=4,max=Math.max(1,...vals),n=vals.length;
  const X=i=>pad+(n<=1?(w-2*pad)/2:i*(w-2*pad)/(n-1)), Y=v=>h-pad-(v/max)*(h-2*pad);
  const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' '); const last=vals[vals.length-1];
  const dots=vals.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.2" fill="${v===0?'var(--safe)':'var(--bad)'}"/>`).join('');
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="margin-bottom:10px;background:var(--card2);border-radius:8px">${n>1?`<polyline fill="none" stroke="${last===0?'var(--safe)':'var(--bad)'}" stroke-width="2" points="${pts}"/>`:''}${dots}</svg>`;
}

function renderReadiness(rd){ if(!rd) return '';

  const dot=(ok,warn)=>`<span class="rdot ${ok?'ok':(warn?'warn':'no')}"></span>`;
  const woOk=wo.linked && wo.filled>=3;
  const owNames=(ow.owners||[]).map(o=>esc(o.name)+(o.wholeSheet?'(시트전체)':'')).join(', ');
  const linkPct = fi.activeRows ? Math.round(fi.linkedOrders/fi.activeRows*100) : 0;
  const won = (fi.writtenAmount||0).toLocaleString('ko-KR');
  return `<div class="sh" style="margin-top:14px">전환 준비도</div>
    <div class="rdlist">
      <div class="rdrow">${dot(woOk, wo.linked&&!woOk)}<span class="rl">작업발주 연결</span><span class="rv">${wo.linked?(wo.filled+'/'+wo.of+' 필드'):'미연결'}</span></div>
      <div class="rdrow">${dot(ow.assigned)}<span class="rl">업체 소유</span><span class="rv">${ow.assigned?(owNames||'지정됨'):'미지정'}</span></div>
      <div class="rdrow">${dot(fi.linkedOrders>0, fi.activeRows>0&&fi.linkedOrders===0)}<span class="rl">주문 귀속</span><span class="rv">${fi.linkedOrders}/${fi.activeRows} 링크${won!=='0'?(' · '+won+'원'):''}</span></div>
    </div>`;
}

// 진실원천 전환(master 전용) — 옵션 A cutover 스위치. 'db' 전환은 진짜불일치 0 게이트(409면 force 확인).
async function flipSoT(value, force){
  if(!STATE.cur)return;
  if(value==='db' && !force && !confirm(`이 탭의 원본을 Track B(DB)로 전환합니다.\n\n옵션 A(미러 유지·되돌리기 가능)이며, 시트 쓰기반영 엔진(P2)이 붙기 전까지 라이브 동작은 바뀌지 않습니다.\n계속할까요?`)) return;
  const btn=$('#sotBtn'); if(btn){btn.disabled=true;btn.textContent='전환 중…';}
  const r=await api('/api/trackb/source-of-truth',{method:'POST',body:JSON.stringify({sheetId:STATE.cur.sheetId,tabName:STATE.cur.tabName,value,force:!!force})});
  if(r&&r.ok){ toast(`원본 → ${value==='db'?'Track B':'시트'}`); selTab(STATE.tabs.indexOf(STATE.cur)); return; }
  if(r&&r.error==='parity_not_clean'){
    // force 마찰: confirm 원클릭이 아니라 탭명을 직접 타이핑해야 강제 전환(우발적 force 차단, 검증 미통과 명시).
    const typed=prompt(`방금 서버가 재계산한 진짜 불일치가 ${r.real}건입니다(권장: 0).\n(화면의 이전 [정밀] 결과가 아니라 지금 시점 값입니다.)\n\n검증 미통과 상태로 강제 전환하려면 탭 이름을 정확히 입력하세요:\n${STATE.cur.tabName}`);
    if(typed!==null && typed.trim()===STATE.cur.tabName) return flipSoT('db', true);
    if(typed!==null) toast('탭 이름 불일치 — 강제 전환 취소됨');
  } else if(r&&r.error==='parity_check_failed'){
    toast('전환 거부: 정밀검증 실패('+((r&&r.detail)||'오류')+') — 잠시 후 재시도하세요');
  } else if(r&&r.error==='empty_tab'){
    toast('전환 거부: A·B 모두 0행(유령/아카이브 탭) — cutover 대상이 아닙니다');
  } else { toast('전환 실패: '+((r&&r.error)||'오류')); }
  if(btn){btn.disabled=false;btn.textContent=value==='db'?'Track B로 전환':'시트로 되돌리기';}
}

    return `<div class="wobar"><span class="wt">작업발주 미연결</span><span class="wsub">발주(작업오더)를 연결하면 작업세부가 표시되고 모집 인원만큼 명단을 준비할 수 있습니다.</span>
      <span style="flex:1"></span><button class="btn pri" onclick="openWorkOrderPicker()">＋ 발주 연결</button></div>`;
  }
  const fields=[['상품',d.productOption],['모집 인원',d.recruitCount],['일건수',d.dailyCountText||d.dailyCount],
    ['구매시간',d.purchaseTime],['배송',d.deliveryType],['페이',d.payAmount?Number(d.payAmount).toLocaleString()+'원':''],
    ['리뷰유형',d.reviewType],['유입키워드',d.inflowKeyword],['유입방식',d.inflowType],['유입가이드',d.inflowGuide],
    ['리뷰가이드',d.reviewGuide],['특이사항',d.specialNotes],['상품 URL',d.productUrl],
    ['시작일',d.startDate?String(d.startDate).slice(0,10):''],['담당',d.managerName]];
  const opts=Array.isArray(d.options)?d.options:[];
  const optRow=opts.length?`<div class="worow"><span class="wk">옵션</span><span class="wv">${opts.map(o=>`<span class="wochip">${esc(o)}</span>`).join('')}</span></div>`:'';
  const rows=fields.filter(([k,v])=>v!=null&&String(v).trim()!=='').map(([k,v])=>`<div class="worow"><span class="wk">${esc(k)}</span><span class="wv">${esc(String(v))}</span></div>`).join('');
  const adminCtl=isAdmin?`<span style="flex:1"></span>
      <button class="btn xs" onclick="prepareRoster()" title="발주 모집 인원만큼 빈 명단 슬롯을 준비(부족분만 생성·멱등)">명단 준비 (모집 ${d.recruitCount||0})</button>
      <button class="btn xs" onclick="openWorkOrderPicker()">발주 변경</button>
      <button class="btn xs" onclick="unlinkWO()">연결 해제</button>`:'';
  return `<div class="wobar"><span class="wt">📋 발주: ${esc(d.title||'(제목 없음)')}</span><span class="wsub">${esc(d.status||'')} · 모집 ${d.recruitCount||0}</span>${adminCtl}</div>
    <details class="wodetail"><summary>작업세부 펼치기 (발주 정형 정보)</summary>${optRow}${rows||'<div class="worow"><span class="wv">세부 정보 없음</span></div>'}</details>`;
}

  ov.innerHTML=`<div class="modalbox"><div class="modalhd"><b>발주 연결 · ${esc(t.tabName)}</b><button class="btn xs" onclick="document.getElementById('woov').remove()">닫기</button></div><div class="modalbd" id="wobd"><div class="empty">불러오는 중…</div></div></div>`;

// ══ write-back 시뮬레이션(P2-2) — 편집이 시트에 반영된다면 무엇이 바뀔지 미리보기(실제 시트 무접촉) ══
async function showWritebackSim(){
  const t=STATE.cur; if(!t)return;
  let ov=document.getElementById('wbov'); if(!ov){ov=document.createElement('div');ov.id='wbov';ov.className='modalov';ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});document.body.appendChild(ov);}
  ov.innerHTML=`<div class="modalbox"><div class="modalhd"><b>write-back 시뮬레이션 · ${esc(t.tabName)}</b><button class="btn xs" onclick="document.getElementById('wbov').remove()">닫기</button></div><div class="modalbd" id="wbbd"><div class="empty">계산 중…</div></div></div>`;
  const r=await api(`/api/trackb/writeback/simulate?sheetId=${encodeURIComponent(t.sheetId)}&tabName=${encodeURIComponent(t.tabName)}`);
  const bd=$('#wbbd'); if(!bd)return;
  if(!r||!r.ok){ bd.innerHTML=`<div class="empty">${esc((r&&r.error)||'조회 실패')}</div>`; return; }
  const s=r.summary||{}, ops=r.ops||[];
  const gmap={ok:'✅ 반영',risky_ownership_key:'⚠️ 위험(소유권키·제외)',risky_order_mapped:'⚠️ 위험(주문매핑칸·제외)',risky_coords:'⚠️ 위험(좌표·제외)',risky_append:'⚠️ 위험(추가·제외)',manual_row:'⚠️ 수동행(검토·제외)',no_anchor:'⛔ 앵커없음',ambiguous:'⛔ 중복신원',no_column:'⛔ 컬럼없음',no_sheet_row:'⛔ 행없음',no_tab_gid:'⛔ gid없음'};
  const tmap={toggle:'제출/입금',edit:'필드편집',add:'행추가',clear:'행삭제'};
  const rows=ops.map(o=>{ const nv=(o.newValue&&typeof o.newValue==='object')?JSON.stringify(o.newValue):(o.newValue==null?'':String(o.newValue));
    return `<tr><td>${esc(tmap[o.type]||o.type)}</td><td>${esc(o.field||'')}</td><td>${esc(o.name||'—')}</td><td>${o.sheetRow||'-'}${o.column?(' · '+esc(o.column)+'열'):''}${o.header?(' <span style="color:var(--faint)">('+esc(o.header)+')</span>'):''}</td><td>${esc(nv)}</td><td>${gmap[o.guard]||esc(o.guard)}</td></tr>`;
  }).join('')||`<tr><td colspan="6" class="empty">반영할 편집 없음</td></tr>`;
  bd.innerHTML=`<div style="font-size:12px;color:var(--muted);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:10px">
      이 탭 편집이 시트에 <b>반영된다면</b> 이렇게 됩니다 — <b style="color:var(--accent)">시뮬레이션이라 실제 시트에는 쓰지 않습니다.</b><br>
      원본: ${r.cutover?'<b>Track B(cutover)</b>':'시트'} · 실제적용 트리거(<code>TRACK_B_WRITEBACK_FULL</code>): <b>${r.triggerOn?'ON':'OFF'}</b>${r.triggerOn?'':' <span style="color:var(--faint)">(OFF = 시뮬레이션만, 시트 무접촉)</span>'}</div>
    <div style="font-size:12.5px;font-weight:650;margin-bottom:8px">총 ${s.total||0} · <span class="ok">반영가능 ${s.ok||0}</span> · <span style="color:var(--warn)">위험(적용제외) ${s.risky||0}</span> · <span style="color:var(--bad)">차단 ${s.blocked||0}</span></div>
    <table class="histtable"><thead><tr><th>유형</th><th>필드</th><th>참여자</th><th>대상(행·열)</th><th>값</th><th>상태</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function onAdvSheet(){
  const sid=($('#advSheet')&&$('#advSheet').value)||'';
  const nameEl=$('#advName'), prev=$('#advSheetTabs');
  if(!sid){ if(nameEl){ nameEl.disabled=true; nameEl.placeholder='먼저 캠페인 시트를 선택하세요'; } if(prev) prev.textContent=''; return; }
  const tabs=((STATE.sheetMap[sid]||{}).tabs||[]);
  if(prev){ const names=tabs.map(t=>t.tabName); prev.textContent = tabs.length ? `탭 ${tabs.length}개: `+names.slice(0,5).join(' · ')+(names.length>5?` 외 ${names.length-5}개`:'') : '이 시트에 활성 탭 없음'; }
  if(nameEl){ nameEl.disabled=false; nameEl.placeholder='예: (주)콩고물'; nameEl.focus(); }
}
// 인트라넷 광고주DB 자동완성(서버 프록시 경유 — 브라우저는 인트라넷 직접 미호출). 실패 시 조용히 무시(수동 입력 가능).
let _sugTimer=null;
function intraSuggest(q){
  clearTimeout(_sugTimer); const box=$('#advSug'); if(!box) return;
  if(!(q||'').trim()){ box.classList.remove('show'); box.innerHTML=''; return; }
  _sugTimer=setTimeout(async()=>{
    const r=await api('/api/trackb/intranet/advertisers?q='+encodeURIComponent(q.trim())).catch(()=>null);
    const items=(r&&r.ok&&r.items)||[];
    if(!items.length){ box.classList.remove('show'); box.innerHTML=''; return; }
    box.innerHTML=items.map(it=>`<div class="sugitem" onclick="pickIntra('${esc(it.name).replace(/'/g,'&#39;')}')">${esc(it.name)}${it.manager?`<span class="sugm">${esc(it.manager)}</span>`:''}</div>`).join('');
    box.classList.add('show');
  },250);
}
function pickIntra(name){ const el=$('#advName'); if(el) el.value=name; const box=$('#advSug'); if(box){ box.classList.remove('show'); box.innerHTML=''; } }
async function createAdvertiser(){
  const sheetId=($('#advSheet')&&$('#advSheet').value)||'';
  const name=($('#advName').value||'').trim(), inad_pm=(STATE.name||'').trim();
  const err=$('#advErr'); if(err) err.textContent='';
  if(!sheetId){ if(err) err.textContent='캠페인 시트를 먼저 선택하세요.'; return; }
  if(!name){ if(err) err.textContent='거래처명을 입력하세요.'; return; }
  const r=await api('/api/trackb/advertisers',{method:'POST',body:JSON.stringify({ name, inad_pm })});
  if(!(r&&r.ok)){ if(err) err.textContent=(r&&r.error)||'등록 실패'; return; }
  const newId=r.data&&r.data.id;
  let ownOk=false;
  if(newId){ const o=await api('/api/trackb/ownership',{method:'POST',body:JSON.stringify({advertiserId:newId, sheetId, tabGid:null})}); ownOk=!!(o&&o.ok); }
  toast(ownOk ? ('업체 등록 + 시트 소유 지정: '+name) : ('업체 등록: '+name+' (소유 지정 실패 — 아래에서 수동 지정)'));
  await renderOwnershipView();
  const idx=(STATE.advs||[]).findIndex(a=>a.id===newId); if(idx>=0) selAdv(idx);
}
function buildTabIndex(list){ STATE.sheetMap={}; STATE.tabIndex={};
  for(const t of (list||STATE.tabs)){ if(!STATE.sheetMap[t.sheetId]) STATE.sheetMap[t.sheetId]={title:t.spreadsheetTitle||t.sheetId,tabs:[]};
    STATE.sheetMap[t.sheetId].tabs.push(t); STATE.tabIndex[t.sheetId+'::'+(t.tabGid||'')]=t.tabName; } }

async function selAdv(i){ const a=STATE.advs[i]; STATE.advCur=a; STATE.addSheet=null; STATE.addMode='all'; STATE.addTabs={}; STATE.ownBrand=null;
  STATE.ownSettle={}; STATE.ownSettleFor=a.id;
  document.querySelectorAll('.advitem').forEach(el=>el.classList.toggle('on',+el.dataset.i===i));
  $('#ownPanel').innerHTML=`<div class="empty">불러오는 중…</div>`;
  const [r, rt]=await Promise.all([
    api('/api/trackb/ownership?advertiserId='+encodeURIComponent(a.id)),
    api('/api/trackb/ownership/tabs?advertiserId='+encodeURIComponent(a.id)).catch(()=>null),
  ]);
  if(STATE.advCur!==a) return;   // 빠른 업체 전환 경합 — 늦게 온 stale 응답이 현재 패널을 덮지 않게 폐기
  STATE.ownTabs=(rt&&rt.ok&&rt.items)||[];
  renderOwnPanel(a, (r&&r.items)||[]);
  if(STATE.ownTabs.some(t=>t.salesId)) loadOwnSettlement(a.id);   // 정산 컬럼 비동기 필(링크 탭 0이면 호출 생략)
}
// 연결된 탭 클릭 → 작업대에서 그 탭 열기(관측 뷰 "열기"와 동일한 pendingTab 계약).
function openOwnTab(i){ const t=(STATE.ownTabs||[])[i]; if(!t) return;
  STATE.pendingTab={sheetId:t.sheetId, tabGid:t.tabGid, tabName:t.tabName, spreadsheetTitle:t.spreadsheetTitle||sheetTitle(t.sheetId)};
  switchView('workdesk'); }
function sheetTitle(sid){ return (STATE.sheetMap[sid]&&STATE.sheetMap[sid].title)||sid; }
function renderOwnPanel(a, items){
  const owns = items.map(o=>{
    const whole = !o.tabGid;
    const label = whole ? sheetTitle(o.sheetId) : (STATE.tabIndex[o.sheetId+'::'+o.tabGid] || ('탭 '+o.tabGid));
    const sub = whole ? '시트 전체 · 모든 탭 자동 포함' : ('시트: '+sheetTitle(o.sheetId));
    return `<div class="own"><span class="ic">${whole?'▦':'▤'}</span><div class="info"><b>${esc(label)}</b><span>${esc(sub)}</span></div>
      <span class="scope ${whole?'all':'tab'}">${whole?'시트 전체':'특정 탭'}</span>
      <button class="rm" title="소유 해제" onclick="rmOwn('${esc(o.sheetId)}','${esc(o.tabGid||'')}')">×</button></div>`;
  }).join('') || `<div class="empty" style="padding:20px">소유 캠페인 없음 — 아래에서 추가하세요.</div>`;
  const sheetOpts = Object.keys(STATE.sheetMap).map(sid=>`<option value="${esc(sid)}">${esc(sheetTitle(sid))}</option>`).join('');
  const ot=STATE.ownTabs||[];
  $('#ownPanel').innerHTML = `
    <div class="ph2"><span class="big">${esc((a.name||'?').slice(0,1))}</span><div style="flex:1"><h2>${esc(a.name)}</h2><div class="acc">거래처 ID: ${esc(a.id)} · 소유 ${items.length}</div></div>
      <label class="setvis" title="이 거래처가 통합작업대에서 정산(금액·상태)을 볼 수 있는지"><input type="checkbox" id="setvis" ${a.settlementVisible===false?'':'checked'} onchange="toggleSettleVis('${esc(a.id)}',this.checked)"> 정산 노출</label></div>
    <div class="sect"><div class="st">소유 캠페인</div>${owns}</div>
    <div class="sect" id="owntabsSect">${_ownTabsHtml()}</div>
    <div class="sect"><div class="st">소유 추가</div>
      <div class="add">
        <label>캠페인 시트</label>
        <select id="addSheet" onchange="onAddSheet()"><option value="">— 시트 선택 —</option>${sheetOpts}</select>
        <div class="radios">
          <div class="radio on" data-m="all" onclick="setAddMode('all')"><span class="d"></span>시트 전체(모든 탭)</div>
          <div class="radio" data-m="tab" onclick="setAddMode('tab')"><span class="d"></span>특정 탭만</div>
        </div>
        <div class="taboptions" id="taboptions"></div>
        <button class="btn pri assignbtn" onclick="assignOwn()">＋ 소유 지정</button>
      </div>
    </div>`;
}
// 연결된 탭 섹션(컬럼형) — 브랜드 필터 칩 + 헤더 + 행 그리드. setOwnBrand 가 이 섹션만 재렌더(#owntabsSect).
// openOwnTab 인덱스는 항상 STATE.ownTabs 원본 기준(필터로 순서가 바뀌어도 원본 i 를 넘김).
function _ownTabsHtml(){
  const ot=STATE.ownTabs||[];
  const rows=ot.map((t,i)=>({t,i,pm:parseTabMeta(t.tabName)}));
  const bc={}; let noBrand=0;
  rows.forEach(r=>{ if(r.pm.brand) bc[r.pm.brand]=(bc[r.pm.brand]||0)+1; else noBrand++; });
  const brands=Object.keys(bc).sort((a,b)=>bc[b]-bc[a]||a.localeCompare(b));
  STATE.ownBrandList=brands;
  if(STATE.ownBrand!==null&&STATE.ownBrand!==''&&!bc[STATE.ownBrand]) STATE.ownBrand=null;   // 목록 갱신으로 사라진 브랜드
  const chips=(brands.length>=2||(brands.length===1&&noBrand))
    ? `<div class="obchips"><span class="obchip ${STATE.ownBrand===null?'on':''}" onclick="setOwnBrand(-1)">전체 ${ot.length}</span>`
      + brands.map((b,bi)=>`<span class="obchip ${STATE.ownBrand===b?'on':''}" onclick="setOwnBrand(${bi})">${esc(b)} ${bc[b]}</span>`).join('')
      + (noBrand?`<span class="obchip ${STATE.ownBrand===''?'on':''}" onclick="setOwnBrand(-2)">미분류 ${noBrand}</span>`:'')+`</div>` : '';
  const vis=rows.filter(r=>STATE.ownBrand===null||(STATE.ownBrand===''?!r.pm.brand:r.pm.brand===STATE.ownBrand));
  const list=vis.map(({t,i,pm})=>{
    const target=(t.woRecruit&&+t.woRecruit)||pm.count||null;
    const total=t.bTotal||0, sub=t.bSub||0, paid=t.bPaid||0;
    const pct=total?Math.round(sub/total*100):0;
    const gauge=total?gaugeSvg(pct,pct+'%',pct>=100?'g-safe':''):gaugeSvg(0,'—','');
    const chan=[pm.channel?`<span class="bb ok">${esc(pm.channel)}</span>`:'', pm.viral?'<span class="bb warn">바이럴</span>':''].filter(Boolean).join(' ')||'<span class="ocol dim">—</span>';
    const tgt=[target?`${target}건${t.woRecruit?'·발주':''}`:'', pm.round||''].filter(Boolean).join(' · ')||'—';
    // 정산 컬럼(관제실 대응): 링크된 탭만 인트라넷 요약 대상. 요약 도착 전 '…', 미링크 '—'.
    const st=(STATE.ownSettle||{})[t.sheetId+'\t'+t.tabName];
    const linked=!!t.salesId;
    const dOr = v => linked ? (st ? (st.proxyDown?'<span class="dim" title="인트라넷 연결 실패">?</span>':(v||'<span class="dim">—</span>')) : '<span class="dim">…</span>') : '<span class="dim">—</span>';
    const quoteCell=dOr(st&&st.quoteDate?`<span title="${esc(st.quoteDate)}${st.contractNumber?' · '+esc(st.contractNumber):''}">${_md(st.quoteDate)}</span>`:null);
    const invoiceCell=dOr(st&&st.invoiceDate?`<span title="${esc(st.invoiceDate)}">${_md(st.invoiceDate)}</span>`:null);
    const paidDateCell=dOr(st&&st.paidDate?`<span title="${esc(st.paidDate)}">${_md(st.paidDate)}</span>`:null);
    const closeoutCell=t.closeoutDate
      ? `<span class="odate" title="마감 ${esc(String(t.closeoutDate).slice(0,10))} · ${t.closeoutRows||0}건(제출 ${t.closeoutSubs||0})">${_md(t.closeoutDate)}</span>`
      : '<span class="dim">—</span>';
    let moneyCell='<span class="dim">—</span>';
    if(linked){
      if(!st) moneyCell='<span class="dim">…</span>';
      else if(st.proxyDown) moneyCell='<span class="dim" title="인트라넷 연결 실패">?</span>';
      else{
        const pa=st.paidAmount, tc=st.totalCost;
        const pcls=(pa&&tc&&pa>=tc)?'pd-ok':(pa>0?'pd-part':'pd-zero');
        const warn=st.amountMismatch?' <span class="bb warn" title="견적서·계약 금액 불일치">⚠</span>':'';
        moneyCell=`<span title="입금 ${_won(pa)} / 총비용 ${_won(tc)}${st.contractNumber?' · '+esc(st.contractNumber):''}"><b class="${pcls}">${_won(pa)}</b> / ${_won(tc)}${warn}</span>`;
      }
    }
    return `<div class="owntab" onclick="openOwnTab(${i})" title="${esc(t.tabName)}">
      ${gauge}
      <div class="oname"><b><i class="odot ${t.active?'a':''}" title="${t.active?'활성':'비활성'}"></i>${esc(t.tabName)}</b>
        <span class="osub">${esc(t.spreadsheetTitle||sheetTitle(t.sheetId))}${t.firstSeenAt?` · ${esc(String(t.firstSeenAt).slice(0,10))}`:''}</span></div>
      <span class="ocol ${pm.brand?'obr':'dim'}">${esc(pm.brand||'—')}</span>
      <span class="ocol ${pm.product?'':'dim'}" title="${esc(pm.product||'')}">${esc(pm.product||'—')}</span>
      <span class="ocol">${chan}</span>
      <span class="ocol ${tgt==='—'?'dim':''}">${esc(tgt)}</span>
      <span class="ocol ${t.manager?'':'dim'}">${esc(t.manager||'—')}</span>
      <span class="ocnt"><b>${total}</b> · <b class="c-sub">${sub}</b> · <b class="c-paid">${paid}</b></span>
      <span class="ocol odate">${quoteCell}</span>
      <span class="ocol odate">${closeoutCell}</span>
      <span class="ocol odate">${invoiceCell}</span>
      <span class="ocol omoney">${moneyCell}</span>
      <span class="ocol odate">${paidDateCell}</span>
      <span class="ocol omemo" onclick="editTabMemo(event,${i})" title="클릭하여 비고 편집">${t.memo?esc(t.memo):'<i>비고…</i>'}</span>
      <span class="openb">열기 ›</span></div>`;
  }).join('');
  const body=ot.length
    ? `${chips}<div class="otwrap"><div class="othead"><span>진행</span><span>캠페인 탭</span><span>브랜드</span><span>상품</span><span>채널</span><span>목표·차수</span><span>담당</span><span>참여·제출·입금</span><span>견적서</span><span>마감자료</span><span>계산서</span><span>입금액/총비용</span><span>입금일</span><span>비고</span><span></span></div>${list||'<div class="empty" style="padding:14px">이 브랜드의 탭 없음</div>'}</div>`
    : `<div class="empty" style="padding:14px">연결된 탭 없음</div>`;
  return `<div class="st">연결된 탭 ${ot.length} <span style="font-weight:400;color:var(--faint);font-size:11px">· 최신순 — 클릭하면 작업대로 열기 · 정산(견적·계산서·입금)은 정산 링크된 탭만 표시</span></div>${body}`;
}
// 날짜 → M/D 축약(관제실 표기), 금액 → 천단위 콤마.
function _md(d){ const m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m?`${+m[2]}/${+m[3]}`:esc(String(d||'')); }
function _won(n){ return n==null?'—':Number(n).toLocaleString('ko-KR'); }
function setOwnBrand(i){ STATE.ownBrand = i===-1?null : i===-2?'' : ((STATE.ownBrandList||[])[i]!=null?STATE.ownBrandList[i]:null);
  _rerenderOwnTabs(); }
// 연결탭 섹션 재렌더 — 비고 편집 중(.omemoin 존재)이면 연기(포커스 input이 innerHTML 교체로
// 제거되면 blur 미발생 → 입력 무음 소실). 저장/취소 후 rerender 가 pending 을 소화.
function _rerenderOwnTabs(){ const el=$('#owntabsSect'); if(!el) return;
  if(el.querySelector('.omemoin')){ STATE._ownRerenderPending=true; return; }
  STATE._ownRerenderPending=false; el.innerHTML=_ownTabsHtml(); }
// 정산 요약(견적·계산서·입금매칭) 비동기 로드 — 패널 렌더를 막지 않음. 업체 전환 경합은 ownSettleFor 로 무시.
async function loadOwnSettlement(advId){
  let r=null; try{ r=await api('/api/trackb/ownership/settlement?advertiserId='+encodeURIComponent(advId)); }catch(_){ }
  if(STATE.ownSettleFor!==advId) return;   // 이미 다른 업체로 전환됨
  const m={};
  if(r&&r.ok){ for(const it of (r.items||[])) m[it.sheetId+'\t'+it.tabName]=it; }
  else { for(const t of (STATE.ownTabs||[])) if(t.salesId) m[t.sheetId+'\t'+t.tabName]={proxyDown:true}; }   // 로드 실패 = '…' 영구 대신 '?' 표기
  STATE.ownSettle=m;
  _rerenderOwnTabs();
}
// 비고 인라인 편집: 셀 클릭 → input 치환 → Enter/blur 저장, Esc 취소. 행 클릭(탭 열기)과 격리(stopPropagation).
function editTabMemo(ev,i){ ev.stopPropagation(); const t=(STATE.ownTabs||[])[i]; if(!t) return;
  const cell=ev.currentTarget; if(cell.querySelector('input')) return;
  cell.innerHTML=`<input class="omemoin" maxlength="2000" onclick="event.stopPropagation()" onkeydown="_memoKey(event)" onblur="saveOwnMemo(${i},this)">`;
  const inp=cell.querySelector('input'); inp.value=t.memo||''; inp.focus(); inp.select();
}
function _memoKey(ev){ if(ev.key==='Enter') ev.target.blur(); else if(ev.key==='Escape'){ ev.target.dataset.esc='1'; ev.target.blur(); } }
async function saveOwnMemo(i,inp){ const t=(STATE.ownTabs||[])[i];
  // 편집 종료 시점 = 연기된 재렌더(_ownRerenderPending)까지 함께 소화(최신 STATE 로 강제 렌더).
  const rerender=()=>{ STATE._ownRerenderPending=false; const el=$('#owntabsSect'); if(el) el.innerHTML=_ownTabsHtml(); };
  if(!t||inp.dataset.esc){ rerender(); return; }
  const memo=inp.value.trim();
  if(memo===(t.memo||'')){ rerender(); return; }
  try{
    const r=await api('/api/trackb/tab-memo',{method:'POST',body:JSON.stringify({sheetId:t.sheetId,tabName:t.tabName,memo})});
    if(r&&r.ok){ t.memo=r.memo; toast('비고 저장됨'); } else toast('비고 저장 실패'+(r&&r.error?': '+r.error:''));
  }catch(_){ toast('비고 저장 실패: 네트워크 오류'); }
  rerender();
}
function setAddMode(m){ STATE.addMode=m; document.querySelectorAll('.radio').forEach(r=>r.classList.toggle('on',r.dataset.m===m));
  const to=$('#taboptions'); to.classList.toggle('show', m==='tab' && STATE.addSheet); if(m==='tab') renderTabOptions(); else to.innerHTML=''; }
function onAddSheet(){ STATE.addSheet=$('#addSheet').value||null; STATE.addTabs={}; if(STATE.addMode==='tab') renderTabOptions(); }
function renderTabOptions(){ const to=$('#taboptions'); if(!STATE.addSheet){ to.classList.remove('show'); to.innerHTML=''; return; }
  const tabs=(STATE.sheetMap[STATE.addSheet]||{}).tabs||[];
  to.classList.add('show');
  to.innerHTML = tabs.map(t=>`<div class="tchip ${STATE.addTabs[t.tabGid||'']?'on':''}" onclick="tglTab('${esc(t.tabGid||'')}')"><span class="cb">${STATE.addTabs[t.tabGid||'']?'✓':''}</span>${esc(t.tabName)}</div>`).join('')||'<span style="font-size:12px;color:var(--faint)">이 시트에 활성 탭 없음</span>'; }
function tglTab(gid){ STATE.addTabs[gid]=!STATE.addTabs[gid]; renderTabOptions(); }
async function assignOwn(){ const a=STATE.advCur; if(!a) return; if(!STATE.addSheet){ toast('시트를 선택하세요'); return; }
  let posts=[];
  if(STATE.addMode==='all') posts=[{sheetId:STATE.addSheet, tabGid:null}];
  else { const gids=Object.keys(STATE.addTabs).filter(g=>STATE.addTabs[g]); if(!gids.length){ toast('탭을 선택하세요'); return; } posts=gids.map(g=>({sheetId:STATE.addSheet, tabGid:g})); }
  for(const p of posts) await api('/api/trackb/ownership',{method:'POST',body:JSON.stringify({advertiserId:a.id, sheetId:p.sheetId, tabGid:p.tabGid})});
  toast('소유 지정 완료'); refreshAdvCounts(); selAdv(STATE.advs.indexOf(a));
}
async function rmOwn(sheetId, tabGid){ const a=STATE.advCur; if(!a) return;
  await api('/api/trackb/ownership',{method:'DELETE',body:JSON.stringify({advertiserId:a.id, sheetId, tabGid:tabGid||null})});
  toast('소유 해제'); refreshAdvCounts(); selAdv(STATE.advs.indexOf(a));
}
async function refreshAdvCounts(){ const r=await api('/api/trackb/advertisers'); if(r&&r.ok){ STATE.advs=r.items||[];
  document.querySelectorAll('.advitem').forEach((el)=>{ const i=+el.dataset.i; if(STATE.advs[i]) el.querySelector('.ct').textContent=STATE.advs[i].owned; }); } }

boot();
</script>
</body>
</html>
