<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>통합 작업대 (Track B · 그림자)</title>
<style>
  :root{
    --paper:#F4F6F7;--card:#FFFFFF;--card2:#EEF2F3;--ink:#15232A;--muted:#5C6B72;--faint:#8A979D;
    --line:#DDE4E6;--line2:#C9D3D6;--accent:#127C8A;--accent-soft:#E1F0F1;
    --safe:#2E7D64;--safe-soft:#E2F1EA;--warn:#A9721E;--warn-soft:#F5EBD8;--bad:#BB4E37;--bad-soft:#F7E5E0;
    --adv:#7A5AA6;--adv-soft:#EFE8F5;
    --mono:'SF Mono','JetBrains Mono',ui-monospace,monospace;
    --sans:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
  .top{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  .top .logo{font-weight:800;letter-spacing:-.02em;font-size:15px}
  .top .logo .tag{font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px;margin-left:8px;letter-spacing:.03em}
  .nav{display:flex;gap:4px;margin-left:6px}
  .navb{font:inherit;font-size:12.5px;font-weight:650;padding:6px 13px;border-radius:8px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer}
  .navb.on{background:var(--accent-soft);color:var(--accent)}
  .top .sp{flex:1}
  .rolebadge{font-size:11px;font-weight:750;padding:4px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
  .btn{font:inherit;font-size:12px;font-weight:650;padding:6px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--ink);cursor:pointer}
  .btn:hover{background:var(--card2)} .btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)} .btn:disabled{opacity:.5;cursor:default}
  .wrap{display:grid;grid-template-columns:230px 1fr 240px;min-height:calc(100vh - 50px)}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}.side,.rail{display:none}.wrap.showlist .main{display:none}.wrap.showlist .side{display:block}}
  .side{border-right:1px solid var(--line);background:var(--card);padding:12px 10px;overflow:auto}
  .side .sh{font-size:10px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:6px 6px 8px;display:flex;justify-content:space-between}
  .titem{font-size:12.5px;padding:8px 10px;border-radius:8px;margin-bottom:3px;color:var(--muted);cursor:pointer;border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .titem:hover{background:var(--card2)} .titem.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--ink);font-weight:650}
  .titem .sub{font-size:10.5px;color:var(--faint);font-weight:400}
  .main{padding:18px 22px;overflow:auto}
  .mh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .mh h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.02em}
  .bd{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--card2);color:var(--muted);border:1px solid var(--line)} .bd.g{background:var(--safe-soft);color:var(--safe);border-color:transparent}
  .metagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin-bottom:16px}
  .mf{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
  .mf .k{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.03em} .mf .v{font-size:13px;font-weight:600;margin-top:2px}
  .counts{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .cc{flex:1;min-width:90px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;text-align:center}
  .cc .big{font-size:22px;font-weight:800;letter-spacing:-.02em} .cc .lb{font-size:11px;color:var(--muted);margin-top:1px} .cc.s .big{color:var(--safe)} .cc.p .big{color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  thead th{background:var(--card2);text-align:left;padding:9px 11px;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:750}
  tbody td{padding:9px 11px;border-top:1px solid var(--line)} tbody tr:hover{background:var(--card2)}
  .chk{font-weight:800}.chk.y{color:var(--safe)}.chk.n{color:var(--faint)}
  .ph{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .src{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--card2);color:var(--faint)} .src.manual{background:var(--warn-soft);color:var(--warn)} .src.order{background:var(--accent-soft);color:var(--accent)}
  .rail{border-left:1px solid var(--line);background:var(--card);padding:14px 12px;overflow:auto}
  .rail .sh{font-size:10px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:2px 2px 10px}
  .parity{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px}
  .pbar{display:flex;height:8px;border-radius:5px;overflow:hidden;margin:8px 0} .pbar i{display:block}.pbar .m{background:var(--safe)}.pbar .b{background:var(--warn)}.pbar .r{background:var(--bad)}
  .plegend{display:flex;flex-direction:column;gap:5px;font-size:11.5px} .plegend .row{display:flex;justify-content:space-between}
  .plegend .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
  .verdict{font-size:12px;font-weight:750;padding:8px 10px;border-radius:8px;margin-top:8px;text-align:center} .verdict.pass{background:var(--safe-soft);color:var(--safe)} .verdict.fail{background:var(--bad-soft);color:var(--bad)}
  .cmt{font-size:11px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;color:var(--muted)}
  .rdlist{display:flex;flex-direction:column;gap:6px}
  .rdrow{display:flex;align-items:center;gap:8px;font-size:11.5px}
  .rdrow .rdot{width:8px;height:8px;border-radius:50%;flex:none} .rdot.ok{background:var(--safe)} .rdot.warn{background:var(--warn)} .rdot.no{background:var(--line2)}
  .rdrow .rl{color:var(--muted);flex:none;width:72px} .rdrow .rv{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{color:var(--faint);font-size:13px;text-align:center;padding:40px 10px}
  .loginbox{max-width:320px;margin:80px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 8px 28px rgba(20,35,42,.08)}
  .loginbox h2{margin:0 0 14px;font-size:18px} .loginbox input{width:100%;padding:9px 12px;border:1px solid var(--line2);border-radius:8px;margin-bottom:9px;font:inherit}
  .loginbox .err{color:var(--bad);font-size:12px;margin-top:6px;min-height:16px} .note{font-size:11px;color:var(--faint);margin-top:10px;line-height:1.5}
  /* ── 소유 지정 뷰 ── */
  .own-wrap{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 50px)}
  @media(max-width:780px){.own-wrap{grid-template-columns:1fr}}
  .advlist{border-right:1px solid var(--line);background:var(--card);padding:12px 11px;overflow:auto}
  .advitem{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;margin-bottom:4px;cursor:pointer;border:1px solid transparent}
  .advitem:hover{background:var(--card2)} .advitem.on{background:var(--adv-soft);border-color:color-mix(in srgb,var(--adv) 35%,transparent)}
  .advitem .ava{width:26px;height:26px;border-radius:8px;background:var(--adv-soft);color:var(--adv);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
  .advitem .nm{font-size:12.5px;font-weight:650;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .advitem .ct{font-size:10.5px;font-weight:700;color:var(--faint);background:var(--card2);border-radius:999px;padding:1px 7px} .advitem.on .ct{background:var(--card);color:var(--adv)}
  .own-panel{padding:18px 20px;overflow:auto}
  .ph2{display:flex;align-items:center;gap:11px;margin-bottom:4px}
  .ph2 .big{width:40px;height:40px;border-radius:11px;background:var(--adv-soft);color:var(--adv);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
  .ph2 h2{margin:0;font-size:18px;font-weight:800} .ph2 .acc{font-size:12px;color:var(--muted)}
  .sect{margin-top:20px} .sect .st{font-size:11px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
  .own{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px}
  .own .ic{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;font-size:15px}
  .own .info{flex:1;min-width:0} .own .info b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .own .info span{font-size:11.5px;color:var(--muted)}
  .scope{font-size:10px;font-weight:750;padding:2px 8px;border-radius:6px;white-space:nowrap} .scope.all{background:var(--safe-soft);color:var(--safe)} .scope.tab{background:var(--warn-soft);color:var(--warn)}
  .rm{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--faint);cursor:pointer;flex:none;font-size:14px}
  .rm:hover{color:var(--adv);border-color:color-mix(in srgb,var(--adv) 40%,transparent)}
  .add{border:1px dashed var(--line2);border-radius:11px;padding:15px;background:var(--card2)}
  .add label{font-size:11px;color:var(--faint);font-weight:650;display:block;margin-bottom:4px}
  .add select{width:100%;padding:8px 11px;border:1px solid var(--line2);border-radius:8px;font:inherit;font-size:13px;background:var(--card);color:var(--ink)}
  .radios{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .radio{font-size:12px;padding:6px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--card);cursor:pointer;display:flex;align-items:center;gap:6px}
  .radio.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:650}
  .radio .d{width:10px;height:10px;border-radius:50%;border:2px solid var(--line2)} .radio.on .d{border-color:var(--accent);background:var(--accent)}
  .taboptions{margin-top:10px;display:none;flex-wrap:wrap;gap:6px} .taboptions.show{display:flex}
  .tchip{font-size:11.5px;padding:5px 10px;border-radius:7px;border:1px solid var(--line2);background:var(--card);cursor:pointer;display:flex;align-items:center;gap:6px}
  .tchip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .tchip .cb{width:13px;height:13px;border-radius:3px;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:9px;color:#fff} .tchip.on .cb{background:var(--accent);border-color:var(--accent)}
  .assignbtn{margin-top:12px}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:10px;font-size:13px;z-index:99;opacity:0;transition:opacity .25s} .toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
const API_BASE = (function(){ if (window.REVIEW_API_URL) return window.REVIEW_API_URL; if (location.hostname==='localhost') return 'http://localhost:3000'; return 'https://sublime-magic-production-790b.up.railway.app'; })();
function token(){ return sessionStorage.getItem('admin_token') || ''; }
async function api(path, opts){ const o=Object.assign({headers:{}},opts||{}); o.headers['Authorization']='Bearer '+token(); if(o.body)o.headers['Content-Type']='application/json'; const r=await fetch(API_BASE+path,o); return r.json(); }
const $=(s,el)=>(el||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function parseJwt(t){ try{ return JSON.parse(atob(t.split('.')[1])); }catch(_){ return {}; } }

let STATE = { role:'', name:'', view:'workdesk', tabs:[], cur:null,
              advs:[], advCur:null, tabIndex:{}, sheetMap:{}, addMode:'all', addSheet:null, addTabs:{} };

async function boot(){
  if (!token()) return renderLogin();
  const me = parseJwt(token()); STATE.role=me.role||''; STATE.name=me.name||'';
  renderShell();
}
function renderLogin(){
  $('#app').innerHTML = `<div class="loginbox"><h2>통합 작업대 로그인</h2>
    <input id="lname" placeholder="아이디 (master / admin)" autocomplete="username">
    <input id="lpw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button class="btn pri" style="width:100%;padding:9px" onclick="doLogin()">로그인</button>
    <div class="err" id="lerr"></div>
    <div class="note">Track B 그림자 화면입니다. 관리자(master/admin)로 로그인하면 통합 작업대·parity·소유 지정을 봅니다.</div></div>`;
  $('#lpw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
}
async function doLogin(){ const r=await api('/api/admin/login',{method:'POST',body:JSON.stringify({name:$('#lname').value.trim(),pw:$('#lpw').value})});
  if(r&&r.success&&r.token){ sessionStorage.setItem('admin_token',r.token); boot(); } else $('#lerr').textContent=(r&&(r.error||r.message))||'로그인 실패'; }
function logout(){ sessionStorage.removeItem('admin_token'); boot(); }

function renderShell(){
  const isAdmin = STATE.role==='master' || STATE.role==='admin';
  $('#app').innerHTML = `
    <div class="top">
      <span class="logo">통합 작업대 <span class="tag">TRACK B · 그림자</span></span>
      ${isAdmin?`<nav class="nav">
        <button class="navb" data-v="workdesk" onclick="switchView('workdesk')">작업대</button>
        <button class="navb" data-v="ownership" onclick="switchView('ownership')">소유 지정</button></nav>`:''}
      <span class="sp"></span>
      <span class="rolebadge">${esc(STATE.role||'?')}${STATE.name?(' · '+esc(STATE.name)):''}</span>
      <button class="btn" onclick="logout()">로그아웃</button>
    </div>
    <div id="viewroot"></div>`;
  switchView(STATE.view||'workdesk');
}
function switchView(v){ STATE.view=v; document.querySelectorAll('.navb').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(v==='ownership') renderOwnershipView(); else renderWorkdeskView(); }

// ══ 작업대 뷰 ══
function renderWorkdeskView(){
  const isMaster = STATE.role==='master';
  $('#viewroot').innerHTML = `<div class="wrap showlist" id="wrap">
    <div class="side"><div class="sh"><span>작업 목록</span><span id="tcount"></span></div>
      <div id="tabs"><div class="empty">불러오는 중…</div></div></div>
    <div class="main" id="main"><div class="empty">왼쪽에서 작업을 선택하세요.</div></div>
    <div class="rail" id="rail"></div></div>`;
  loadTabs();
}
async function loadTabs(){
  const r = await api('/api/trackb/tabs?limit=300');
  if(!r||!r.ok){ $('#tabs').innerHTML=`<div class="empty">작업 목록은 관리자 로그인에서 제공됩니다.</div>`; return; }
  STATE.tabs=r.tabs||[]; $('#tcount').textContent=STATE.tabs.length;
  $('#tabs').innerHTML = STATE.tabs.map((t,i)=>`<div class="titem" data-i="${i}" onclick="selTab(${i})">${esc(t.tabName)}<div class="sub">${esc(t.spreadsheetTitle||'')}</div></div>`).join('')||`<div class="empty">활성 작업 없음</div>`;
}
async function selTab(i){ const t=STATE.tabs[i]; STATE.cur=t;
  document.querySelectorAll('.titem').forEach(el=>el.classList.toggle('on',+el.dataset.i===i));
  $('#wrap').classList.remove('showlist'); $('#main').innerHTML=`<div class="empty">불러오는 중…</div>`;
  const q=`sheetId=${encodeURIComponent(t.sheetId)}&tabName=${encodeURIComponent(t.tabName)}&tabGid=${encodeURIComponent(t.tabGid||'')}`;
  renderWorkdesk(await api('/api/trackb/workdesk?'+q)); loadParity(t); }
function renderWorkdesk(wd){
  if(!wd||!wd.ok){ $('#main').innerHTML=`<div class="empty">${esc((wd&&wd.error)||'조회 실패')}</div>`; return; }
  const d=wd.detail||{},m=wd.meta||{},c=wd.counts||{}, isMaster=STATE.role==='master';
  const metaCards=[['상품',d.productOption||m.campaignName||'—'],['모집',(d.recruitCount||'—')+(m.manager?(' · '+m.manager):'')],['구매시간',d.purchaseTime||'자율'],['배송',d.deliveryType||m.deliveryType||'—']].map(([k,v])=>`<div class="mf"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('');
  const rows=(wd.roster||[]).map(r=>`<tr><td>${esc(r.seq)}</td><td>${esc(r.name||'—')}${r.source==='manual'?' <span class="src manual">수동</span>':(r.hasOrder?' <span class="src order">주문</span>':'')}</td><td class="ph">${esc(r.phone8||'')}</td><td>${esc(r.round||'')}</td><td>${esc(r.option||'')}</td><td><span class="chk ${r.submitted?'y':'n'}">${r.submitted?'✓':'–'}</span></td><td><span class="chk ${r.paid?'y':'n'}">${r.paid?'✓':'–'}</span></td></tr>`).join('')||`<tr><td colspan="7" class="empty">명단 없음 — 그림자 투영을 실행하세요.</td></tr>`;
  $('#main').innerHTML=`<div class="mh"><h1>${esc(STATE.cur.tabName)}</h1>
    ${wd.maskPII?'<span class="bd">개인정보 마스킹(광고주)</span>':''}<span class="bd g">참여자 ${c.total||0}</span>
    ${isMaster?'<span class="sp" style="flex:1"></span><button class="btn" id="projBtn" onclick="projectCur()">그림자 투영(새로고침)</button>':''}</div>
    <div class="metagrid">${metaCards}</div>
    <div class="counts"><div class="cc"><div class="big">${c.total||0}</div><div class="lb">참여자</div></div><div class="cc s"><div class="big">${c.submitted||0}</div><div class="lb">제출완료</div></div><div class="cc p"><div class="big">${c.paid||0}</div><div class="lb">입금완료</div></div></div>
    <table><thead><tr><th>#</th><th>참여자</th><th>연락처</th><th>차수</th><th>옵션</th><th>제출</th><th>입금</th></tr></thead><tbody>${rows}</tbody></table>`;
}
async function loadParity(t){ const rail=$('#rail'); if(!rail)return;
  rail.innerHTML=`<div class="sh">Parity (B ↔ 현행)</div><div class="empty" style="padding:14px">확인 중…</div>`;
  const p=await api(`/api/trackb/parity?sheetId=${encodeURIComponent(t.sheetId)}&tabName=${encodeURIComponent(t.tabName)}`);
  if(!p||!p.ok){ rail.innerHTML=`<div class="sh">Parity</div><div class="empty" style="padding:14px">master에서 제공</div>`; return; }
  const b=p.buckets||{match:0,benign:0,real:0}, tot=Math.max(1,b.match+b.benign+b.real), pct=n=>(n/tot*100).toFixed(1)+'%';
  rail.innerHTML=`<div class="sh">Parity (B ↔ 현행)</div><div class="parity">
    <div class="pbar"><i class="m" style="width:${pct(b.match)}"></i><i class="b" style="width:${pct(b.benign)}"></i><i class="r" style="width:${pct(b.real)}"></i></div>
    <div class="plegend"><div class="row"><span><span class="dot" style="background:var(--safe)"></span>일치</span><b>${b.match}</b></div><div class="row"><span><span class="dot" style="background:var(--warn)"></span>의도된차이</span><b>${b.benign}</b></div><div class="row"><span><span class="dot" style="background:var(--bad)"></span>진짜 불일치</span><b>${b.real}</b></div></div>
    <div class="verdict ${p.pass?'pass':'fail'}">${p.pass?'✓ 진짜 불일치 0':('진짜 불일치 '+b.real+'건')}</div></div>
    <div class="sh">차원 요약</div><div class="cmt">참여자 A ${p.dims.d1_membership.aSet} · B ${p.dims.d1_membership.bSet}<br>제출 A ${p.dims.d3_counts.aSubmitted} · B ${p.dims.d3_counts.bSubmitted}<br>입금 A ${p.dims.d3_counts.aPaid} · B ${p.dims.d3_counts.bPaid}</div>
    ${renderReadiness(p.readiness)}`;
}
function renderReadiness(rd){ if(!rd) return '';
  const wo=rd.workOrder||{}, ow=rd.ownership||{}, fi=rd.financial||{};
  const dot=(ok,warn)=>`<span class="rdot ${ok?'ok':(warn?'warn':'no')}"></span>`;
  const woOk=wo.linked && wo.filled>=3;
  const owNames=(ow.owners||[]).map(o=>esc(o.name)+(o.wholeSheet?'(시트전체)':'')).join(', ');
  const linkPct = fi.activeRows ? Math.round(fi.linkedOrders/fi.activeRows*100) : 0;
  const won = (fi.writtenAmount||0).toLocaleString('ko-KR');
  return `<div class="sh" style="margin-top:14px">전환 준비도</div>
    <div class="rdlist">
      <div class="rdrow">${dot(woOk, wo.linked&&!woOk)}<span class="rl">작업발주 연결</span><span class="rv">${wo.linked?(wo.filled+'/'+wo.of+' 필드'):'미연결'}</span></div>
      <div class="rdrow">${dot(ow.assigned)}<span class="rl">업체 소유</span><span class="rv">${ow.assigned?(owNames||'지정됨'):'미지정'}</span></div>
      <div class="rdrow">${dot(fi.linkedOrders>0, fi.activeRows>0&&fi.linkedOrders===0)}<span class="rl">주문 귀속</span><span class="rv">${fi.linkedOrders}/${fi.activeRows} 링크${won!=='0'?(' · '+won+'원'):''}</span></div>
    </div>`;
}
async function projectCur(){ if(!STATE.cur)return; const btn=$('#projBtn'); if(btn){btn.disabled=true;btn.textContent='투영 중…';}
  await api('/api/trackb/project',{method:'POST',body:JSON.stringify({sheetId:STATE.cur.sheetId,tabName:STATE.cur.tabName})});
  selTab(STATE.tabs.indexOf(STATE.cur)); }

// ══ 소유 지정 뷰 ══
async function renderOwnershipView(){
  $('#viewroot').innerHTML = `<div class="own-wrap">
    <div class="advlist"><div class="sh" style="font-size:10px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:4px 6px 9px">업체(광고주)</div><div id="advs"><div class="empty">불러오는 중…</div></div></div>
    <div class="own-panel" id="ownPanel"><div class="empty">왼쪽에서 업체를 선택하세요.</div></div></div>`;
  // 탭 인덱스(시트명/탭명 조회용) 1회 로드
  if(!STATE.tabs.length){ const r=await api('/api/trackb/tabs?limit=500'); STATE.tabs=(r&&r.tabs)||[]; }
  buildTabIndex();
  const r=await api('/api/trackb/advertisers');
  if(!r||!r.ok){ $('#advs').innerHTML=`<div class="empty">업체 목록은 admin/master에서 제공</div>`; return; }
  STATE.advs=r.items||[];
  $('#advs').innerHTML = STATE.advs.map((a,i)=>`<div class="advitem" data-i="${i}" onclick="selAdv(${i})"><span class="ava">${esc((a.name||'?').slice(0,1))}</span><span class="nm">${esc(a.name)}</span><span class="ct">${a.owned}</span></div>`).join('')||`<div class="empty">등록된 업체 없음</div>`;
}
function buildTabIndex(){ STATE.sheetMap={}; STATE.tabIndex={};
  for(const t of STATE.tabs){ if(!STATE.sheetMap[t.sheetId]) STATE.sheetMap[t.sheetId]={title:t.spreadsheetTitle||t.sheetId,tabs:[]};
    STATE.sheetMap[t.sheetId].tabs.push(t); STATE.tabIndex[t.sheetId+'::'+(t.tabGid||'')]=t.tabName; } }

async function selAdv(i){ const a=STATE.advs[i]; STATE.advCur=a; STATE.addSheet=null; STATE.addMode='all'; STATE.addTabs={};
  document.querySelectorAll('.advitem').forEach(el=>el.classList.toggle('on',+el.dataset.i===i));
  $('#ownPanel').innerHTML=`<div class="empty">불러오는 중…</div>`;
  const r=await api('/api/trackb/ownership?advertiserId='+encodeURIComponent(a.id));
  renderOwnPanel(a, (r&&r.items)||[]);
}
function sheetTitle(sid){ return (STATE.sheetMap[sid]&&STATE.sheetMap[sid].title)||sid; }
function renderOwnPanel(a, items){
  const owns = items.map(o=>{
    const whole = !o.tabGid;
    const label = whole ? sheetTitle(o.sheetId) : (STATE.tabIndex[o.sheetId+'::'+o.tabGid] || ('탭 '+o.tabGid));
    const sub = whole ? '시트 전체 · 모든 탭 자동 포함' : ('시트: '+sheetTitle(o.sheetId));
    return `<div class="own"><span class="ic">${whole?'▦':'▤'}</span><div class="info"><b>${esc(label)}</b><span>${esc(sub)}</span></div>
      <span class="scope ${whole?'all':'tab'}">${whole?'시트 전체':'특정 탭'}</span>
      <button class="rm" title="소유 해제" onclick="rmOwn('${esc(o.sheetId)}','${esc(o.tabGid||'')}')">×</button></div>`;
  }).join('') || `<div class="empty" style="padding:20px">소유 캠페인 없음 — 아래에서 추가하세요.</div>`;
  const sheetOpts = Object.keys(STATE.sheetMap).map(sid=>`<option value="${esc(sid)}">${esc(sheetTitle(sid))}</option>`).join('');
  $('#ownPanel').innerHTML = `
    <div class="ph2"><span class="big">${esc((a.name||'?').slice(0,1))}</span><div><h2>${esc(a.name)}</h2><div class="acc">거래처 ID: ${esc(a.id)} · 소유 ${items.length}</div></div></div>
    <div class="sect"><div class="st">소유 캠페인</div>${owns}</div>
    <div class="sect"><div class="st">소유 추가</div>
      <div class="add">
        <label>캠페인 시트</label>
        <select id="addSheet" onchange="onAddSheet()"><option value="">— 시트 선택 —</option>${sheetOpts}</select>
        <div class="radios">
          <div class="radio on" data-m="all" onclick="setAddMode('all')"><span class="d"></span>시트 전체(모든 탭)</div>
          <div class="radio" data-m="tab" onclick="setAddMode('tab')"><span class="d"></span>특정 탭만</div>
        </div>
        <div class="taboptions" id="taboptions"></div>
        <button class="btn pri assignbtn" onclick="assignOwn()">＋ 소유 지정</button>
      </div>
    </div>`;
}
function setAddMode(m){ STATE.addMode=m; document.querySelectorAll('.radio').forEach(r=>r.classList.toggle('on',r.dataset.m===m));
  const to=$('#taboptions'); to.classList.toggle('show', m==='tab' && STATE.addSheet); if(m==='tab') renderTabOptions(); else to.innerHTML=''; }
function onAddSheet(){ STATE.addSheet=$('#addSheet').value||null; STATE.addTabs={}; if(STATE.addMode==='tab') renderTabOptions(); }
function renderTabOptions(){ const to=$('#taboptions'); if(!STATE.addSheet){ to.classList.remove('show'); to.innerHTML=''; return; }
  const tabs=(STATE.sheetMap[STATE.addSheet]||{}).tabs||[];
  to.classList.add('show');
  to.innerHTML = tabs.map(t=>`<div class="tchip ${STATE.addTabs[t.tabGid||'']?'on':''}" onclick="tglTab('${esc(t.tabGid||'')}')"><span class="cb">${STATE.addTabs[t.tabGid||'']?'✓':''}</span>${esc(t.tabName)}</div>`).join('')||'<span style="font-size:12px;color:var(--faint)">이 시트에 활성 탭 없음</span>'; }
function tglTab(gid){ STATE.addTabs[gid]=!STATE.addTabs[gid]; renderTabOptions(); }
async function assignOwn(){ const a=STATE.advCur; if(!a) return; if(!STATE.addSheet){ toast('시트를 선택하세요'); return; }
  let posts=[];
  if(STATE.addMode==='all') posts=[{sheetId:STATE.addSheet, tabGid:null}];
  else { const gids=Object.keys(STATE.addTabs).filter(g=>STATE.addTabs[g]); if(!gids.length){ toast('탭을 선택하세요'); return; } posts=gids.map(g=>({sheetId:STATE.addSheet, tabGid:g})); }
  for(const p of posts) await api('/api/trackb/ownership',{method:'POST',body:JSON.stringify({advertiserId:a.id, sheetId:p.sheetId, tabGid:p.tabGid})});
  toast('소유 지정 완료'); refreshAdvCounts(); selAdv(STATE.advs.indexOf(a));
}
async function rmOwn(sheetId, tabGid){ const a=STATE.advCur; if(!a) return;
  await api('/api/trackb/ownership',{method:'DELETE',body:JSON.stringify({advertiserId:a.id, sheetId, tabGid:tabGid||null})});
  toast('소유 해제'); refreshAdvCounts(); selAdv(STATE.advs.indexOf(a));
}
async function refreshAdvCounts(){ const r=await api('/api/trackb/advertisers'); if(r&&r.ok){ STATE.advs=r.items||[];
  document.querySelectorAll('.advitem').forEach((el)=>{ const i=+el.dataset.i; if(STATE.advs[i]) el.querySelector('.ct').textContent=STATE.advs[i].owned; }); } }

boot();
</script>
</body>
</html>
