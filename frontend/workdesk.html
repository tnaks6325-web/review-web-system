  if(STATE._gMenuCol===col && m.classList.contains('show')){ closeGColMenu(); return; }
  STATE._gMenuCol=col;
  const roster=(STATE.wd&&STATE.wd.roster)||[]; const cur=STATE.gFilters[col];
  const counts={}; roster.forEach(r=>{ const v=gCellDisp(r,col); counts[v]=(counts[v]||0)+1; });
  const vals=Object.keys(counts).sort((a,b)=>a.localeCompare(b,'ko',{numeric:true}));
  const so=(STATE.gSort&&STATE.gSort.col===col)?STATE.gSort.dir:null;
  const canHide = col!=='#';
  m.innerHTML=`
    <div class="gcm-sort"><button class="${so==='asc'?'on':''}" onclick="gSortCol('asc')">▲ 오름차순</button><button class="${so==='desc'?'on':''}" onclick="gSortCol('desc')">▼ 내림차순</button></div>
    <input class="gcm-search" placeholder="값 검색…" oninput="gFilterMenuList(this.value)">
    <div class="gcm-acts"><a onclick="gcmAll(true)">전체 선택</a><a onclick="gcmAll(false)">전체 해제</a></div>
    <div class="gcm-list" id="gcmlist">${vals.map(v=>{ const on=!cur||cur.has(v);
      return `<label class="gcm-opt" data-v="${esc(v)}"><input type="checkbox" ${on?'checked':''} value="${esc(v)}"><span class="cv">${esc(v||'(빈값)')}</span><span class="cn">${counts[v]}</span></label>`;
    }).join('')||'<div class="gcm-empty">값 없음</div>'}</div>
    <div class="gcm-foot"><button class="btn xs" onclick="closeGColMenu()">취소</button><button class="btn xs pri" onclick="applyGFilter()">적용</button></div>
    ${canHide?`<div class="gcm-div"></div><button class="gcm-hide" onclick="hideGCol()">⤫ 이 열 숨기기</button>`:''}`;
  m.classList.add('show');
  _placeMenu(m, rect, 252, 340);
}
function closeGColMenu(){ STATE._gMenuCol=null; const m=$('#gcolmenu'); if(m) m.classList.remove('show'); }
function gFilterMenuList(q){ const ql=(q||'').trim().toLowerCase(); const box=$('#gcmlist'); if(!box) return;
  box.querySelectorAll('.gcm-opt').forEach(o=>{ const v=(o.getAttribute('data-v')||'').toLowerCase(); o.style.display=(!ql||v.includes(ql))?'':'none'; }); }
function gcmAll(on){ const box=$('#gcmlist'); if(!box) return; box.querySelectorAll('.gcm-opt').forEach(o=>{ if(o.style.display!=='none') o.querySelector('input').checked=on; }); }
function applyGFilter(){ const col=STATE._gMenuCol; if(col==null) return;
  const boxes=[...$('#gcmlist').querySelectorAll('input')];
  const checked=boxes.filter(b=>b.checked).map(b=>b.value);
  if(checked.length===boxes.length){ delete STATE.gFilters[col]; }   // 전부 선택 = 필터 해제
  else{ STATE.gFilters[col]=new Set(checked); }
  STATE.gCollapsed.clear(); closeGColMenu(); rerenderGrid();
}
function gSortCol(dir){ const col=STATE._gMenuCol; if(col==null) return;
  if(STATE.gSort&&STATE.gSort.col===col&&STATE.gSort.dir===dir) STATE.gSort=null; else STATE.gSort={col,dir};
  closeGColMenu(); rerenderGrid();
}
function hideGCol(){ const col=STATE._gMenuCol; if(col==null||col==='#') return;
  STATE.gHidden.add(col);

// ── 그리드 셀 즉시 편집(엑셀/구글시트식) ──
//   인라인 입력 → 커밋 시 로컬 모델 즉시 반영 + 해당 셀만 재도색 + 백그라운드 저장(전체 리로드/네트워크 대기 없음 = 딜레이 0).
//   Enter=아래 셀, Tab=오른쪽, Shift+Tab=왼쪽으로 이어서 편집. Esc=취소(로컬 복원). 저장 실패/충돌 시에만 롤백·리로드.
function _gridRowById(id){ return ((STATE.wd&&STATE.wd.roster)||[]).find(r=>String(r.id)===String(id)); }
// 그리드 col 셀 1칸을 로컬 모델 기준으로 재도색(rowHtml의 col 분기와 동일 계산 — 편집표시/되돌리기/gempty/gok 일치).
function _paintGridCell(r, field, td){
  if(!td||!field||field.indexOf('col:')!==0) return;
  const h=field.slice(4);
  const rj=(r.rowJson&&typeof r.rowJson==='object')?r.rowJson:{};
  const ce=(r.cellEdits&&typeof r.cellEdits==='object')?r.cellEdits:{};
  const ed=(h in ce); const raw= ed?ce[h]:rj[h];
  const disp= ed?(raw==null?'':String(raw)):_gridVal(h, raw);
  const editv= ed?disp:_gridEditVal(h, raw);
  const isOk=(h==='리뷰제출'||h==='입금');
  td.classList.toggle('edited', ed); td.classList.toggle('gempty', !disp); if(isOk) td.classList.toggle('gok', !!disp);
  td.setAttribute('data-val', editv!=null?editv:disp);   // 편집 대상 값(다음 클릭 시 입력 초기값)
  td.setAttribute('title', disp||'');   // 축약된 전체값 = 호버 툴팁
  td.innerHTML=`${esc(disp||'—')}${ed?` <span class="revb" title="되돌리기" data-id="${esc(r.id)}" data-field="${esc(field)}" onclick="revertCell(event,this)">↩</span>`:''}`;
}
function beginEditCell(td){
  if(!td||!td.getAttribute||td.querySelector('input')) return;
  const rowId=td.getAttribute('data-id'), field=td.getAttribute('data-field'), cur=td.getAttribute('data-val')||'';
  if(!field||field.indexOf('col:')!==0) return;   // 편집 가능한 시트열 셀만(참여자·연락처·# 잠금)
  td.innerHTML=`<input class="einp" value="${esc(cur)}">`;
  const inp=td.querySelector('input'); inp.focus(); inp.select();
  let done=false;
  const restore=()=>{ const r=_gridRowById(rowId); if(r) _paintGridCell(r,field,td); else reloadWorkdesk(); };
  const finish=(nav)=>{ if(done)return; done=true;
    const val=inp.value;
    if(val===cur) restore(); else commitCellEdit(rowId, field, val, td);   // 무변경=복원 · 변경=즉시반영+백그라운드 저장
    if(nav) _navFromCell(td, nav); };
  const cancel=()=>{ if(done)return; done=true; restore(); };
  inp.addEventListener('blur',()=>finish(null));
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){ e.preventDefault(); finish('down'); }
    else if(e.key==='Tab'){ e.preventDefault(); finish(e.shiftKey?'left':'right'); }
    else if(e.key==='Escape'){ e.preventDefault(); cancel(); }
  });
}
// 낙관적 커밋: 로컬 즉시 반영 → 백그라운드 저장. 실패 시 (아직 최신 값일 때만) 롤백해 더 새 편집 보호.
function commitCellEdit(rowId, field, value, td){
  const r=_gridRowById(rowId); if(!r||!field||field.indexOf('col:')!==0) return;
  const h=field.slice(4); r.cellEdits=(r.cellEdits&&typeof r.cellEdits==='object')?r.cellEdits:{};
  const had=(h in r.cellEdits), prev=r.cellEdits[h];
  r.cellEdits[h]=value; _paintGridCell(r, field, td);
  const t=STATE.cur; if(!t) return;
  const rollback=()=>{ if(r.cellEdits[h]===value){ if(had) r.cellEdits[h]=prev; else delete r.cellEdits[h]; _paintGridCell(r, field, td); } };
  api('/api/trackb/workdesk/edit',{method:'POST',body:JSON.stringify({sheetId:t.sheetId,tabName:t.tabName,rowId,field,value})})
    .then(resp=>{
      if(resp&&resp.ok){ if(td&&td.classList){ td.classList.add('cellsaved'); setTimeout(()=>{ td.classList.remove('cellsaved'); },600); } return; }
      rollback();
      if(resp&&resp.error==='concurrent_edit_conflict'){ toast('동시 편집 감지 — 최신 상태로 새로고침'); reloadWorkdesk(); }
      else toast(resp&&resp.error?('편집 거부: '+resp.error):'편집 실패');
    })
    .catch(()=>{ rollback(); toast('편집 실패 — 네트워크'); });
}
// 커밋 후 이동(Enter=아래·Tab=오른쪽·Shift+Tab=왼쪽) — 다음 편집 가능한 셀로 이어 편집.
function _navFromCell(td, dir){
  const tr=td.parentElement; if(!tr) return; const cells=[...tr.children]; const ci=cells.indexOf(td);
  const open=cell=>{ if(cell&&cell.classList&&cell.classList.contains('gedit')){ setTimeout(()=>beginEditCell(cell),0); return true; } return false; };
  if(dir==='right'||dir==='left'){ const step=dir==='right'?1:-1;
    for(let j=ci+step;j>=0&&j<cells.length;j+=step){ if(open(cells[j])) return; } }
  else{ const tbody=tr.parentElement; if(!tbody) return;
    const rows=[...tbody.children].filter(x=>x.tagName==='TR'&&!x.classList.contains('grouphd'));
    const ri=rows.indexOf(tr); const target=rows[ri+(dir==='down'?1:-1)]; if(target) open(target.children[ci]); }
}
// 되돌리기(그리드 col): 로컬 즉시 원복 + 백그라운드 revert. 실패 시 복원.
function revertCell(ev, el){ if(ev)ev.stopPropagation();
  const rowId=el.getAttribute('data-id'), field=el.getAttribute('data-field');
  const td=el&&el.closest?el.closest('td'):null, r=_gridRowById(rowId);
  if(r&&td&&field&&field.indexOf('col:')===0){
    const h=field.slice(4), had=!!(r.cellEdits&&(h in r.cellEdits)), prev=had?r.cellEdits[h]:undefined;
    if(r.cellEdits) delete r.cellEdits[h];
    _paintGridCell(r, field, td);
    const t=STATE.cur; if(!t) return;
    api('/api/trackb/workdesk/revert',{method:'POST',body:JSON.stringify({sheetId:t.sheetId,tabName:t.tabName,rowId,field})})
      .catch(()=>{ if(had){ r.cellEdits=r.cellEdits||{}; r.cellEdits[h]=prev; _paintGridCell(r,field,td); } toast('되돌리기 실패'); });
    return;
  }
  revertEdit(rowId, field);   // 비그리드(폴백) 경로
}

async function _woAccept(id){

  const r=await api('/api/trackb/work-orders/accept',{method:'POST',body:JSON.stringify({id})});
  if(r&&r.ok){ _toast(r.skipped?'이미 등록된 오더입니다.':('접수 완료'+(r.tabName?' — '+r.tabName:''))); _loadOrders(); }
  else _toast('⚠ 접수 실패'+(r&&r.error?': '+r.error:''));

async function _woStatus(id){

  const memo=prompt('메모(반려·보완 사유 등, 없으면 비워두세요)')||'';
  const r=await api('/api/trackb/work-orders/status',{method:'PUT',body:JSON.stringify({id,status:st.trim(),admin_memo:memo})});

  else _toast('⚠ 변경 실패'+(r&&r.error?': '+r.error:''));

async function openEditorList(){

    `<div style="font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:11px">

async function _edLoad(){

  const el=document.getElementById('edList'); if(!el) return;
  if(!r||!r.ok){ el.innerHTML=`<div class="empty">명단을 불러오지 못했습니다.</div>`; return; }
  const act=(r.items||[]).filter(x=>x.active);
  el.innerHTML = act.length ? `<table class="lgtable"><thead><tr>
      <th>이름</th><th style="width:120px">부서</th><th style="width:110px">등록자</th><th style="width:60px"></th>

      <td><button class="btn xs" onclick="_edRemove('${esc(x.id)}','${esc(x.name)}')">제거</button></td>
    </tr>`).join('')}</tbody></table>` : `<div class="empty">명단이 비어 있습니다 — 마스터만 편집할 수 있는 상태입니다.</div>`;
}
let _edSuggestT=null, _edCandMap={};
function _edSuggest(q){
  clearTimeout(_edSuggestT);
  if(!q || q.trim().length<1) return;
  _edSuggestT=setTimeout(async ()=>{
    const r=await api('/api/trackb/intranet/users?q='+encodeURIComponent(q.trim()));
    const dl=document.getElementById('edCands'); if(!dl) return;
    const items=(r&&(r.items||r.users))||[];
    _edCandMap={};
    dl.innerHTML=items.map(u=>{
      const nm=u.display_name||u.name||u.username||'';
      _edCandMap[nm]={ username:u.username||'', dept:[u.department,u.part].filter(Boolean).join(' · ') };
      return `<option value="${esc(nm)}">${esc([u.department,u.part].filter(Boolean).join(' · '))}</option>`;
    }).join('');
  }, 150);
}
async function _edAdd(){
  const el=document.getElementById('edName');
  const name=(el.value||'').trim();
  if(!name){ _toast('이름을 입력하세요.'); return; }
  const meta=_edCandMap[name]||{};
  const r=await api('/api/trackb/workdesk-editors',{method:'POST',
    body:JSON.stringify({ name, username:meta.username||'', dept:meta.dept||'' })});
  if(r&&r.ok){ el.value=''; _toast(`'${name}' 을(를) 명단에 추가했습니다.`); _edLoad(); STATE.canEdit=null; }
  else _toast('⚠ 추가 실패'+(r&&r.error?': '+r.error:''));
}
async function _edRemove(id,name){
  if(!confirm(`'${name}' 을(를) 명단에서 뺄까요?\n\n· 이후 접수·발행·수정을 할 수 없고 열람만 됩니다.`)) return;
  const r=await api('/api/trackb/workdesk-editors/'+encodeURIComponent(id),{method:'DELETE'});
  if(r&&r.ok){ _toast('명단에서 제외했습니다.'); _edLoad(); STATE.canEdit=null; }
  else _toast('⚠ 제외 실패'+(r&&r.error?': '+r.error:''));
}

    ★ #csInquiryBadge 를 읽지 않는다: 그 엘리먼트는 관리자 대시보드 탭 버튼에만 있고
      통합 작업대엔 없다 → DOM 에서 읽으면 늘 0이 되어 뱃지가 지워진다(실측). */
function _csSyncNavBadge(n){

}

async function _loadReviewers(){
  const qs = new URLSearchParams({ limit:String(RV_PAGE), offset:String(STATE.rvOffset||0) });
  if(STATE.rvq) qs.set('q', STATE.rvq);
  if(STATE.rvStatus) qs.set('status', STATE.rvStatus);

  if(!r || !r.ok){ if(b) b.innerHTML=`<div class="empty">리뷰어 목록을 불러오지 못했습니다.${r&&r.error?' ('+esc(r.error)+')':''}</div>`; _renderRvHead(0); return; }

function _rvPager(){
  const total=STATE.rvTotal|0, off=STATE.rvOffset|0;
  if(total<=RV_PAGE) return '';

  return `<div style="display:flex;gap:8px;justify-content:center;align-items:center;padding:14px 0;font-size:12.5px">
    <button class="btn" ${prev?'':'disabled'} onclick="STATE.rvOffset=Math.max(0,(STATE.rvOffset|0)-${RV_PAGE});_loadReviewers()">← 이전</button>
    <span style="color:var(--muted)">${Math.floor(off/RV_PAGE)+1} / ${Math.ceil(total/RV_PAGE)}</span>
    <button class="btn" ${next?'':'disabled'} onclick="STATE.rvOffset=(STATE.rvOffset|0)+${RV_PAGE};_loadReviewers()">다음 →</button></div>`;
}
/** 관리자 메모 저장 — 값이 안 바뀌었으면 요청하지 않는다(포커스 이동마다 쓰기 금지) */
async function _rvSaveMemo(el){
  const id=el.getAttribute('data-rvid');
  const row=(STATE.rv||[]).find(x=>String(x.id)===String(id));
  const memo=el.value;
  if(!row || String(row.memo||'')===String(memo)) return;
  el.disabled=true;
  const r=await api('/api/trackb/reviewers/memo',{method:'POST',body:JSON.stringify({id,memo})});
  el.disabled=false;
  if(r&&r.ok){ row.memo=memo; _toast('메모를 저장했습니다.'); }
  else { el.value=row.memo||''; _toast('⚠ 메모 저장 실패'+(r&&r.error?': '+r.error:'')); }   // 실패 시 화면값을 원래대로 되돌린다
}

    <input id="lgq" class="ovsearch" placeholder="캠페인/리뷰어/내용 검색" oninput="STATE.logq=this.value;_renderLogsBody(this.value)" value="${esc(STATE.logq||'')}"></div>
    <div class="ovnote">구매양식 <b>시트 소실(유령 written)</b>·<b>미반영 적체</b>·<b>구매캡쳐 미첨부</b> 등을 시스템이 자동 감지해 캠페인별 한글 문장으로 기록합니다. 소실 건은 자동 재기록되며(하단 행 비고 'system'), 반복 소실·수동 필요 건은 🔴 중요로 표시됩니다.</div>`;
}
function _renderLogsBody(q){
  const kw=String(q||'').trim().toLowerCase();
  const kwd=kw.replace(/[^0-9]/g,'');   // 숫자만 입력하면 연락처 검색(하이픈 유무 무관)
  const items=(STATE.logs||[]).filter(l=>!kw
    || String(l.campaignName||'').toLowerCase().includes(kw)
    || String(l.reviewerName||'').toLowerCase().includes(kw)
    || String(l.message||'').toLowerCase().includes(kw)
    || String(l.problem||'').toLowerCase().includes(kw)
    || String(l.action||'').toLowerCase().includes(kw)
    || (kwd && String(l.phone8||'').includes(kwd)));
  if(!items.length){ $('#lgbody').innerHTML=`<div class="empty">${kw?'검색 결과가 없습니다.':'표시할 로그가 없습니다. (문제 없음 🎉)'}</div>`; return; }
  const sevBadge=s=> s==='critical'?'<span class="bd no">중요</span>' : s==='warn'?'<span class="bd" style="background:#FEF3C7;color:#92400E">주의</span>' : '<span class="bd g">정보</span>';
  // 표(컬럼) 표기 — 한 줄 문장 대신 발생시점/작업명/이름/전화번호/오류내용/조치안내로 분해.
  //   오류내용·조치안내는 서버가 event_type+context 로 만들어 내려주고(problem/action),
  //   모르는 유형이면 message 원문을 오류내용 칸에 그대로 넣어 화면이 비지 않게 한다.
  $('#lgbody').innerHTML = `<div class="ovnote" style="margin-bottom:8px">행을 클릭하면 아래로 <b>펼쳐져 상세·제출 캡처</b>를 보고 그 자리에서 <b>해결</b> 처리할 수 있습니다. 리뷰어가 올바른 캡처를 다시 올리면 <b>자동 해결</b>되며, 해결된 로그는 위 <b>‘해결된 로그 포함’</b>으로 다시 볼 수 있습니다.</div>
    <div class="lgwrap"><table class="lgtable">
    <thead><tr>
      <th class="c-btn"></th><th class="c-sev">상태</th><th class="c-ts">발생시점</th><th class="c-tab">작업명</th>
      <th class="c-nm">이름</th><th class="c-ph">전화번호</th>
      <th class="c-prob">오류내용</th><th class="c-act">조치안내</th>
    </tr></thead><tbody>`+items.map(l=>{
    const t=l.occurredAt?new Date(l.occurredAt):null;
    const ts=t?`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`:'';
    const resolved=!!l.resolvedAt;
    const problem=l.problem||l.message||'';   // 미지 유형 폴백
    const ph=_fmtPhone(l.phone8||'');
    const cap=_logCapFileId(l);   // capture_mismatch 로그의 제출 캡처 파일ID(있을 때만)
    // 조치 버튼은 표에서 제거하고 펼침 패널로 이동한다([확인] 버튼 제거 요청).
    //   여기서 _logOpenWorkdesk/_cancelLogOrder/_resolveLog/_canResolveLog 를 참조 = 회귀가드 대상.
    const acts=[];
    if(l.sheetId&&l.tabName) acts.push(`<button class="btn xs" onclick="event.stopPropagation();_logOpenWorkdesk(${l.id})" title="이 리뷰어의 행이 있는 작업대를 새 탭으로 엽니다">작업대 ↗</button>`);
    if(!resolved && _canResolveLog()){
      if(_LOG_CANCELABLE.has(l.eventType)) acts.push(`<button class="btn xs" style="border-color:#FCA5A5;color:#B91C1C" onclick="event.stopPropagation();_cancelLogOrder(${l.id})" title="시트에서 지운 것이 '주문취소'였다면 — 다시 기록되지 않습니다">취소 처리</button>`);
      acts.push(`<button class="btn xs" style="background:#16a34a;color:#fff;border-color:#16a34a" onclick="event.stopPropagation();_resolveLog(${l.id})" title="이 알림을 해결 처리 — 모든 관리자 화면에서 사라집니다">✔ 해결</button>`);
    }
    const imgBlock=cap?`<div class="lgcap"><img src="${_logImgUrl(cap)}" loading="lazy" onclick="event.stopPropagation();_logViewImage('${cap}')" onerror="this.style.display='none'" title="클릭하면 크게 보기"><div class="lgcaphint">📷 리뷰어가 제출한 캡처 — 클릭하면 크게 보기</div></div>`:'';
    const detail=`<tr class="lgdetail" id="lgdetail-${l.id}" style="display:none"><td colspan="8"><div class="lgexpand">
        <div class="lgexptext"><b>오류내용</b> ${esc(problem)}${l.action?`<br><b>조치안내</b> ${esc(l.action)}`:''}${resolved?`<br><span style="color:var(--faint)">✔ 확인: ${esc(l.resolvedBy||'')}</span>`:''}</div>
        ${imgBlock}
        <div class="lgexpacts">${acts.join('')||'<span style="color:var(--muted);font-size:11.5px">열람 권한만 있습니다(해결은 담당 관리자).</span>'}</div>
      </div></td></tr>`;
    return `<tr class="lgrow ${resolved?'lgdone':''}${l.severity==='critical'&&!resolved?' lgcrit':''}" onclick="_toggleLogRow(${l.id})">
      <td class="c-btn"><span class="lgchev" id="lgchev-${l.id}">▾</span>${cap?'<span class="lgcapdot" title="제출 캡처 있음">🖼</span>':''}</td>
      <td class="c-sev">${sevBadge(l.severity)}${resolved?`<div class="lgby" title="확인: ${esc(l.resolvedBy||'')}">✔ 해결됨</div>`:''}</td>
      <td class="c-ts">${esc(ts)}</td>
      <td class="c-tab" title="${esc(l.campaignName||l.tabName||'')}">${esc(l.campaignName||l.tabName||'')}</td>
      <td class="c-nm">${esc(l.reviewerName||'')}</td>
      <td class="c-ph">${esc(ph)}</td>
      <td class="c-prob">${esc(problem)}</td>
      <td class="c-act">${esc(l.action||'')}</td>
    </tr>${detail}`;
  }).join('')+`</tbody></table></div>`;
}
// 리뷰어 로그 펼침행 헬퍼 — 행 클릭 시 상세+제출 캡처를 아래로 펼친다. 이미지 프록시는 무인증·추측불가 fileId.

function _logCapFileId(l){ try{ const c=l&&l.context; const f=c&&typeof c==='object'?c.fileId:''; return /^[-\w]{20,}$/.test(String(f||''))?String(f):''; }catch(_){ return ''; } }
function _toggleLogRow(id){ const d=document.getElementById('lgdetail-'+id); if(!d) return;

  ov.innerHTML=`<div class="modalbox" style="width:auto;max-width:96vw"><div class="modalhd"><b>제출 캡처</b> <a class="btn xs" href="${url}" target="_blank" rel="noopener">새 탭 ↗</a> <button class="btn xs" onclick="document.getElementById('lgimgov').remove()">닫기</button></div><div class="modalbd" style="text-align:center"><img src="${url}" style="max-width:92vw;max-height:80vh;border-radius:8px"></div></div>`;

// 로그 → 그 리뷰어가 있는 작업대를 새 탭으로. 탭 지정+행 강조 정보를 프래그먼트(#)로 넘긴다
//   — 프래그먼트는 서버 로그·Referer에 안 실려 연락처가 새지 않고, 도착 즉시 주소창에서 제거된다.
//   토큰도 함께 넘기는 이유: 새 탭은 sessionStorage를 물려받지 못해(인트라넷 SSO 세션) 로그인 화면으로 떨어진다.
//   ★ 권한 확대 아님 — 새 탭도 서버의 스코프 검증(canAccessTab)을 그대로 거친다.
function _logOpenWorkdesk(id){
  const l=(STATE.logs||[]).find(x=>String(x.id)===String(id));
  if(!l||!l.sheetId||!l.tabName) return;
  const payload={ s:l.sheetId, t:l.tabName, g:l.tabGid||'', p:l.phone8||'', n:l.reviewerName||'', st:l.campaignName||'' };
  let url=location.origin+location.pathname+'#go='+encodeURIComponent(JSON.stringify(payload));
  const tk=token(); if(tk) url+='&sso='+encodeURIComponent(tk);
  window.open(url,'_blank','noopener');   // noopener = 새 탭이 이 창을 조작하지 못하게
}
// '구매캡쳐 미첨부' 정밀확인 — DB의 미연결 표시만으로는 "안 올림"과 "올렸는데 연결 실패"를 구분할 수 없어
//   Drive [구매캡처] 폴더 실물과 대조한다(읽기 전용). 결과는 모달로.
async function _auditNoCapture(){

        </div>

          위 숫자는 <b>캡처↔주문 연결 기능 배포(${esc(String(r.cutoff||'').replace('T',' ').slice(0,16))}) 이후</b> 주문만 센 것입니다.
          ${(lg.attachedButUnlinked|0)?`그 이전 <b>${lg.attachedButUnlinked|0}건</b>은 연결 코드가 없던 시절이라 미링크가 정상이며 <b>알림이 나간 적 없습니다</b>(집계 제외).`:''}
          ${r.tabsSkipped?`<br>※ 탭이 많아 ${r.tabsSkipped}개 탭은 이번 대조에서 제외됐습니다(maxTabs).`:''}
          ${(s.unknown|0)?`<br>※ 판정 보류 ${s.unknown|0}건은 그 탭에 [구매캡처] 폴더가 연결돼 있지 않아 대조할 수 없었습니다 — 탭설정에서 폴더 연결이 필요합니다.`:''}</div>

// 확인(해결)은 전역 상태 변경이라 admin/master 전용(서버도 adminOrMaster로 강제) — staff는 열람만.
function _canResolveLog(){ return STATE.role==='master' || STATE.role==='admin'; }
// 「시트에서 지운 게 사실은 취소」인 경우에만 취소 처리 버튼을 노출(서버도 동일 목록으로 검증).
const _LOG_CANCELABLE = new Set(['order_lost','order_lost_manual','order_unmirrored']);
async function _cancelLogOrder(id){
  if(!confirm('이 주문을 취소 처리할까요?\n\n· 시트에 다시 기록되지 않습니다.\n· 시트에 행이 남아 있으면 그 행을 비웁니다(다른 사람이 이미 쓴 행은 건드리지 않습니다).\n· 서버에서 취소 상태로 확정됩니다.')) return;
  const r=await api('/api/trackb/reviewer-logs/cancel-order',{method:'POST',body:JSON.stringify({id})});
  if(!r||!r.ok){ alert('취소 처리 실패: '+((r&&r.error)||'')); return; }
  await _loadLogs();
}
async function _resolveLog(id){
  const r=await api('/api/trackb/reviewer-logs/resolve',{method:'POST',body:JSON.stringify({id})});
  if(!r||!r.ok){ alert('확인 처리 실패'); return; }
  await _loadLogs();
}

// cutover 종합 판정 — fail-closed: real은 "신선한" 값만 인정(세션 [정밀] 30분 TTL > 서버 스냅샷 fresh > 없음=미검증).
const REAL_TTL_MS = 30*60*1000;
function _freshReal(o){
  if(typeof o.real==='number' && o.realAt && (Date.now()-o.realAt)<REAL_TTL_MS) return {v:o.real,src:'방금 정밀',at:o.realAt};
  const lp=o.lastParity;
  if(lp && lp.fresh && typeof lp.real==='number') return {v:lp.real,src:'스냅샷',at:lp.takenAt?new Date(lp.takenAt).getTime():null};
  return null;
}
function _cutoverVerdict(o){

  if(o.ghost) return {cls:'no',txt:'유령',title:'A·B 모두 활성 0행(아카이브/리네임 잔재) — cutover 대상 아님'};
  const base=o.countMatch&&o.owned&&o.woLinked;
  if(!base){ const m=[]; if(!o.countMatch)m.push('카운트'); if(!o.owned)m.push('소유'); if(!o.woLinked)m.push('발주'); return {cls:'no',txt:'미충족',title:'미충족: '+m.join('·')}; }
  const fr=_freshReal(o);
  if(fr) return fr.v===0
    ?{cls:'ok',txt:'✅ 준비',title:`카운트·소유·발주·진짜불일치0 충족 (${fr.src}${fr.at?' '+_fmtTs(fr.at):''}) → cutover 가능`}
    :{cls:'no',txt:'불일치 '+fr.v,title:`진짜 불일치 ${fr.v}건 (${fr.src})`};
  if(typeof o.real==='number') return {cls:'warn',txt:'정밀 만료',title:'정밀 결과가 30분 경과 — [정밀] 재실행 필요'};

function _spark(vals){ if(!vals.length)return ''; const w=520,h=46,pad=4,max=Math.max(1,...vals),n=vals.length;
  const X=i=>pad+(n<=1?(w-2*pad)/2:i*(w-2*pad)/(n-1)), Y=v=>h-pad-(v/max)*(h-2*pad);
  const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' '); const last=vals[vals.length-1];
  const dots=vals.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.2" fill="${v===0?'var(--safe)':'var(--bad)'}"/>`).join('');
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="margin-bottom:10px;background:var(--card2);border-radius:8px">${n>1?`<polyline fill="none" stroke="${last===0?'var(--safe)':'var(--bad)'}" stroke-width="2" points="${pts}"/>`:''}${dots}</svg>`;
}

// 진실원천 전환(master 전용) — 옵션 A cutover 스위치. 'db' 전환은 진짜불일치 0 게이트(409면 force 확인).
async function flipSoT(value, force){
  if(!STATE.cur)return;
  if(value==='db' && !force && !confirm(`이 탭의 원본을 Track B(DB)로 전환합니다.\n\n옵션 A(미러 유지·되돌리기 가능)이며, 시트 쓰기반영 엔진(P2)이 붙기 전까지 라이브 동작은 바뀌지 않습니다.\n계속할까요?`)) return;
  const btn=$('#sotBtn'); if(btn){btn.disabled=true;btn.textContent='전환 중…';}
  const r=await api('/api/trackb/source-of-truth',{method:'POST',body:JSON.stringify({sheetId:STATE.cur.sheetId,tabName:STATE.cur.tabName,value,force:!!force})});
  if(r&&r.ok){ toast(`원본 → ${value==='db'?'Track B':'시트'}`); selTab(STATE.tabs.indexOf(STATE.cur)); return; }
  if(r&&r.error==='parity_not_clean'){
    // force 마찰: confirm 원클릭이 아니라 탭명을 직접 타이핑해야 강제 전환(우발적 force 차단, 검증 미통과 명시).
    const typed=prompt(`방금 서버가 재계산한 진짜 불일치가 ${r.real}건입니다(권장: 0).\n(화면의 이전 [정밀] 결과가 아니라 지금 시점 값입니다.)\n\n검증 미통과 상태로 강제 전환하려면 탭 이름을 정확히 입력하세요:\n${STATE.cur.tabName}`);
    if(typed!==null && typed.trim()===STATE.cur.tabName) return flipSoT('db', true);
    if(typed!==null) toast('탭 이름 불일치 — 강제 전환 취소됨');
  } else if(r&&r.error==='parity_check_failed'){
    toast('전환 거부: 정밀검증 실패('+((r&&r.detail)||'오류')+') — 잠시 후 재시도하세요');
  } else if(r&&r.error==='empty_tab'){
    toast('전환 거부: A·B 모두 0행(유령/아카이브 탭) — cutover 대상이 아닙니다');
  } else { toast('전환 실패: '+((r&&r.error)||'오류')); }
  if(btn){btn.disabled=false;btn.textContent=value==='db'?'Track B로 전환':'시트로 되돌리기';}
}

  const tmap={toggle:'제출/입금',edit:'필드편집',add:'행추가',clear:'행삭제'};
  const rows=ops.map(o=>{ const nv=(o.newValue&&typeof o.newValue==='object')?JSON.stringify(o.newValue):(o.newValue==null?'':String(o.newValue));
    return `<tr><td>${esc(tmap[o.type]||o.type)}</td><td>${esc(o.field||'')}</td><td>${esc(o.name||'—')}</td><td>${o.sheetRow||'-'}${o.column?(' · '+esc(o.column)+'열'):''}${o.header?(' <span style="color:var(--faint)">('+esc(o.header)+')</span>'):''}</td><td>${esc(nv)}</td><td>${gmap[o.guard]||esc(o.guard)}</td></tr>`;

      원본: ${r.cutover?'<b>Track B(cutover)</b>':'시트'} · 실제적용 트리거(<code>TRACK_B_WRITEBACK_FULL</code>): <b>${r.triggerOn?'ON':'OFF'}</b>${r.triggerOn?'':' <span style="color:var(--faint)">(OFF = 시뮬레이션만, 시트 무접촉)</span>'}</div>
    <div style="font-size:12.5px;font-weight:650;margin-bottom:8px">총 ${s.total||0} · <span class="ok">반영가능 ${s.ok||0}</span> · <span style="color:var(--warn)">위험(적용제외) ${s.risky||0}</span> · <span style="color:var(--bad)">차단 ${s.blocked||0}</span></div>

}

// 인트라넷 광고주DB 실시간 자동완성(서버 프록시 경유 — 브라우저는 인트라넷 직접 미호출). 실패 시 조용히 무시.
//   ★ 등록 게이트: 거래처정보(인트라넷 광고주DB)에 정확히 존재하는 이름만 등록 허용 → 목록에서 선택(또는 정확 입력)해야
//     [＋등록] 버튼이 활성화된다(미등록/오타 광고주 유입 차단). 서버(createAdvertiserScoped)도 동일 검증(최종 방어).
let _sugTimer=null, _intraItems=[], _aeItems=[];
function intraSuggest(q){
  clearTimeout(_sugTimer); const box=$('#advSug'); const val=(q||'').trim();
  _advNameCheck();   // 즉시(직전 후보 기준) 상태 갱신 — 타이핑 중 반응성
  if(!box) return;
  if(!val){ box.classList.remove('show'); box.innerHTML=''; return; }
  _sugTimer=setTimeout(async()=>{
    const r=await api('/api/trackb/intranet/advertisers?q='+encodeURIComponent(val)).catch(()=>null);
    _intraItems=(r&&r.ok&&r.items)||[];
    _advNameCheck();
    if(!_intraItems.length){ box.classList.remove('show'); box.innerHTML=''; return; }
    box.innerHTML=_intraItems.map(it=>{
      const meta=[it.ceo?('대표 '+esc(it.ceo)):'', it.bizNo?('사업자 '+esc(it.bizNo)):''].filter(Boolean).join(' · ');
      return `<div class="sugitem" onclick="pickIntra('${esc(it.name).replace(/'/g,'&#39;')}','${esc(it.manager||'').replace(/'/g,'&#39;')}')"><span class="sugl"><span class="sugn">${esc(it.name)}</span>${meta?`<span class="sugmeta">${meta}</span>`:''}</span>${it.manager?`<span class="sugm">${esc(it.manager)}</span>`:''}</div>`;
    }).join('');
    box.classList.add('show');
  },120);
}
// 현재 입력값이 인트라넷 광고주DB(직전 후보)에 정확히 있는지 판정 → 상태문구 + [＋등록] 버튼 활성/비활성.
function _advNameCheck(){
  const el=$('#advName'), chk=$('#advNameChk'), btn=$('#advCreateBtn'); if(!el) return;
  const val=(el.value||'').trim().toLowerCase();
  const ok=!!val && _intraItems.some(it=>String(it.name||'').trim().toLowerCase()===val);
  STATE.advNameOk=ok;
  if(chk){
    if(!val){ chk.textContent=''; chk.style.color=''; }
    else if(ok){ chk.textContent='✓ 인트라넷 광고주DB 등록 확인됨'; chk.style.color='var(--safe)'; }
    else { chk.textContent='⚠ 거래처정보에 등록되지 않은 광고주입니다 — 목록에서 선택하세요'; chk.style.color='var(--bad)'; }
  }
  if(btn) btn.disabled=!ok;
}
// 거래처 선택 시: 값 확정 + 검증 통과 + master/admin 이고 담당AE 칸이 비어 있으면 광고주DB 담당자(manager) 자동 제안(수정 가능).
function pickIntra(name, manager){ const el=$('#advName'); if(el) el.value=name;
  const pm=$('#advPm');

// 담당 AE 입력값이 인트라넷 등록 AE(dept=AE 목록)에 있는지 → 확인 배지. 자유입력 허용이라 미매칭도 차단 안 함(회색 안내만).
function _advPmCheck(){
  const el=$('#advPm'), chk=$('#advPmChk'); if(!el||!chk) return;
  const val=(el.value||'').trim().toLowerCase();
  if(!val){ chk.textContent=''; chk.style.color=''; return; }
  const ok=_aeItems.some(u=>String(u.name||'').trim().toLowerCase()===val);
  if(ok){ chk.textContent='✓ 인트라넷 등록 AE 확인됨'; chk.style.color='var(--safe)'; }
  else { chk.textContent='직접 입력값 (인트라넷 AE 목록에 없음)'; chk.style.color='var(--faint)'; }

async function createAdvertiser(){
  const sheetId=($('#advSheet')&&$('#advSheet').value)||'';
  const name=($('#advName').value||'').trim(), inad_pm=(($('#advPm')&&$('#advPm').value)||'').trim();
  const err=$('#advErr'); if(err) err.textContent='';
  if(!sheetId){ if(err) err.textContent='캠페인 시트를 먼저 선택하세요.'; return; }
  if(!name){ if(err) err.textContent='거래처명을 입력하세요.'; return; }
  if(!STATE.advNameOk){ if(err) err.textContent='거래처정보(인트라넷 광고주DB)에 등록된 광고주만 등록할 수 있습니다. 목록에서 선택하세요.'; return; }
  const r=await api('/api/trackb/advertisers',{method:'POST',body:JSON.stringify({ name, inad_pm })});
  if(!(r&&r.ok)){ if(err) err.textContent=(r&&r.error)||'등록 실패'; return; }
  const newId=r.data&&r.data.id;
  let ownOk=false;
  if(newId){ const o=await api('/api/trackb/ownership',{method:'POST',body:JSON.stringify({advertiserId:newId, sheetId, tabGid:null})}); ownOk=!!(o&&o.ok); }
  toast(ownOk ? ('업체 등록 + 시트 소유 지정: '+name) : ('업체 등록: '+name+' (소유 지정 실패 — 아래에서 수동 지정)'));
  await renderOwnershipView();
  const idx=(STATE.advs||[]).findIndex(a=>a.id===newId); if(idx>=0) selAdv(idx);
}
// ── 광고주 전용 접속 링크(매직 링크) — master/admin 만. 광고주는 이 링크만 열면 로그인 없이
//   이 업체 뷰(소유 탭·마스킹·읽기전용)로 진입. 유출 대비 회전/폐기 가능. 링크 CRUD = /api/trackb/advertiser-link. ──
function _advLinkUrl(token){ return location.origin + '/workdesk#adv=' + encodeURIComponent(token); }

  if(!(STATE.role==='master'||STATE.role==='admin')) return '';

    return `<div class="sect"><div class="st">광고주 접속 링크</div>
      <div class="linkempty">링크 준비 중… <button class="btn xs" onclick="advLinkGen('${esc(a.id)}',false)">지금 생성</button></div></div>`;
  }

    : hasAcct ? '이 업체는 계정이 있어 링크를 열면 로그인 화면이 뜹니다(아래 "광고주 계정"으로 로그인).'
    : '아래 "광고주 계정"에서 계정을 만들면 이 링크가 자동으로 "로그인 필요"로 바뀝니다.';
  return `<div class="sect"><div class="st">광고주 접속 링크 <span class="sthint">업체마다 자동 생성된 고유 URL — 광고주에게 전달</span></div>
    <div class="linkrow"><input id="advLinkUrl" readonly value="${esc(url)}" onclick="this.select()"><button class="btn xs pri" onclick="advLinkCopy()">복사</button></div>
    <div class="linkmeta">${mode} <span class="linkused">${esc(used)}</span><span style="flex:1"></span>
      <button class="btn xs" onclick="advLinkGen('${esc(a.id)}',true)">링크 회전</button>
      ${lk.active?`<button class="btn xs bad" onclick="advLinkRevoke('${esc(a.id)}')">폐기</button>`:`<button class="btn xs" onclick="advLinkEnable('${esc(a.id)}')">다시 활성</button>`}</div>
    <div class="linkhint">${hint}</div></div>`;
}
async function _advLinkReload(){ const cur=STATE.advCur; if(!cur) return;
  const lk=await api('/api/trackb/advertiser-link',{method:'POST',body:JSON.stringify({action:'get',advertiserId:cur.id})}).catch(()=>null);

async function advLinkGen(advertiserId, rotate){

  if(r&&r.ok){ toast(rotate?'링크 회전 완료':'접속 링크 발급'); await _advLinkReload(); }
  else toast('발급 실패'+(r&&r.error?': '+r.error:''));
}
async function advLinkRevoke(advertiserId){

async function advLinkEnable(advertiserId){

function advLinkCopy(){ const el=$('#advLinkUrl'); if(!el) return; el.select();

// ── 광고주 로그인 계정(업체별) — master/admin 만. 광고주는 이 아이디/비번으로 통합작업대에 로그인 →

async function _advAcctReload(){ const cur=STATE.advCur; if(!cur) return;

function buildTabIndex(list){ STATE.sheetMap={}; STATE.tabIndex={};

    STATE.sheetMap[t.sheetId].tabs.push(t); STATE.tabIndex[t.sheetId+'::'+(t.tabGid||'')]=t.tabName; } }

async function selAdv(i){ const a=STATE.advs[i]; STATE.advCur=a; STATE.addSheet=null; STATE.addMode='all'; STATE.addTabs={}; STATE.ownBrand=null;
  STATE.ownSettle={}; STATE.ownSettleFor=a.id;
  document.querySelectorAll('.advitem').forEach(el=>el.classList.toggle('on',+el.dataset.i===i));
  $('#ownPanel').innerHTML=`<div class="empty">불러오는 중…</div>`;
  const isAdmin2=STATE.role==='master'||STATE.role==='admin';
  const [r, rt, lk]=await Promise.all([
    api('/api/trackb/ownership?advertiserId='+encodeURIComponent(a.id)),
    api('/api/trackb/ownership/tabs?advertiserId='+encodeURIComponent(a.id)).catch(()=>null),
    isAdmin2 ? api('/api/trackb/advertiser-link',{method:'POST',body:JSON.stringify({action:'ensure',advertiserId:a.id})}).catch(()=>null) : Promise.resolve(null),   // ensure=없으면 자동생성(모든 업체 항상 고유 URL)
  ]);
  if(STATE.advCur!==a) return;   // 빠른 업체 전환 경합 — 늦게 온 stale 응답이 현재 패널을 덮지 않게 폐기
  STATE.advLink=(lk&&lk.ok&&lk.link)||null;   // 이 업체 접속 링크(있으면 token/active)
  STATE.ownTabs=(rt&&rt.ok&&rt.items)||[];
  renderOwnPanel(a, (r&&r.items)||[]);
  if(STATE.ownTabs.some(t=>t.salesId)) loadOwnSettlement(a.id);   // 정산 컬럼 비동기 필(링크 탭 0이면 호출 생략)
}
// 연결된 탭 클릭 → 작업대에서 그 탭 열기(관측 뷰 "열기"와 동일한 pendingTab 계약).
function openOwnTab(i){ const t=(STATE.ownTabs||[])[i]; if(!t) return;
  STATE.pendingTab={sheetId:t.sheetId, tabGid:t.tabGid, tabName:t.tabName, spreadsheetTitle:t.spreadsheetTitle||sheetTitle(t.sheetId)};
  switchView('workdesk'); }
function sheetTitle(sid){ return (STATE.sheetMap[sid]&&STATE.sheetMap[sid].title)||sid; }
function renderOwnPanel(a, items){
  const owns = items.map(o=>{
    const whole = !o.tabGid;
    const label = whole ? sheetTitle(o.sheetId) : (STATE.tabIndex[o.sheetId+'::'+o.tabGid] || ('탭 '+o.tabGid));
    const sub = whole ? '시트 전체 · 모든 탭 자동 포함' : ('시트: '+sheetTitle(o.sheetId));
    return `<div class="own"><span class="ic">${whole?'▦':'▤'}</span><div class="info"><b>${esc(label)}</b><span>${esc(sub)}</span></div>
      <span class="scope ${whole?'all':'tab'}">${whole?'시트 전체':'특정 탭'}</span>
      <button class="rm" title="소유 해제" onclick="rmOwn('${esc(o.sheetId)}','${esc(o.tabGid||'')}')">×</button></div>`;
  }).join('') || `<div class="empty" style="padding:20px">소유 캠페인 없음 — 아래에서 추가하세요.</div>`;
  const sheetOpts = Object.keys(STATE.sheetMap).map(sid=>`<option value="${esc(sid)}">${esc(sheetTitle(sid))}</option>`).join('');
  const ot=STATE.ownTabs||[];
  const linkH=_advLinkHtml(a), acctH=_advAcctHtml(a);   // 시안 A: 접속링크·계정을 2열 카드로
  const accessBlock=(linkH||acctH)?`<div class="acc2col">${linkH}${acctH}</div>`:'';
  $('#ownPanel').innerHTML = `
    <div class="ph2"><span class="big">${esc((a.name||'?').slice(0,1))}</span><div style="flex:1"><h2>${esc(a.name)}</h2><div class="acc">거래처 ID: ${esc(a.id)} · 소유 ${items.length}</div></div>
      <div class="aebox" id="aebox">${_aeChipHtml(a)}</div>
      <label class="setvis" title="이 거래처가 통합작업대에서 정산(금액·상태)을 볼 수 있는지"><input type="checkbox" id="setvis" ${a.settlementVisible===false?'':'checked'} onchange="toggleSettleVis('${esc(a.id)}',this.checked)"> 정산 노출</label></div>
    ${accessBlock}
    <div class="sect"><div class="st">소유 캠페인</div>${owns}</div>
    <div class="sect" id="owntabsSect">${_ownTabsHtml()}</div>
    <div class="sect"><div class="st">소유 추가</div>
      <div class="add">
        <label>캠페인 시트</label>
        <select id="addSheet" onchange="onAddSheet()"><option value="">— 시트 선택 —</option>${sheetOpts}</select>
        <div class="radios">
          <div class="radio on" data-m="all" onclick="setAddMode('all')"><span class="d"></span>시트 전체(모든 탭)</div>
          <div class="radio" data-m="tab" onclick="setAddMode('tab')"><span class="d"></span>특정 탭만</div>
        </div>
        <div class="taboptions" id="taboptions"></div>
        <button class="btn pri assignbtn" onclick="assignOwn()">＋ 소유 지정</button>
      </div>
    </div>`;
}
// ── 담당 AE(inad_pm) 매칭 — master/admin 만 편집(staff 는 표시만). 인트라넷 사용자 자동완성(datalist). ──
function _aeChipHtml(a){
  const isAdmin = STATE.role==='master'||STATE.role==='admin';
  const cur = a.inadPm ? `<b>${esc(a.inadPm)}</b>` : '<b style="color:var(--warn)">미지정</b>';
  return `담당 AE: ${cur}${isAdmin?` <button class="btn xs" onclick="editAe()">변경</button>`:''}`;
}
function editAe(){ const a=STATE.advCur; if(!a) return; const box=$('#aebox'); if(!box||box.querySelector('input')) return;
  box.innerHTML=`담당 AE: <input id="aein" list="aelist" placeholder="인트라넷 사용자명" autocomplete="off" style="width:130px"
      onkeydown="if(event.key==='Enter')saveAe(); else if(event.key==='Escape')cancelAe()"><datalist id="aelist"></datalist>
    <button class="btn xs pri" onclick="saveAe()">저장</button> <button class="btn xs" onclick="cancelAe()">취소</button>`;
  const inp=$('#aein'); inp.value=a.inadPm||''; inp.focus(); inp.select();
  api('/api/trackb/intranet/users?dept=AE').then(r=>{ const dl=$('#aelist');   // 담당AE 후보 = AE 부서 직원만
    if(dl&&r&&r.ok) dl.innerHTML=(r.items||[]).map(u=>`<option value="${esc(u.name)}">${esc(u.username)}${u.department?' · '+esc(u.department):''}</option>`).join('');
  }).catch(()=>{});
}
function cancelAe(){ const a=STATE.advCur, box=$('#aebox'); if(box&&a) box.innerHTML=_aeChipHtml(a); }
async function saveAe(){ const a=STATE.advCur; if(!a) return;
  const v=(($('#aein')&&$('#aein').value)||'').trim();
  let r=null; try{ r=await api('/api/trackb/advertisers/inad-pm',{method:'POST',body:JSON.stringify({advertiserId:a.id, inadPm:v})}); }catch(_){ }
  if(r&&r.ok){ a.inadPm=(r.advertiser&&r.advertiser.inadPm)||v; toast(a.inadPm?('담당 AE 매칭: '+a.inadPm):'담당 AE 해제');
    const li=(STATE.advs||[]).find(x=>x.id===a.id); if(li) li.inadPm=a.inadPm;
    // 좌측 업체 목록 서브라벨 즉시 갱신(재조회 없이)
    document.querySelectorAll('.advitem').forEach(el=>{ const ad=STATE.advs[+el.dataset.i], pm=el.querySelector('.pmn');
      if(ad&&pm){ pm.textContent=ad.inadPm?('AE '+ad.inadPm):'AE 미지정'; pm.classList.toggle('noae',!ad.inadPm); } });
  } else toast('담당 AE 저장 실패'+(r&&r.error?': '+r.error:''));
  cancelAe();
}
// 연결된 탭 섹션(컬럼형) — 브랜드 필터 칩 + 헤더 + 행 그리드. setOwnBrand 가 이 섹션만 재렌더(#owntabsSect).
// openOwnTab 인덱스는 항상 STATE.ownTabs 원본 기준(필터로 순서가 바뀌어도 원본 i 를 넘김).
function _ownTabsHtml(){
  const ot=STATE.ownTabs||[];
  const rows=ot.map((t,i)=>({t,i,pm:parseTabMeta(t.tabName)}));
  const bc={}; let noBrand=0;
  rows.forEach(r=>{ if(r.pm.brand) bc[r.pm.brand]=(bc[r.pm.brand]||0)+1; else noBrand++; });
  const brands=Object.keys(bc).sort((a,b)=>bc[b]-bc[a]||a.localeCompare(b));
  STATE.ownBrandList=brands;
  if(STATE.ownBrand!==null&&STATE.ownBrand!==''&&!bc[STATE.ownBrand]) STATE.ownBrand=null;   // 목록 갱신으로 사라진 브랜드
  const chips=(brands.length>=2||(brands.length===1&&noBrand))
    ? `<div class="obchips"><span class="obchip ${STATE.ownBrand===null?'on':''}" onclick="setOwnBrand(-1)">전체 ${ot.length}</span>`
      + brands.map((b,bi)=>`<span class="obchip ${STATE.ownBrand===b?'on':''}" onclick="setOwnBrand(${bi})">${esc(b)} ${bc[b]}</span>`).join('')
      + (noBrand?`<span class="obchip ${STATE.ownBrand===''?'on':''}" onclick="setOwnBrand(-2)">미분류 ${noBrand}</span>`:'')+`</div>` : '';
  const vis=rows.filter(r=>STATE.ownBrand===null||(STATE.ownBrand===''?!r.pm.brand:r.pm.brand===STATE.ownBrand));
  const list=vis.map(({t,i,pm})=>{
    const target=(t.woRecruit&&+t.woRecruit)||pm.count||null;
    const total=t.bTotal||0, sub=t.bSub||0, paid=t.bPaid||0;
    const pct=total?Math.round(sub/total*100):0;
    const gauge=total?gaugeSvg(pct,pct+'%',pct>=100?'g-safe':''):gaugeSvg(0,'—','');
    const chan=[pm.channel?`<span class="bb ok">${esc(pm.channel)}</span>`:'', pm.viral?'<span class="bb warn">바이럴</span>':''].filter(Boolean).join(' ')||'<span class="ocol dim">—</span>';
    const tgt=[target?`${target}건${t.woRecruit?'·발주':''}`:'', pm.round||''].filter(Boolean).join(' · ')||'—';
    // 정산 컬럼(관제실 대응): 링크된 탭만 인트라넷 요약 대상. 요약 도착 전 '…', 미링크 '—'.
    const st=(STATE.ownSettle||{})[t.sheetId+'\t'+t.tabName];
    const linked=!!t.salesId;
    const dOr = v => linked ? (st ? (st.proxyDown?'<span class="dim" title="인트라넷 연결 실패">?</span>':(v||'<span class="dim">—</span>')) : '<span class="dim">…</span>') : '<span class="dim">—</span>';
    const quoteCell=dOr(st&&st.quoteDate?`<span title="${esc(st.quoteDate)}${st.contractNumber?' · '+esc(st.contractNumber):''}">${_md(st.quoteDate)}</span>`:null);
    const invoiceCell=dOr(st&&st.invoiceDate?`<span title="${esc(st.invoiceDate)}">${_md(st.invoiceDate)}</span>`:null);
    const paidDateCell=dOr(st&&st.paidDate?`<span title="${esc(st.paidDate)}">${_md(st.paidDate)}</span>`:null);
    const closeoutCell=t.closeoutDate
      ? `<span class="odate" title="마감 ${esc(String(t.closeoutDate).slice(0,10))} · ${t.closeoutRows||0}건(제출 ${t.closeoutSubs||0})">${_md(t.closeoutDate)}</span>`
      : '<span class="dim">—</span>';
    let moneyCell='<span class="dim">—</span>';
    if(linked){
      if(!st) moneyCell='<span class="dim">…</span>';
      else if(st.proxyDown) moneyCell='<span class="dim" title="인트라넷 연결 실패">?</span>';
      else{
        const pa=st.paidAmount, tc=st.totalCost;
        const pcls=(pa&&tc&&pa>=tc)?'pd-ok':(pa>0?'pd-part':'pd-zero');
        const warn=st.amountMismatch?' <span class="bb warn" title="견적서·계약 금액 불일치">⚠</span>':'';
        moneyCell=`<span title="입금 ${_won(pa)} / 총비용 ${_won(tc)}${st.contractNumber?' · '+esc(st.contractNumber):''}"><b class="${pcls}">${_won(pa)}</b> / ${_won(tc)}${warn}</span>`;
      }
    }
    return `<div class="owntab" onclick="openOwnTab(${i})" title="${esc(t.tabName)}">
      ${gauge}
      <div class="oname"><b><i class="odot ${t.active?'a':''}" title="${t.active?'활성':'비활성'}"></i>${esc(t.tabName)}</b>
        <span class="osub">${esc(t.spreadsheetTitle||sheetTitle(t.sheetId))}${t.firstSeenAt?` · ${esc(String(t.firstSeenAt).slice(0,10))}`:''}</span></div>
      <span class="ocol ${pm.brand?'obr':'dim'}">${esc(pm.brand||'—')}</span>
      <span class="ocol ${pm.product?'':'dim'}" title="${esc(pm.product||'')}">${esc(pm.product||'—')}</span>
      <span class="ocol">${chan}</span>
      <span class="ocol ${tgt==='—'?'dim':''}">${esc(tgt)}</span>
      <span class="ocol ${t.manager?'':'dim'}">${esc(t.manager||'—')}</span>
      <span class="ocnt"><b>${total}</b> · <b class="c-sub">${sub}</b> · <b class="c-paid">${paid}</b></span>
      <span class="ocol odate">${quoteCell}</span>
      <span class="ocol odate">${closeoutCell}</span>
      <span class="ocol odate">${invoiceCell}</span>
      <span class="ocol omoney">${moneyCell}</span>
      <span class="ocol odate">${paidDateCell}</span>
      <span class="ocol omemo" onclick="editTabMemo(event,${i})" title="클릭하여 비고 편집">${t.memo?esc(t.memo):'<i>비고…</i>'}</span>
      <span class="openb">열기 ›</span></div>`;
  }).join('');
  const body=ot.length
    ? `${chips}<div class="otwrap"><div class="othead"><span>진행</span><span>캠페인 탭</span><span>브랜드</span><span>상품</span><span>채널</span><span>목표·차수</span><span>담당</span><span>참여·제출·입금</span><span>견적서</span><span>마감자료</span><span>계산서</span><span>입금액/총비용</span><span>입금일</span><span>비고</span><span></span></div>${list||'<div class="empty" style="padding:14px">이 브랜드의 탭 없음</div>'}</div>`
    : `<div class="empty" style="padding:14px">연결된 탭 없음</div>`;
  return `<div class="st">연결된 탭 ${ot.length} <span style="font-weight:400;color:var(--faint);font-size:11px">· 최신순 — 클릭하면 작업대로 열기 · 정산(견적·계산서·입금)은 정산 링크된 탭만 표시</span></div>${body}`;
}
// 날짜 → M/D 축약(관제실 표기), 금액 → 천단위 콤마.
function _md(d){ const m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m?`${+m[2]}/${+m[3]}`:esc(String(d||'')); }
function _won(n){ return n==null?'—':Number(n).toLocaleString('ko-KR'); }
function setOwnBrand(i){ STATE.ownBrand = i===-1?null : i===-2?'' : ((STATE.ownBrandList||[])[i]!=null?STATE.ownBrandList[i]:null);
  _rerenderOwnTabs(); }
// 연결탭 섹션 재렌더 — 비고 편집 중(.omemoin 존재)이면 연기(포커스 input이 innerHTML 교체로
// 제거되면 blur 미발생 → 입력 무음 소실). 저장/취소 후 rerender 가 pending 을 소화.
function _rerenderOwnTabs(){ const el=$('#owntabsSect'); if(!el) return;
  if(el.querySelector('.omemoin')){ STATE._ownRerenderPending=true; return; }
  STATE._ownRerenderPending=false; el.innerHTML=_ownTabsHtml(); }
// 정산 요약(견적·계산서·입금매칭) 비동기 로드 — 패널 렌더를 막지 않음. 업체 전환 경합은 ownSettleFor 로 무시.
async function loadOwnSettlement(advId){
  let r=null; try{ r=await api('/api/trackb/ownership/settlement?advertiserId='+encodeURIComponent(advId)); }catch(_){ }
  if(STATE.ownSettleFor!==advId) return;   // 이미 다른 업체로 전환됨
  const m={};
  if(r&&r.ok){ for(const it of (r.items||[])) m[it.sheetId+'\t'+it.tabName]=it; }
  else { for(const t of (STATE.ownTabs||[])) if(t.salesId) m[t.sheetId+'\t'+t.tabName]={proxyDown:true}; }   // 로드 실패 = '…' 영구 대신 '?' 표기
  STATE.ownSettle=m;
  _rerenderOwnTabs();
}
// 비고 인라인 편집: 셀 클릭 → input 치환 → Enter/blur 저장, Esc 취소. 행 클릭(탭 열기)과 격리(stopPropagation).
function editTabMemo(ev,i){ ev.stopPropagation(); const t=(STATE.ownTabs||[])[i]; if(!t) return;
  const cell=ev.currentTarget; if(cell.querySelector('input')) return;
  cell.innerHTML=`<input class="omemoin" maxlength="2000" onclick="event.stopPropagation()" onkeydown="_memoKey(event)" onblur="saveOwnMemo(${i},this)">`;
  const inp=cell.querySelector('input'); inp.value=t.memo||''; inp.focus(); inp.select();
}
function _memoKey(ev){ if(ev.key==='Enter') ev.target.blur(); else if(ev.key==='Escape'){ ev.target.dataset.esc='1'; ev.target.blur(); } }
async function saveOwnMemo(i,inp){ const t=(STATE.ownTabs||[])[i];
  // 편집 종료 시점 = 연기된 재렌더(_ownRerenderPending)까지 함께 소화(최신 STATE 로 강제 렌더).
  const rerender=()=>{ STATE._ownRerenderPending=false; const el=$('#owntabsSect'); if(el) el.innerHTML=_ownTabsHtml(); };
  if(!t||inp.dataset.esc){ rerender(); return; }
  const memo=inp.value.trim();
  if(memo===(t.memo||'')){ rerender(); return; }
  try{
    const r=await api('/api/trackb/tab-memo',{method:'POST',body:JSON.stringify({sheetId:t.sheetId,tabName:t.tabName,memo})});
    if(r&&r.ok){ t.memo=r.memo; toast('비고 저장됨'); } else toast('비고 저장 실패'+(r&&r.error?': '+r.error:''));
  }catch(_){ toast('비고 저장 실패: 네트워크 오류'); }
  rerender();
}
function setAddMode(m){ STATE.addMode=m; document.querySelectorAll('.radio').forEach(r=>r.classList.toggle('on',r.dataset.m===m));
  const to=$('#taboptions'); to.classList.toggle('show', m==='tab' && STATE.addSheet); if(m==='tab') renderTabOptions(); else to.innerHTML=''; }
function onAddSheet(){ STATE.addSheet=$('#addSheet').value||null; STATE.addTabs={}; if(STATE.addMode==='tab') renderTabOptions(); }
function renderTabOptions(){ const to=$('#taboptions'); if(!STATE.addSheet){ to.classList.remove('show'); to.innerHTML=''; return; }
  const tabs=(STATE.sheetMap[STATE.addSheet]||{}).tabs||[];
  to.classList.add('show');
  to.innerHTML = tabs.map(t=>`<div class="tchip ${STATE.addTabs[t.tabGid||'']?'on':''}" onclick="tglTab('${esc(t.tabGid||'')}')"><span class="cb">${STATE.addTabs[t.tabGid||'']?'✓':''}</span>${esc(t.tabName)}</div>`).join('')||'<span style="font-size:12px;color:var(--faint)">이 시트에 활성 탭 없음</span>'; }
function tglTab(gid){ STATE.addTabs[gid]=!STATE.addTabs[gid]; renderTabOptions(); }
async function assignOwn(){ const a=STATE.advCur; if(!a) return; if(!STATE.addSheet){ toast('시트를 선택하세요'); return; }
  let posts=[];
  if(STATE.addMode==='all') posts=[{sheetId:STATE.addSheet, tabGid:null}];
  else { const gids=Object.keys(STATE.addTabs).filter(g=>STATE.addTabs[g]); if(!gids.length){ toast('탭을 선택하세요'); return; } posts=gids.map(g=>({sheetId:STATE.addSheet, tabGid:g})); }
  for(const p of posts) await api('/api/trackb/ownership',{method:'POST',body:JSON.stringify({advertiserId:a.id, sheetId:p.sheetId, tabGid:p.tabGid})});
  toast('소유 지정 완료'); refreshAdvCounts(); selAdv(STATE.advs.indexOf(a));
}
async function rmOwn(sheetId, tabGid){ const a=STATE.advCur; if(!a) return;
  await api('/api/trackb/ownership',{method:'DELETE',body:JSON.stringify({advertiserId:a.id, sheetId, tabGid:tabGid||null})});
  toast('소유 해제'); refreshAdvCounts(); selAdv(STATE.advs.indexOf(a));
}
async function refreshAdvCounts(){ const r=await api('/api/trackb/advertisers'); if(r&&r.ok){ STATE.advs=r.items||[];
  document.querySelectorAll('.advitem').forEach((el)=>{ const i=+el.dataset.i; if(STATE.advs[i]) el.querySelector('.ct').textContent=STATE.advs[i].owned; }); } }

boot();
</script>

     ★ index-recruit.js 는 경로 베이스만 갈아끼우면 그대로 동작한다 —

<!-- 모집공고 발행·수정 모달 — 공유 마크업(js/recruit-modal.js)에서 마운트.
     ★ body 직속이어야 한다 — 뷰 안(.ovwrap 스크롤 컨테이너)에 두면 오버레이가
       화면 흐름에 섞여 페이지 하단에 일반 블록으로 흐른다(실측 버그). -->
<div id="recruitModalMount"></div>

<script>
/* index-recruit.js 가 admin.html 전역으로 기대하는 6개를 통합 작업대 것으로 잇는다.
   ★ 함수를 베끼지 않고 **이름만 연결**한다 — 로직은 여전히 한 벌이다. */
(function () {
  var W = window;
  if (typeof W.escHtml !== 'function') W.escHtml = function (v) { return esc(v); };
  // C/S 문의창구 뱃지 — 모듈이 갱신할 때 nav 뱃지도 같이 따라가게 감싼다(집계 복제 0)
  if (typeof W.csUpdateBadge === 'function' && !W.csUpdateBadge._wrapped) {
    var _cub = W.csUpdateBadge;
    W.csUpdateBadge = function (n) { _cub(n); try { _csSyncNavBadge(Number(n) || 0); } catch (_) {} };
    W.csUpdateBadge._wrapped = true;
  }
  if (typeof W.showToast !== 'function') W.showToast = function (m) { _toast(String(m || '')); };
  if (typeof W._getAuthHeaders !== 'function') {
    W._getAuthHeaders = function () { return { Authorization: 'Bearer ' + token() }; };
  }
  // 작업오더 목록 갱신 훅 — 공고 발행이 오더 상태를 바꾸면 오더 탭도 최신화
  if (typeof W.loadWorkOrders !== 'function') {
    W.loadWorkOrders = function () { try { if (STATE.view === 'orders') _loadOrders(); } catch (_) {} };
  }
  // 카드 렌더 후 머리말(건수·새 공고 버튼) 갱신 — index-recruit.js 는 목록만 그린다
  var _origRender = W._renderRecruitCards;
  if (typeof _origRender === 'function') {
    W._renderRecruitCards = function (list) {
      _origRender(list);
      try { if (STATE.view === 'campaigns') _rcRenderHead((list || []).length); } catch (_) {}
    };
  }
})();
</script>
