<script>
/* ===================== CONFIG (맞춰야 함) ===================== */
const RK_CONFIG = {
  API_BASE:   "https://sublime-magic-production-790b.up.railway.app", // 리뷰웹 백엔드
  INTAKE_KEY: "여기에_공유시크릿_입력",                                 // = Railway ORDER_INTAKE_KEY
};
// 인트라넷 로그인 AE 이름 반환하도록 연결. 세션 없으면 입력칸(rk_requester) 사용.
function getRequester() {
  // 예: return window.currentUser?.name || "";
  return "";
}
/* ============================================================= */

(function(){ const el=document.getElementById("rk_requester"); const n=getRequester(); if(n){el.value=n; el.readOnly=true;} })();

function rkVal(id){ return (document.getElementById(id).value || "").trim(); }
function rkMsg(text, ok){ const m=document.getElementById("rk_msg"); m.textContent=text; m.className="rk-msg "+(ok?"rk-ok":"rk-err"); }
function rkNum(v){ return parseInt(String(v).replace(/[^\d]/g,""),10) || 0; }
function rkWon(n){ return n.toLocaleString("ko-KR"); }

/* ───────────── 상품 / 옵션 빌더 ───────────── */
function rkAddProduct(){
  const wrap = document.getElementById("rk_products");
  const div = document.createElement("div");
  div.className = "rkp";
  div.innerHTML = `
    <div class="rkp-head">
      <input class="rkp-name" type="text" placeholder="상품명 (예: 선크림)">
      <button type="button" class="rk-iconbtn" onclick="rkDelProduct(this)" title="상품 삭제">×</button>
    </div>
    <input class="rkp-url" type="text" placeholder="상품 URL">
    <div class="rkp-base">
      <input class="rkp-pay" type="number" min="0" placeholder="결제금액(기본)">
      <input class="rkp-cnt" type="number" min="0" placeholder="건수(기본)">
    </div>
    <div class="rkp-note" style="display:none">옵션이 있어 기본 결제금액/건수는 계산에서 제외됩니다.</div>
    <div class="rkp-opts"></div>
    <button type="button" class="rk-addbtn" onclick="rkAddOption(this)">+ 옵션추가</button>`;
  wrap.appendChild(div);
  rkRecompute();
}
function rkDelProduct(btn){ btn.closest(".rkp").remove(); rkRecompute(); }

function rkAddOption(btn){
  const prod = btn.closest(".rkp");
  const opts = prod.querySelector(".rkp-opts");
  const row = document.createElement("div");
  row.className = "rko";
  row.innerHTML = `
    <input class="rko-label" type="text" placeholder="옵션 (예: 블랙 / 라지)">
    <input class="rko-pay" type="number" min="0" placeholder="결제금액">
    <input class="rko-cnt" type="number" min="0" placeholder="건수">
    <button type="button" class="rk-iconbtn" onclick="rkDelOption(this)" title="옵션 삭제">×</button>`;
  opts.appendChild(row);
  rkRecompute();
}
function rkDelOption(btn){ const p=btn.closest(".rkp"); btn.closest(".rko").remove(); rkRecompute(); }

// 상품 1개의 합계 {count, pay, hasOpt}
function _rkProductTotals(prod){
  const optRows = [...prod.querySelectorAll(".rko")];
  if (optRows.length > 0){
    let count=0, pay=0;
    optRows.forEach(r=>{
      const c=rkNum(r.querySelector(".rko-cnt").value);
      const p=rkNum(r.querySelector(".rko-pay").value);
      count+=c; pay+=p*c;
    });
    return { count, pay, hasOpt:true };
  }
  const c=rkNum(prod.querySelector(".rkp-cnt").value);
  const p=rkNum(prod.querySelector(".rkp-pay").value);
  return { count:c, pay:p*c, hasOpt:false };
}

function rkRecompute(){
  let totCount=0, totPay=0;
  document.querySelectorAll("#rk_products .rkp").forEach(prod=>{
    const t=_rkProductTotals(prod);
    totCount+=t.count; totPay+=t.pay;
    // 옵션 있으면 기본 입력 흐리게 + 안내
    const base=prod.querySelector(".rkp-base");
    const note=prod.querySelector(".rkp-note");
    if(t.hasOpt){ base.classList.add("dim"); note.style.display="block"; }
    else { base.classList.remove("dim"); note.style.display="none"; }
  });
  document.getElementById("rk_sumCount").textContent = rkWon(totCount);
  document.getElementById("rk_sumPay").textContent   = rkWon(totPay);
  return { totCount, totPay };
}
// 입력 변화 실시간 반영
document.getElementById("rk_products").addEventListener("input", rkRecompute);

// 상품/옵션 → 사람이 읽는 요약(product_option) 문자열
function rkProductsSummary(){
  const lines=[];
  let gCount=0, gPay=0;
  document.querySelectorAll("#rk_products .rkp").forEach((prod,idx)=>{
    const name=(prod.querySelector(".rkp-name").value||"").trim() || ("상품"+(idx+1));
    const url=(prod.querySelector(".rkp-url").value||"").trim();
    const optRows=[...prod.querySelectorAll(".rko")];
    lines.push("• "+name+(url?("  "+url):""));
    if(optRows.length>0){
      let sc=0, sp=0;
      optRows.forEach(r=>{
        const label=(r.querySelector(".rko-label").value||"").trim()||"옵션";
        const p=rkNum(r.querySelector(".rko-pay").value);
        const c=rkNum(r.querySelector(".rko-cnt").value);
        sc+=c; sp+=p*c;
        lines.push("   - "+label+": "+rkWon(p)+"원 × "+c+"건 = "+rkWon(p*c)+"원");
      });
      lines.push("   소계: "+sc+"명 / "+rkWon(sp)+"원");
      gCount+=sc; gPay+=sp;
    } else {
      const p=rkNum(prod.querySelector(".rkp-pay").value);
      const c=rkNum(prod.querySelector(".rkp-cnt").value);
      lines.push("   "+rkWon(p)+"원 × "+c+"건 = "+rkWon(p*c)+"원");
      gCount+=c; gPay+=p*c;
    }
  });
  lines.push("──────────");
  lines.push("합계: 모집인원 "+gCount+"명 / 총 상품구입비 "+rkWon(gPay)+"원");
  return lines.join("\n");
}
function rkFirstProductUrl(){
  const first=document.querySelector("#rk_products .rkp .rkp-url");
  return first ? (first.value||"").trim() : "";
}

/* ───────────── 유입가이드 에디터 (이미지 첨부 → Drive) ───────────── */
function rkInflowType(){ return (document.querySelector('input[name=rk_inflow]:checked')||{}).value || 'link'; }
function _rkCompress(file){
  return new Promise((resolve)=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=1600; let w=img.width, h=img.height;
        if(w>max||h>max){ const s=Math.min(max/w,max/h); w=Math.round(w*s); h=Math.round(h*s); }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve({ base64:c.toDataURL('image/jpeg',0.85), mime:'image/jpeg' });
      };
      img.onerror=()=>resolve({ base64:r.result, mime:file.type||'image/png' });
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}
async function _rkUploadGuideImage(file){
  const st=document.getElementById('rk_guide_status'); st.textContent='이미지 업로드 중...';
  try{
    const { base64, mime }=await _rkCompress(file);
    const res=await fetch(RK_CONFIG.API_BASE + '/api/order/guide-image', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'X-Intake-Key': RK_CONFIG.INTAKE_KEY },
      body: JSON.stringify({ imageBase64:base64, mimeType:mime, fileName:file.name||'guide.jpg' }),
    });
    const json=await res.json().catch(()=>({}));
    if(res.ok && json.ok && json.url){ _rkInsertImage(json.url); st.textContent='첨부 완료'; }
    else { st.textContent='업로드 실패: '+(json.error||('HTTP '+res.status)); }
  }catch(e){ st.textContent='업로드 오류: '+e.message; }
  setTimeout(()=>{ st.textContent=''; }, 2500);
}
function _rkInsertImage(url){
  const ed=document.getElementById('rk_guide_editor'); ed.focus();
  const html='<img src="'+url+'" style="max-width:100%;border-radius:8px;margin:4px 0"><br>';
  if(!document.execCommand('insertHTML', false, html)){ ed.insertAdjacentHTML('beforeend', html); }
}
(function _rkInitGuide(){
  const radios=document.querySelectorAll('input[name=rk_inflow]');
  if(!radios.length) return;
  if(!document.getElementById('rk_guide_ph')){
    const s=document.createElement('style'); s.id='rk_guide_ph';
    s.textContent='#rk_guide_editor:empty:before{content:attr(data-ph);color:#9ca3af}';
    document.head.appendChild(s);
  }
  radios.forEach(r=>r.addEventListener('change',()=>{
    document.getElementById('rk_guidebox').style.display = rkInflowType()==='guide' ? 'block':'none';
  }));
  const ed=document.getElementById('rk_guide_editor');
  const file=document.getElementById('rk_guide_file');
  file.addEventListener('change',e=>{ [...e.target.files].forEach(f=>f.type.startsWith('image/')&&_rkUploadGuideImage(f)); file.value=''; });
  ed.addEventListener('paste',e=>{
    const items=(e.clipboardData||{}).items||[]; let had=false;
    for(const it of items){ if(it.type&&it.type.startsWith('image/')){ const f=it.getAsFile(); if(f){ had=true; _rkUploadGuideImage(f); } } }
    if(had) e.preventDefault();
  });
  ed.addEventListener('dragover',e=>{ e.preventDefault(); });
  ed.addEventListener('drop',e=>{
    const imgs=[...(((e.dataTransfer||{}).files)||[])].filter(f=>f.type.startsWith('image/'));
    if(imgs.length){ e.preventDefault(); imgs.forEach(_rkUploadGuideImage); }
  });
})();

// 시작 시 상품 1개 자동 추가
rkAddProduct();

/* ───────────── 수집 / 제출 ───────────── */
function rkCollect(){
  const t = rkRecompute();
  return {
    requester_name: getRequester() || rkVal("rk_requester"),
    title:          rkVal("rk_title"),
    start_date:     rkVal("rk_start"),
    product_option: rkProductsSummary(),   // 상품/옵션 요약(여러 줄)
    pay_amount:     t.totPay,              // 총 상품구입비 합계
    recruit_count:  t.totCount,            // 최종 모집인원 합계
    product_url:    rkFirstProductUrl(),   // 첫 상품 URL
    daily_count:    Number(rkVal("rk_daily")) || 0,
    purchase_time:  rkVal("rk_time"),
    inflow_type:    rkInflowType(),
    inflow_guide:   rkInflowType() === "guide" ? document.getElementById("rk_guide_editor").innerHTML : "",
    delivery_type:  rkVal("rk_delivery"),
    courier_proxy:  document.getElementById("rk_courier").checked,
    review_type:    rkVal("rk_reviewtype"),
    review_guide:   rkVal("rk_guide"),
    special_notes:  rkVal("rk_notes"),
    goods_cost_type:rkVal("rk_goods"),
  };
}

// 카톡 리마인드용 요약
function rkBuildSummary(d){
  const yn = d.courier_proxy ? " (택배대행)" : "";
  return [
    "▶작업명: " + (d.title||"-") + (d.start_date ? "  / 시작 "+d.start_date : ""),
    "▶상품·옵션:\n" + (d.product_option||"-"),
    "▶모집인원: " + (d.recruit_count||0) + "명",
    "▶총 상품구입비: " + rkWon(d.pay_amount||0) + "원",
    "▶일일진행건수: " + (d.daily_count||"-"),
    "▶구매시간대: " + (d.purchase_time||"-"),
    "▶유입방식: " + (d.inflow_type==="guide" ? "유입가이드(첨부)" : "링크유입"),
    "▶배송: " + (d.delivery_type||"-") + yn,
    "▶리뷰유형: " + (d.review_type||"-"),
    "▶물건비: " + (d.goods_cost_type||"-"),
    "▶특이사항: " + (d.special_notes||"-"),
    "▶작업시트URL: " + (d.work_sheet_url||rkVal("rk_sheeturl")||"-"),
  ].join("\n");
}

async function rkCopySummary(){
  const d = rkCollect();
  const text = rkBuildSummary(d);
  try {
    await navigator.clipboard.writeText(text);
    rkMsg("요약을 복사했습니다. 카톡방에 붙여넣어 리마인드하세요.", true);
  } catch(_) {
    const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); rkMsg("요약을 복사했습니다.", true);}catch(e){ rkMsg("복사 실패 — 수동 복사하세요.", false);}
    ta.remove();
  }
}

async function rkSubmitOrder(){
  const d = rkCollect();
  d.work_sheet_url = rkVal("rk_sheeturl");
  if (!d.title)          { rkMsg("작업명을 입력하세요.", false); return; }
  if (!d.work_sheet_url) { rkMsg("작업시트탭URL은 필수입니다.", false); return; }
  if (!d.requester_name) { rkMsg("요청자(AE) 이름을 입력하세요.", false); return; }
  if (!d.recruit_count)  { rkMsg("상품/옵션의 건수를 입력하세요. (모집인원 0)", false); return; }
  rkMsg("전송 중...", true);
  try {
    const res = await fetch(RK_CONFIG.API_BASE + "/api/order/intake", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Intake-Key": RK_CONFIG.INTAKE_KEY },
      body: JSON.stringify(d),
    });
    const json = await res.json().catch(()=>({}));
    if (res.ok && json.ok) {
      rkMsg("✅ 작업 요청이 전송되었습니다. 관리자 인박스에서 확인됩니다.", true);
      try { await navigator.clipboard.writeText(rkBuildSummary(d)); } catch(_){}
    } else {
      rkMsg("전송 실패: " + (json.error || ("HTTP " + res.status)), false);
    }
  } catch(e) {
    rkMsg("네트워크 오류: " + e.message, false);
  }
}
</script>
